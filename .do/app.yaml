name: pstdio-preview
region: ams

services:
  - name: pstdio
    environment_slug: node-js
    source_dir: /
    build_command: |
      bun run --filter @pstdio/ui build
      bun run --filter pstdio-dashboard build
    run_command: |
      bun run --cwd packages/pstdio pstdio -- serve --port 80
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

    github:
      repo: pufflyai/prompt-studio
      branch: main
      deploy_on_push: true
