name: pstdio-preview
region: ams

services:
  - name: pstdio
    environment_slug: node-js
    source_dir: /
    build_command: |
      curl -fsSL https://bun.sh/install | bash
      export PATH="$HOME/.bun/bin:$PATH"
      bun install
      bun run build
    run_command: |
      export PATH="$HOME/.bun/bin:$PATH"
      bun packages/pstdio/bin/pstdio.cjs serve --port 80
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

    github:
      repo: pufflyai/prompt-studio
      branch: main
      deploy_on_push: true
