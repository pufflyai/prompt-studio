# Local pstdio dev stack. Designed for parallel runs: leave ports ephemeral and use
# `COMPOSE_PROJECT_NAME` (or `-p <name>`) to namespace each invocation.
#
# `VITE_API_BASE_URL: /` is intentional — the dashboard's Vite dev server proxies
# `/v1` and `/healthz` to the in-container API at :19841 (see vite.config.ts), so
# the browser never needs to know the host-side API port.

services:
  prompt-studio:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    init: true
    working_dir: ${HOST_WORKTREE:?HOST_WORKTREE is required}
    environment:
      DISABLE_AUTOUPDATER: "1"
      PSTDIO_API_URL: http://localhost:19841
      PSTDIO_API_PORT: "19841"
      PSTDIO_DASHBOARD_HOST: 0.0.0.0
      PSTDIO_DASHBOARD_PORT: "5173"
      PSTDIO_DISABLE_API_AUTO_START: "1"
      VITE_API_BASE_URL: /
    command:
      - bash
      - -lc
      - |
        set -e
        PROJECT_ROOT=/workspace/project
        PSTDIO_BIN=/usr/local/bin/pstdio

        # Bootstrap commits invoke git directly; without a global identity, sub-commands
        # that pstdio shells out to (e.g. on `projects create`) fail with "please tell me who you are".
        git config --global user.email dev@local
        git config --global user.name pstdio

        bun install --frozen-lockfile
        bun run pstdio:local:add-dev --install-dir /usr/local/bin --api-url http://localhost:19841

        bun run dev &
        child=$$!

        trap 'kill "$$child" 2>/dev/null || true' INT TERM EXIT

        until curl -fsS http://localhost:19841/healthz >/dev/null; do
          sleep 1
        done

        mkdir -p "$$PROJECT_ROOT"
        cd "$$PROJECT_ROOT"

        git init
        git commit --allow-empty -m "init"

        "$$PSTDIO_BIN" projects create "$$(basename "$$PROJECT_ROOT")"

        wait "$$child"
    ports:
      - 127.0.0.1::5173
      - 127.0.0.1::19841
    volumes:
      - type: bind
        source: ${HOST_WORKTREE:?HOST_WORKTREE is required}
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}
      - type: bind
        source: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
        target: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
      - type: volume
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}/node_modules
      - type: volume
        source: bun-cache
        target: /root/.bun/install/cache
      # Persistent state across `compose up/down`. Defaults match `bun run dev` ($HOME=/root in this image).
      - type: volume
        target: /root/.pstdio-dev
      - type: volume
        target: /workspace/project
      - type: volume
        source: opencode-config
        target: /root/.config/opencode
      - type: volume
        target: /root/.local/share/opencode
      - type: volume
        source: claude-config
        target: /root/.claude

volumes:
  bun-cache:
  opencode-config:
  claude-config:
