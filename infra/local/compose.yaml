services:
  prompt-studio:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    init: true
    working_dir: ${HOST_WORKTREE:?HOST_WORKTREE is required}
    environment:
      DISABLE_AUTOUPDATER: "1"
      # The container runs as root; without this Claude Code refuses bypassPermissions
      # ("--dangerously-skip-permissions cannot be used with root") and never starts.
      IS_SANDBOX: "1"
      PSTDIO_DISABLE_API_AUTO_START: "1"
      PSTDIO_DISABLE_EMBED_MANIFEST: "1"
      PSTDIO_DEFAULT_EXTENSIONS: '["harness-claude-code","harness-codex","harness-open-code","pstdio-base-themes","pstdio-planner","pstdio-skills","extension-lab"]'
      PSTDIO_HOME: /root/.pstdio-dev
      PSTDIO_API_URL: http://127.0.0.1:19841
      VITE_API_BASE_URL: ${BROWSER_API_BASE_URL:-/}
    command:
      - bash
      - -lc
      - |
        set -e
        PROJECT_ROOT=/workspace/project
        pstdio_bin=/usr/local/bin/pstdio

        bun install --frozen-lockfile
        bun run pstdio:local:add-dev --install-dir /usr/local/bin --api-url http://127.0.0.1:19841

        bun packages/pstdio/src/index.ts serve --host 0.0.0.0 --port 19841 &
        api_child=$$!
        bun run --cwd packages/pstdio-dashboard dev -- --host 0.0.0.0 --port 5173 &
        dashboard_child=$$!

        trap 'kill "$$api_child" "$$dashboard_child" 2>/dev/null || true' INT TERM EXIT

        until curl -fsS http://127.0.0.1:19841/healthz >/dev/null; do
          sleep 1
        done

        mkdir -p "$$PROJECT_ROOT"
        cd "$$PROJECT_ROOT"

        git init
        git -c user.email=dev@local -c user.name=pstdio commit --allow-empty -m "init"

        read_project_id() {
          curl -fsS http://127.0.0.1:19841/v1/projects | bun --eval '
            const projects = await new Response(Bun.stdin.stream()).json();
            const project = projects.find((entry) => entry.name === "project");
            if (project) console.log(project.id);
          '
        }

        project_id="$$(read_project_id)"
        if [ -z "$$project_id" ]; then
          "$$pstdio_bin" projects create "$$(basename "$$PROJECT_ROOT")"
          project_id="$$(read_project_id)"
        fi

        curl -fsS -X PATCH "http://127.0.0.1:19841/v1/projects/$$project_id" \
          -H 'content-type: application/json' \
          --data '{"default_agent_id":"pstdio.harness-codex.codex","default_agent_model":"gpt-5.5"}' >/dev/null

        wait -n "$$api_child" "$$dashboard_child"
    ports:
      - 127.0.0.1:${HOST_DASHBOARD_PORT:-0}:5173
      - 127.0.0.1:${HOST_API_PORT:-0}:19841
    volumes:
      - type: bind
        source: ${HOST_WORKTREE:?HOST_WORKTREE is required}
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}
      - type: bind
        source: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
        target: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
      - type: volume
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}/node_modules
      - type: volume
        source: bun-cache
        target: /root/.bun/install/cache
      - type: volume
        target: /root/.pstdio-dev
      - type: volume
        target: /workspace/project
      - type: volume
        source: opencode-config
        target: /root/.config/opencode
      - type: volume
        target: /root/.local/share/opencode
      - type: bind
        source: ${HOME}/.local/share/opencode/auth.json
        target: /root/.local/share/opencode/auth.json
      - type: bind
        source: ${HOME}/.local/share/opencode/mcp-auth.json
        target: /root/.local/share/opencode/mcp-auth.json
      - type: volume
        source: claude-config
        target: /root/.claude
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /root/.codex/auth.json

volumes:
  bun-cache:
  opencode-config:
  claude-config:
