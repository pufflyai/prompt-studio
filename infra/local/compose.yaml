services:
  prompt-studio:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    init: true
    working_dir: ${HOST_WORKTREE:?HOST_WORKTREE is required}
    environment:
      DISABLE_AUTOUPDATER: "1"
      # The container runs as root; without this Claude Code refuses bypassPermissions
      # ("--dangerously-skip-permissions cannot be used with root") and never starts.
      IS_SANDBOX: "1"
      PSTDIO_DISABLE_API_AUTO_START: "1"
      PSTDIO_DISABLE_EMBED_MANIFEST: "1"
      PSTDIO_DEFAULT_EXTENSIONS: '${PSTDIO_DEFAULT_EXTENSIONS:-["harness-claude-code","harness-codex","harness-open-code","pstdio-base-themes","pstdio-planner","pstdio-planner-loops","pstdio-skills","extension-lab"]}'
      PSTDIO_EXTENSION_RELEASE_REF: ${PSTDIO_EXTENSION_RELEASE_REF:?PSTDIO_EXTENSION_RELEASE_REF is required}
      PSTDIO_EXTENSION_SOURCE_ROOT: ${HOST_WORKTREE:?HOST_WORKTREE is required}
      PSTDIO_HOME: ${HOST_PSTDIO_HOME:?HOST_PSTDIO_HOME is required}
      PSTDIO_DESKTOP_FLOW: ${PSTDIO_DESKTOP_FLOW:-0}
      PSTDIO_TERMINAL_ORIGINS: ${PSTDIO_TERMINAL_ORIGINS:?PSTDIO_TERMINAL_ORIGINS is required}
      PSTDIO_TERMINAL_WEBSOCKET_URL: ${PSTDIO_TERMINAL_WEBSOCKET_URL:?PSTDIO_TERMINAL_WEBSOCKET_URL is required}
    command:
      - bash
      - -lc
      - |
        set -e
        PROJECT_ROOT=/workspace/project
        pstdio_bin=/usr/local/bin/pstdio
        api_port=19841
        if [ "$$PSTDIO_DESKTOP_FLOW" = "1" ]; then
          api_port=${CONTAINER_API_PORT:-19841}
        fi
        api_url="http://127.0.0.1:$$api_port"
        export PSTDIO_API_URL="$$api_url"

        bun install --frozen-lockfile
        bun run pstdio:local:add-dev --install-dir /usr/local/bin --api-url "$$api_url"

        if [ "$$PSTDIO_DESKTOP_FLOW" = "1" ]; then
          bun run --cwd packages/pstdio-dashboard build
          bun packages/pstdio/src/index.ts serve --foreground --owner persistent --host 0.0.0.0 --port "$$api_port" &
          api_child=$$!
          dashboard_child=""
        else
          PORT="$$api_port" bun run --cwd packages/pstdio-api start &
          api_child=$$!
          bun run --cwd packages/pstdio-dashboard dev -- --host 0.0.0.0 --port 5173 &
          dashboard_child=$$!
        fi

        trap 'kill "$$api_child" $$dashboard_child 2>/dev/null || true' INT TERM EXIT

        until curl -fsS "$$api_url/healthz" >/dev/null; do
          sleep 1
        done

        auth_header=()
        if [ "$$PSTDIO_DESKTOP_FLOW" = "1" ]; then
          until [ -s "$$PSTDIO_HOME/runtime.json" ]; do
            sleep 1
          done
          runtime_token="$$(bun --eval 'console.log(JSON.parse(await Bun.file(process.env.PSTDIO_HOME + "/runtime.json").text()).token)')"
          auth_header=(-H "authorization: Bearer $$runtime_token")
        fi

        mkdir -p "$$PROJECT_ROOT"
        cd "$$PROJECT_ROOT"

        git init
        git -c user.email=dev@local -c user.name=pstdio commit --allow-empty -m "init"

        read_project_id() {
          curl -fsS "$${auth_header[@]}" "$$api_url/v1/projects" | bun --eval '
            const projects = await new Response(Bun.stdin.stream()).json();
            const project = projects.find((entry) => entry.name === "project");
            if (project) console.log(project.id);
          '
        }

        project_id="$$(read_project_id)"
        if [ -z "$$project_id" ]; then
          "$$pstdio_bin" projects create "$$(basename "$$PROJECT_ROOT")"
          project_id="$$(read_project_id)"
        fi

        curl -fsS "$${auth_header[@]}" -X PATCH "$$api_url/v1/projects/$$project_id" \
          -H 'content-type: application/json' \
          --data '{"default_agent_id":"pstdio.harness-codex.harness.codex","default_agent_model":"gpt-5.5"}' >/dev/null

        if [ -n "$$dashboard_child" ]; then
          wait -n "$$api_child" "$$dashboard_child"
        else
          wait "$$api_child"
        fi
    ports:
      - 127.0.0.1:${HOST_DASHBOARD_PORT:-0}:5173
      - 127.0.0.1:${HOST_API_PORT:-0}:${CONTAINER_API_PORT:-19841}
    volumes:
      - type: bind
        source: ${HOST_WORKTREE:?HOST_WORKTREE is required}
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}
      - type: bind
        source: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
        target: ${HOST_GIT_COMMON_DIR:?HOST_GIT_COMMON_DIR is required}
      - type: volume
        target: ${HOST_WORKTREE:?HOST_WORKTREE is required}/node_modules
      - type: volume
        source: bun-cache
        target: /root/.bun/install/cache
      - type: volume
        target: /workspace/project
      - type: volume
        source: opencode-config
        target: /root/.config/opencode
      - type: volume
        target: /root/.local/share/opencode
      - type: bind
        source: ${HOME}/.local/share/opencode/auth.json
        target: /root/.local/share/opencode/auth.json
      - type: bind
        source: ${HOME}/.local/share/opencode/mcp-auth.json
        target: /root/.local/share/opencode/mcp-auth.json
      - type: volume
        source: claude-config
        target: /root/.claude
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /root/.codex/auth.json

volumes:
  bun-cache:
  opencode-config:
  claude-config:
