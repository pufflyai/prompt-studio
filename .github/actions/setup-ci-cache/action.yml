name: Install and restore CI build cache
description: Reuse dependency downloads and portable Nx task archives.
inputs:
  profile:
    description: Separate host and Playwright-container workspace paths.
    default: host
runs:
  using: composite
  steps:
    - name: Locate the Bun download cache
      id: bun_cache
      shell: bash
      run: |
        bun -e 'import { appendFileSync } from "node:fs"; import { execFileSync } from "node:child_process"; appendFileSync(process.env.GITHUB_OUTPUT, `path=${execFileSync(process.execPath, ["pm", "cache"], { encoding: "utf8" }).trim()}\n`);'
    - name: Restore dependency downloads
      # Expanding Bun's many cache files on Windows costs more than installing them with Bun.
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ steps.bun_cache.outputs.path }}
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Restore portable Nx task archives
      uses: actions/cache@v4
      with:
        path: .cache/ci-build
        key: nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-${{ github.job }}-${{ strategy.job-index }}
        restore-keys: nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-
    - name: Start the job's Nx HTTP cache
      # Nx imports portable archives through its supported cache API. Its local database
      # is machine-bound and cannot be copied between GitHub runners.
      shell: bash
      run: bun scripts/ci/build-cache.ts
    - name: Generate installed Chakra theme declarations
      # Type generation writes into node_modules, outside Nx's declared build outputs.
      # Consumers need it even when the UI build itself comes from the cache.
      shell: bash
      run: bun run --cwd packages/ui typegen:tokens
