name: Setup Bun + pstdio workspace
description: Setup Node, Bun, and install dependencies for pstdio workflows

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "1.3.11"
  node-version:
    description: Node version to install
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
