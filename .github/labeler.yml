extensions:
  - changed-files:
      - any-glob-to-any-file:
          - extensions/**
sdk:
  - changed-files:
      - any-glob-to-any-file:
          - packages/sdk/**
          - packages/pstdio-api-contracts/**
database:
  - changed-files:
      - any-glob-to-any-file:
          - packages/pstdio-db/**
          - packages/pstdio-storage/**
          - services/account-manager/**
extension-runtime:
  - changed-files:
      - any-glob-to-any-file:
          - packages/pstdio-extensions/**
          - packages/pstdio-api-runtime-host/**
          - packages/pstdio-api/src/features/extensions/**
security:
  - changed-files:
      - any-glob-to-any-file:
          - services/account-manager/**
          - packages/pstdio-api/src/features/runtime/runtime-auth.ts
          - packages/pstdio-api/src/features/extensions/connection-secret-store.ts
          - packages/pstdio-api/src/features/extensions/extension-webview-access.ts
          - packages/pstdio-api/src/app-routing.ts
          - clients/desktop/src/security/**
          - clients/desktop/src/preload.ts
sync:
  - changed-files:
      - any-glob-to-any-file:
          - packages/pstdio-api/src/features/sync/**
          - packages/pstdio-api/src/services/sync-service.ts
          - packages/sdk/src/client/sync.ts
# Packaging, publishing and release validation. CI-only changes get `ci` instead.
release:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/release-*.yml
          - .github/workflows/publish-*.yml
          - .github/workflows/production-*.yml
          - .github/workflows/verify-*.yml
          - scripts/build/**
          - scripts/release/**
          - scripts/embed.json
          - .changeset/config.json
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/labeler.yml
          - scripts/ci/**
# Core UI only: the dashboard chrome, the workbench, shared components and theme, and the design system.
# Extension views are tracked by the `extensions` label. Test-only files do not count.
dashboard-ui:
  - changed-files:
      - all-globs-to-any-file:
          - "{packages/pstdio-dashboard,packages/pstdio-workbench,packages/ui}/src/**"
          - "!**/*.test.*"
          - "!**/*.fixture.*"
          - "!**/*.fixtures.*"
          - "!**/*test-fixture*"
          - "!**/*test-support*"
          - "!**/*test-helpers*"
          - "!**/test-helpers/**"
          - "!**/*test-utils*"
          - "!**/test-utils/**"
          - "!**/__fixtures__/**"
  - changed-files:
      - any-glob-to-any-file:
          - packages/pstdio-dashboard/index.html
          - packages/pstdio-dashboard/public/**
          - packages/ui/public/font/**
          - design/prompt-studio-design-system.pen
