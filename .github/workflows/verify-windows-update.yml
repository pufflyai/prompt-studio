name: Verify Windows installation and update

on:
  workflow_call:
    inputs:
      candidate-run-id:
        description: Run containing the candidate (defaults to this run)
        required: false
        type: string
      candidate-ref:
        description: Candidate commit with the installation checks and matching package versions
        required: true
        type: string
      previous-tag:
        description: Published pstdio release tag to install as the signed baseline
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Successful signing or release run containing the newer candidate
        required: true
        type: string
      candidate-ref:
        description: Candidate commit with matching package versions (defaults to the workflow revision)
        required: false
        type: string
      previous-tag:
        description: Published older pstdio release tag to install as the signed baseline
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download the published signed baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PSTDIO_BASELINE_TAG: ${{ inputs.previous-tag }}
        run: |
          # Installation must cover the files users received, rather than a rebuild of the tag.
          gh release download $env:PSTDIO_BASELINE_TAG --repo $env:GITHUB_REPOSITORY --dir windows-baseline `
            --pattern 'Prompt-Studio-*-win32-x64-Setup.exe' --pattern 'PromptStudio-*-full.nupkg' --pattern 'RELEASES'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published Windows baseline' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed-baseline
          path: windows-baseline
          if-no-files-found: error
          retention-days: 14

  installation:
    needs: baseline
    if: ${{ !cancelled() && needs.baseline.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate-ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - uses: actions/download-artifact@v4
        with:
          name: windows-signed-baseline
          path: windows-baseline
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-signed-candidate
          path: windows-candidate
          run-id: ${{ inputs.candidate-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify installed application and signed Squirrel update
        run: bun clients/desktop/scripts/verify-windows-installation.ts windows-baseline windows-candidate
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installation-readiness-attempt-${{ github.run_attempt }}
          path: clients/desktop/test-results/windows-installation
          if-no-files-found: warn
          retention-days: 14
      - name: Upload prepared Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-prepared-candidate
          path: clients/desktop/out/release/win32-x64
          if-no-files-found: error
          retention-days: 14
