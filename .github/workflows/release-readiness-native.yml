name: Release readiness native qualification
on:
  push:
    branches: [test/release-046-native-qualification]
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the clean landing-page image
        run: docker build -f clients/landing-page/Dockerfile -t pstdio-release-046-landing-check .
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - run: bun run --cwd clients/desktop package
      - name: Configure the native Chromium sandboxes
        run: |
          for sandbox in clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox clients/desktop/node_modules/electron/dist/chrome-sandbox; do
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          done
      - name: Test every P2 packaged desktop case
        run: xvfb-run -a bun scripts/ci/run-priority-tests.ts p2 --scope @pstdio/desktop --runner desktop --prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-linux-desktop
          path: |
            clients/desktop/test-results
            test-results/ci
          if-no-files-found: warn
  native_canvas:
    name: Canvas runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest, windows-11-arm]
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/install-native-dependencies.ts
      - name: Install the maintained packaged browser engine
        if: runner.os != 'Windows'
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Test every P1 public Canvas case on Windows
        if: runner.os == 'Windows'
        run: bun scripts/ci/run-priority-tests.ts p1 --scope @pstdio/canvas --runner bun
      - name: Prepare fixtures and test every P1 packaged CLI case
        run: bun scripts/ci/run-priority-tests.ts p1 --scope e2e --runner packaged-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness-native-${{ matrix.os }}
          path: |
            test-results/ci
            packages/e2e/test-results
          if-no-files-found: warn
