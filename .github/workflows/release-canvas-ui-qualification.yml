name: Release Intel Canvas UI qualification
on:
  push:
    branches: [test/release-046-canvas-ui-qualification]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope e2e --include-dependencies
      - run: bun run --cwd scripts build:host
      - run: bunx playwright@1.60.0 install chromium
      - name: Verify the existing critical install workload with its unchanged deadline
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:cli --test-name-pattern '^installs Canvas from the catalog with working commands and its authoring skill$'
      - name: Execute the remaining registered compiled CLI quarantine
        if: always() && !cancelled()
        env:
          E2E_TEST_LANE: quarantine
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun scripts/ci/run-quarantined-tests.ts packaged-bun --scope e2e --prebuilt
      - name: Require every compiled CLI quarantine case to have executed
        if: always() && !cancelled()
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-bun --scope e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-ui-qualification-evidence
          path: |
            packages/e2e/test-results
            test-results/ci
            test-results/quarantine
          if-no-files-found: warn
