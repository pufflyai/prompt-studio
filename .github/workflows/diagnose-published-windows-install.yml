name: Diagnose published Windows install

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        source: [published, rebuilt]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Download rebuilt historical baseline
        if: matrix.source == 'rebuilt'
        uses: actions/download-artifact@v4
        with:
          name: windows-signed-baseline
          path: evidence
          run-id: 38360503631
          github-token: ${{ github.token }}
      - name: Install published 0.43.0 and record shortcut targets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_SOURCE: ${{ matrix.source }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $root = Join-Path $env:LOCALAPPDATA 'PromptStudio'
          if (Test-Path $root) { throw 'Runner already has Prompt Studio installed' }
          if ($env:INSTALLER_SOURCE -eq 'published') {
            gh release download 'pstdio@0.43.0' --pattern 'Prompt-Studio-0.43.0-win32-x64-Setup.exe' --dir evidence
            if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          }
          $setup = Get-ChildItem evidence -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          Get-FileHash $setup.FullName | ConvertTo-Json | Set-Content evidence/installer-hash.json
          Get-AuthenticodeSignature $setup.FullName | Select-Object Status, StatusMessage, SignerCertificate | ConvertTo-Json -Depth 4 | Set-Content evidence/installer-signature.json
          $env:PSTDIO_DIAG_SETUP = $setup.FullName
          bun clients/desktop/scripts/diagnose-windows-baseline.ts
          $installCode = $LASTEXITCODE
          $shell = New-Object -ComObject WScript.Shell
          $programs = [Environment]::GetFolderPath('Programs')
          $shortcuts = @(Get-ChildItem $programs -Recurse -Filter '*.lnk' | ForEach-Object {
            $link = $shell.CreateShortcut($_.FullName)
            @{ path = $_.FullName; target = $link.TargetPath; arguments = $link.Arguments; workingDirectory = $link.WorkingDirectory }
          })
          $shortcuts | ConvertTo-Json -AsArray | Set-Content evidence/shortcuts.json
          @{ programs = $programs; launcher = (Join-Path $root 'Prompt Studio.exe'); root = $root; exitCode = $installCode } | ConvertTo-Json | Set-Content evidence/install.json
          Get-ChildItem $root -Recurse | Select-Object FullName, Length | ConvertTo-Json | Set-Content evidence/installed-files.json
          Get-ChildItem $env:LOCALAPPDATA -Filter '*Squirrel*.log' -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination evidence
          $shortcuts | ConvertTo-Json -AsArray
          if ($installCode -ne 0) { throw "Bun verifier failed with $installCode" }
          $launcher = Join-Path $root 'Prompt Studio.exe'
          if (-not ($shortcuts | Where-Object { $_.target -eq $launcher })) {
            throw 'Existing check: Start menu shortcut must launch the installed app'
          }
      - name: Preserve install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-${{ matrix.source }}-attempt-${{ github.run_attempt }}
          path: |
            evidence/*.json
            evidence/*.log
          if-no-files-found: warn
          retention-days: 14
