name: PR #2240 exact source CLI review

on:
  push:
    branches:
      - chore/pr-2240-source-cli-review-4e1699ba

permissions:
  actions: read
  contents: read

jobs:
  source_cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR2240_HEAD: 4e1699ba62818eee2d5211523c27a606618465ea
      PR2240_TREE: 26327fa27604bf91445576e25236a725631b5b2b
      PR2240_BASE: 2c01704eb089bab55d18b8f75d88b4b678b08d20
      PR2240_POLICY: 0919c441a350ecbfcce669094d433f8f02a2b3f45c4d0571f798af77d9b341da
      PR2240_PLAN: 7289584d53b05264ca79d17e31573d80d8cfb2d0794c4355df36dd93b7d40306
      PR2240_CLI_GROUP: 72480638f874d13d0838a290
      PR2240_CLI_FILES_SHA256: 58d8a6b1f28c46136461a9d26acb7a8700f52cf27fdc5841e7117801d9420c7a
      PR2240_OUTPUT: test-results/pr-2240-source-cli
      PR2240_ORDINARY_RUN: "45507360948"
      PR2240_ORDINARY_SOURCE: 6a6934f9705699579391e2206c2b50c02e761eae
      PR2240_ORDINARY_PLAN: 2d489840e066b9781f79c6aee6f3d0137662f4e1e12c5ab425730148f8383af6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PR2240_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify the source and sealed Linux plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/pr-2240-source-cli-review-4e1699ba
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git show -s --format=%P "$GITHUB_WORKFLOW_SHA")" = "$PR2240_HEAD"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_WORKFLOW_SHA")" =             "$(printf 'A\t.github/workflows/pr-2240-source-cli-review-4e1699ba.yml')"
          test "$(git rev-parse HEAD)" = "$PR2240_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PR2240_TREE"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main             refs/heads/chore/release-048-latency-gates:refs/remotes/origin/chore/release-048-latency-gates
          test "$(git rev-parse origin/chore/release-048-latency-gates)" = "$PR2240_HEAD"
          main="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$main")" = "$PR2240_BASE"
          incoming="$(git rev-list --count "HEAD..$main")"
          test "$incoming" -le 10
          prospective="$(git merge-tree --write-tree --no-messages HEAD "$main")"
          test "$(git cat-file -t "$prospective")" = tree
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = "1.4.4"
          test "$(node --version)" = "v26.7.0"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          mkdir -p "$PR2240_OUTPUT"
          bun run test:review --base origin/main --list > "$PR2240_OUTPUT/selected-plan.json"
          jq -e --arg sha "$PR2240_HEAD" --arg tree "$PR2240_TREE" --arg base "$PR2240_BASE"             --arg policy "$PR2240_POLICY" --arg digest "$PR2240_PLAN" --arg group "$PR2240_CLI_GROUP" '
              .head == $sha and .mergeBase == $base and .testPlan.digest == $digest
              and .testPlan.source == {sha:$sha,tree:$tree,policy:$policy,dirty:false}
              and (.testPlan.runs | length) == 80 and (.selected | length) == 2761
              and all(.testPlan.runs[]; .target == {platform:"linux",arch:"x64"})
              and ([.testPlan.runs[] | select(.job == "local-additions") | .id] == [$group])
              and any(.testPlan.runs[]; .id == $group and .owner == "e2e" and .cwd == "packages/e2e"
                and .runner == "cli" and .priority == "P1" and .lane == "stable" and .artifact == "source"
                and .requires == ["build-e5b1f54fca1c52cd"] and (.files | length) == 10)
              and any(.testPlan.setup[]; .id == "build-e5b1f54fca1c52cd" and .owners == ["e2e"]
                and .kind == "build" and .requires == [])
            ' "$PR2240_OUTPUT/selected-plan.json"
          jq -c --arg group "$PR2240_CLI_GROUP" '.testPlan.runs[] | select(.id == $group) | .files'             "$PR2240_OUTPUT/selected-plan.json" > "$PR2240_OUTPUT/assigned-files.json"
          printf '%s  %s\n' "$PR2240_CLI_FILES_SHA256" "$PR2240_OUTPUT/assigned-files.json" | sha256sum -c -
          jq -n --arg sha "$PR2240_HEAD" --arg tree "$PR2240_TREE" --arg main "$main" --arg base "$PR2240_BASE"             --arg prospective "$prospective" --arg plan "$PR2240_PLAN" --arg workflow "$GITHUB_WORKFLOW_SHA"             --argjson incoming "$incoming" --arg ordinary "$PR2240_ORDINARY_RUN"             --arg ordinarySource "$PR2240_ORDINARY_SOURCE"             '{sha:$sha,tree:$tree,main:$main,mergeBase:$base,mergeTree:$prospective,incoming:$incoming,
              planDigest:$plan,diagnosticCommit:$workflow,ordinaryCiRun:$ordinary,ordinaryCiSha:$ordinarySource}'             > "$PR2240_OUTPUT/identity.json"

      - name: Open an owned private temporary directory
        shell: bash
        run: |
          scratch="$(mktemp -d /tmp/pr2240.XXXXXX)"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$scratch/owner"
          {
            echo "PR2240_CLI_TMP=$scratch"
            echo "TMPDIR=$scratch"
            echo "TMP=$scratch"
            echo "TEMP=$scratch"
            echo "PR2240_NATIVE_BUN=$(command -v bun)"
          } >> "$GITHUB_ENV"
          { node --version; bun --version; docker version; df -h /tmp "$GITHUB_WORKSPACE"; }             > "$PR2240_OUTPUT/toolchain.log"

      - name: Install locked dependencies and prepare Firefox
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens
          (cd packages/e2e && bun x --no-install playwright install --with-deps firefox) 2>&1             | tee "$PR2240_OUTPUT/browser-setup.log"
          test -z "$(git status --porcelain)"

      - name: Execute only the ten-file source CLI group
        shell: bash
        run: |
          test "$(command -v bun)" = "$PR2240_NATIVE_BUN"
          bun --no-orphans - <<'BUN' 2>&1 | tee "$PR2240_OUTPUT/console.log"
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const { PR2240_CLI_TMP: scratch, PR2240_OUTPUT: relative, PR2240_CLI_GROUP: group } = process.env;
          if (!scratch || !/^\/tmp\/pr2240\.[A-Za-z0-9]{6}$/.test(scratch) || !relative || !group)
            throw new Error("Unexpected native review assignment");
          const executionId = process.env.GITHUB_RUN_ID + "/" + process.env.GITHUB_RUN_ATTEMPT;
          const output = resolve(root, relative);
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = relative + "/native";
          const { testPlan } = await Bun.file(resolve(output, "selected-plan.json")).json();
          let passed = false;
          try {
            const result = await executePlan(testPlan, {
              root, runIds: [group], prebuilt: false, executionId,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every(entry => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify exact native execution and file coverage
        shell: bash
        run: |
          jq -e --arg group "$PR2240_CLI_GROUP" --arg digest "$PR2240_PLAN"             --slurpfile expected "$PR2240_OUTPUT/assigned-files.json"             --slurpfile sealed "$PR2240_OUTPUT/selected-plan.json" '
              .source == $sealed[0].testPlan.source and .planDigest == $digest
              and .complete and .outcome == "success" and .errors == [] and .runIds == [$group]
              and (.results | length) == 1
              and all(.results[]; .runId == $group and .complete and .outcome == "success"
                and .exitCode == 0 and .nativeFailure != true and (.reportedFiles | sort) == ($expected[0] | sort))
              and [.phases[] | select(.kind == "build") | [.id,.outcome]] == [["build-e5b1f54fca1c52cd","success"]]
              and any(.phases[]; .kind == "cleanup" and .outcome == "success")
            ' "$PR2240_OUTPUT/native/execution.json"
          jq -e 'all(.[]; .outcome == "success")' "$PR2240_OUTPUT/compose-cleanup.json"
          git diff --exit-code

      - name: Retain and clean this invocation's temporary files
        if: always()
        shell: bash
        run: |
          mkdir -p "$PR2240_OUTPUT"
          if [[ -n "${PR2240_CLI_TMP:-}" ]]; then
            [[ "$PR2240_CLI_TMP" =~ ^/tmp/pr2240\.[A-Za-z0-9]{6}$ ]]
            test "$(cat "$PR2240_CLI_TMP/owner")" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if [[ -f "$PR2240_CLI_TMP/compose-projects.jsonl" ]]; then
              cp "$PR2240_CLI_TMP/compose-projects.jsonl" "$PR2240_OUTPUT/"
            fi
            rm -rf -- "$PR2240_CLI_TMP"
            test ! -e "$PR2240_CLI_TMP"
            printf '%s\n' 'Owned temporary directory removed' > "$PR2240_OUTPUT/scratch-cleanup.txt"
          fi

      - name: Upload the fixture and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-2240-source-cli-review-4e1699ba-attempt-${{ github.run_attempt }}
          path: ${{ env.PR2240_OUTPUT }}
          if-no-files-found: error
