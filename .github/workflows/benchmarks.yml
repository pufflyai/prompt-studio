name: Constrained Linux renderer escape diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    name: Instrumented Linux stream with constrained renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_PRIORITY: P3
      TEST_PRIORITIES: P3
      CI_PROFILE: production
      NX_SKIP_NX_CACHE: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3558596716087dac30b7a6ceb00d2d390d11b9fa
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Instrument existing primitive reads without extra layout reads
        env:
          FOLLOW_SCRIPT: ""
        run: |
          bun -e 'await Bun.write("native-desktop-follow-diagnostic.ts",Buffer.from(process.env.FOLLOW_SCRIPT,"base64"));'
          bun native-desktop-follow-diagnostic.ts
      - name: Install original Linux browser prerequisites
        working-directory: packages/e2e
        run: bun x --no-install playwright install-deps chromium
      - name: Freeze genuine instrumented dirty-source diagnostic plan
        run: bun scripts/ci/benchmark-ci-plan.ts stable
      - uses: actions/upload-artifact@v4
        with:
          name: test-plan-attempt-${{ github.run_attempt }}
          path: test-results/ci/plan.json
          if-no-files-found: error
      - uses: ./.github/actions/run-test-plan
        with:
          job: benchmark-linux-x64-desktop
          prebuilt: "false"
          display: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-linux-constrained-native-escape-events
          path: |
            clients/desktop/test-results
            test-results
            native-desktop-follow-diagnostic.ts
            native-desktop-follow-diagnostic-manifest.json
          if-no-files-found: error
