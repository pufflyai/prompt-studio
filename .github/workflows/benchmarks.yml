name: Scoped PS-1126 failure qualification
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [all, browser, arm, intel]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  failures:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: browser, os: ubuntu-24.04}
          - {lane: arm, os: macos-15}
          - {lane: intel, os: macos-15-intel}
    env:
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
      - uses: oven-sh/setup-bun@v2
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          install-strategy: native
      - name: Build candidate and test dependencies
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install required browser engines
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane != 'intel'
        run: bunx playwright@1.60.0 install --with-deps chromium firefox
      - name: Run only failed Chromium and Firefox command/settings scenarios
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'browser'
        working-directory: packages/e2e
        env:
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
        run: bun run test:packaged:browser src/packaged/packaged-webview-browsers.p2.spec.ts --grep 'commands and settings.*(Chromium|Firefox)'
      - name: Run only failed Apple Silicon Cloud Retry scenario
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'arm'
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-cloud-project-recovery.p2.test.ts
      - name: Run only failed Intel project and ticket scenarios
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'intel'
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged.p1.test.ts --test-name-pattern 'creates a project and lists it|creates and lists a ticket'
      - name: Preserve selected failure evidence
        if: always() && (inputs.lane == 'all' || inputs.lane == matrix.lane)
        uses: actions/upload-artifact@v4
        with:
          name: ps1126-${{ matrix.lane }}
          path: |
            test-results
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn
