name: Failed Windows Cloud qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows_cloud:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      PSTDIO_DEFAULT_EXTENSIONS: '[]'
      PSTDIO_EXTENSION_WEBVIEW_BUILDS: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: 'true'
      - run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Qualify initial convergence, resumed sockets and key-generation contracts
        working-directory: packages/pstdio-api
        run: bun src/test-utils/run-api-tests.ts --files='["src/services/relay/runtime-resumption.p1.test.ts","src/services/relay/documents-discovery.p1.test.ts","src/services/relay/documents.p1.test.ts"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-windows-cloud-native
          path: test-results/ci
