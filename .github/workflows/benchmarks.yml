name: Benchmarks
run-name: Release failed-case evidence verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify release repairs using recorded results
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: failed-desktop-linux-x64-performance
          run-id: '43090281764'
          github-token: ${{ github.token }}
          path: recovery-evidence
      - name: Reuse passing release results and validate only the failed-case receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/verify-release-repairs.ts <<'SCRIPT'
          import { resolve } from "node:path";
          const root = process.cwd();
          const { countTests } = await import(`${root}/.pstdio/extensions/pstdio-dev/src/releases/test-counts.ts`);
          const { browserBenchmarkResults } = await import(`${root}/scripts/ci/browser-benchmark-results.ts`);
          const { quarantineRegistry, matchesPlatform } = await import(`${root}/scripts/ci/test-quarantine.ts`);
          const gh = async (args: string[]) => {
            const child = Bun.spawn(["gh", ...args], { stdout: "pipe", stderr: "pipe" });
            const [text, error, code] = await Promise.all([new Response(child.stdout).text(), new Response(child.stderr).text(), child.exited]);
            if (code !== 0) throw new Error(error);
            return text;
          };
          const json = async (args: string[]) => JSON.parse(await gh(args));
          const baseline = await json(["run", "view", "43080161463", "--json", "status,headSha,jobs"]);
          if (baseline.status !== "completed" || baseline.headSha !== "cc0dd9b6e0ca05b08c498203a2d708ae99c08c00") throw new Error("Wrong release baseline");
          const repaired = new Set([130736065406,130736065428,130736134447,130736134479,130736134994]);
          const aggregates = new Set(["production / functional / validation_results", "production / functional / production_ci_passed", "production / certify"]);
          const outstanding = baseline.jobs.filter((job: any) => !["success", "skipped"].includes(job.conclusion) && !repaired.has(job.databaseId) && !aggregates.has(job.name));
          if (outstanding.length) throw new Error(`Unaccounted baseline failures: ${JSON.stringify(outstanding)}`);
          const receipts = [];
          for (const [id, expected] of [[130762819098,2],[130762819486,1],[130762819951,1]]) {
            const job = await json(["api", `repos/{owner}/{repo}/actions/jobs/${id}`]);
            if (job.run_id !== 43089587738 || job.conclusion !== "success" || !job.head_sha.startsWith("6ec6b93ec")) throw new Error(`Invalid correction receipt ${id}`);
            const counts = countTests(await gh(["api", "--allow-escape-sequences", `repos/{owner}/{repo}/actions/jobs/${id}/logs`]));
            if (counts.passed !== expected || counts.failed || counts.skipped) throw new Error(`Incomplete correction receipt ${id}: ${JSON.stringify(counts)}`);
            receipts.push({ jobId: id, ...counts });
          }
          const report = await Bun.file("recovery-evidence/packaged-benchmarks.json").json();
          const expected = quarantineRegistry.filter((test: any) => test.runner === "packaged-desktop-benchmark" && matchesPlatform(test,"linux","x64") && test.name === "sidecar crash shows recovery within budget");
          const recovery = browserBenchmarkResults(report, expected, resolve(report.config.rootDir,"../../../.."));
          if (recovery.executed !== 1 || recovery.stableFailures.length) throw new Error(`Blocking recovery failure: ${JSON.stringify(recovery.stableFailures)}`);
          const result = { originalReleaseRun: 43080161463, originalSource: baseline.headSha, reusedPassedJobs: baseline.jobs.filter((job: any) => job.conclusion === "success").length, correctionReceipts: receipts, recovery: { executed: recovery.executed, stableFailures: recovery.stableFailures, quarantined: recovery.quarantined }, testsExecutedByThisJob: 0, note: "Historical release run remains red. This verifies its recorded failed-case correction receipts and existing quarantine policy; it is not a new full release certificate." };
          await Bun.write("release-repair-verification.json", JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await Bun.write(process.env.GITHUB_STEP_SUMMARY!, "## Release failed-case verification\n\nAll five originally blocking test cases are accounted for: four passed in focused native runs; Linux recovery completed with only an existing performance-only quarantine.\n\nPassing baseline jobs are reused. No tests ran in this evidence-verification job. The original release run remains historical failure evidence; no new full release certificate is claimed.\n");
          SCRIPT
          bun /tmp/verify-release-repairs.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-repair-verification
          path: release-repair-verification.json
