name: Focused Windows baseline
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  archive:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Check the unchanged archive contracts once
        working-directory: scripts
        run: bun test verify/fresh-install.p0.test.ts verify/api-report-source.p0.test.ts verify/api-report-verification.p0.test.ts --timeout=15000
  process:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Retain the owning Windows runner prerequisite
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"
      - name: Check the unchanged process contracts once
        working-directory: packages/pstdio-api
        env:
          CI_PRIORITY: P2
        run: bun src/test-utils/run-api-tests.ts '--files=["src/features/extensions/process-command.windows.exclusive.p1.test.ts"]'
  pi:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build -- --scope @pstdio/sdk --include-dependencies
      - name: Install the original resolved CLI version
        shell: bash
        run: npm install --global --allow-scripts=@earendil-works/pi-coding-agent @earendil-works/pi-coding-agent@1.5.2
      - name: Retain the cold installed CLI probe first
        working-directory: extensions/harness-pi
        env:
          INSTALLED_CLI_TESTS: "1"
        run: bun test src/installed-cli.p0.test.ts
