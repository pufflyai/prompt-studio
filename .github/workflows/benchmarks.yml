name: Focused native baseline
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  packaged:
    name: Packaged ${{ matrix.scope }} baseline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: canvas
            os: windows-11-arm
            pkg: cli-win-arm64
            file: packaged-canvas-install.p2.test.ts
            pattern: installs Canvas from the catalog
            lane: quarantine
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build the original packaged prerequisites
        env:
          PSTDIO_BUILD_PLATFORM_PKG: ${{ matrix.pkg }}
        run: bun run --cwd scripts build:all
      - name: Build the owning E2E prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Restore the owning packaged browser prerequisite
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.pkg }}/bin/pstdio.exe
        run: bun -e 'import {preparePackagedSmokeBrowser} from "./scripts/verify/packaged-runtime-smoke.ts";preparePackagedSmokeBrowser(process.env.E2E_PACKAGED_BINARY_PATH!);'
      - name: Check the unchanged packaged contract once
        if: matrix.lane == 'stable'
        working-directory: packages/e2e
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.pkg }}/bin/pstdio.exe
          E2E_TEST_LANE: ${{ matrix.lane }}
        run: bun run test:packaged:cli -- src/packaged/${{ matrix.file }} --test-name-pattern '${{ matrix.pattern }}'
      - name: Check the registered quarantine contract once
        if: matrix.lane == 'quarantine'
        working-directory: packages/e2e
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.pkg }}/bin/pstdio.exe
          E2E_TEST_LANE: quarantine
        run: bun run test:packaged:cli -- src/packaged/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-${{ matrix.scope }}-evidence
          path: packages/e2e/test-results
          if-no-files-found: warn
