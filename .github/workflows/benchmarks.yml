name: Completed fixture profile qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    name: One completed fixture profile on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original public artifacts
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Compare complete setup and cleanup once
        run: |
          mkdir -p test-results
          bun -e 'await Bun.write("test-results/completed-profile-candidate.patch", Buffer.from("", "base64"));'
          git apply test-results/completed-profile-candidate.patch
          cat > "$RUNNER_TEMP/completed-profile-qualification.ts" <<'QUALIFICATION'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,mkdtempSync,writeFileSync} from 'node:fs';
          import {rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const root=process.env.GITHUB_WORKSPACE ?? '/Users/aurelienfranky/.pstdio/workspaces/1ab91e31-365c-4c54-a8a8-f5e2e0f3e817';
          const directory=mkdtempSync(join(tmpdir(),'ps206-completed-profile-'));
          const baseline=join(directory,'baseline-code');mkdirSync(baseline);
          const original=(path:string)=>execFileSync('git',['show',`0af9691eeffa5acdb4d6a802b0abe102feaa670a:${path}`],{cwd:root,encoding:'utf8'});
          let prepare=original('packages/e2e/src/scripts/prepare-ui-fixtures.ts')
           .replace('"pstdio-scripts/testing"',JSON.stringify(join(root,'scripts/ci/testing.ts')))
           .replace('"../packaged/packaged-extension-source"',JSON.stringify(join(root,'packages/e2e/src/packaged/packaged-extension-source.ts')))
           .replace('"./prepared-fixture-copy"',JSON.stringify(join(baseline,'prepared-fixture-copy.ts')))
           .replace('join(import.meta.dirname, "../../../../extensions", name)',`join(${JSON.stringify(root)},"extensions",name)`);
          writeFileSync(join(baseline,'prepare-ui-fixtures.ts'),prepare);
          writeFileSync(join(baseline,'prepared-fixture-copy.ts'),original('packages/e2e/src/scripts/prepared-fixture-copy.ts'));
          let consumers=original('packages/e2e/src/packaged/prepared-packaged-consumers.ts')
           .replace('"../local-workspace-registry"',JSON.stringify(join(root,'packages/e2e/src/local-workspace-registry.ts')))
           .replace('"../scripts/prepare-ui-fixtures"',JSON.stringify(join(baseline,'prepare-ui-fixtures.ts')))
           .replace('join(import.meta.dirname, "../../../..")',JSON.stringify(root));
          writeFileSync(join(baseline,'prepared-packaged-consumers.ts'),consumers);
          const oldPreparation=await import(join(baseline,'prepare-ui-fixtures.ts'));
          const oldConsumer=await import(join(baseline,'prepared-packaged-consumers.ts'));
          const current=await import(join(root,'packages/e2e/src/packaged/prepared-packaged-consumers.ts'));
          const {uiFixtureExtensions:names}=await import(join(root,'scripts/ci/test-fixture-profiles.ts'));
          const prior=process.env.E2E_PREPARED_FIXTURES;
          const signal=new AbortController().signal;
          try{
           const results=[];
           for(const mode of ['0af-source-only','completed-profile']){
            const prepared=join(directory,mode);
            const producerStart=performance.now();
            if(mode==='0af-source-only'){
             const env={...process.env,E2E_HOME:prepared,E2E_BUN_CACHE_DIR:join(prepared,'bun-cache'),E2E_PREPARED_FIXTURES:undefined};
             await oldPreparation.prepareUiFixtureSources(env,signal);writeFileSync(join(prepared,'sources.json'),env.E2E_EXTENSION_SOURCES!);
            }else{
             const producer=Bun.spawn([process.execPath,'packages/e2e/src/scripts/prepare-ui-fixtures.ts','--out',prepared,'--extensions',JSON.stringify(names)],{cwd:root,stdout:'inherit',stderr:'inherit'});
             if(await producer.exited!==0)throw new Error('Completed fixture producer failed');
            }
            const producerMs=performance.now()-producerStart;
            process.env.E2E_PREPARED_FIXTURES=prepared;
            const runs=[];
            for(let index=0;index<3;index++){
             const consumerStart=performance.now();
             const profile=await (mode==='0af-source-only'?oldConsumer:current).preparePackagedConsumers(signal);
             const setupMs=performance.now()-consumerStart;
             const cleanupStart=performance.now();await profile.close();const cleanupMs=performance.now()-cleanupStart;
             const run={setupMs,cleanupMs,totalMs:setupMs+cleanupMs};runs.push(run);console.log(JSON.stringify({mode,index,...run}));
            }
            const cleanupStart=performance.now();await rm(prepared,{recursive:true,force:true});const executorCleanupMs=performance.now()-cleanupStart;
            results.push({mode,producerMs,runs,executorCleanupMs,totalMs:producerMs+executorCleanupMs+runs.reduce((sum,run)=>sum+run.totalMs,0)});
           }
           const result={baseline:'0af9691eeffa5acdb4d6a802b0abe102feaa670a',candidate:'same source plus completed-profile preparation patch',host:`${process.platform}/${process.arch}`,bun:Bun.version,samples:1,selection:names,conditions:'Same seven production extensions, same built public SDK/UI, three fresh private consumers per arm, separate initially empty producer/package caches. Baseline uses original 0af producer/consumer modules, candidate uses actual current CLI producer and consumer. All preparation, private consumer closure and final executor cleanup included. Normal runtime installations remain outside this setup-only measurement. Sequential arms on one host; baseline first. No application runtimes or assertions and no end-to-end CI speedup claim.',results};
           const output=process.env.GITHUB_WORKSPACE?join(root,'test-results/completed-profile-qualification.json'):'/tmp/ps206-completed-profile-qualification.json';writeFileSync(output,JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          }finally{
           if(prior===undefined)delete process.env.E2E_PREPARED_FIXTURES;else process.env.E2E_PREPARED_FIXTURES=prior;
           await rm(directory,{recursive:true,force:true});
          }
          QUALIFICATION
          bun "$RUNNER_TEMP/completed-profile-qualification.ts" 2>&1 | tee test-results/completed-profile-qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-profile-qualification
          path: |
            test-results/completed-profile-qualification.*
            test-results/completed-profile-candidate.patch
          if-no-files-found: error
