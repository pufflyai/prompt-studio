name: Native conversation measurement ownership qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  linux:
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ inputs.source_sha }}
      profile: full
      priority: P2
      platforms: '[{"os":"ubuntu-24.04","platform_pkg":"cli-linux-x64","shard":1,"shards":1,"priorities":"P0,P1,P2"}]'
  desktop:
    name: Original six Intel desktop cases with conversation ownership repair
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CI_PRIORITY: P3
      TEST_PRIORITIES: P3
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original desktop prerequisites
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Package original desktop
        run: bun run --cwd clients/desktop package
      - name: Execute all six original desktop cases once
        run: bun run --cwd clients/desktop test:benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps211-original-intel-desktop
          path: |
            clients/desktop/test-results
            test-results/quarantine
          if-no-files-found: warn
