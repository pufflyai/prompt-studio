name: Failed recovery observation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux_recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: validation-app-linux-x64
          run-id: '43240403888'
          github-token: ${{ github.token }}
      - run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-linux-x64.tar.gz -C clients/desktop
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Observe the original failed crash workload with renderer visibility events
        working-directory: clients/desktop
        env:
          E2E_TEST_LANE: benchmark
          CI_QUARANTINE_ATTEMPT: '1'
        run: xvfb-run -a bunx --no-install playwright test --config playwright.benchmark.config.ts src/e2e/packaged-launch.p3.bench.ts -g 'sidecar crash shows recovery within budget'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-linux-recovery-trace
          path: clients/desktop/test-results
