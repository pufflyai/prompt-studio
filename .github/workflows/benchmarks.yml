name: Packaged consumer cleanup qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    name: Same seven-extension cleanup on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original public artifacts
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Compare complete owned cleanup once
        run: |
          mkdir -p test-results
          cat > "$RUNNER_TEMP/consumer-cleanup-qualification.ts" <<'QUALIFICATION'
          import {mkdtempSync,writeFileSync,readdirSync,lstatSync} from 'node:fs';
          import {rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const root=process.env.GITHUB_WORKSPACE!;
          const {startLocalWorkspaceRegistry}=await import(join(root,'packages/e2e/src/local-workspace-registry.ts'));
          const {prepareUiFixtureSources,prepareUiFixtures}=await import(join(root,'packages/e2e/src/scripts/prepare-ui-fixtures.ts'));
          const {removeTestDirectory}=await import(join(root,'packages/e2e/src/packaged/remove-test-directory.ts'));
          const directory=mkdtempSync(join(tmpdir(),'ps206-consumer-cleanup-'));
          const signal=new AbortController().signal;
          const prepared=join(directory,'prepared');
          const preparedEnv={...process.env,E2E_HOME:prepared,E2E_BUN_CACHE_DIR:join(prepared,'bun-cache'),E2E_PREPARED_FIXTURES:undefined};
          const count=(path:string)=>{let files=0,bytes=0,dirs=0,links=0;for(const entry of readdirSync(path,{withFileTypes:true})){const full=join(path,entry.name);if(entry.isSymbolicLink())links++;else if(entry.isDirectory()){dirs++;const c=count(full);files+=c.files;bytes+=c.bytes;dirs+=c.dirs;links+=c.links;}else{files++;bytes+=lstatSync(full).size;}}return{files,bytes,dirs,links};};
          try{
           await prepareUiFixtureSources(preparedEnv,signal);writeFileSync(join(prepared,'sources.json'),preparedEnv.E2E_EXTENSION_SOURCES!);
           const results=[];
           for(const mode of ['node','native']){
            const consumer=join(directory,mode);const configPath=join(consumer,'.npmrc');const began=performance.now();
            const registry=await startLocalWorkspaceRegistry({configPath,outputRoot:join(consumer,'registry'),packagePaths:[join(root,'packages/sdk'),join(root,'packages/ui')]});
            const env={...process.env,E2E_HOME:join(consumer,'home'),E2E_BUN_CACHE_DIR:join(consumer,'bun-cache'),E2E_PREPARED_FIXTURES:prepared,NPM_CONFIG_USERCONFIG:configPath};
            await prepareUiFixtures(env,signal,registry.packageArtifacts);const prepareMs=performance.now()-began;
            const inventory=count(consumer);const sourceInventory=count(env.E2E_HOME);const cacheInventory=count(env.E2E_BUN_CACHE_DIR);
            const closeStart=performance.now();await registry.close();const registryCloseMs=performance.now()-closeStart;
            const removeStart=performance.now();if(mode==='node')await rm(consumer,{recursive:true,force:true});else await removeTestDirectory(consumer);
            const removeMs=performance.now()-removeStart;
            const result={mode,prepareMs,registryCloseMs,removeMs,totalMs:prepareMs+registryCloseMs+removeMs,inventory,sourceInventory,cacheInventory};results.push(result);console.log(JSON.stringify(result));
           }
           const result={revision:'0af9691eeffa5acdb4d6a802b0abe102feaa670a',host:`${process.platform}/${process.arch}`,bun:Bun.version,samples:1,conditions:'Same seven fixture extensions and immutable source producer; separate initially empty invocation-owned package caches; normal frozen installs before cleanup. Node baseline first; native utility second. One sequential sample on a shared host. Counts exclude following symlinks. No application runtime or assertions; setup/cleanup qualification only.',results};
           writeFileSync(join(root,'test-results/consumer-cleanup-qualification.json'),JSON.stringify(result,null,2));
          }finally{await removeTestDirectory(directory);}
          QUALIFICATION
          bun "$RUNNER_TEMP/consumer-cleanup-qualification.ts" 2>&1 | tee test-results/consumer-cleanup-qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-cleanup-qualification
          path: test-results/consumer-cleanup-qualification.*
          if-no-files-found: error
