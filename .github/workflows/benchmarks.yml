name: Scoped remaining Mac Planner failures
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  failures:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-darwin-arm64/bin/pstdio
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build test dependencies
        run: bun run build -- --scope e2e --include-dependencies
      - name: Download immutable 0.47 CLI from the completed release build
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-1
          run-id: "43030741495"
          github-token: ${{ github.token }}
      - name: Verify and restore immutable CLI
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Run only two newly failed Mac Planner cases
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-planner-smoke.p2.test.ts --test-name-pattern 'brief supervisor wakes|adopts a feature draft'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1160-more-mac
          path: |
            packages/e2e/test-results
            test-results
          if-no-files-found: warn
