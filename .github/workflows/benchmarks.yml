name: Scoped final release failures
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cloud:
    name: Cloud eight-replacement catch-up
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PRIORITY: P2
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build test dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Run only failed Cloud scenario
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:browser src/packaged/packaged-cloud-phase-one.p2.spec.ts --grep 'catches up after eight trimmed replacements'
      - name: Preserve Cloud evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1160-cloud
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
            test-results
          if-no-files-found: warn
  native:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: planner-cold-open, os: ubuntu-24.04}
          - {lane: planner-recovery, os: macos-15}
    env:
      CI_PRIORITY: P2
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build test dependencies
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install browser
        if: matrix.lane == 'planner-cold-open'
        run: bunx playwright@1.60.0 install --with-deps chromium
      - name: Run full failed Planner benchmark
        if: matrix.lane == 'planner-cold-open'
        run: bun run --cwd packages/e2e perf:planner-board-cold-open
      - name: Run only two failed Apple Silicon recovery cases
        if: matrix.lane == 'planner-recovery'
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-planner-smoke.p2.test.ts --test-name-pattern 'reconciles dependency stacks|recovers missing workspaces without losing'
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1160-${{ matrix.lane }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
            test-results
          if-no-files-found: warn
