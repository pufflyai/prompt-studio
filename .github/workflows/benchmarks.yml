name: Release failure diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_display:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - run: bun run build -- --scope @pstdio/desktop --scope e2e --include-dependencies
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox x11-utils xvfb
      - name: Observe both source Electron phases on the original shared display
        working-directory: clients/desktop
        shell: bash
        run: |
          xvfb-run -a -e "$RUNNER_TEMP/release-xvfb.log" bash -c '
            set +e
            TEST_PRIORITIES=P1 bunx --no-install playwright test --config playwright.config.ts
            first=$?
            echo "Display state between P1 and P2"
            ps -C Xvfb -o pid,ppid,args
            ls -l /tmp/.X11-unix
            test -f "$XAUTHORITY" && echo "Xauthority exists"
            xprop -root _NET_SUPPORTING_WM_CHECK
            TEST_PRIORITIES=P2 bunx --no-install playwright test --config playwright.config.ts
            second=$?
            exit $((first | second))
          '
      - name: Check the previously failed streaming case
        if: ${{ !cancelled() }}
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-chat-motion-smoke.p2.test.ts -t 'retains streaming messages and cached history'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-linux-diagnostic
          path: |
            clients/desktop/test-results
            packages/e2e/test-results
            ${{ runner.temp }}/release-xvfb.log
  windows_cloud:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: 'true'
      - run: bun run build -- --scope e2e --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-1
          run-id: 43214095816
          github-token: ${{ github.token }}
      - shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Observe cloud picker authentication on the original compiled application
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-two-device-sync-smoke.p2.test.ts -t 'a new device opens its cloud project from the picker'
      - name: Observe the failed native Cloud resumption contract
        if: ${{ !cancelled() }}
        working-directory: packages/pstdio-api
        env:
          PSTDIO_DEFAULT_EXTENSIONS: '[]'
          PSTDIO_EXTENSION_WEBVIEW_BUILDS: '0'
        run: bun src/test-utils/run-api-tests.ts --files='["src/services/relay/runtime-resumption.p1.test.ts"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-windows-cloud-diagnostic
          path: |
            packages/e2e/test-results
            packages/pstdio-api/test-results
  intel_streaming:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: validation-app-darwin-x64
          run-id: 43223768966
          github-token: ${{ github.token }}
      - shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-darwin-x64.tar.gz -C clients/desktop
      - name: Observe the complete original streaming workload without changing limits
        working-directory: clients/desktop
        env:
          E2E_TEST_LANE: benchmark
          CI_QUARANTINE_ATTEMPT: '1'
        run: bunx --no-install playwright test --config playwright.benchmark.config.ts src/e2e/packaged-renderer.p3.bench.ts --grep 'long tool-heavy stream stays within budget$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-intel-streaming-diagnostic
          path: clients/desktop/test-results
  browser_profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - run: bunx playwright install chromium --with-deps
      - name: Profile only the failed hierarchy and Secondary Panel workloads
        env:
          UI_PERF_ASSERT_BUDGETS: '1'
        run: bun scripts/ci/run-workbench-benchmarks.ts src/perf/resource-hierarchy.p3.bench.ts src/perf/workbench-interactions.p3.bench.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-profile-diagnostic
          path: |
            packages/e2e/test-results
            test-results/quarantine
