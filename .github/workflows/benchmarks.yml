name: Benchmarks
run-name: Release failed-case qualification ${{ inputs.release_run }}
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Original release artifact run
        required: true
        default: '43080161463'
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    name: Failed desktop case (${{ matrix.target }} ${{ matrix.kind }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, kind: performance, config: playwright.benchmark.config.ts, file: packaged-launch.p3.bench.ts, grep: 'sidecar crash shows recovery within budget' }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: validation-app-${{ matrix.target }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
      - name: Restore the original immutable signed app
        shell: bash
        run: tar -xzf validation-app-${{ matrix.target }}.tar.gz -C clients/desktop
      - name: Configure Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Run only the recorded failed case
        working-directory: clients/desktop
        shell: bash
        env:
          E2E_TEST_LANE: benchmark
          CASE_CONFIG: ${{ matrix.config }}
          CASE_FILE: ${{ matrix.file }}
          CASE_TITLE: ${{ matrix.grep }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a bunx --no-install playwright test --config "$CASE_CONFIG" "src/e2e/$CASE_FILE" --grep "$CASE_TITLE"
          else
            bunx --no-install playwright test --config "$CASE_CONFIG" "src/e2e/$CASE_FILE" --grep "$CASE_TITLE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-desktop-${{ matrix.target }}-${{ matrix.kind }}
          path: clients/desktop/test-results
