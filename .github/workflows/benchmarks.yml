name: Focused remaining failure controls
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  app:
    name: Main Linux draft workspace control
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PRIORITY: P2
      TEST_PRIORITIES: P2
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build browser prerequisites
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Execute unchanged workspace selection case once
        run: bun run --cwd packages/e2e test:ui -- src/ui/session-bubble-workspaces.p2.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-workspace-selection
          path: packages/e2e/test-results
          if-no-files-found: warn
  desktop:
    name: Main Linux original desktop benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_PRIORITY: P3
      TEST_PRIORITIES: P3
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Install Chromium system prerequisites
        working-directory: packages/e2e
        run: bun x --no-install playwright install-deps chromium
      - name: Build original desktop prerequisites
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Package original desktop
        run: bun run --cwd clients/desktop package
      - name: Configure Linux sandbox
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Execute original complete benchmark workload once
        run: xvfb-run -a bun run --cwd clients/desktop test:benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-linux-desktop-benchmarks
          path: |
            clients/desktop/test-results
            test-results/quarantine
          if-no-files-found: warn
  composer:
    name: Windows ARM composer install diagnostics
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      CI_PRIORITY: P1
      TEST_PRIORITIES: P1
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Record dependency installer output and effective cache
        env:
          DIAGNOSTIC_SCRIPT: ""
        run: |
          bun -e 'await Bun.write("dependency-install-diagnostic.ts", Buffer.from(process.env.DIAGNOSTIC_SCRIPT,"base64"));'
          bun dependency-install-diagnostic.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Compile instrumented packaged host
        run: bun run --cwd scripts build:host
      - name: Run original composer case with installer diagnostics
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio.exe
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-project-setup-smoke.p1.test.ts --test-name-pattern 'serves the dashboard and API'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-arm-composer-install-diagnostics
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn
