name: Scoped release fixture qualification
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [all, planner-win, ui, vite]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  failures:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: planner-win, os: windows-2025}
          - {lane: ui, os: macos-15}
          - {lane: vite, os: macos-15}
    steps:
      - uses: actions/checkout@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
      - uses: oven-sh/setup-bun@v2
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build test dependencies
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        run: bun run build -- --scope e2e --include-dependencies
      - name: Download previous immutable CLI for cleanup diagnosis
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'planner-win'
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-1
          run-id: "42962479744"
          github-token: ${{ github.token }}
      - name: Restore previous immutable CLI
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'planner-win'
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Install browser
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane != 'planner-win'
        run: bunx playwright@1.60.0 install --with-deps chromium
      - name: Run only failed Windows Auto Build case
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'planner-win'
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-planner-smoke.p2.test.ts --test-name-pattern 'scoped Auto Build dispatch'
      - name: Run blocked UI startup smoke
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'ui'
        env:
          DEBUG: pw:webserver
        run: bun run --cwd packages/e2e test:ui src/ui/startup.p1.spec.ts --grep 'dashboard keeps project selection open when no project is selected'
      - name: Run only failed Vite development terminal case
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'vite'
        env:
          DEBUG: pw:webserver
        run: bun run --cwd packages/e2e test:vite-terminal --project=vite-development
      - name: Preserve evidence
        if: always() && (inputs.lane == 'all' || inputs.lane == matrix.lane)
        uses: actions/upload-artifact@v4
        with:
          name: release-fixture-${{ matrix.lane }}
          path: |
            test-results
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn
