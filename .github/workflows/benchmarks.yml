name: Native follow probe and app cleanup ownership
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    name: Forced app preparation ownership (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: df71c234fdf6a7e7a51b06be473e8e885f312057
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Apply exact app owner repair and regression
        env:
          APP_PATCH: ""
        run: |
          bun -e 'await Bun.write("app-owner.patch",Buffer.from(process.env.APP_PATCH,"base64"));'
          git apply app-owner.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute forced app preparation ownership regression
        run: |
          bun test packages/e2e/src/scripts/run-playwright.p0.test.ts --test-name-pattern 'executor can remove an app preparation' 2>&1 | Tee-Object -FilePath app-owner.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-app-owner
          path: |
            app-owner.patch
            app-owner.log
          if-no-files-found: error
  stream:
    name: Actual native stream primitive events
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P2
      CI_PROFILE: production
      NX_SKIP_NX_CACHE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Instrument primitive follow events
        env:
          FOLLOW_SCRIPT: ""
        run: |
          bun -e 'await Bun.write("native-follow-diagnostic.ts",Buffer.from(process.env.FOLLOW_SCRIPT,"base64"));'
          bun native-follow-diagnostic.ts
      - name: Build native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install original Chromium
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Compile instrumented host
        run: bun run --cwd scripts build:host
      - name: Execute original full streaming case once with primitive diagnostics
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-chat-motion-smoke.p2.test.ts --test-name-pattern 'retains streaming messages and cached history'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stream-primitive-events
          path: packages/e2e/test-results
          if-no-files-found: warn
