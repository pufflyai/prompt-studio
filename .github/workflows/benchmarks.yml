name: Scoped 0.47 release failure diagnostics
on:
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [all, planner-mac, planner-win, startup, storage]
        default: all
      artifact_run:
        default: "42962479744"
        description: Previous failed release artifacts, used only for diagnosis
permissions:
  contents: read
  actions: read
jobs:
  failures:
    name: ${{ matrix.lane }}
    if: inputs.lane == 'all' || inputs.lane != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: planner-mac, os: macos-15, scope: e2e, platform_pkg: cli-darwin-arm64}
          - {lane: planner-win, os: windows-2025, scope: e2e, platform_pkg: cli-win-x64}
          - {lane: startup, os: macos-15, scope: '@pstdio/desktop'}
          - {lane: storage, os: macos-15, scope: pstdio-db}
    steps:
      - uses: actions/checkout@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
      - uses: oven-sh/setup-bun@v2
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build only test dependencies
        if: inputs.lane == 'all' || inputs.lane == matrix.lane
        run: bun run build -- --scope ${{ matrix.scope }} --include-dependencies
      - name: Download previous immutable CLI build for targeted diagnosis
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.scope == 'e2e'
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-1
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Restore previous immutable CLI build
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.scope == 'e2e'
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Run only five failing Apple Silicon Planner cases
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'planner-mac'
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-darwin-arm64/bin/pstdio
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-planner-smoke.p2.test.ts --test-name-pattern 'independent views|brief supervisor wakes|reconciles dependency|recovers missing workspaces|adopts a feature draft'
      - name: Run only failing Windows Auto Build case
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'planner-win'
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe
        run: bun run --cwd packages/e2e test:packaged:cli src/packaged/packaged-planner-smoke.p2.test.ts --test-name-pattern 'scoped Auto Build dispatch'
      - name: Download previously signed Apple Silicon app for targeted diagnosis
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'startup'
        uses: actions/download-artifact@v4
        with:
          name: validation-app-darwin-arm64
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Restore previously signed app
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'startup'
        run: tar -xzf validation-app-darwin-arm64.tar.gz -C clients/desktop
      - name: Run only failing startup benchmark once
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'startup'
        working-directory: clients/desktop
        run: bunx --no-install playwright test --config playwright.benchmark.config.ts src/e2e/packaged-launch.p3.bench.ts --grep 'cold start with an empty home'
      - name: Run only failing storage conversion benchmark once
        if: (inputs.lane == 'all' || inputs.lane == matrix.lane) && matrix.lane == 'storage'
        run: bun packages/pstdio-db/src/services/extension-storage/ordered-legacy-backlog.p3.bench.ts
      - name: Preserve scoped diagnostic evidence
        if: always() && (inputs.lane == 'all' || inputs.lane == matrix.lane)
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ matrix.lane }}
          path: |
            test-results
            packages/e2e/test-results
            clients/desktop/test-results
          if-no-files-found: warn
