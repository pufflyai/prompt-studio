name: Native inherited installer cache and recovery qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    name: Windows inherited cache and original Bookmarks contract
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P0,P1,P2
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Apply exact inherited cache repair and phase probe
        env:
          CACHE_PATCH: ""
          CACHE_PROBE: ""
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          bun -e 'await Bun.write("test-results/cache-repair.patch",Buffer.from(process.env.CACHE_PATCH,"base64"));await Bun.write("test-results/cache-probe.ts",Buffer.from(process.env.CACHE_PROBE,"base64"));'
          git apply test-results/cache-repair.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test-results/cache-probe.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute actual producer and inherited offline install regression
        run: bun test scripts/ci/execution-package-cache.p0.test.ts
      - name: Build original native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Compile original packaged host
        run: bun run --cwd scripts build:host
      - name: Execute original complete Bookmarks file through repaired owning plan
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio.exe
        run: |
          bun scripts/test.ts --artifact compiled-cli --file packages/e2e/src/packaged/packaged-bookmarks-compatibility.p2.test.ts --out test-results/bookmarks-plan.json --prebuilt 2>&1 | Tee-Object -FilePath test-results/bookmarks.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-inherited-installer-cache
          path: |
            test-results/cache-*
            test-results/bookmarks*
            test-results/ci/planned
            packages/e2e/test-results
          if-no-files-found: error
  recovery:
    name: Original harness commands with separate recovery repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PRIORITY: P2
      TEST_PRIORITIES: P2
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0c18772dcf7c454ae428bcea239d9dc2d6d12a1d
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build original browser prerequisites
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Execute both original harness command cases once
        run: bun run --cwd packages/e2e test:ui -- src/ui/harness-commands.p2.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-failed-command-recovery
          path: packages/e2e/test-results
          if-no-files-found: warn
