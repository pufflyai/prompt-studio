name: Windows fixture ownership qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  ownership:
    name: Windows interrupted consumer cleanup
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Apply consumer ownership repair
        env:
          OWNERSHIP_PATCH: ""
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          bun -e 'await Bun.write("test-results/consumer-root-ownership.patch", Buffer.from(process.env.OWNERSHIP_PATCH, "base64"));'
          git apply test-results/consumer-root-ownership.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete and interrupted execution ownership
        run: |
          bun test scripts/ci/execution-package-cache.p0.test.ts 2>&1 | Tee-Object -FilePath test-results/consumer-root-ownership.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-consumer-root-ownership
          path: |
            test-results/consumer-root-ownership.*
            test-results/ci/planned/**/execution.json
          if-no-files-found: error
