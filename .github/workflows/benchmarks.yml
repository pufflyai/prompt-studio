name: Original main Linux streaming control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Uninstrumented main original packaged motion file
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P2
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install original Chromium
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Compile unchanged main host
        run: bun run --cwd scripts build:host
      - name: Execute original complete motion file once
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-chat-motion-smoke.p2.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps211-main-linux-motion-control
          path: packages/e2e/test-results
          if-no-files-found: warn
