name: Combined Linux desktop follow event diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Combined Linux original six desktop cases with follow events
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_PRIORITY: P3
      TEST_PRIORITIES: P3
      CI_PROFILE: production
      NX_SKIP_NX_CACHE: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3558596716087dac30b7a6ceb00d2d390d11b9fa
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Instrument existing primitive reads without extra layout reads
        env:
          FOLLOW_SCRIPT: ""
        run: |
          bun -e 'await Bun.write("native-desktop-follow-diagnostic.ts",Buffer.from(process.env.FOLLOW_SCRIPT,"base64"));'
          bun native-desktop-follow-diagnostic.ts
      - name: Install original Linux browser prerequisites
        working-directory: packages/e2e
        run: bun x --no-install playwright install-deps chromium
      - name: Build original desktop prerequisites
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Package original desktop
        run: bun run --cwd clients/desktop package
      - name: Execute all original desktop cases once
        run: xvfb-run --auto-servernum bun run --cwd clients/desktop test:benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-linux-native-follow-events
          path: |
            clients/desktop/test-results
            test-results/quarantine
          if-no-files-found: warn
