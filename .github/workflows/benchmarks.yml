name: Execution-owned package cache qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    name: Same three private profiles on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original public artifacts
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Compare complete setup and cleanup once
        run: |
          mkdir -p test-results
          cat > "$RUNNER_TEMP/execution-cache-qualification.ts" <<'QUALIFICATION'
          import {mkdtempSync,writeFileSync} from 'node:fs';
          import {rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join,dirname} from 'node:path';
          const root=process.env.GITHUB_WORKSPACE!;
          // Diagnostic checkout: apply the exact one-line cache-input repair to the baseline adapter.
          const adapterPath=join(root,'packages/e2e/src/packaged/prepared-packaged-consumers.ts');
          const adapter=await Bun.file(adapterPath).text();
          await Bun.write(adapterPath,adapter.replace('E2E_BUN_CACHE_DIR: join(root, "bun-cache"),','E2E_BUN_CACHE_DIR: process.env.E2E_BUN_CACHE_DIR ?? join(root, "bun-cache"),'));
          const {preparePackagedConsumers}=await import(join(root,'packages/e2e/src/packaged/prepared-packaged-consumers.ts'));
          const {prepareUiFixtureSources}=await import(join(root,'packages/e2e/src/scripts/prepare-ui-fixtures.ts'));
          const directory=mkdtempSync(join(tmpdir(),'ps206-execution-cache-'));
          const signal=new AbortController().signal;
          const prepared=join(directory,'prepared');
          const preparedEnv={...process.env,E2E_HOME:prepared,E2E_BUN_CACHE_DIR:join(prepared,'bun-cache'),E2E_PREPARED_FIXTURES:undefined};
          const previous={E2E_BUN_CACHE_DIR:process.env.E2E_BUN_CACHE_DIR,E2E_PREPARED_FIXTURES:process.env.E2E_PREPARED_FIXTURES};
          try{
           await prepareUiFixtureSources(preparedEnv,signal);writeFileSync(join(prepared,'sources.json'),preparedEnv.E2E_EXTENSION_SOURCES!);
           process.env.E2E_PREPARED_FIXTURES=prepared;
           const results=[];
           for(const mode of ['independent','execution-owned']){
            const runs=[]; const cache=join(directory,'consumer-cache',mode);
            for(let i=0;i<3;i++){
             if(mode==='independent')delete process.env.E2E_BUN_CACHE_DIR;else process.env.E2E_BUN_CACHE_DIR=cache;
             const began=performance.now();const profile=await preparePackagedConsumers(signal);const setupMs=performance.now()-began;
             const consumer=dirname(profile.env.E2E_HOME!);const usedCache=profile.env.E2E_BUN_CACHE_DIR!;
             const closeStart=performance.now();await profile.close();const cleanupMs=performance.now()-closeStart;
             const result={setupMs,cleanupMs,totalMs:setupMs+cleanupMs,consumer};runs.push(result);console.log(JSON.stringify({mode,index:i,...result}));
            }
            const cleanupStart=performance.now();await rm(cache,{recursive:true,force:true});const executorCleanupMs=performance.now()-cleanupStart;
            results.push({mode,runs,executorCleanupMs,totalMs:executorCleanupMs+runs.reduce((n,r)=>n+r.totalMs,0)});
           }
           const result={revision:'0af9691 + execution-owned cache repair',host:`${process.platform}/${process.arch}`,bun:Bun.version,samples:1,conditions:'Same seven-extension immutable source producer, same built SDK/UI. Three sequential fresh profiles in each arm, normal frozen installs each time; separate empty caches in baseline vs one empty execution-owned cache in candidate; all cleanup included. No application runtimes/assertions. Shared host; baseline first. No end-to-end CI speedup claim.',results};writeFileSync(join(root,'test-results/execution-cache-qualification.json'),JSON.stringify(result,null,2));
          }finally{
           for(const [key,value]of Object.entries(previous)){if(value===undefined)delete process.env[key];else process.env[key]=value;}
           await rm(directory,{recursive:true,force:true});
          }
          QUALIFICATION
          bun "$RUNNER_TEMP/execution-cache-qualification.ts" 2>&1 | tee test-results/execution-cache-qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-cache-qualification
          path: test-results/execution-cache-qualification.*
          if-no-files-found: error
