name: Failed release case qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  NX_DAEMON: "false"
  CI_PRIORITY: P2
defaults:
  run:
    shell: bash
jobs:
  windows-core:
    name: Failed Windows ARM64 core defaults case
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build current-main packaged test dependencies
        run: bun run build -- --scope e2e --include-dependencies
      - name: Compile current-main Windows ARM64 CLI
        run: |
          bun run --cwd scripts build:host
          bun -e 'import { appendFileSync } from "node:fs"; import { resolve } from "node:path"; appendFileSync(process.env.GITHUB_ENV, "E2E_PACKAGED_BINARY_PATH=" + resolve("dist/pstdio.exe") + "\n")'
      - name: Run only the failed core defaults case
        run: >-
          bun run --cwd packages/e2e test:packaged:cli --
          src/packaged/packaged-core-extensions-smoke.p1.test.ts
          -t 'loads packaged core defaults with usable assets and safe extension storage'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-core-windows-arm64
          path: packages/e2e/test-results
          if-no-files-found: warn
  linux-recovery:
    name: Failed Linux recovery case on original signed app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_TEST_LANE: benchmark
      CI_QUARANTINE_ATTEMPT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build desktop test dependencies
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Restore original immutable signed app
        uses: actions/download-artifact@v4
        with:
          name: validation-app-linux-x64
          run-id: "43167638831"
          github-token: ${{ github.token }}
      - name: Check original payload identity and configure sandbox
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-linux-x64.tar.gz -C clients/desktop
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Run only the failed recovery case
        id: recovery
        continue-on-error: true
        working-directory: clients/desktop
        run: >-
          xvfb-run -a bunx playwright test --config playwright.benchmark.config.ts
          src/e2e/packaged-launch.p3.bench.ts
          --grep '^sidecar crash shows recovery within budget$'
      - name: Apply the existing performance-only quarantine policy
        if: always()
        run: |
          bun -e '
            import { browserBenchmarkResults } from "./scripts/ci/browser-benchmark-results";
            import { quarantineRegistry, matchesPlatform } from "./scripts/ci/test-quarantine";
            const expected = quarantineRegistry.filter(entry => entry.runner === "packaged-desktop-benchmark" && entry.file === "clients/desktop/src/e2e/packaged-launch.p3.bench.ts" && entry.name === "sidecar crash shows recovery within budget" && matchesPlatform(entry, process.platform, process.arch));
            if (expected.length !== 1 || expected[0].failureKind !== "performance") throw new Error("Expected existing Linux performance-only policy");
            const report = await Bun.file("clients/desktop/test-results/packaged-benchmarks.json").json();
            const result = browserBenchmarkResults(report, expected, process.cwd());
            await Bun.write("failed-recovery-qualification.json", JSON.stringify(result, null, 2));
            if (result.selected !== 1 || result.executed !== 1 || result.stableFailures.length) throw new Error("Failed recovery case has a blocking failure or missing execution");
            console.log(JSON.stringify({ executed: result.executed, stableFailures: result.stableFailures, quarantined: result.quarantined }));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-recovery-linux
          path: |
            clients/desktop/test-results
            failed-recovery-qualification.json
          if-no-files-found: warn
