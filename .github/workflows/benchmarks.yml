name: Completed fixture profile qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    name: One completed fixture profile on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original public artifacts
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Compare complete setup and cleanup once
        run: |
          mkdir -p test-results
          cat > test-results/completed-profile-candidate.patch <<'PATCH'
          diff --git a/packages/e2e/src/scripts/prepare-ui-fixtures.ts b/packages/e2e/src/scripts/prepare-ui-fixtures.ts
          index 093eb2ab8..32e7309b6 100644
          --- a/packages/e2e/src/scripts/prepare-ui-fixtures.ts
          +++ b/packages/e2e/src/scripts/prepare-ui-fixtures.ts
          @@ -1,5 +1,5 @@
           import { execFile } from "node:child_process";
          -import { mkdir, writeFile } from "node:fs/promises";
          +import { mkdir, rm, writeFile } from "node:fs/promises";
           import { join } from "node:path";
           import { promisify } from "node:util";
           import { uiFixtureExtensions } from "pstdio-scripts/testing";
          @@ -8,20 +8,21 @@ import { copyPreparedFixtures } from "./prepared-fixture-copy";
           
           export const preparedUiSourcesPath = (home: string) => join(home, "fixtures", "sources.json");
           
          -// Producers retain immutable source and tarballs. Consumers also prepare their private
          -// package cache, which timed runtime installs already used before source reuse.
          +// One execution prepares sources, public tarballs and package payloads. Borrowers
          +// copy only source; each timed runtime still installs its own dependencies.
           const prepareFixtures = async (
             env: NodeJS.ProcessEnv,
             signal: AbortSignal,
          -  install: boolean,
             packageArtifacts?: Readonly<Record<string, string>>,
           ) => {
          -  const installEnv = { ...env, HOME: env.E2E_HOME, BUN_INSTALL_CACHE_DIR: env.E2E_BUN_CACHE_DIR };
             const names = JSON.parse(env.E2E_FIXTURE_EXTENSIONS ?? JSON.stringify(uiFixtureExtensions)) as string[];
             const started = performance.now();
             const reused = env.E2E_PREPARED_FIXTURES
               ? copyPreparedFixtures(env.E2E_PREPARED_FIXTURES, env.E2E_HOME!, names)
               : undefined;
          +  if (reused) env.E2E_BUN_CACHE_DIR = reused.packageCache;
          +  await mkdir(env.E2E_BUN_CACHE_DIR!, { recursive: true });
          +  const installEnv = { ...env, HOME: env.E2E_HOME, BUN_INSTALL_CACHE_DIR: env.E2E_BUN_CACHE_DIR };
             const sources: Record<string, string> = reused?.sources ?? {};
             const artifacts =
               packageArtifacts ??
          @@ -36,7 +37,7 @@ const prepareFixtures = async (
                   join(import.meta.dirname, "../../../../extensions", name),
                   { env: installEnv, signal, packageArtifacts: artifacts },
                 );
          -    if (install)
          +    if (!reused)
                 await promisify(execFile)("bun", ["install", "--frozen-lockfile", "--ignore-scripts"], {
                   cwd: sources[name],
                   env: installEnv,
          @@ -68,10 +69,7 @@ export const prepareUiFixtures = (
             env: NodeJS.ProcessEnv,
             signal: AbortSignal,
             packageArtifacts?: Readonly<Record<string, string>>,
          -) => prepareFixtures(env, signal, true, packageArtifacts);
          -
          -export const prepareUiFixtureSources = (env: NodeJS.ProcessEnv, signal: AbortSignal) =>
          -  prepareFixtures(env, signal, false);
          +) => prepareFixtures(env, signal, packageArtifacts);
           
           if (import.meta.main) {
             const directory = process.argv[process.argv.indexOf("--out") + 1];
          @@ -82,6 +80,7 @@ if (import.meta.main) {
             process.on("SIGINT", stop);
             process.on("SIGTERM", stop);
             try {
          +    await rm(join(directory, "sources.json"), { force: true });
               const env: NodeJS.ProcessEnv = {
                 ...process.env,
                 E2E_PREPARED_FIXTURES: undefined,
          @@ -89,8 +88,14 @@ if (import.meta.main) {
                 E2E_FIXTURE_EXTENSIONS: names,
                 E2E_BUN_CACHE_DIR: join(directory, "bun-cache"),
               };
          -    await prepareUiFixtureSources(env, controller.signal);
          -    await writeFile(join(directory, "sources.json"), env.E2E_EXTENSION_SOURCES!);
          +    await prepareUiFixtures(env, controller.signal);
          +    const sources = JSON.parse(env.E2E_EXTENSION_SOURCES!) as Record<string, string>;
          +    // Only package payloads are borrowed. Discard disposable setup installs before
          +    // publishing the handoff, so partial preparation is never reusable.
          +    for (const source of Object.values(sources))
          +      await rm(join(source, "node_modules"), { recursive: true, force: true });
          +    controller.signal.throwIfAborted();
          +    await writeFile(join(directory, "sources.json"), JSON.stringify({ sources, packageCache: env.E2E_BUN_CACHE_DIR }));
             } finally {
               process.off("SIGINT", stop);
               process.off("SIGTERM", stop);
          diff --git a/packages/e2e/src/scripts/prepared-fixture-copy.ts b/packages/e2e/src/scripts/prepared-fixture-copy.ts
          index 92dfc6edf..4e2608dd8 100644
          --- a/packages/e2e/src/scripts/prepared-fixture-copy.ts
          +++ b/packages/e2e/src/scripts/prepared-fixture-copy.ts
          @@ -5,15 +5,20 @@ import { basename, join } from "node:path";
           // source belongs to this invocation, including symlink targets. Runtime installation
           // owns dependencies; copying prepared node_modules repeats gigabytes of disposable work.
           export const copyPreparedFixtures = (prepared: string, home: string, names: string[]) => {
          -  const catalog = JSON.parse(readFileSync(join(prepared, "sources.json"), "utf8")) as Record<string, string>;
          +  const catalog = JSON.parse(readFileSync(join(prepared, "sources.json"), "utf8")) as {
          +    sources: Record<string, string>;
          +    packageCache: string;
          +  };
          +  if (!catalog.packageCache || !statSync(catalog.packageCache, { throwIfNoEntry: false })?.isDirectory())
          +    throw new Error("Completed fixture package cache missing");
             const started = performance.now();
             let bytesCopied = 0;
             const sources: Record<string, string> = {};
             for (const name of names) {
          -    if (!catalog[name]) throw new Error(`Prepared fixture missing: ${name}`);
          +    if (!catalog.sources[name]) throw new Error(`Prepared fixture missing: ${name}`);
               const destination = join(home, "fixtures", name, "extension-source");
               mkdirSync(join(home, "fixtures", name), { recursive: true });
          -    cpSync(catalog[name]!, destination, {
          +    cpSync(catalog.sources[name]!, destination, {
                 recursive: true,
                 dereference: true,
                 filter: (path) => {
          @@ -25,5 +30,11 @@ export const copyPreparedFixtures = (prepared: string, home: string, names: stri
               });
               sources[name] = destination;
             }
          -  return { sources, bytesCopied, copyMs: performance.now() - started, reuseHits: names.length };
          +  return {
          +    sources,
          +    packageCache: catalog.packageCache,
          +    bytesCopied,
          +    copyMs: performance.now() - started,
          +    reuseHits: names.length,
          +  };
           };
          PATCH
          git apply test-results/completed-profile-candidate.patch
          cat > "$RUNNER_TEMP/completed-profile-qualification.ts" <<'QUALIFICATION'
          import {execFileSync} from 'node:child_process';
          import {mkdirSync,mkdtempSync,writeFileSync} from 'node:fs';
          import {rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const root=process.env.GITHUB_WORKSPACE ?? '/Users/aurelienfranky/.pstdio/workspaces/1ab91e31-365c-4c54-a8a8-f5e2e0f3e817';
          const directory=mkdtempSync(join(tmpdir(),'ps206-completed-profile-'));
          const baseline=join(directory,'baseline-code');mkdirSync(baseline);
          const original=(path:string)=>execFileSync('git',['show',`0af9691eeffa5acdb4d6a802b0abe102feaa670a:${path}`],{cwd:root,encoding:'utf8'});
          let prepare=original('packages/e2e/src/scripts/prepare-ui-fixtures.ts')
           .replace('"pstdio-scripts/testing"',JSON.stringify(join(root,'scripts/ci/testing.ts')))
           .replace('"../packaged/packaged-extension-source"',JSON.stringify(join(root,'packages/e2e/src/packaged/packaged-extension-source.ts')))
           .replace('"./prepared-fixture-copy"',JSON.stringify(join(baseline,'prepared-fixture-copy.ts')))
           .replace('join(import.meta.dirname, "../../../../extensions", name)',`join(${JSON.stringify(root)},"extensions",name)`);
          writeFileSync(join(baseline,'prepare-ui-fixtures.ts'),prepare);
          writeFileSync(join(baseline,'prepared-fixture-copy.ts'),original('packages/e2e/src/scripts/prepared-fixture-copy.ts'));
          let consumers=original('packages/e2e/src/packaged/prepared-packaged-consumers.ts')
           .replace('"../local-workspace-registry"',JSON.stringify(join(root,'packages/e2e/src/local-workspace-registry.ts')))
           .replace('"../scripts/prepare-ui-fixtures"',JSON.stringify(join(baseline,'prepare-ui-fixtures.ts')))
           .replace('join(import.meta.dirname, "../../../..")',JSON.stringify(root));
          writeFileSync(join(baseline,'prepared-packaged-consumers.ts'),consumers);
          const oldPreparation=await import(join(baseline,'prepare-ui-fixtures.ts'));
          const oldConsumer=await import(join(baseline,'prepared-packaged-consumers.ts'));
          const current=await import(join(root,'packages/e2e/src/packaged/prepared-packaged-consumers.ts'));
          const {uiFixtureExtensions:names}=await import(join(root,'scripts/ci/test-fixture-profiles.ts'));
          const prior=process.env.E2E_PREPARED_FIXTURES;
          const signal=new AbortController().signal;
          try{
           const results=[];
           for(const mode of ['0af-source-only','completed-profile']){
            const prepared=join(directory,mode);
            const producerStart=performance.now();
            if(mode==='0af-source-only'){
             const env={...process.env,E2E_HOME:prepared,E2E_BUN_CACHE_DIR:join(prepared,'bun-cache'),E2E_PREPARED_FIXTURES:undefined};
             await oldPreparation.prepareUiFixtureSources(env,signal);writeFileSync(join(prepared,'sources.json'),env.E2E_EXTENSION_SOURCES!);
            }else{
             const producer=Bun.spawn([process.execPath,'packages/e2e/src/scripts/prepare-ui-fixtures.ts','--out',prepared,'--extensions',JSON.stringify(names)],{cwd:root,stdout:'inherit',stderr:'inherit'});
             if(await producer.exited!==0)throw new Error('Completed fixture producer failed');
            }
            const producerMs=performance.now()-producerStart;
            process.env.E2E_PREPARED_FIXTURES=prepared;
            const runs=[];
            for(let index=0;index<3;index++){
             const consumerStart=performance.now();
             const profile=await (mode==='0af-source-only'?oldConsumer:current).preparePackagedConsumers(signal);
             const setupMs=performance.now()-consumerStart;
             const cleanupStart=performance.now();await profile.close();const cleanupMs=performance.now()-cleanupStart;
             const run={setupMs,cleanupMs,totalMs:setupMs+cleanupMs};runs.push(run);console.log(JSON.stringify({mode,index,...run}));
            }
            const cleanupStart=performance.now();await rm(prepared,{recursive:true,force:true});const executorCleanupMs=performance.now()-cleanupStart;
            results.push({mode,producerMs,runs,executorCleanupMs,totalMs:producerMs+executorCleanupMs+runs.reduce((sum,run)=>sum+run.totalMs,0)});
           }
           const result={baseline:'0af9691eeffa5acdb4d6a802b0abe102feaa670a',candidate:'same source plus completed-profile preparation patch',host:`${process.platform}/${process.arch}`,bun:Bun.version,samples:1,selection:names,conditions:'Same seven production extensions, same built public SDK/UI, three fresh private consumers per arm, separate initially empty producer/package caches. Baseline uses original 0af producer/consumer modules, candidate uses actual current CLI producer and consumer. All preparation, private consumer closure and final executor cleanup included. Normal runtime installations remain outside this setup-only measurement. Sequential arms on one host; baseline first. No application runtimes or assertions and no end-to-end CI speedup claim.',results};
           const output=process.env.GITHUB_WORKSPACE?join(root,'test-results/completed-profile-qualification.json'):'/tmp/ps206-completed-profile-qualification.json';writeFileSync(output,JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          }finally{
           if(prior===undefined)delete process.env.E2E_PREPARED_FIXTURES;else process.env.E2E_PREPARED_FIXTURES=prior;
           await rm(directory,{recursive:true,force:true});
          }
          QUALIFICATION
          bun "$RUNNER_TEMP/completed-profile-qualification.ts" 2>&1 | tee test-results/completed-profile-qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-profile-qualification
          path: |
            test-results/completed-profile-qualification.*
            test-results/completed-profile-candidate.patch
          if-no-files-found: error
