name: Native scratch repair and stream diagnostics
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    name: Repaired scratch and failed set (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P0,P1,P2
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Apply exact scratch storage repair
        env:
          SCRATCH_PATCH: ""
          FAILED_SELECTION: ""
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          bun -e 'await Bun.write("test-results/native-scratch.patch",Buffer.from(process.env.SCRATCH_PATCH,"base64"));await Bun.write("test-results/failed-selection.ts",Buffer.from(process.env.FAILED_SELECTION,"base64"));'
          git apply test-results/native-scratch.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test-results/failed-selection.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove normal and forced interruption ownership
        run: bun test scripts/ci/execution-package-cache.p0.test.ts
      - name: Build original native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Compile original packaged host
        run: bun run --cwd scripts build:host
      - name: Execute complete failed files through repaired owning plan
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio.exe
        run: |
          bun scripts/test.ts --artifact compiled-cli --files-from test-results/native-failed-files.json --out test-results/native-failed-plan.json --prebuilt 2>&1 | Tee-Object -FilePath test-results/native-failed-set.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-scratch-${{ matrix.os }}
          path: |
            test-results/native-*
            test-results/ci/planned
            !test-results/ci/planned/**/extension-fixtures-*/**
            packages/e2e/test-results
          if-no-files-found: error
  stream:
    name: Actual native stream primitive events
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P2
      CI_PROFILE: production
      NX_SKIP_NX_CACHE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Instrument primitive follow events
        env:
          FOLLOW_SCRIPT: ""
        run: |
          bun -e 'await Bun.write("native-follow-diagnostic.ts",Buffer.from(process.env.FOLLOW_SCRIPT,"base64"));'
          bun native-follow-diagnostic.ts
      - name: Build native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install original Chromium
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Compile instrumented host
        run: bun run --cwd scripts build:host
      - name: Execute original full streaming case once with primitive diagnostics
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:cli -- src/packaged/packaged-chat-motion-smoke.p2.test.ts --test-name-pattern 'retains streaming messages and cached history'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-stream-primitive-events
          path: packages/e2e/test-results
          if-no-files-found: warn
  subnav:
    name: Main complete navigation control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_PRIORITY: P3
      TEST_PRIORITIES: P3
      CI_PROFILE: production
      SUBNAV_LABEL: main-f728-control
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f7289ac43b84e64bac4f6e13fda715517a118909
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build original native prerequisites
        run: bun run build -- --scope e2e --include-dependencies
      - name: Install original Chromium
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Compile original packaged host
        run: bun run --cwd scripts build:host
      - name: Execute all original navigation samples once
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun scripts/ci/run-subnav-benchmarks.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-complete-navigation-control
          path: |
            __test-tmp__/subnav-benchmark/results
            packages/e2e/test-results
            test-results/quarantine
          if-no-files-found: warn
