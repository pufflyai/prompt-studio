name: Verify and publish desktop release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source_ref:
        description: Candidate revision for a rehearsal that publishes nothing
        required: false
        type: string

permissions:
  contents: read

jobs:
  release_set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-release

      - name: Verify and flatten release set
        shell: bash
        run: |
          set -euo pipefail
          bun clients/desktop/scripts/verify-release-set.ts desktop-release
          mkdir desktop-publish
          find desktop-release -type f -exec cp '{}' desktop-publish/ \;
          cd desktop-publish
          for checksums in checksums-*.sha256; do sha256sum -c "$checksums"; done
          cat checksums-*.sha256 | sort > "checksums-desktop-${{ inputs.version }}.sha256"

      - name: Publish desktop release
        if: inputs.source_ref == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view '${{ inputs.tag }}' --json isDraft -q .isDraft)" = "true"
          gh release upload "${{ inputs.tag }}" desktop-publish/* --clobber
          gh release edit "${{ inputs.tag }}" --draft=false
