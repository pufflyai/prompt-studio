name: Weekly CI failure report

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Collect all CI attempts from the last week
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/report-ci-failures.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve report data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report-attempt-${{ github.run_attempt }}
          path: test-results/ci-failures
          if-no-files-found: warn
