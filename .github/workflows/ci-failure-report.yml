name: Weekly CI failure report

on:
  # Sunday night stays clear of the 03:00 nightly, which shares the token's request budget.
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:
    inputs:
      native_diagnostics:
        description: Diagnose release fixtures on their native platforms without publishing
        type: boolean
        default: false
      bridge_diagnostics:
        description: Exercise the relay process boundary on Windows without building a release
        type: boolean
        default: false
      run_id:
        description: Optional run whose failed job logs should be preserved instead of collecting the weekly report
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  report:
    if: inputs.run_id == '' && !inputs.native_diagnostics && !inputs.bridge_diagnostics
    runs-on: ubuntu-latest
    # The week to 2026-11-01 needed about 2,700 API requests. The token's 1,000 per hour are
    # shared with every workflow, so the collector keeps 300 in reserve and waits for each reset.
    timeout-minutes: 330
    steps:
      # Full history dates each quarantine entry.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Collect all CI attempts from the last week
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/report-ci-failures.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve report data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report-attempt-${{ github.run_attempt }}
          path: test-results/ci-failures
          if-no-files-found: warn

  failure_logs:
    if: inputs.run_id != '' && !inputs.native_diagnostics && !inputs.bridge_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect the original failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p failure-logs
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" \
            --jq '{id, head_sha, run_attempt, conclusion}' > failure-logs/run.json
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | {id, name}' \
            > failure-logs/failed-jobs.jsonl
          jq -r '.id' failure-logs/failed-jobs.jsonl > failure-logs/failed-jobs.txt
          failed=0
          while read -r job_id; do
            if ! gh api "repos/$REPOSITORY/actions/jobs/$job_id/logs" \
              > "failure-logs/$job_id.log" 2> "$RUNNER_TEMP/job-log-error.txt"; then
              : > "failure-logs/$job_id.log"
              echo "Could not retrieve original log for job $job_id" >> failure-logs/unavailable.txt
              failed=1
            fi
          done < failure-logs/failed-jobs.txt
          if [[ "$failed" == 1 ]]; then
            gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/logs" > "$RUNNER_TEMP/workflow-logs.zip"
            python3 - <<'PY'
          import json, os, pathlib, zipfile
          root = pathlib.Path("failure-logs")
          unavailable = []
          with zipfile.ZipFile(pathlib.Path(os.environ["RUNNER_TEMP"]) / "workflow-logs.zip") as archive:
              for line in (root / "failed-jobs.jsonl").read_text().splitlines():
                  job = json.loads(line)
                  target = root / f"{job['id']}.log"
                  if target.stat().st_size:
                      continue
                  suffix = "_" + job["name"].replace("/", "_") + ".txt"
                  matches = [name for name in archive.namelist() if "/" not in name and name.endswith(suffix)]
                  if len(matches) == 1:
                      target.write_bytes(archive.read(matches[0]))
                  else:
                      unavailable.append(str(job["id"]))
          (root / "unavailable.txt").write_text("\n".join(unavailable))
          if unavailable:
              raise SystemExit("Original job logs remain unavailable")
          PY
            failed=0
          fi
          exit "$failed"
      - name: Preserve original failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-job-logs-${{ inputs.run_id }}
          path: failure-logs
          if-no-files-found: error

  native_diagnostics:
    if: inputs.native_diagnostics
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform_pkg: cli-win-x64 }
          - { os: windows-11-arm, platform_pkg: cli-win-arm64 }
          - { os: macos-15-intel, platform_pkg: cli-darwin-x64 }
    env:
      PSTDIO_BUILD_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      CI_PRIORITY: P2
      CI_PROFILE: production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build native diagnostic runtime and source fixtures
        shell: bash
        run: bun run --cwd scripts build:all > native-build.log 2>&1
      - name: Prepare browser outside the tests
        env:
          BINARY_PATH: packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/${{ runner.os == 'Windows' && 'pstdio.exe' || 'pstdio' }}
        shell: bash
        run: bun -e 'import { resolve } from "node:path"; import { preparePackagedSmokeBrowser } from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(resolve(process.env.BINARY_PATH!));' > native-browser-setup.log 2>&1
      - name: Diagnose the unchanged native workloads once
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/${{ runner.os == 'Windows' && 'pstdio.exe' || 'pstdio' }}
        working-directory: packages/e2e
        shell: bash
        run: >-
          bun run test:packaged:cli
          src/packaged/packaged-cloud-peer.fixture.p0.test.ts
          src/packaged/packaged.p1.test.ts
          src/packaged/packaged-core-extensions-smoke.p1.test.ts
          src/packaged/packaged-cloud-notes-onboarding.p2.test.ts
          src/packaged/packaged-board-panning-smoke.p2.test.ts
          > ../../native-fixtures.log 2>&1
      - name: Diagnose unsigned Intel desktop build
        if: ${{ !cancelled() && matrix.platform_pkg == 'cli-darwin-x64' }}
        shell: bash
        run: bun run --cwd clients/desktop package -- --arch=x64 > native-desktop-build.log 2>&1
      - name: Preserve native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-release-diagnostics-${{ matrix.platform_pkg }}
          path: |
            native-*.log
            packages/e2e/test-results
            test-results/ci/bun/packages/e2e
          if-no-files-found: error

  bridge_diagnostics:
    if: inputs.bridge_diagnostics
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Await native process I/O before checking the rejection
        shell: bash
        run: bun test packages/e2e/src/packaged/packaged-cloud-peer.fixture.p0.test.ts > bridge-fixture.log 2>&1
      - name: Preserve process boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-diagnostics-${{ matrix.os }}
          path: bridge-fixture.log
          if-no-files-found: error
