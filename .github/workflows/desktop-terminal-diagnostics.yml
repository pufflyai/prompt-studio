name: Desktop Terminal Diagnostics
on:
  push:
    branches: [test/ps-3-terminal-lifetime]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: node scripts/ci/install-native-dependencies.ts
      - name: Build the source Lab fixture dependencies
        run: bunx lerna run build --scope workbench-fixture --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: desktop-development-win32-x64
          run-id: 36175724299
          github-token: ${{ github.token }}
          path: clients/desktop/out/Prompt Studio-win32-x64
      - name: Trace terminal lifetime in the existing development package
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.packaged.config.ts packaged-project-tabs --grep "preserving pages and terminals"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-lifetime-windows
          path: clients/desktop/test-results
