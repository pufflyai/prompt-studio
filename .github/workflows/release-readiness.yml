name: Release readiness

# Rehearses the next release without publishing anything. Start it from main: Windows signing
# trusts only main and release tags. `ref` names the branch to rehearse, usually the version PR.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to rehearse
        required: true
        default: changeset-release/main
        type: string

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check npm publishing
        id: check
        run: bun scripts/release/check-npm-publishing.ts

  packaged_toolchain:
    needs: npm
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ inputs.ref }}

  harness_cli_support:
    needs: npm
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ inputs.ref }}
      versions: '["minimum", "latest"]'

  release_build:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build release artifacts
        uses: ./.github/actions/build-release

      - name: Pack npm packages
        env:
          PUBLISH: ${{ needs.npm.outputs.publish }}
        run: |
          for dir in $(jq -r '.[]' <<< "$PUBLISH"); do
            (cd "$dir" && npm publish --dry-run)
          done

      - name: Render release notes
        run: bun run --cwd scripts release:notes "${{ needs.npm.outputs.version }}"

  desktop:
    needs: npm
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.npm.outputs.version }}
      tag: pstdio@${{ needs.npm.outputs.version }}
      source_ref: ${{ inputs.ref }}
      validation_ref: ${{ inputs.ref }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
