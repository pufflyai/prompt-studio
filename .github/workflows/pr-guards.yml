name: PR guards

# Enforces AGENTS.md "Generated files": no generated files outside the listed exceptions.
# It catches accidental commits, mostly by agents. It is not a security boundary: the PR
# can edit this workflow, and reviewers check workflow changes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr_guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci/pr-change-guards.ts
