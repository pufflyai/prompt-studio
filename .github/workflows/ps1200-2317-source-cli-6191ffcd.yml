name: PS-1200 exact source CLI review

on:
  push:
    branches:
      - chore/ps1200-2317-source-cli-6191ffcd

permissions:
  actions: read
  contents: read

jobs:
  source_cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PS1200_HEAD: 6191ffcd8305ab65406fc7ffbbc5bc0b9971bc9d
      PS1200_TREE: 566bce9e85e8f9d45e7a1586ee10453f0b347075
      PS1200_BASE: 8cb27b3678b3c32ba7710a3ef2ac4e8ee6d70f3e
      PS1200_POLICY: 6aca906de365eb58e68e09e82b42ed0cdc93b00f5d3e18900f19368d62293994
      PS1200_PLAN: 92aead95be49b260ef2d302d87813408f9b0d35d2771a6339cc348264243a0e2
      PS1200_CLI_GROUP: 72480638f874d13d0838a290
      PS1200_CLI_FILES_SHA256: 58d8a6b1f28c46136461a9d26acb7a8700f52cf27fdc5841e7117801d9420c7a
      PS1200_OUTPUT: test-results/ps1200-2317-source-cli
      PS1200_ORDINARY_RUN: "45517642142"
      PS1200_ORDINARY_SOURCE: bfc231869eb5518a109e698b8577709c7d7b7eb2
      PS1200_ORDINARY_PLAN: 3b2e290afe4fe6793221a5624577b9a77a20008b6b4a91978972d0d8cec314a7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PS1200_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify the source and sealed Linux plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/ps1200-2317-source-cli-6191ffcd
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git show -s --format=%P "$GITHUB_WORKFLOW_SHA")" = "$PS1200_HEAD"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_WORKFLOW_SHA")" =             "$(printf 'A\t.github/workflows/ps1200-2317-source-cli-6191ffcd.yml')"
          test "$(git rev-parse HEAD)" = "$PS1200_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PS1200_TREE"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main             refs/heads/chore/ps1200-api06-compat:refs/remotes/origin/chore/ps1200-api06-compat
          test "$(git rev-parse origin/chore/ps1200-api06-compat)" = "$PS1200_HEAD"
          main="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$main")" = "$PS1200_BASE"
          incoming="$(git rev-list --count "HEAD..$main")"
          test "$incoming" -le 10
          prospective="$(git merge-tree --write-tree --no-messages HEAD "$main")"
          test "$(git cat-file -t "$prospective")" = tree
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = "1.4.4"
          test "$(node --version)" = "v26.7.0"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          mkdir -p "$PS1200_OUTPUT"
          bun run test:review --base origin/main --list > "$PS1200_OUTPUT/selected-plan.json"
          jq -e --arg sha "$PS1200_HEAD" --arg tree "$PS1200_TREE" --arg base "$PS1200_BASE"             --arg policy "$PS1200_POLICY" --arg digest "$PS1200_PLAN" --arg group "$PS1200_CLI_GROUP" '
              .head == $sha and .mergeBase == $base and .testPlan.digest == $digest
              and .testPlan.source == {sha:$sha,tree:$tree,policy:$policy,dirty:false}
              and (.testPlan.runs | length) == 80 and (.selected | length) == 2734
              and all(.testPlan.runs[]; .target == {platform:"linux",arch:"x64"})
              and ([.testPlan.runs[] | select(.job == "local-additions") | .id] == [$group])
              and any(.testPlan.runs[]; .id == $group and .owner == "e2e" and .cwd == "packages/e2e"
                and .runner == "cli" and .priority == "P1" and .lane == "stable" and .artifact == "source"
                and .requires == ["build-e5b1f54fca1c52cd"] and (.files | length) == 10)
              and any(.testPlan.setup[]; .id == "build-e5b1f54fca1c52cd" and .owners == ["e2e"]
                and .kind == "build" and .requires == [])
            ' "$PS1200_OUTPUT/selected-plan.json"
          bun -e '
            import { validateTestPlan } from "./scripts/ci/test-plan";
            const { testPlan } = await Bun.file(process.env.PS1200_OUTPUT + "/selected-plan.json").json();
            validateTestPlan(testPlan);
          '
          jq -c --arg group "$PS1200_CLI_GROUP" '.testPlan.runs[] | select(.id == $group) | .files'             "$PS1200_OUTPUT/selected-plan.json" > "$PS1200_OUTPUT/assigned-files.json"
          printf '%s  %s\n' "$PS1200_CLI_FILES_SHA256" "$PS1200_OUTPUT/assigned-files.json" | sha256sum -c -
          jq -n --arg sha "$PS1200_HEAD" --arg tree "$PS1200_TREE" --arg main "$main" --arg base "$PS1200_BASE"             --arg prospective "$prospective" --arg plan "$PS1200_PLAN" --arg workflow "$GITHUB_WORKFLOW_SHA"             --argjson incoming "$incoming" --arg ordinary "$PS1200_ORDINARY_RUN"             --arg ordinarySource "$PS1200_ORDINARY_SOURCE"             '{sha:$sha,tree:$tree,main:$main,mergeBase:$base,mergeTree:$prospective,incoming:$incoming,
              planDigest:$plan,diagnosticCommit:$workflow,ordinaryCiRun:$ordinary,ordinaryCiSha:$ordinarySource}'             > "$PS1200_OUTPUT/identity.json"

      - name: Open an owned private temporary directory
        shell: bash
        run: |
          scratch="$(mktemp -d /tmp/ps1200.XXXXXX)"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$scratch/owner"
          {
            echo "PS1200_CLI_TMP=$scratch"
            echo "TMPDIR=$scratch"
            echo "TMP=$scratch"
            echo "TEMP=$scratch"
            echo "PS1200_NATIVE_BUN=$(command -v bun)"
          } >> "$GITHUB_ENV"
          { node --version; bun --version; docker version; df -h /tmp "$GITHUB_WORKSPACE"; }             > "$PS1200_OUTPUT/toolchain.log"

      - name: Install locked dependencies and prepare Firefox
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens
          (cd packages/e2e && bun x --no-install playwright install --with-deps firefox) 2>&1             | tee "$PS1200_OUTPUT/browser-setup.log"
          test -z "$(git status --porcelain)"

      - name: Execute only the ten-file source CLI group
        shell: bash
        run: |
          test "$(command -v bun)" = "$PS1200_NATIVE_BUN"
          bun --no-orphans - <<'BUN' 2>&1 | tee "$PS1200_OUTPUT/console.log"
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const { PS1200_CLI_TMP: scratch, PS1200_OUTPUT: relative, PS1200_CLI_GROUP: group } = process.env;
          if (!scratch || !/^\/tmp\/ps1200\.[A-Za-z0-9]{6}$/.test(scratch) || !relative || !group)
            throw new Error("Unexpected native review assignment");
          const executionId = process.env.GITHUB_RUN_ID + "/" + process.env.GITHUB_RUN_ATTEMPT;
          const output = resolve(root, relative);
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = relative + "/native";
          const { testPlan } = await Bun.file(resolve(output, "selected-plan.json")).json();
          let passed = false;
          try {
            const result = await executePlan(testPlan, {
              root, runIds: [group], prebuilt: false, executionId,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every(entry => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify exact native execution and file coverage
        shell: bash
        run: |
          jq -e --arg group "$PS1200_CLI_GROUP" --arg digest "$PS1200_PLAN"             --slurpfile expected "$PS1200_OUTPUT/assigned-files.json"             --slurpfile sealed "$PS1200_OUTPUT/selected-plan.json" '
              .source == $sealed[0].testPlan.source and .planDigest == $digest
              and .complete and .outcome == "success" and .errors == [] and .runIds == [$group]
              and (.results | length) == 1
              and all(.results[]; .runId == $group and .complete and .outcome == "success"
                and .exitCode == 0 and .nativeFailure != true and (.reportedFiles | sort) == ($expected[0] | sort))
              and [.phases[] | select(.kind == "build") | [.id,.outcome]] == [["build-e5b1f54fca1c52cd","success"]]
              and any(.phases[]; .kind == "cleanup" and .outcome == "success")
            ' "$PS1200_OUTPUT/native/execution.json"
          jq -e 'all(.[]; .outcome == "success")' "$PS1200_OUTPUT/compose-cleanup.json"
          git diff --exit-code

      - name: Retain and clean this invocation's temporary files
        if: always()
        shell: bash
        run: |
          mkdir -p "$PS1200_OUTPUT"
          if [[ -n "${PS1200_CLI_TMP:-}" ]]; then
            [[ "$PS1200_CLI_TMP" =~ ^/tmp/ps1200\.[A-Za-z0-9]{6}$ ]]
            test "$(cat "$PS1200_CLI_TMP/owner")" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if [[ -f "$PS1200_CLI_TMP/compose-projects.jsonl" ]]; then
              cp "$PS1200_CLI_TMP/compose-projects.jsonl" "$PS1200_OUTPUT/"
            fi
            rm -rf -- "$PS1200_CLI_TMP"
            test ! -e "$PS1200_CLI_TMP"
            printf '%s\n' 'Owned temporary directory removed' > "$PS1200_OUTPUT/scratch-cleanup.txt"
          fi

      - name: Upload the fixture and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1200-2317-source-cli-6191ffcd-attempt-${{ github.run_attempt }}
          path: ${{ env.PS1200_OUTPUT }}
          if-no-files-found: error
