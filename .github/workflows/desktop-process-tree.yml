name: Desktop Process Tree Regression
on:
  push:
    branches: [test/ps-3-process-tree]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install test dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter prompt-studio --filter workbench-fixture --filter @pstdio/sdk --filter @pstdio/ui --verbose
      - uses: actions/download-artifact@v4
        with:
          name: desktop-development-win32-x64
          path: ${{ runner.temp }}/desktop-candidate
          run-id: 36165823286
          github-token: ${{ github.token }}
      - name: Build Lab frontend dependencies
        run: bun run build -- --scope workbench-fixture --include-dependencies
      - name: Inspect compiled webviews with linked dependencies
        shell: pwsh
        run: |
          $env:E2E_PACKAGED_BINARY_PATH = Join-Path $env:RUNNER_TEMP "desktop-candidate/resources/bin/pstdio.exe"
          Set-Content packages/e2e/src/packaged/desktop-webview-diagnostic.test.ts 'import { registerLinkedWebviewSmokeTests } from "./packaged-linked-webview-smoke"; registerLinkedWebviewSmokeTests();'
          bun test packages/e2e/src/packaged/desktop-webview-diagnostic.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test packages/e2e/src/packaged/packaged-lab-build-diagnostic.test.ts
      - name: Reproduce synchronous Windows directory removal and verify asynchronous cleanup
        shell: pwsh
        run: |
          $helper = "clients/desktop/src/testing/remove-packaged-directory.ts"
          $original = Get-Content $helper -Raw
          try {
            Set-Content $helper 'import { rmSync } from "node:fs"; export const removePackagedDirectory = (path) => rmSync(path, { recursive: true, force: true, maxRetries: 5, retryDelay: 100 });'
            bun test clients/desktop/src/testing/remove-packaged-directory.test.ts
            if ($LASTEXITCODE -eq 0) { throw "Regression must fail with synchronous removal" }
          } finally {
            Set-Content $helper $original
          }
          bun test clients/desktop/src/testing/remove-packaged-directory.test.ts clients/desktop/src/testing/stop-packaged-runtime.test.ts clients/desktop/src/testing/packaged-fixture.test.ts clients/desktop/src/testing/stop-packaged-process.test.ts clients/desktop/src/runtime/runtime-process.test.ts
          exit $LASTEXITCODE
