name: Desktop Process Tree Regression
on:
  push:
    branches: [test/ps-3-process-tree]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install test dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify timeout cleanup reaches descendant processes
        run: bun test clients/desktop/src/testing/packaged-fixture.test.ts
