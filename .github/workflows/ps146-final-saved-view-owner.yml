name: PS146 profiler input comparison
on:
  push:
    branches: [test/ps146-observation-input-audit]
permissions:
  contents: read
  actions: read
env:
  NX_DAEMON: "false"
jobs:
  startup:
    name: Observation audit (${{ matrix.observe }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [edited-1]
        observe: [plain, cli-profile]
    env:
      GH_TOKEN: ${{ github.token }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2665d3224f7e3b06ce796ed94e27644441ce50ce
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up Bun in the Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - name: Install dependencies and restore the original Playwright build-cache profile
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Download original immutable plan
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "14331646075"
          merge-multiple: true
          run-id: "44089825358"
          github-token: ${{ github.token }}
          path: test-results/ci
      - name: Bind original plan to exact repaired source
        shell: bash
        run: |
          mkdir -p test-results/ci/final-saved-view-owner
          cp test-results/ci/plan.json test-results/ci/final-saved-view-owner/original-plan.json
          git rev-parse HEAD HEAD^{tree} > test-results/ci/final-saved-view-owner/source.txt
          git diff --exit-code
          git diff 3944dd91c6c9fc5bc3f0782af4eb4aa2eaf27951 HEAD --binary > test-results/ci/final-saved-view-owner/repair.patch
          bun -e 'import { readFileSync, writeFileSync } from "node:fs"; import { sealTestPlan, validateTestPlan } from "./scripts/ci/test-plan"; import { testPlanSource } from "./scripts/ci/test-plan-source"; const original = JSON.parse(readFileSync("test-results/ci/final-saved-view-owner/original-plan.json", "utf8")); validateTestPlan(original); const { digest, ...body } = original; const selected = original.runs.filter((run) => run.id === "3b5ab4bffce62d61ee9797ad"); if (selected.length !== 1 || selected[0].files.length !== 1 || selected[0].files[0] !== "packages/e2e/src/ui/workspace-saved-views.p2.spec.ts") throw new Error("Incorrect failed owning selection"); const next = sealTestPlan({ ...body, source: testPlanSource(process.cwd()), runs: selected }); if (JSON.stringify(next.setup) !== JSON.stringify(original.setup) || JSON.stringify(next.runs) !== JSON.stringify(selected)) throw new Error("Repair verification changed owning workload"); validateTestPlan(next, testPlanSource(process.cwd())); writeFileSync("test-results/ci/plan.json", JSON.stringify(next, null, 2)); writeFileSync("test-results/ci/final-saved-view-owner/provenance.json", JSON.stringify({originalSource: original.source, repairedSource: next.source, originalDigest: digest, repairedDigest: next.digest, setupByteIdentical: true, selectedOriginalWholeOwnerByteIdentical: true, selectedRunIds: selected.map((run) => run.id), passingPeersNotRepeated: true, profiling: false, timeoutOrWorkloadChanges: false}, null, 2));'
      - name: Execute complete failed saved-view owner without profiling
        shell: bash
        env:
          PLAN_JOB: ${{ matrix.job }}
          PLAN_PREBUILT: "false"
          PLAN_DISPLAY: "true"
          CI_PLAN_OUTPUT_DIR: test-results/ci/final-saved-view-owner/execution-${{ matrix.job }}
          AUDIT_OBSERVE: ${{ matrix.observe }}
        run: |
          python3 -c 'import base64; exec(base64.b64decode(""))'
      - name: Hash repair verification evidence
        if: always()
        shell: bash
        run: |
          find test-results/ci/final-saved-view-owner -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-results/ci/final-saved-view-owner/SHA256SUMS
      - name: Preserve original plan, phase inputs and every native outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps146-input-audit-${{ matrix.observe }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
          if-no-files-found: error
