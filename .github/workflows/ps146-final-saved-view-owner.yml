name: PS146 final saved view owner verification
on:
  push:
    branches: [test/ps146-private-transfer-owner]
permissions:
  contents: read
  actions: read
env:
  NX_DAEMON: "false"
jobs:
  startup:
    name: Final saved view owner (${{ matrix.job }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [edited-1]
    env:
      GH_TOKEN: ${{ github.token }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 359aa9ea612292c107566a044bc3fe0076fdbca6
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up Bun in the Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - name: Install dependencies and restore the original Playwright build-cache profile
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Download original immutable plan
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "14331646075"
          merge-multiple: true
          run-id: "44089825358"
          github-token: ${{ github.token }}
          path: test-results/ci
      - name: Bind original plan to exact repaired source
        shell: bash
        run: |
          mkdir -p test-results/ci/final-saved-view-owner
          cp test-results/ci/plan.json test-results/ci/final-saved-view-owner/original-plan.json
          git rev-parse HEAD HEAD^{tree} > test-results/ci/final-saved-view-owner/source.txt
          git diff --exit-code
          git diff 3944dd91c6c9fc5bc3f0782af4eb4aa2eaf27951 HEAD --binary > test-results/ci/final-saved-view-owner/repair.patch
          bun -e 'import { readFileSync, writeFileSync } from "node:fs"; import { sealTestPlan, validateTestPlan } from "./scripts/ci/test-plan"; import { testPlanSource } from "./scripts/ci/test-plan-source"; const original = JSON.parse(readFileSync("test-results/ci/final-saved-view-owner/original-plan.json", "utf8")); validateTestPlan(original); const { digest, ...body } = original; const selected = original.runs.filter((run) => run.id === "3b5ab4bffce62d61ee9797ad"); if (selected.length !== 1 || selected[0].files.length !== 1 || selected[0].files[0] !== "packages/e2e/src/ui/workspace-saved-views.p2.spec.ts") throw new Error("Incorrect failed owning selection"); const next = sealTestPlan({ ...body, source: testPlanSource(process.cwd()), runs: selected }); if (JSON.stringify(next.setup) !== JSON.stringify(original.setup) || JSON.stringify(next.runs) !== JSON.stringify(selected)) throw new Error("Repair verification changed owning workload"); validateTestPlan(next, testPlanSource(process.cwd())); writeFileSync("test-results/ci/plan.json", JSON.stringify(next, null, 2)); writeFileSync("test-results/ci/final-saved-view-owner/provenance.json", JSON.stringify({originalSource: original.source, repairedSource: next.source, originalDigest: digest, repairedDigest: next.digest, setupByteIdentical: true, selectedOriginalWholeOwnerByteIdentical: true, selectedRunIds: selected.map((run) => run.id), passingPeersNotRepeated: true, profiling: false, timeoutOrWorkloadChanges: false}, null, 2));'
      - name: Execute complete failed saved-view owner without profiling
        shell: bash
        env:
          PLAN_JOB: ${{ matrix.job }}
          PLAN_PREBUILT: "false"
          PLAN_DISPLAY: "true"
          CI_PLAN_OUTPUT_DIR: test-results/ci/final-saved-view-owner/execution-${{ matrix.job }}
        run: bun scripts/ci/run-ci-test-job.ts
      - name: Record hardware after the complete owning workload
        if: always()
        run: |
          cat /proc/cpuinfo > test-results/ci/final-saved-view-owner/cpuinfo.txt
          cat /sys/fs/cgroup/cpu.max > test-results/ci/final-saved-view-owner/cpu-max.txt
      - name: Hash repair verification evidence
        if: always()
        shell: bash
        run: |
          find test-results/ci/final-saved-view-owner -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > test-results/ci/final-saved-view-owner/SHA256SUMS
      - name: Preserve original plan, phase inputs and every native outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps146-final-owner-${{ matrix.job }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
          if-no-files-found: error

  cold-control:
    name: Cold inspector transfer (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: before
            source: ef809d53a15e033288a7909c16e6434c93841386
          - revision: repaired
            source: b5793193534755800687a8eebe1bd624f773b756
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up Bun in the Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Exercise real fresh inspector children and same-size edit
        shell: bash
        env:
          CONTROL_SOURCE: ${{ matrix.source }}
          CONTROL_REVISION: ${{ matrix.revision }}
        run: |
          mkdir -p test-results/ci/cold-control
          python3 - <<'PYCONTROL'
          from pathlib import Path
          import base64
          Path('/tmp/243-cold-inspector-transfer-control.ts').write_bytes(base64.b64decode(""))
          PYCONTROL
          set +e
          bun /tmp/243-cold-inspector-transfer-control.ts > test-results/ci/cold-control/result.json 2> test-results/ci/cold-control/stderr.log
          status=$?
          set -e
          cat test-results/ci/cold-control/result.json
          cat test-results/ci/cold-control/stderr.log
          echo "$status" > test-results/ci/cold-control/exit-code.txt
          if [ "$CONTROL_REVISION" = before ]; then test "$status" = 1; else test "$status" = 0; fi
      - name: Check owning graph and private child behavior
        if: matrix.revision == 'repaired'
        run: >
          bun test
          packages/pstdio-extensions/src/runtime/runtime-source-snapshot.p0.test.ts
          packages/pstdio-extensions/src/runtime/revision-dependency-artifacts.p0.test.ts
          packages/pstdio-extensions/src/runtime/revision-file-inputs.p0.test.ts
          packages/pstdio-extensions/src/runtime/revision-file-hash.p0.test.ts
          packages/pstdio-extensions/src/runtime/prepared-cache.p0.test.ts
          packages/pstdio-api/src/features/extensions/webview-input-inspector.p0.test.ts
      - name: Preserve every control outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps243-cold-control-${{ matrix.revision }}
          path: test-results/ci/cold-control
          if-no-files-found: error
