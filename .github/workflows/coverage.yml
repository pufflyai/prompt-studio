name: Coverage

# Full source measurement runs daily. Pull requests only check the reporting logic.
on:
  schedule:
    - cron: "31 4 * * *"
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - scripts/badges/**
      - packages/pstdio-api/src/test-utils/run-api-tests.ts
      - packages/pstdio-db/package.json
      - packages/sdk/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve a daily measurement's result. The report records the measured revision.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  report_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun test scripts/badges/coverage-badge.test.ts scripts/badges/coverage-report.test.ts

  measure:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      - name: Run tests with coverage
        # Database and SDK coverage targets run alone so other package tests do not
        # compete with cold database fixtures and full-size streaming asset checks.
        run: bun run test:coverage

      - name: Summarize coverage
        if: ${{ !cancelled() }}
        env:
          COVERAGE_SCOPE: daily-unit-source/linux-x64
        run: bun run --cwd scripts coverage:badge -- "$RUNNER_TEMP/badges/coverage.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badges/*.json

  # Only this job can write to the repository, and it runs no project code.
  publish:
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badges

      - name: Replace the badges branch
        working-directory: badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The badges branch holds only the latest badge data, so each run replaces it.
        run: |
          git init --quiet --initial-branch badges
          git add coverage.json coverage-report.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore: update coverage badge for ${GITHUB_SHA}"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
