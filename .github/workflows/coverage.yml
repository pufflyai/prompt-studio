name: Coverage

# Measure in full nightly validation. This workflow publishes that run's result.
on:
  workflow_run:
    workflows: [Release Packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful full nightly Release Packages run to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
    steps:
      - name: Select the successful full nightly measurement
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
          jq -e '.name == "Release Packages" and .head_branch == "main" and .conclusion == "success"' run.json > /dev/null
          attempt=$(jq -r '.run_attempt' run.json)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > artifacts.json
          artifact_id=$(jq -r --arg name "nightly-source-coverage-attempt-$attempt" \
            '[.[].artifacts[] | select(.name == $name and .expired == false)] |
            if length == 0 then "" elif length == 1 then .[0].id else error("Ambiguous nightly coverage") end' artifacts.json)
          echo "run_id=$(jq -r '.id' run.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

  # Only this job can write to the repository, and it runs no project code.
  publish:
    needs: select
    if: needs.select.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select.outputs.artifact_id }}
          run-id: ${{ needs.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: badges
          merge-multiple: true

      - name: Replace the badges branch
        working-directory: badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.select.outputs.run_id }}
        # The badges branch holds only the latest badge data, so each run replaces it.
        run: |
          git init --quiet --initial-branch badges
          git add coverage.json coverage-report.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore: update coverage badge from full nightly $SOURCE_RUN_ID"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
