name: PS-525 exact current prefix source CLI

on:
  push:
    branches:
      - chore/ps525-current-prefix-cli-53eccc4a

permissions:
  actions: read
  contents: read

concurrency:
  group: ps525-current-prefix-cli-53eccc4a
  cancel-in-progress: false

