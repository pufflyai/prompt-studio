name: Release Extensions

# Manual until PSX is deployed. Stable hosts install core extensions from their host
# release tag until then, so nothing reads these publications yet.
on:
  workflow_dispatch:

concurrency:
  group: release-extensions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Publish new extension versions independently
        env:
          PSTDIO_EXTENSION_REGISTRY: https://base.prompt.studio/psx
          PSX_PUBLISH_TOKEN: ${{ secrets.PSX_PUBLISH_TOKEN }}
        run: bun scripts/release/publish-extensions.ts
