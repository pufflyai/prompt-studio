name: Release Extensions

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/release/publish-extensions.ts"
      - "scripts/verify/verify-published-extensions.ts"
      - ".github/workflows/release-extensions.yml"
  workflow_dispatch:

concurrency:
  group: release-extensions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: psx-production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Publish new extension versions independently
        env:
          PSTDIO_EXTENSION_REGISTRY: ${{ vars.PSTDIO_EXTENSION_REGISTRY }}
          PSX_PUBLISH_TOKEN: ${{ secrets.PSX_PUBLISH_TOKEN }}
        run: bun scripts/release/publish-extensions.ts
