name: Release readiness resume verification
on:
  push:
    branches: [test/release-046-resume]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Test native runtime cleanup
        run: bun test ./clients/desktop/src/testing/stop-packaged-runtime.p0.test.ts
      - run: bun run --cwd clients/desktop package
      - name: Configure native Chromium sandboxes
        if: runner.os == 'Linux'
        run: |
          for sandbox in clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox; do
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          done
      - name: Verify the observed reload task and corrected cleanup
        shell: bash
        env:
          TEST_PRIORITIES: P2
        run: |
          bun scripts/ci/run-priority-tests.ts p2 --scope @pstdio/desktop --runner desktop --list > "$RUNNER_TEMP/desktop-plan.json"
          bun -e '
            const plan = await Bun.file(process.argv[1]).json();
            const packaged = plan.find((run) => run.id.endsWith(":packaged"));
            if (!packaged) throw new Error("Missing registered packaged desktop group");
            const command = [...packaged.command, "--grep", "keeps reporting slow frames"];
            const launch = process.platform === "linux" ? ["xvfb-run", "-a", ...command] : command;
            const child = Bun.spawn(launch, { cwd: packaged.cwd, stdin: "inherit", stdout: "inherit", stderr: "inherit" });
            process.exitCode = await child.exited;
          ' "$RUNNER_TEMP/desktop-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-resume-${{ matrix.os }}
          path: clients/desktop/test-results
          if-no-files-found: warn
