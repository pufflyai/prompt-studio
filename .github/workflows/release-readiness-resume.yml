name: Release readiness resume verification
on:
  push:
    branches: [test/release-046-resume]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - run: bun run --cwd clients/desktop package
      - name: Configure native Chromium sandboxes
        if: runner.os == 'Linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          for sandbox in clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox clients/desktop/node_modules/electron/dist/chrome-sandbox; do
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          done
      - name: Verify the source Electron group after correcting its sandbox prerequisite
        shell: bash
        env:
          TEST_PRIORITIES: P2
        run: |
          bun scripts/ci/run-priority-tests.ts p2 --scope @pstdio/desktop --runner desktop --list > "$RUNNER_TEMP/desktop-plan.json"
          xvfb-run -a bun -e '
            const plan = await Bun.file(process.argv[1]).json();
            const source = plan.find((run) => run.id.endsWith(":source"));
            if (!source) throw new Error("Missing registered source Electron group");
            const child = Bun.spawn(source.command, { cwd: source.cwd, stdin: "inherit", stdout: "inherit", stderr: "inherit" });
            process.exitCode = await child.exited;
          ' "$RUNNER_TEMP/desktop-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-resume-${{ matrix.os }}
          path: clients/desktop/test-results
          if-no-files-found: warn
