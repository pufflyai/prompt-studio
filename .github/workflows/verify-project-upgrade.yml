name: Recheck isolated desktop and browser groups with native prerequisites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    name: Native desktop and Firefox checks for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2219
            sha: 3442778a804c7b77d759a7680950c229ae7ac65a
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun x --no-install playwright install chromium firefox --with-deps
        working-directory: packages/e2e
      - name: Verify affected extension and CLI groups after main integration
        run: |
          xvfb-run -a bun -e '
            import {readReviewSource,localReviewEnvironment} from "./scripts/ci/local-review-source";
            import {executePlan} from "./scripts/ci/run-test-plan";
            import {mkdtempSync} from "node:fs";import {tmpdir} from "node:os";import {join} from "node:path";
            const root=process.cwd();const {plan}=readReviewSource(root,"0f0ba5bf4d3bfa3a1de4ce9a4e902d140b910dd0",[]);
            const groups=plan.testPlan.runs.filter(r=>r.files.some(f=>f.includes("/features/extensions/")||f==="packages/e2e/src/cli/close.p1.test.ts") || r.runner==="desktop");
            if (!groups.length) throw new Error("Missing expected review groups");
            const result=await executePlan(plan.testPlan,{root,env:localReviewEnvironment(mkdtempSync(join(tmpdir(),"webview-review-"))),runIds:groups.map(r=>r.id),report:"native-review-result.json"});
            console.log("Selected groups",groups.map(r=>r.id),"outcome",result.outcome);
            if(result.outcome!=="success")process.exit(1);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review-${{ matrix.pr }}
          path: native-review-result.json
