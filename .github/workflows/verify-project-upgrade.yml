name: Trace existing cold CLI project creation on Linux
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trace:
    name: Trace ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            sha: 4e74580fd18c4d2d0593e0ec8d2cbab4ef9ab848
          - label: lazy-webviews
            sha: a8e6fe1eded4a20ae974d7c5f17c9ab8ce749905
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - name: Build the public SDK used by the source API
        run: bun run --cwd packages/sdk build
      - name: Record timestamps from the existing setup spans
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/pstdio-api/src/lib/setup-phase.ts');s=p.read_text();s='import {appendFileSync} from "node:fs";\n'+s
          a='  setupLogger.info({ ...fields, state: "started" }';assert a in s;s=s.replace(a,'  appendFileSync("/tmp/installer-phases.jsonl",JSON.stringify({time: Date.now(), phase, extension:context.extension, task:context.task,state:"start",span:fields.span_id})+"\\n");\n'+a)
          a='  } finally {';assert a in s;s=s.replace(a,a+'\n    appendFileSync("/tmp/installer-phases.jsonl",JSON.stringify({time: Date.now(),phase,extension:context.extension,task:context.task,state,span:fields.span_id,ms:Math.round(performance.now()-startedAt)})+"\\n");')
          p.write_text(s)
          PY
      - name: Run the existing cold project creation file
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/cli/projects-create.p1.test.ts --timeout 30000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-phases-${{ matrix.label }}
          path: /tmp/installer-phases.jsonl
