name: Diagnose first Tickets navigation after a published stable upgrade
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        background: ['normal', 'disabled-for-comparison']
    env:
      TRACE_BACKGROUND: ${{ matrix.background }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44477507405
          artifact-ids: 14507072453
          merge-multiple: true
          path: ${{ runner.temp }}
      - run: |
          mkdir -p "$RUNNER_TEMP/probed"
          cd "$RUNNER_TEMP/probed"
          tar xzf "$RUNNER_TEMP/apple-cli.tgz"
          shasum -a 256 -c checksums
      - run: bun x --no-install playwright install chromium --no-shell
        working-directory: packages/e2e
      - run: |
          bun --no-env-file packages/e2e/src/packaged/project-upgrade.ts --from pstdio@0.47.0 --candidate "$RUNNER_TEMP/probed/dist/pstdio" --candidate-ref 113a69a10457bac7cdeb26754d06d9c1fb8cb775 --profile active
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-trace-${{ matrix.background }}
          path: test-results/project-upgrades
