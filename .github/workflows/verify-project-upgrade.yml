name: Isolated upgrade repair review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    name: Local-review command for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2219
            sha: a8e6fe1eded4a20ae974d7c5f17c9ab8ce749905
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun x --no-install playwright install chromium firefox --with-deps
        working-directory: packages/e2e
      - name: Run repository review against main
        run: |
          df -h .
          xvfb-run -a bun run test:review --base origin/bugfix/recover-home-and-workspace-upgrades
      - name: Collect per-group results
        if: failure()
        run: |
          mkdir -p checks
          for directory in /tmp/pstdio-local-review-*; do
            if test -d "$directory/source/test-results/ci"; then cp -R "$directory/source/test-results/ci" checks/; fi
          done
      - name: Preserve the selected checks and terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.pr }}
          path: |
            test-results/local-review/*.json
            checks/
