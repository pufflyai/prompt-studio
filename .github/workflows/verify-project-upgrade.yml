name: Verify a populated project upgrade
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      candidate_artifact_id:
        description: Production certification manifest artifact (stable)
        type: string
      build_artifact_id:
        description: Exact release build artifact (nightly)
        type: string
      include_previous_nightly:
        type: boolean
        default: false
      from_tag:
        type: string
  workflow_dispatch:
    inputs:
      from_tag:
        description: Published stable source release (defaults to the current stable release)
        type: string
      include_previous_nightly:
        description: Also upgrade the most recently published nightly to main
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    name: Project upgrade (${{ matrix.from }} → ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: pstdio@0.48.0-nightly.20261119040652
            target: linux-x64
            os: ubuntu-24.04
    env:
      FROM_TAG: ${{ matrix.from }}
      CANDIDATE_REF: 1499cdb507c55c363bf4bd83636fec95be62721b
      TARGET: ${{ matrix.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      # A candidate can predate this test. Keep the fixture and product checkouts separate.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install fixture dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check out the frozen candidate
        uses: actions/checkout@v5
        with:
          ref: e5fc4b1fdc90209e5c5632d7af1238501c9e5f3e
          path: __test-tmp__/upgrade-candidate
      - name: Use the candidate's recorded Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: __test-tmp__/upgrade-candidate/package.json
      - uses: actions/setup-node@v5
        if: inputs.ref == ''
        with:
          node-version: "26.7.0"
      - name: Install native build dependencies for current main
        if: inputs.ref == ''
        working-directory: __test-tmp__/upgrade-candidate
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Compile current main with its own extension sources
        if: inputs.ref == ''
        working-directory: __test-tmp__/upgrade-candidate
        env:
          PSTDIO_EXTENSION_RELEASE_REF: 1499cdb507c55c363bf4bd83636fec95be62721b
        run: |
          set -euo pipefail
          bun run build -- --scope pstdio --include-dependencies
          echo "CANDIDATE_BINARY=$PWD/dist/pstdio" >> "$GITHUB_ENV"
      - name: Archive the Apple rehearsal executable
        if: matrix.target == 'darwin-arm64' && contains(matrix.from, '-nightly.')
        working-directory: __test-tmp__/upgrade-candidate
        run: |
          set -euo pipefail
          git rev-parse HEAD > revision
          ./dist/pstdio --version > version
          shasum -a 256 dist/pstdio > checksums
          tar czf "$RUNNER_TEMP/apple-cli.tgz" dist/pstdio checksums revision version
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'darwin-arm64' && contains(matrix.from, '-nightly.')
        with:
          name: apple-rehearsal-cli
          path: ${{ runner.temp }}/apple-cli.tgz
      - name: Download the frozen candidate manifest
        if: inputs.candidate_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: __test-tmp__/upgrade-candidate
          merge-multiple: true
      - name: Read the immutable build artifact ID
        id: build
        if: inputs.candidate_artifact_id != ''
        working-directory: __test-tmp__/upgrade-candidate
        env:
          ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
        run: |
          set -euo pipefail
          id=$(jq -er --arg name "release-build-attempt-$ARTIFACT_ATTEMPT" '.artifacts[] | select(.name == $name) | .id' production-candidate.json)
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Download the exact build
        if: inputs.ref != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.build_artifact_id || steps.build.outputs.id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: __test-tmp__/upgrade-candidate
          merge-multiple: true
      - name: Restore the packaged CLI
        if: inputs.ref != ''
        working-directory: __test-tmp__/upgrade-candidate
        run: |
          set -euo pipefail
          jq -e --arg ref "$CANDIDATE_REF" --arg source "$SOURCE_SHA" '.versionSha == $ref and .sourceSha == $source' production-build-identity.json
          bun scripts/ci/production-payload.ts check
          binary="packages/pstdio/dist/platforms/cli-$TARGET/bin/pstdio"
          tar -xzf release-build.tar.gz "$binary"
          echo "CANDIDATE_BINARY=$PWD/$binary" >> "$GITHUB_ENV"
      - name: Install Chromium for the upgraded workbench
        working-directory: packages/e2e
        run: bun x --no-install playwright install chromium --no-shell
      - name: Upgrade both populated projects
        run: |
          bun --no-env-file packages/e2e/src/packaged/project-upgrade.ts \
            --from "$FROM_TAG" --candidate "$CANDIDATE_BINARY" --candidate-ref "$CANDIDATE_REF" --candidate-root __test-tmp__/upgrade-candidate
      - name: Preserve the pair, manifests and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-upgrade-${{ matrix.from }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: test-results/project-upgrades
          if-no-files-found: warn
      - name: Attest the verified release artifacts
        if: inputs.candidate_artifact_id != ''
        working-directory: __test-tmp__/upgrade-candidate
        env:
          CHANNEL: stable
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
        run: bun scripts/ci/production-evidence.ts --check "project-upgrade-$TARGET" --outcome success
      - name: Preserve release certification evidence
        if: inputs.candidate_artifact_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-project-upgrade-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: __test-tmp__/upgrade-candidate/production-evidence
          if-no-files-found: error
