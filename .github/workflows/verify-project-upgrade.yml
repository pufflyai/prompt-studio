name: Isolated CLI project creation and process lifecycle groups
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    name: Complete CLI project creation checks for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2207
            sha: 9e575a653cf38563223009fd45f55c7e0459903a
            base: bea93e2bd752247aa26599efb9095d82f93b7ba0
          - pr: 2216
            sha: ad9174895e02ebb1f53c9e3aa7be69e018daff34
            base: 9e575a653cf38563223009fd45f55c7e0459903a
          - pr: 2217
            sha: 5a4531dec6dcfe53c4d2261fd341f05714f12adc
            base: ad9174895e02ebb1f53c9e3aa7be69e018daff34
    env:
      STACK_BASE_REF: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun x --no-install playwright install chromium firefox --with-deps
        working-directory: packages/e2e
      - name: Run the complete CLI group containing project creation
        run: |
          xvfb-run -a bun -e '
            import {readReviewSource,localReviewEnvironment} from "./scripts/ci/local-review-source";
            import {executePlan} from "./scripts/ci/run-test-plan";
            import {mkdtempSync} from "node:fs";import {tmpdir} from "node:os";import {join} from "node:path";
            const root=process.cwd();
            const {plan}=readReviewSource(root,process.env.STACK_BASE_REF,[]);
            const groups=plan.testPlan.runs.filter(r=>r.runner==="cli" && r.files.includes("packages/e2e/src/cli/projects-create.p1.test.ts"));
            if (!groups.length) { console.log("No CLI project creation group in this per-base review");process.exit(0) }
            const result=await executePlan(plan.testPlan,{root,env:localReviewEnvironment(mkdtempSync(join(tmpdir(),"stack-cli-"))),runIds:groups.map(r=>r.id),report:"stack-cli-result.json"});
            console.log("CLI group review",result.outcome,groups.map(r=>r.id));
            if(result.outcome!=="success")process.exit(1);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-cli-${{ matrix.pr }}
          path: stack-cli-result.json
