name: Build the Apple rehearsal executable
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  cli:
    runs-on: macos-15
    env:
      SOURCE: 8e7eb300f26a44f13cc82cf0613de4633c84b721
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44475393029
          artifact-ids: 14506191069
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - run: |
          git fetch "$RUNNER_TEMP/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD^)" = "$SOURCE"
          git checkout --detach FETCH_HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          PSTDIO_EXTENSION_RELEASE_REF="$SOURCE" bun run build -- --scope pstdio --include-dependencies
          version=$(./dist/pstdio --version)
          git rev-parse HEAD > revision
          echo "$version" > version
          shasum -a 256 dist/pstdio > checksums
          tar czf "$RUNNER_TEMP/apple-cli.tgz" dist/pstdio checksums revision version
      - uses: actions/upload-artifact@v4
        with:
          name: apple-rehearsal-cli
          path: ${{ runner.temp }}/apple-cli.tgz
