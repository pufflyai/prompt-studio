name: Isolated upgrade repair review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    name: Local-review command for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2212
            sha: b7d8c5ddcf62aa183315ed9f152bfc69a69adc19
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - name: Install Chromium for browser and packaged checks
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Install test runner dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run repository review against main
        run: |
          df -h .
          xvfb-run -a bun run test:review --base origin/main
      - name: Collect disposable review results
        if: failure()
        run: |
          mkdir -p review-failures
          for scratch in /tmp/pstdio-local-review-*; do
            if test -d "$scratch/source/test-results/ci"; then
              cp -R "$scratch/source/test-results/ci" review-failures/
            fi
            if test -d "$scratch/logs"; then
              cp -R "$scratch/logs" review-failures/
            fi
          done
      - name: Preserve the selected checks and terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.pr }}
          path: |
            test-results/local-review/*.json
            review-failures
