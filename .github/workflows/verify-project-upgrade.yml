name: Exact review of the ticket recovery stack
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    name: PR ${{ matrix.pr }} against its declared base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2207
            sha: 9e575a653cf38563223009fd45f55c7e0459903a
            base: bea93e2bd752247aa26599efb9095d82f93b7ba0
          - pr: 2216
            sha: ad9174895e02ebb1f53c9e3aa7be69e018daff34
            base: 9e575a653cf38563223009fd45f55c7e0459903a
          - pr: 2217
            sha: 5a4531dec6dcfe53c4d2261fd341f05714f12adc
            base: ad9174895e02ebb1f53c9e3aa7be69e018daff34
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun x --no-install playwright install chromium firefox --with-deps
        working-directory: packages/e2e
      - name: Run the selected repository checks
        id: review
        env:
          BASE: ${{ matrix.base }}
        run: xvfb-run -a bun run test:review --base "$BASE"
      - name: Preserve exact results
        if: always()
        run: |
          mkdir -p exact-reports
          cp test-results/local-review/*.json exact-reports/ || true
          for scratch in /tmp/pstdio-local-review-*; do
            if test -d "$scratch/source/test-results/ci"; then
              cp -R "$scratch/source/test-results/ci" exact-reports/
            fi
            if test -f "$scratch/checks.json"; then
              cp "$scratch/checks.json" exact-reports/selected-checks.json
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-exact-review-${{ matrix.pr }}
          path: exact-reports/
