name: Recheck isolated desktop and browser groups with native prerequisites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    name: Native desktop and Firefox checks for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2203
            sha: e7a6bb06a2c32f4516e8d1eb62712a8c6bc79c72
          - pr: 2212
            sha: b7d8c5ddcf62aa183315ed9f152bfc69a69adc19
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun x --no-install playwright install chromium firefox --with-deps
        working-directory: packages/e2e
      - name: Re-run the complete selected desktop groups and Firefox shutdown test
        run: |
          xvfb-run -a bun -e '
            import {readReviewSource,localReviewEnvironment} from "./scripts/ci/local-review-source";
            import {executePlan} from "./scripts/ci/run-test-plan";
            import {mkdtempSync} from "node:fs";import {tmpdir} from "node:os";import {join} from "node:path";
            const root=process.cwd();
            const {plan}=readReviewSource(root,"origin/main",[]);
            const groups=plan.testPlan.runs.filter(r=>r.runner==="desktop" || r.files.includes("packages/e2e/src/cli/close.p1.test.ts"));
            if (!groups.length) throw new Error("Missing native review groups");
            const result=await executePlan(plan.testPlan,{root,env:localReviewEnvironment(mkdtempSync(join(tmpdir(),"native-review-"))),runIds:groups.map(r=>r.id),report:"native-review-result.json"});
            console.log("Native review",result.outcome,groups.map(r=>r.id));
            if(result.outcome!=="success")process.exit(1);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review-${{ matrix.pr }}
          path: native-review-result.json
