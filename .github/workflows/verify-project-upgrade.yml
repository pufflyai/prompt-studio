name: Isolated upgrade repair review
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    name: Local-review command for PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2203
            sha: eeeff29f10224993b94e1aff9f1a6598fb403f4f
          - pr: 2207
            sha: 9082b6d51547a527126e60e2908c3b8d29b29b15
          - pr: 2212
            sha: e4e1fcf8bf80e13c4f6c9f936060a87bf551d819
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '26.7.0'
      - name: Install Chromium for browser and packaged checks
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Run repository review against main
        run: |
          df -h .
          xvfb-run -a bun run test:review --base origin/main
      - name: Preserve the selected checks and terminal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.pr }}
          path: test-results/local-review/*.json
