name: Terminal output observation proof
on:
  push:
    branches: [diagnostics/verify-terminal-output-sampling]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-with-gate
            revision: 889efc0c96cd08df4d113482aa7f0855ee781e93
            gate: true
          - label: fixed-with-gate
            revision: de172f0bbb9561254400453b9d5899f1a3fb7445
            gate: true
          - label: fixed-native
            revision: de172f0bbb9561254400453b9d5899f1a3fb7445
            gate: false
    env:
      CI_PROFILE: production
      CI_PRIORITY: P2
      E2E_TEST_LANE: quarantine
      E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      PRODUCT_REVISION: ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ matrix.revision }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "26.7.0"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build the release browser fixture
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
          bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Hold visibility during the observed sampling gap
        if: matrix.gate
        run: |
          git show "$GITHUB_SHA:.github/diagnostics/gate-terminal-output.mjs" > "$RUNNER_TEMP/gate-terminal-output.mjs"
          node "$RUNNER_TEMP/gate-terminal-output.mjs"
      - name: Check the complete host terminal journey once
        run: bun run --cwd packages/e2e test:ui src/ui/extension-webviews.p2.spec.ts --grep "opens host terminal tabs from the Secondary Panel" --trace on
      - name: Preserve the first attempt and browser trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-output-${{ matrix.label }}
          path: packages/e2e/test-results/
