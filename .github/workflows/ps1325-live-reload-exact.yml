name: PS-1325 exact live-reload diagnostic

on:
  push:
    branches:
      - chore/ps1325-live-reload-9abf612f

permissions:
  contents: read

jobs:
  live-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 9abf612f0d544531baeb873640f4b004770b7f60
      CANDIDATE_TREE: 8f412b07cf8cba12e29b8dc9c409a567ed8145af
      CANDIDATE_BASE: ef128db184ea5456f8b91a626bb83ecb02a6c3ac
      SOURCE_POLICY: 0919c441a350ecbfcce669094d433f8f02a2b3f45c4d0571f798af77d9b341da
      PLAN_DIGEST: 7998f6db639a75bf11be9afa61b85ffcd1d6e6934999e5f230ae5db9e39c6301
      LIVE_RELOAD_GROUP: 648e5b4b7b23c91c090387b2
      LIVE_RELOAD_SPEC: packages/e2e/src/ui/extension-webview-live-reload.p2.spec.ts
      LIVE_RELOAD_SHA256: 7ba1b955e3c2b419e255fa7af00bd3a85ba2f1da250b1a9a6ca76adff6b67a45
      PLAN_DISPLAY: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify and record the exact selected plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/ps1325-live-reload-9abf612f
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git show --no-patch --format=%P "$GITHUB_WORKFLOW_SHA")" = "$CANDIDATE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_WORKFLOW_SHA")" = \
            ".github/workflows/ps1325-live-reload-exact.yml"
          test -z "$(git status --porcelain)"
          printf '%s  %s\n' "$LIVE_RELOAD_SHA256" "$LIVE_RELOAD_SPEC" | sha256sum --check
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          main="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$main")" = "$CANDIDATE_BASE"
          incoming="$(git rev-list --count "$CANDIDATE_SHA..$main")"
          test "$incoming" -le 10
          prospective_tree="$(git merge-tree --write-tree --no-messages "$main" "$CANDIDATE_SHA")"
          test "$(git cat-file -t "$prospective_tree")" = tree
          out=test-results/ps1325-live-reload
          mkdir -p "$out"
          bun run test:review --base origin/main --test "$LIVE_RELOAD_SPEC" --list > "$out/selected-plan.json"
          jq -e --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg base "$CANDIDATE_BASE" \
            --arg policy "$SOURCE_POLICY" --arg digest "$PLAN_DIGEST" --arg run "$LIVE_RELOAD_GROUP" \
            --arg file "$LIVE_RELOAD_SPEC" \
            '.head == $head and .mergeBase == $base and .testPlan.digest == $digest
            and .testPlan.source == {sha:$head,tree:$tree,policy:$policy,dirty:false}
            and (.testPlan.runs | length) == 80 and (.selected | length) == 2646 and (.queueFiles | length) == 2634
            and ([.testPlan.runs[] | select(.id == $run)] | length) == 1
            and all(.testPlan.runs[] | select(.id == $run);
              .files == [$file] and .runner == "app" and .priority == "P2"
              and .target == {platform:"linux",arch:"x64"}
              and .requires == ["build-e5b1f54fca1c52cd","build-fe3393b3d79ff7a4","extension-fixtures-dda5c124d5787f5d"])' "$out/selected-plan.json"
          jq -S '.testPlan' "$out/selected-plan.json" > "$out/plan.json"
          jq -n --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg base "$main" \
            --arg mergeBase "$CANDIDATE_BASE" --arg digest "$PLAN_DIGEST" --arg run "$LIVE_RELOAD_GROUP" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" --arg prospectiveTree "$prospective_tree" \
            --argjson incoming "$incoming" \
            '{head:$head,tree:$tree,base:$base,mergeBase:$mergeBase,digest:$digest,run:$run,workflowSha:$workflowSha,
              prospectiveTree:$prospectiveTree,incoming:$incoming}' > "$out/identity.json"

      - name: Prepare the browser and owned temporary directory
        shell: bash
        run: |
          docker version
          docker compose version
          sudo -n true
          bunx playwright@1.60.0 install --with-deps chromium
          command -v xvfb-run
          private_tmp="$(mktemp -d /tmp/ps1325.XXXXXX)"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$private_tmp/owner"
          {
            echo "PS1325_REVIEW_TMP=$private_tmp"
            echo "TMPDIR=$private_tmp"
            echo "TMP=$private_tmp"
            echo "TEMP=$private_tmp"
          } >> "$GITHUB_ENV"

      - name: Prepare locked dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens

      - name: Execute the complete owning live-reload group
        shell: bash
        run: |
          bun --no-orphans - <<'BUN' 2>&1 | tee test-results/ps1325-live-reload/console.log
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const output = resolve(root, "test-results/ps1325-live-reload");
          const scratch = process.env.PS1325_REVIEW_TMP;
          const group = process.env.LIVE_RELOAD_GROUP;
          const executionId = process.env.GITHUB_RUN_ID + "/" + process.env.GITHUB_RUN_ATTEMPT;
          if (!scratch || !/^\/tmp\/ps1325\.[A-Za-z0-9]{6}$/.test(scratch) || !group)
            throw new Error("Missing or invalid exact diagnostic inputs");
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = "test-results/ps1325-live-reload/native";
          const plan = await Bun.file(resolve(output, "plan.json")).json();
          let passed = false;
          try {
            const result = await executePlan(plan, {
              root,
              runIds: [group],
              prebuilt: false,
              executionId,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every((entry) => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify the native receipt and both original Chromium cases
        shell: bash
        run: |
          out=test-results/ps1325-live-reload
          jq -e --arg digest "$PLAN_DIGEST" --arg run "$LIVE_RELOAD_GROUP" --slurpfile plan "$out/plan.json" \
            --arg execution "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --arg file "$LIVE_RELOAD_SPEC" \
            '.executionId == $execution and .complete and .outcome == "success" and .planDigest == $digest and .source == $plan[0].source
            and .runIds == [$run] and .errors == [] and (.results | length) == 1
            and all(.results[]; .runId == $run and .complete and .outcome == "success"
              and .exitCode == 0 and .nativeFailure != true and .reportedFiles == [$file])
            and ([.phases[] | select(.kind == "build" or .kind == "extension-fixtures") | [.id,.outcome]] | sort)
                == [["build-e5b1f54fca1c52cd","success"],["build-fe3393b3d79ff7a4","success"],
                  ["extension-fixtures-dda5c124d5787f5d","success"]]
            and any(.phases[]; .kind == "cleanup" and .outcome == "success")' "$out/native/execution.json"
          jq -e --arg digest "$PLAN_DIGEST" --arg run "$LIVE_RELOAD_GROUP" --arg file "$LIVE_RELOAD_SPEC" \
            --arg execution "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            '.executionId == $execution and .runId == $run and .planDigest == $digest and .complete and .status == "passed" and .errors == []
            and (.selected | length) == 2 and (.cases | length) == 2
            and all(.selection[]; .file == $file and .project == "chromium")
            and all(.cases[]; .file == $file and .outcome == "passed" and .retry == 0 and .errorMessages == [])
            and any(.cases[]; .title | endswith("updates an open dashboard webview after editing its source"))
            and any(.cases[]; .title | endswith("recovers an open webview after its missing dependency is installed"))' \
            "$out/native/$LIVE_RELOAD_GROUP/browser.json"
          sed -nE 's/.*webview live reload elapsed: ([0-9]+)ms.*/\1/p' "$out/console.log" > "$out/update-ms.txt"
          test "$(wc -l < "$out/update-ms.txt")" -eq 2
          awk '$1 >= 5000 { failed=1 } END { exit failed }' "$out/update-ms.txt"
          jq -e 'all(.[]; .outcome == "success")' "$out/compose-cleanup.json"
          git diff --exit-code

      - name: Record cleanup
        if: always()
        shell: bash
        run: |
          out=test-results/ps1325-live-reload
          mkdir -p "$out"
          docker ps -a --format '{{.Names}} {{.Status}} {{.Label "com.docker.compose.project"}}' > "$out/docker-after.txt"
          if [[ -n "${PS1325_REVIEW_TMP:-}" ]]; then
            [[ "$PS1325_REVIEW_TMP" =~ ^/tmp/ps1325\.[A-Za-z0-9]{6}$ ]]
            test "$(cat "$PS1325_REVIEW_TMP/owner")" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if [[ -f "$PS1325_REVIEW_TMP/compose-projects.jsonl" ]]; then
              cp "$PS1325_REVIEW_TMP/compose-projects.jsonl" "$out/"
            fi
            rm -rf -- "$PS1325_REVIEW_TMP"
            test ! -e "$PS1325_REVIEW_TMP"
            printf '%s\n' "$PS1325_REVIEW_TMP removed" > "$out/scratch-cleanup.txt"
          fi
          test ! -s "$out/docker-after.txt"

      - name: Upload native execution and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1325-live-reload-9abf-attempt-${{ github.run_attempt }}
          path: |
            test-results/ps1325-live-reload
            packages/e2e/test-results
          if-no-files-found: error
