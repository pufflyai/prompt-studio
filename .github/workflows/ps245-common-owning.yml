name: PS245 shared prerequisite owning qualification
on:
  push:
    branches: [test/ps245-common-owning-20261117]
permissions:
  contents: read
env:
  NX_DAEMON: "false"
jobs:
  owning:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      UI_PERF_ASSERT_BUDGETS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 627719ec0814f171a372d0c05ea8477fac4c5c30
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up pinned Bun in the Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Bind exact clean candidate
        run: |
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree}
      - name: Run complete failed Workspaces two-device owning file
        run: bun scripts/test.ts --file packages/e2e/src/packaged/packaged-workspaces-devices.p2.test.ts --out test-results/ci/owning-plan.json
      - name: Retain exact owning outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps245-workspaces-device-owner-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: error
