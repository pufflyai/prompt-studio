{name: Desktop Intel Release Candidate,"on": {push: {branches: [feature/ps-3-native-desktop-support]}},permissions: {contents: read},jobs: {intel: {name: "${{ matrix.target }}",runs-on: "${{ matrix.os }}",timeout-minutes: 30,strategy: {fail-fast: false,matrix: {include: [{target: darwin-x64,platform: darwin,arch: x64,os: macos-15-intel}]}},steps: [{uses: actions/checkout@v5,with: {fetch-depth: 0}},{name: Setup Bun,uses: oven-sh/setup-bun@v2,with: {bun-version-file: package.json}},{name: Setup Node.js,uses: actions/setup-node@v5,with: {node-version: "24"}},{name: Install dependencies,run: node scripts/ci/install-native-dependencies.ts},{name: Import macOS signing credentials,if: "matrix.platform == 'darwin'",shell: bash,env: {MACOS_CERTIFICATE: "${{ secrets.MACOS_CERTIFICATE }}",MACOS_CERTIFICATE_PASSWORD: "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}",APPLE_API_KEY_CONTENT: "${{ secrets.APPLE_API_KEY }}",CERTIFICATE_PATH: "${{ runner.temp }}/pstdio-desktop.p12",APPLE_API_KEY_PATH: "${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8",KEYCHAIN_PATH: "${{ runner.temp }}/pstdio-desktop.keychain-db"},run: "set -euo pipefail\ntest -n \"$MACOS_CERTIFICATE\"\ntest -n \"$MACOS_CERTIFICATE_PASSWORD\"\ntest -n \"$APPLE_API_KEY_CONTENT\"\nbun -e 'await Bun.write(process.env.CERTIFICATE_PATH, Buffer.from(process.env.MACOS_CERTIFICATE, \"base64\")); await Bun.write(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_CONTENT, \"base64\"));'\nKEYCHAIN_PASSWORD=$(uuidgen)\necho \"::add-mask::$KEYCHAIN_PASSWORD\"\nsecurity create-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\nsecurity set-keychain-settings -lut 21600 \"$KEYCHAIN_PATH\"\nsecurity unlock-keychain -p \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\nsecurity import \"$CERTIFICATE_PATH\" -P \"$MACOS_CERTIFICATE_PASSWORD\" -A -t cert -f pkcs12 -k \"$KEYCHAIN_PATH\"\nsecurity set-key-partition-list -S apple-tool:,apple: -k \"$KEYCHAIN_PASSWORD\" \"$KEYCHAIN_PATH\"\nsecurity list-keychains -d user -s \"$KEYCHAIN_PATH\"\n"},{name: Build signed macOS distributions,if: "matrix.platform == 'darwin'",env: {DEBUG: electron-notarize*,PSTDIO_DESKTOP_RELEASE: "1",MACOS_SIGN_IDENTITY: "${{ secrets.MACOS_SIGN_IDENTITY }}",APPLE_API_KEY: "${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8",APPLE_API_KEY_ID: "${{ secrets.APPLE_API_KEY_ID }}",APPLE_API_ISSUER: "${{ secrets.APPLE_API_ISSUER }}"},run: "bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}"},{name: Verify Electron fuse policy,id: fuses,run: bun run --cwd clients/desktop verify:fuses},{name: Smoke packaged application,if: "matrix.platform != 'linux'",run: bun run --cwd clients/desktop test:packaged},{name: Upload packaged release-readiness evidence,if: always(),uses: actions/upload-artifact@v4,with: {name: "release-readiness-${{ matrix.target }}",path: clients/desktop/test-results,if-no-files-found: error,retention-days: 14}},{name: Verify macOS signatures and notarization,if: "always() && steps.fuses.outcome == 'success'",shell: bash,run: "set -euo pipefail\nAPP_PATH=\"clients/desktop/out/Prompt Studio-darwin-${{ matrix.arch }}/Prompt Studio.app\"\ncodesign --verify --deep --strict --verbose=2 \"$APP_PATH\"\ncodesign --verify --strict --verbose=2 \"$APP_PATH/Contents/Resources/bin/pstdio\"\nxcrun stapler validate \"$APP_PATH\"\nspctl --assess --type execute --verbose=2 \"$APP_PATH\"\n"},{name: Prepare verified Intel candidate artifacts,shell: bash,run: "bun -e 'const path = \"clients/desktop/src/release/release-artifacts.ts\"; const text = await Bun.file(path).text(); await Bun.write(path, text.replace(\"[\\\"darwin-arm64\\\", \\\"linux-x64\\\"]\", \"[\\\"darwin-arm64\\\", \\\"darwin-x64\\\", \\\"linux-x64\\\"]\")); await Bun.write(\"/tmp/ps3-candidate-notes.md\", \"Unpublished PS-3 Intel validation candidate.\");'\nbun run --cwd clients/desktop release:prepare -- --target darwin-x64 --notes-file /tmp/ps3-candidate-notes.md"},{name: Preserve signed Intel test installers,uses: actions/upload-artifact@v4,with: {name: desktop-candidate-darwin-x64,path: clients/desktop/out/release/darwin-x64/*,if-no-files-found: error}},{name: Remove macOS signing keychain,if: "always() && matrix.platform == 'darwin'",shell: bash,env: {KEYCHAIN_PATH: "${{ runner.temp }}/pstdio-desktop.keychain-db"},run: "security delete-keychain \"$KEYCHAIN_PATH\" || true"}]}}}