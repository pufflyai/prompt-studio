name: Diagnose Windows Planner dependency install
on:
  push:
    branches: [test/diag-win-arm-core]
permissions:
  contents: read
jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          drive-format: ReFS
          drive-path: ${{ runner.temp }}\refs_drive.vhdx
          env-mapping: REFS_DRIVE,{{ DEV_DRIVE }}
      - uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          drive-format: NTFS
          drive-path: ${{ runner.temp }}\ntfs_drive.vhdx
          env-mapping: NTFS_DRIVE,{{ DEV_DRIVE }}
      - name: Time Planner production installs per volume
        shell: pwsh
        run: |
          function Time-Install($root, $label) {
            New-Item -ItemType Directory -Force "$root\app" | Out-Null
            Copy-Item extensions\pstdio-planner\package.json, extensions\pstdio-planner\bun.lock, extensions\pstdio-planner\bunfig.toml "$root\app"
            $env:BUN_INSTALL_CACHE_DIR = "$root\cache"
            Push-Location "$root\app"
            $cold = Measure-Command { bun install --frozen-lockfile --ignore-scripts --production | Out-Host }
            $files = (Get-ChildItem node_modules -Recurse -File -Force).Count
            $bytes = (Get-ChildItem node_modules -Recurse -File -Force | Measure-Object Length -Sum).Sum
            $cacheBytes = (Get-ChildItem "$root\cache" -Recurse -File -Force | Measure-Object Length -Sum).Sum
            Remove-Item node_modules -Recurse -Force
            $warm = Measure-Command { bun install --frozen-lockfile --ignore-scripts --production | Out-Host }
            Pop-Location
            "RESULT $label cold=$([math]::Round($cold.TotalSeconds,1))s warm=$([math]::Round($warm.TotalSeconds,1))s files=$files bytes=$bytes cacheBytes=$cacheBytes"
          }
          "RUNNER_TEMP=$env:RUNNER_TEMP REFS_DRIVE=$env:REFS_DRIVE NTFS_DRIVE=$env:NTFS_DRIVE"
          Get-Volume | Format-Table DriveLetter,FileSystem,FileSystemLabel,Size,SizeRemaining
          Time-Install "$env:RUNNER_TEMP\diag-1" "runner-temp"
          Time-Install "$env:REFS_DRIVE\diag-1" "refs-1"
          Time-Install "$env:NTFS_DRIVE\diag-1" "ntfs-1"
          Time-Install "$env:REFS_DRIVE\diag-2" "refs-2"
          Time-Install "$env:NTFS_DRIVE\diag-2" "ntfs-2"
