name: Diagnose Windows ReFS rename semantics
on:
  push:
    branches: [test/diag-win-arm-core]
permissions:
  contents: read
jobs:
  rename:
    name: rename (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        shell: bash
      - name: Create ReFS Dev Drive and NTFS virtual disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($kind in 'refs','ntfs') {
            $partition = New-VHD -Path (Join-Path $env:RUNNER_TEMP "$kind.vhdx") -SizeBytes 20GB -Dynamic |
              Mount-VHD -PassThru | Initialize-Disk -PassThru | New-Partition -AssignDriveLetter -UseMaximumSize
            if ($kind -eq 'refs') { $partition | Format-Volume -DevDrive -Confirm:$false -Force | Out-Null }
            else { $partition | Format-Volume -FileSystem NTFS -Confirm:$false -Force | Out-Null }
            $dir = New-Item -ItemType Directory -Path "$($partition.DriveLetter):\temp"
            "$($kind.ToUpper())_TEMP=$dir" >> $env:GITHUB_ENV
          }
      - name: Probe rename over a watched, open file
        shell: pwsh
        run: |
          foreach ($pair in @(@("$env:RUNNER_TEMP",'runner-temp'), @("$env:NTFS_TEMP",'ntfs-vhd'), @("$env:REFS_TEMP",'refs-dev-drive'))) {
            bun scripts/diag/rename-probe.ts $pair[0] $pair[1]
            fsutil fsinfo volumeinfo ($pair[0].Substring(0,2) + '\') | Select-String 'File System Name|POSIX'
          }
      - name: Run the detached-process test per temp volume
        shell: pwsh
        working-directory: packages/pstdio-api
        run: |
          foreach ($pair in @(@("$env:RUNNER_TEMP",'runner-temp'), @("$env:NTFS_TEMP",'ntfs-vhd'), @("$env:REFS_TEMP",'refs-dev-drive'))) {
            $env:TEMP = $pair[0]; $env:TMP = $pair[0]
            "DETACHED $($pair[1])"
            bun test src/features/extensions/extension-detached-process.p1.test.ts 2>&1 | Select-String '\((pass|fail)\)|Received|Expected'
          }
