name: Release repair review
on:
  push:
    branches: [test/release-repair-review-20261123]
    paths: [.github/workflows/release-repair-review.yml]
permissions:
  actions: read
  contents: read
jobs:
  review:
    name: Local review for PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 2368
            head: d7f102222a3142508ac5f9fe1cc6a62078051f86
            prior: 45166061699
            failed: 4dccdfb6923873f7c4fb463c 336206f55e684f82a16be354 0a571ca5be1d73edc4c82bd7 dcc71406c9fb01f7190ca388 90079ca2d7a4656c210d8f93 a5f8c184aa9f9c7a8b390d95 efab1885100feb29dbd697ae f46ca03b80f367e0e2125b48 72480638f874d13d0838a290
          - pr: 2373
            head: 3ad792cf9f26e485b4f73181031bcd935b5374d9
            prior: 45166061699
            failed: 4dccdfb6923873f7c4fb463c 336206f55e684f82a16be354 0a571ca5be1d73edc4c82bd7 dcc71406c9fb01f7190ca388 90079ca2d7a4656c210d8f93 a5f8c184aa9f9c7a8b390d95 efab1885100feb29dbd697ae f46ca03b80f367e0e2125b48 ac4092f9e23be2438d71d70f 72480638f874d13d0838a290
          - pr: 2377
            head: d8e4f454581e5091bd3b15ee64ebb1d9b0f5d453
            test: extensions/harness-open-code/src/harness-catalog-lifecycle.p0.test.ts
          - pr: 2379
            head: 0e6236808a87ab147f247283cc0d46bc1ab75d7c
            test: packages/canvas-tests/src/ui/ui/chat-tail-resize.p1.spec.ts
    env:
      REVIEW_HEAD: ${{ matrix.head }}
      REVIEW_TEST: ${{ matrix.test }}
      REVIEW_PRIOR: ${{ matrix.prior }}
      REVIEW_FAILED: ${{ matrix.failed }}
      REVIEW_PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact repair commit
        run: |
          git checkout --detach "$REVIEW_HEAD"
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          docker info --format '{{.ServerVersion}}'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Install required browser engines
        run: bunx playwright@1.60.0 install --with-deps chromium firefox
      - name: Run the repository review workload
        if: matrix.prior == null
        run: |
          bun run test:review --base origin/main --test "$REVIEW_TEST" --list
          xvfb-run --auto-servernum bun run test:review --base origin/main --test "$REVIEW_TEST"
      - name: Recover the original plan
        if: matrix.prior != null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$REVIEW_PRIOR" --name "release-repair-review-$REVIEW_PR" --dir "$RUNNER_TEMP/prior-review"
          jq -e '.plan.testPlan' "$RUNNER_TEMP"/prior-review/*.json > "$RUNNER_TEMP"/review-plan.json
      - name: Run the checks blocked by missing browsers
        if: matrix.prior != null
        run: |
          bun install --frozen-lockfile
          xvfb-run --auto-servernum bun -e '
            import { mkdtemp } from "node:fs/promises";
            import { join } from "node:path";
            import { tmpdir } from "node:os";
            import { executePlan } from "./scripts/ci/run-test-plan";
            import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
            import { localReviewEnvironment } from "./scripts/ci/local-review-source";

            const directory = await mkdtemp(join(tmpdir(), "pstdio-review-replay-"));
            const plan = await Bun.file(join(process.env.RUNNER_TEMP, "review-plan.json")).json();
            const runIds = process.env.REVIEW_FAILED.split(" ");
            try {
              const result = await executePlan(plan, {
                root: process.cwd(),
                runIds,
                env: { ...localReviewEnvironment(directory), CI_PROFILE: "production" },
              });
              process.exitCode = result.outcome === "success" ? 0 : 1;
            } finally {
              const cleanup = await cleanupReviewCompose(directory);
              if (cleanup.some((entry) => entry.outcome !== "success")) process.exitCode = 1;
            }
          '
      - name: Preserve the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-repair-review-${{ matrix.pr }}
          path: |
            test-results/local-review/*.json
            test-results/ci/planned/**/execution.json
          if-no-files-found: warn
