name: Browser runner compatibility baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b393779a1a099d2a78177badb663ed6507104526
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Confirm main's pinned browser rejects the current default image
        shell: bash
        run: |
          set +e
          bunx playwright@1.60.0 install chromium > browser-install.log 2>&1
          install_status=$?
          set -e
          cat browser-install.log
          test "$install_status" -ne 0
          rg 'does not support chromium on ubuntu26.04-x64' browser-install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-browser-install-baseline
          path: browser-install.log
          if-no-files-found: error
