name: Analyze the existing native scan recording
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: archive-extraction-windows-11-arm
          run-id: 40325365575
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ps-932-existing-trace
      - name: Analyze the saved trace without repeating extraction
        env:
          PS932_TRACE_ROOT: ${{ runner.temp }}/ps-932-existing-trace
        run: bun packages/e2e/src/packaged/analyze-defender-recording.ts
      - name: Keep trace reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scan-analysis
          path: ${{ runner.temp }}/ps-932-existing-trace/analysis/*
          if-no-files-found: error
