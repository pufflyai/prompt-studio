name: Qualify rebased packaged runtime
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen PS158 source after PS157 integration
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require the frozen source and use its maintained platform matrix
        id: matrix
        env:
          QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$QUALIFICATION_SOURCE_SHA" = "4bd741de85239fff34afa01d0dc37aa86e06d4ca"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          bun -e 'import { appendFileSync } from "node:fs"; import { productionToolchainPlatforms } from "./scripts/ci/production-platforms.ts"; appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(productionToolchainPlatforms("stable"))}\n`);'
  packaged_toolchain:
    needs: scope
    uses: pufflyai/prompt-studio/.github/workflows/verify-packaged-toolchain.yml@e92609e79cda954c8f95b07499ee9178b3e33d76
    with:
      ref: ${{ inputs.source_sha }}
      profile: full
      platforms: ${{ needs.scope.outputs.platforms }}
      priority: P2
