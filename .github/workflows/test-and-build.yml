name: Detached process baseline diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached-baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f88cee27552ca8633c9f6285fc1e6b08fcec9a14
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/sdk build
      - name: Run the unchanged main fixture twenty times
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results/baseline | Out-Null
          Set-Location packages/pstdio-api
          bun test src/features/extensions/extension-detached-process.p1.test.ts --timeout 15000 --rerun-each 20 2>&1 | Tee-Object -FilePath ../../test-results/baseline/detached.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-main-detached-process
          path: test-results/baseline
          if-no-files-found: warn
