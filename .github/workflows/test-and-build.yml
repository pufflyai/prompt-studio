name: Vite baseline diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  vite:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15
    env:
      NX_DAEMON: false
      CI_PRIORITY: P1
    steps:
      - uses: actions/checkout@v5
      - name: Install the Bun action extraction tool
        run: apt-get update -qq && apt-get install -y unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-ci-cache
      - name: Build the baseline test dependencies
        run: bun run build -- --scope e2e --include-dependencies
      - name: Exercise both Vite terminal cases
        run: bun run --cwd packages/e2e test:vite-terminal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vite-baseline-evidence
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore
  detached:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build source host test dependencies
        run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Reproduce the baseline detached-process lifetime check
        working-directory: packages/pstdio-api
        run: bun test src/features/extensions/extension-detached-process.p1.test.ts --timeout 30000
