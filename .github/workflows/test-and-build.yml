name: Windows ARM browser architecture comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: ARM browser (${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            channel: chromium
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            channel: msedge
    env:
      CI_PRIORITY: P2
      E2E_QUALIFY_BROWSER_CHANNEL: ${{ matrix.channel }}
      PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require exact delivered source
        run: git diff --exit-code fd1559f9267baa5dfe43861d379c16b4dce7fdfc -- . ':!.github/workflows/test-and-build.yml' ':!packages/e2e/src/packaged/packaged-chromium.ts' ':!packages/e2e/src/packaged/trace-browser-architecture.ts' ':!packages/e2e/src/packaged/decode-browser-architecture.ts' ':!packages/e2e/src/packaged/packaged-board-panning-smoke.p2.test.ts' ':!packages/e2e/src/packaged/packaged-chat-motion-smoke.p2.test.ts' ':!packages/e2e/src/packaged/packaged-collection-view-order-smoke.p2.test.ts'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build and verify the native compiled candidate
        id: integrity
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: cold-browser-cli-win-arm64
          run-id: 40262856377
          github-token: ${{ github.token }}
      - name: Provision the compiled smoke browser
        id: browser
        run: bun -e 'import {preparePackagedSmokeBrowser} from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(process.env.E2E_PACKAGED_BINARY_PATH!);'
      - name: Cold board panning and ticket actions
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-board-panning-smoke.p2.test.ts --timeout 30000 --silent
      - name: Cold streaming and retained history
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-chat-motion-smoke.p2.test.ts --timeout 30000 --silent
      - name: Cold saved view ordering
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-collection-view-order-smoke.p2.test.ts --timeout 30000 --silent
      - name: Decode actual browser and engine headers
        if: always()
        run: bun packages/e2e/src/packaged/decode-browser-architecture.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-${{ matrix.channel }}
          path: |
            .pstdio/extension-storage/pstdio.pstdio-artifacts/browser-architecture
            packages/e2e/test-results
            test-results/ci
            packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
          include-hidden-files: true
          if-no-files-found: warn
