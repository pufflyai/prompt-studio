name: CI native diagnostics
on:
  workflow_dispatch:
    inputs:
      signals_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  signals:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun scripts/ci/native-signal-diagnostic.ts
  native:
    if: inputs.signals_only != true
    name: native fixtures (${{ matrix.platform_pkg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_pkg: cli-win-x64
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
    env:
      CI_PRIORITY: P2
      NATIVE_PROFILE_LOG: ${{ github.workspace }}/native-profile.jsonl
      PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build and verify the native compiled candidate
        run: bun run --cwd scripts verify:packages --profile integrity
      - name: Provision the compiled smoke browser
        shell: bash
        run: bun -e 'import {preparePackagedSmokeBrowser} from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(process.env.E2E_PACKAGED_BINARY_PATH!);'
      - name: Compare bare signals through the host terminal
        run: bun packages/e2e/src/packaged/native-terminal-diagnostic.ts
      - name: Exercise native interruption, inherited output and archive cleanup
        shell: bash
        working-directory: packages/e2e
        run: |
          set -o pipefail
          mkdir -p test-results
          bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts \
            src/packaged/extension-smoke.p2.test.ts \
            src/packaged/packaged-independent-extensions-smoke.p2.test.ts \
            src/packaged/packaged-serve-helpers.p2.test.ts \
            src/packaged/packaged-planner-smoke.p2.test.ts \
            --test-name-pattern 'interruption stops|a packaged CLI gives|a packaged host packs|fixture shutdown|runner cancellation|dependency stacks|recovers missing|adopts a feature' \
            --timeout 30000 --silent 2>&1 | tee test-results/native-fixtures.log
      - name: Identify handles retained by failed archive cleanup
        if: failure()
        shell: pwsh
        run: |
          $diagnosticTools = Join-Path $env:RUNNER_TEMP 'native-handle-tools'
          $archive = Join-Path $env:RUNNER_TEMP 'native-handle-tools.zip'
          Invoke-WebRequest https://download.sysinternals.com/files/Handle.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $diagnosticTools
          $handle = Join-Path $diagnosticTools 'handle64.exe'
          & $handle -accepteula -nobanner 'packaged-extension-reproducibility-'
          & $handle -accepteula -nobanner 'packaged-independent-extensions-'
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fixtures-${{ matrix.platform_pkg }}
          path: |
            packages/e2e/test-results/native-fixtures.log
            test-results/ci
            native-profile.jsonl
          include-hidden-files: true
          if-no-files-found: warn
