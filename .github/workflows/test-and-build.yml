name: Compare native archive extraction stages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Observe fixed archives without dependency installation
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun packages/e2e/src/packaged/observe-archive-extraction.ts
      - name: Keep component measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-extraction-${{ matrix.os }}
          path: ${{ runner.temp }}/ps-932-archive-extraction-*/summary.json
          if-no-files-found: error
