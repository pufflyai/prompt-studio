name: Qualify Cloud Windows packaged gate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed PS158 source after Cloud data-flow correction and main integration
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require the frozen source and use its maintained platform matrix
        id: matrix
        env:
          QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$QUALIFICATION_SOURCE_SHA" = "c77a7d595cadebcbf43ee1163c78debe29c508d9"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          bun -e 'import { appendFileSync } from "node:fs"; import { productionToolchainPlatforms } from "./scripts/ci/production-platforms.ts"; appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(productionToolchainPlatforms("stable").filter(row => row.platform_pkg === "cli-win-x64"))}\n`);'
  packaged_toolchain:
    needs: scope
    uses: pufflyai/prompt-studio/.github/workflows/verify-packaged-toolchain.yml@fd503b0ba180406fbb76f28b833fb9cfbd9a24a3
    with:
      ref: ${{ inputs.source_sha }}
      profile: full
      platforms: ${{ needs.scope.outputs.platforms }}
      priority: P2
