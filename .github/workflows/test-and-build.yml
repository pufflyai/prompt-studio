name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Lint monorepo
        run: bun run lint

      - name: Test monorepo (non-e2e)
        run: bunx lerna run test --ignore e2e

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      - name: Install Playwright browsers
        run: bun run --cwd packages/e2e playwright install --with-deps chromium

      - name: Pre-warm bun install cache for plugin workspaces
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          PRIME_DIR=$(mktemp -d)
          echo '{"private":true,"type":"module","dependencies":{"@pstdio/sdk":"latest"}}' > "$PRIME_DIR/package.json"
          (cd "$PRIME_DIR" && bun install)

      - name: Test e2e (streamed)
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: bun run --cwd packages/e2e test

      - name: Test packaged e2e
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: bun run --cwd packages/e2e test:packaged

  build_docker:
    needs: [test_and_build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .
