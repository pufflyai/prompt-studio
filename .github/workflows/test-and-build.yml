name: Diagnose native ARM extension-smoke dashboard phase
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      PSTDIO_VERIFY_PLATFORM_PKG: cli-win-arm64
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the normal compiled candidate and check integrity
        run: bun run --cwd scripts verify:packages --profile integrity
      - name: Run complete pass and throw cases once with phase observations
        working-directory: packages/e2e
        run: bun test --preload ./src/scripts/bun-process-cleanup.ts src/packaged/extension-smoke.p2.test.ts --test-name-pattern "reports (pass|throw) outside"
      - name: Preserve retained failed smoke evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results/smoke-probe | Out-Null
          Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter "pstdio-extension-test-*" | ForEach-Object {
            $destination = Join-Path test-results/smoke-probe $_.Name
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            foreach ($name in @("evidence", "result.json", "dashboard.png")) {
              $source = Join-Path $_.FullName $name
              if (Test-Path $source) { Copy-Item -Recurse $source $destination }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-smoke-phase-evidence
          path: test-results/smoke-probe
          if-no-files-found: warn
