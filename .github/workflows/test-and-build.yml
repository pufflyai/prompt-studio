name: Temporary PS236 paired isolated comparison
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  comparison:
    name: Same-host 5000-ticket and 5000-foobar comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PSTDIO_ISOLATED_AGENT_CREDENTIALS: "0"
      PSTDIO_ISOLATED_COMPOSE_FILE: __test-tmp__/ps236-counters.compose.json
    steps:
      - uses: actions/checkout@v5
        with:
          path: driver
      - uses: actions/checkout@v5
        with:
          ref: f22e64bc0abd740b9944efd0c6cf51d16a81d8db
          path: app-main
      - uses: actions/checkout@v5
        with:
          ref: de8c377094f2963e0aa7c90ef3b37d43d8cd5fc2
          path: app-candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: Prepare browser and identical passive counters
        run: |
          mkdir -p browser-tools
          cd browser-tools
          bun init -y
          bun add --exact @playwright/test@1.60.0
          bunx playwright install --with-deps chromium
          cd ..
          for app in app-main app-candidate; do
            mkdir -p "$app/__test-tmp__"
            cat > "$app/__test-tmp__/ps236-counters.compose.json" <<'JSON'
          {"services":{"prompt-studio":{"environment":{"PSTDIO_BENCHMARK_COUNTERS":"1"}}}}
          JSON
          done
      - name: Start the owned main Docker runtime
        working-directory: app-main
        run: bun run dev:isolated -- --name ps236-main-${{ github.run_id }} --desktop
      - name: Observe the baseline, preserving original failures
        id: baseline
        continue-on-error: true
        run: bun driver/scripts/diagnostics/ps236-isolated-comparison.ts app-main ps236-main-${{ github.run_id }} main browser-tools
      - name: Capture and remove only the owned main stack
        if: always()
        working-directory: app-main
        run: |
          mkdir -p ../comparison-evidence/main
          docker logs ps236-main-${{ github.run_id }}-prompt-studio-1 > ../comparison-evidence/main/container.log 2>&1 || true
          bun run dev:isolated -- --name ps236-main-${{ github.run_id }} --down
      - name: Start the owned candidate Docker runtime
        working-directory: app-candidate
        run: bun run dev:isolated -- --name ps236-candidate-${{ github.run_id }} --desktop
      - name: Verify every candidate scenario on the same machine
        id: candidate
        run: bun driver/scripts/diagnostics/ps236-isolated-comparison.ts app-candidate ps236-candidate-${{ github.run_id }} candidate browser-tools
      - name: Capture candidate logs and comparison outcomes
        if: always()
        run: |
          mkdir -p comparison-evidence/candidate
          docker logs ps236-candidate-${{ github.run_id }}-prompt-studio-1 > comparison-evidence/candidate/container.log 2>&1 || true
          printf 'baseline=%s\ncandidate=%s\n' '${{ steps.baseline.outcome }}' '${{ steps.candidate.outcome }}' > comparison-evidence/step-outcomes.txt
          df -h > comparison-evidence/disk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps236-paired-${{ github.run_id }}
          path: comparison-evidence
      - name: Remove only the owned candidate stack
        if: always()
        working-directory: app-candidate
        run: bun run dev:isolated -- --name ps236-candidate-${{ github.run_id }} --down
  scoped-history:
    name: Isolated macOS scoped history diagnosis
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a84ce9fc70d25b782e715878d1534d5c2381ad4c
          path: history-baseline
      - uses: actions/checkout@v5
        with:
          ref: 1f78acd986836ee851dbb0b9c2db331ce2b91e70
          path: history-candidate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: Prepare the same published dependencies before both observations
        run: |
          mkdir -p history-evidence
          uname -a > history-evidence/host.txt
          sysctl hw.ncpu hw.memsize >> history-evidence/host.txt
          for app in history-baseline history-candidate; do
            git -C "$app" rev-parse HEAD > "history-evidence/$app-source.txt"
            bun install --cwd "$app/extensions/pstdio-planner" --frozen-lockfile --ignore-scripts > "history-evidence/$app-install.log" 2>&1
          done
      - name: Observe the original parent with its unchanged five-second case limit
        id: baseline
        continue-on-error: true
        working-directory: history-baseline/extensions/pstdio-planner
        run: bun test src/commands/attempt-scoped-history.p1.test.ts > ../../../history-evidence/baseline.log 2>&1
      - name: Verify the integrated parent with the same fixture and case limit
        id: candidate
        working-directory: history-candidate/extensions/pstdio-planner
        run: bun test src/commands/attempt-scoped-history.p1.test.ts > ../../../history-evidence/candidate.log 2>&1
      - name: Record both original outcomes
        if: always()
        run: |
          mkdir -p history-evidence
          printf 'baseline=%s\ncandidate=%s\n' '${{ steps.baseline.outcome }}' '${{ steps.candidate.outcome }}' > history-evidence/step-outcomes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps236-history-${{ github.run_id }}
          path: history-evidence
