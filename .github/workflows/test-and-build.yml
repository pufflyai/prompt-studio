name: Native removal method profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Measure complete removal of equivalent owned trees
        run: bun packages/e2e/src/packaged/measure-native-removal.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: removal-methods-${{ matrix.os }}
          path: .pstdio/extension-storage/pstdio.pstdio-artifacts/native-removal-profile/results.json
          if-no-files-found: warn
