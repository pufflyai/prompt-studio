name: Compare cold ARM install backends
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: ["default,copyfile", "copyfile,default"]
    env:
      CI_PRIORITY: P2
      PSTDIO_VERIFY_PLATFORM_PKG: cli-win-arm64
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the normal compiled candidate and check integrity
        run: bun run --cwd scripts verify:packages --profile integrity
      - name: Compare both backends with separate fresh caches and one frozen input
        working-directory: packages/e2e
        env:
          PS932_BACKEND_ORDER: ${{ matrix.order }}
        run: bun src/packaged/compare-planner-install-backends.ts
      - name: Keep complete installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-install-backends-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/ps-932-install-backends-*/summary.json
            ${{ runner.temp }}/ps-932-install-backends-*/*/summary.json
            ${{ runner.temp }}/ps-932-install-backends-*/*/installer.*.log
          if-no-files-found: error
