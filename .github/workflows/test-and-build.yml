name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check package boundaries and browser test origins
        run: bun run verify:boundaries

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Lint monorepo
        run: bun run lint

      - name: Test monorepo (non-e2e)
        run: bunx lerna run test --ignore e2e

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: bun run --cwd packages/e2e playwright install --with-deps chromium firefox

      - name: Pre-warm bun install cache for plugin workspaces
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          PRIME_DIR=$(mktemp -d)
          echo '{"private":true,"type":"module","dependencies":{"@pstdio/sdk":"latest"}}' > "$PRIME_DIR/package.json"
          (cd "$PRIME_DIR" && bun install)

      - name: Test e2e scripts
        run: bun run --cwd packages/e2e test:scripts

      - name: Test CLI e2e
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: bun run --cwd packages/e2e test:cli

      - name: Test UI e2e
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: bun run --cwd packages/e2e test:ui

  packaged_and_vite_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: bun run --cwd packages/e2e playwright install --with-deps chromium firefox webkit

      - name: Pre-warm bun install cache for plugin workspaces
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
        run: |
          mkdir -p "$BUN_INSTALL_CACHE_DIR"
          PRIME_DIR=$(mktemp -d)
          echo '{"private":true,"type":"module","dependencies":{"@pstdio/sdk":"latest"}}' > "$PRIME_DIR/package.json"
          (cd "$PRIME_DIR" && bun install)

      - name: Test Vite terminal e2e
        run: bun run --cwd packages/e2e test:vite-terminal

      - name: Test packaged e2e
        env:
          BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
          PSTDIO_REQUIRE_WEBVIEW_BROWSERS: "1"
        run: bun run --cwd packages/e2e test:packaged

  desktop_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Electron system dependencies
        run: bun run --cwd clients/desktop playwright install-deps chromium

      - name: Build monorepo
        run: bun run build

      - name: Configure the source Electron sandbox
        run: |
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      - name: Test source Electron
        run: xvfb-run -a bun run --cwd clients/desktop test:electron

      - name: Package Electron with its native sidecar
        run: bun run --cwd clients/desktop package

      - name: Configure the packaged Electron sandbox
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox

      - name: Verify packaged Electron fuses
        run: bun run --cwd clients/desktop verify:fuses

      - name: Test packaged Electron
        run: xvfb-run -a bun run --cwd clients/desktop test:packaged

      - name: Preserve Electron readiness results and redacted failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-readiness-linux-x64
          path: clients/desktop/test-results
          if-no-files-found: error

  build_docker:
    needs: [test_and_build, e2e, packaged_and_vite_e2e, desktop_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'
