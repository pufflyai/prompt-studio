name: Test and Build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  session_review:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 8224b0031f6e6e18fd052bab7b16fa3a79675e81
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Prepare browser and Docker prerequisites
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          bunx playwright@1.60.0 install --with-deps chromium firefox webkit
          docker info --format '{{.ServerVersion}}'
          docker compose version
          git config --global user.name "Prompt Studio Review"
          git config --global user.email "review@localhost"
      - name: Run the repository review and new-session composer check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          xvfb-run -a bun run test:review --base origin/main --test packages/e2e/src/ui/session-draft-focus.p1.spec.ts
      - name: Collect the review evidence
        if: always()
        shell: python
        run: |
          import json, pathlib, shutil
          root = pathlib.Path("test-results/local-review")
          for report in root.glob("pstdio-local-review-*.json"):
              data = json.loads(report.read_text())
              scratch = pathlib.Path(data["directory"])
              evidence = root / (report.stem + "-evidence")
              evidence.mkdir(exist_ok=True)
              for path in [scratch / "checks.json", scratch / "logs", scratch / "source/test-results/local-review", scratch / "source/test-results/test-plan"]:
                  if path.is_file():
                      shutil.copy(path, evidence / path.name)
                  elif path.is_dir():
                      shutil.copytree(path, evidence / path.name)
              print(report.name, data["head"], data["outcome"])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps-1324-review
          path: test-results/local-review
          if-no-files-found: warn
          retention-days: 7
