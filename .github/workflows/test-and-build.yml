name: Attribute current native failures on main
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main for current Linux streaming and Windows Planner controls
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require main and select the two failing maintained native rows
        id: matrix
        env:
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$CONTROL_SOURCE_SHA" = "e92609e79cda954c8f95b07499ee9178b3e33d76"
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE_SHA"
          bun -e 'import { appendFileSync } from "node:fs"; import { productionToolchainPlatforms } from "./scripts/ci/production-platforms.ts"; const rows=productionToolchainPlatforms("stable").filter(row => row.platform_pkg === "cli-linux-x64" || row.platform_pkg === "cli-win-x64" && row.shard === 2); if(rows.length!==2)throw new Error("Unexpected native controls"); appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(rows)}\n`);'
  main_control:
    needs: scope
    uses: pufflyai/prompt-studio/.github/workflows/verify-packaged-toolchain.yml@e92609e79cda954c8f95b07499ee9178b3e33d76
    with:
      ref: ${{ inputs.source_sha }}
      profile: full
      platforms: ${{ needs.scope.outputs.platforms }}
      priority: P2
