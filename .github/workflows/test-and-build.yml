# Temporary diagnostic branch only. This workflow is not a shipping CI change.
name: Canonical bug-fix review
run-name: Canonical review ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [production]
        default: production
        description: Run the complete canonical local-review projection
      source_sha:
        type: string
        required: true
        description: Exact reviewed product commit, checked out without diagnostic changes
      test_file:
        type: string
        default: ""
        description: Additional repository-relative tests, one per line
      test_os:
        type: choice
        options: [macos-15-intel]
        default: macos-15-intel
      release_channel:
        type: choice
        options: [stable]
        default: stable
permissions:
  contents: read
concurrency:
  group: canonical-audit-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  canonical_review:
    runs-on: ${{ inputs.test_os }}
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      ADDITIONAL_TESTS: ${{ inputs.test_file }}
    steps:
      - name: Validate the exact source and additional paths
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import PurePosixPath
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["EXPECTED_SOURCE"]), "Expected a full commit SHA"
          for path in os.environ["ADDITIONAL_TESTS"].splitlines():
              if path:
                  parsed = PurePosixPath(path)
                  assert not parsed.is_absolute() and ".." not in parsed.parts and "\x00" not in path
          PYCODE
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Prepare capacity on this disposable macOS runner
        run: |
          python3 - <<'PYCODE'
          import os, shutil, subprocess
          from pathlib import Path
          assert os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted", "Capacity cleanup requires an isolated hosted runner"
          unused = {"iPhoneOS.platform", "iPhoneSimulator.platform", "AppleTVOS.platform", "AppleTVSimulator.platform", "WatchOS.platform", "WatchSimulator.platform", "XROS.platform", "XRSimulator.platform"}
          for xcode in Path("/Applications").glob("Xcode*.app"):
              for platform in (xcode / "Contents/Developer/Platforms").glob("*.platform"):
                  if platform.name in unused:
                      subprocess.run(["sudo", "rm", "-rf", "--", str(platform)], check=True)
          free = shutil.disk_usage(os.environ["RUNNER_TEMP"]).free
          print("Isolated scratch free GiB:", free / 1024**3)
          assert free >= 18 * 1024**3, "Insufficient isolated scratch capacity"
          memory = int(subprocess.check_output(["sysctl", "-n", "hw.memsize"], text=True))
          assert memory >= 12 * 1024**3, "The full canonical workload requires the higher-memory standard runner"
          PYCODE
      - name: Install the repository's native dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Prepare browser engines
        timeout-minutes: 3
        run: bunx playwright@1.60.0 install
      - name: Run the unchanged canonical review command
        timeout-minutes: 50
        run: |
          exec python3 - <<'PYCODE'
          import json, os, re, shutil, signal, subprocess, sys, time
          from pathlib import Path
          audit = Path(os.environ["RUNNER_TEMP"]) / "canonical-audit"
          audit.mkdir()
          temporary = Path("/private/tmp") / ("pstdio-canonical-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          temporary.mkdir()
          assert Path.home().resolve() not in temporary.resolve().parents
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["EXPECTED_SOURCE"]
          tests = [line for line in os.environ["ADDITIONAL_TESTS"].splitlines() if line]
          for test in tests:
              assert Path(test).is_file(), "Unknown additional test: " + test
          command = ["bun", "run", "test:review", "--base", "origin/main"]
          for test in tests:
              command += ["--test", test]
          metadata = {"source": actual, "workflowSha": os.environ["GITHUB_SHA"], "command": command, "additionalTests": tests, "scratch": str(temporary), "freeBytesBeforeCanonical": shutil.disk_usage(temporary).free, "memoryBytes": int(subprocess.check_output(["sysctl", "-n", "hw.memsize"], text=True)), "logicalCPUs": int(subprocess.check_output(["sysctl", "-n", "hw.logicalcpu"], text=True)), "machine": os.uname().machine}
          def save():
              pending = audit / "invocation.pending.json"
              pending.write_text(json.dumps(metadata, indent=2) + "\n")
              pending.replace(audit / "invocation.json")
          def signal_group(child, signum):
              try:
                  os.killpg(child.pid, signum)
              except ProcessLookupError:
                  pass
          save()
          assert metadata["freeBytesBeforeCanonical"] >= 12 * 1024**3, "Insufficient capacity after dependency/browser setup"
          code = 1
          with (audit / "canonical-local-review.log").open("w") as log:
              child = subprocess.Popen(command, env={**os.environ, "TMPDIR": str(temporary)}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, start_new_session=True)
              def interrupt(signum, _frame):
                  if "interruptedSignal" in metadata:
                      metadata.setdefault("additionalSignals", []).append(signum)
                      save()
                      signal_group(child, signal.SIGTERM)
                      return
                  metadata["interruptedSignal"] = signum
                  metadata["sourceCleanupMayBeIncomplete"] = True
                  save()
                  raise InterruptedError("Received signal " + str(signum))
              signal.signal(signal.SIGTERM, interrupt)
              signal.signal(signal.SIGINT, interrupt)
              try:
                  last_status = time.monotonic()
                  for line in child.stdout:
                      log.write(line)
                      plain = re.sub(r"\x1b\[[0-9;]*m", "", line)
                      if re.match(r"^(?:[a-f0-9-]+: (?:success|failure)|Test plan |Local review |Scratch:|Report:)", plain):
                          print(plain, end="", flush=True)
                      if time.monotonic() - last_status >= 60:
                          print("Canonical workload continues; complete output is retained in the artifact", flush=True)
                          last_status = time.monotonic()
                  code = child.wait()
              except BaseException as error:
                  metadata["supervisorError"] = str(error)
                  raise
              finally:
                  log.flush()
                  if child.poll() is None:
                      signal_group(child, signal.SIGTERM)
                      try:
                          child.wait(timeout=5 if "interruptedSignal" in metadata else 120)
                      except subprocess.TimeoutExpired:
                          metadata["forcedTermination"] = True
                          metadata["sourceCleanupMayBeIncomplete"] = True
                          save()
                          signal_group(child, signal.SIGKILL)
                          try:
                              child.wait(timeout=1)
                          except subprocess.TimeoutExpired:
                              metadata["supervisorChildReapIncomplete"] = True
                  metadata.update(exitCode=child.poll(), supervisorCode=code)
                  save()
          sys.exit(code)
          PYCODE
      - name: Preserve original reports, checks, executions, logs and browser evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os, zipfile
          from pathlib import Path
          audit = Path(os.environ["RUNNER_TEMP"]) / "canonical-audit"
          audit.mkdir(exist_ok=True)
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          metadata = audit / "invocation.json"
          private = Path("/private/tmp") / ("pstdio-canonical-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          if metadata.is_file():
              try:
                  recorded = Path(json.loads(metadata.read_text())["scratch"])
                  if recorded != private:
                      print("Recorded scratch differs from this run; preserving only this run's deterministic scratch")
              except (ValueError, KeyError, TypeError, OSError) as error:
                  print("Unreadable invocation metadata; preserving this run's deterministic scratch:", error)
          with zipfile.ZipFile(audit / "canonical-evidence.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in (workspace / "test-results/local-review").rglob("*"):
                  if path.is_file():
                      archive.write(path, "workspace/" + str(path.relative_to(workspace)))
              for scratch in private.glob("pstdio-local-review-*"):
                  checks = scratch / "checks.json"
                  if checks.is_file():
                      archive.write(checks, str(checks.relative_to(private)))
                  for folder in [scratch / "logs", scratch / "source/test-results", scratch / "source/packages/e2e/test-results", scratch / "source/packages/ui/test-results", scratch / "source/packages/canvas-tests/test-results", scratch / "source/clients/desktop/test-results"]:
                      for path in folder.rglob("*"):
                          if path.is_file():
                              archive.write(path, str(path.relative_to(private)))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-review-${{ inputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canonical-audit
          if-no-files-found: error
