name: Combined default readiness and native cleanup qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_pkg: cli-win-x64
            cleanup: bun
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            cleanup: bun
          - os: windows-latest
            platform_pkg: cli-win-x64
            cleanup: node-pool64
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            cleanup: node-pool64
    env:
      CI_PRIORITY: P2
      E2E_CLEANUP_MODE: ${{ matrix.cleanup }}
      PSTDIO_BUILD_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the delivered product and removal experiment only
        run: git diff --exit-code 77092e1efebcd79cb92fccf3c59a49145f4a9ad4 -- . ':!.github/workflows/test-and-build.yml' ':!packages/e2e/src/packaged/packaged-core-extensions.fixture.ts' ':!packages/e2e/src/packaged/diagnostic-node-core-cleanup.ts' ':!documentation/adrs/0112-temporary-node-core-cleanup-experiment.md'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Compile PS-932 with the separate PS-947 readiness repair
        run: bun run build -- --scope pstdio --include-dependencies
      - name: Provision the compiled smoke browser
        id: browser
        run: bun -e 'import {preparePackagedSmokeBrowser} from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(process.env.E2E_PACKAGED_BINARY_PATH!);'
      - name: Complete cold core features including removal
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-core-extension-features.p2.test.ts --timeout 30000 --silent
      - name: Complete cold defaults including removal
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-core-extensions-smoke.p1.test.ts --timeout 30000 --silent
      - name: Verify compiled integrity after cold runtime cases
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: bun run --cwd scripts verify:packages --prebuilt --profile integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-core-${{ matrix.platform_pkg }}-${{ matrix.cleanup }}
          path: |
            packages/e2e/test-results
            test-results/ci
            packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
          include-hidden-files: true
          if-no-files-found: warn
