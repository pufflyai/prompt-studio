name: Personal history cost diagnostics
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        default: ""
        description: Exact diagnostic source revision
permissions:
  contents: read
jobs:
  profile_history:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PSTDIO_DEFAULT_EXTENSIONS: "[]"
      PSTDIO_EXTENSION_WEBVIEW_BUILDS: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build the same API dependencies
        run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Profile one thousand durable publications
        shell: bash
        run: |
          mkdir -p test-results/private-history-profile
          bun --conditions=source packages/pstdio-api/src/services/personal-history/index-query.diagnostic.ts > test-results/private-history-profile/profile.json 2> test-results/private-history-profile/progress.jsonl
      - name: Preserve profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-history-profile
          path: test-results/private-history-profile
          if-no-files-found: warn
