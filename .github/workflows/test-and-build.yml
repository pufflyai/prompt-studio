name: Qualify native core cleanup repair
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed PS175 cleanup candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  native_cleanup:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
      PSTDIO_VERIFY_PLATFORM_PKG: cli-win-arm64
      TEST_PRIORITIES: P0,P1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require the reviewed cleanup source
        shell: pwsh
        env:
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $expected = "c4d4412c7cdd12e00756a5b7aaa1808ac8614051"
          if ($env:CONTROL_SOURCE_SHA -cne $expected) { throw "Expected full reviewed cleanup SHA" }
          if ((git rev-parse HEAD).Trim() -cne $expected) { throw "Unexpected checkout" }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build source fixtures for packaged runtime tests
        run: bun run build -- --scope e2e --include-dependencies
      - name: Run the maintained cold ARM64 packaged shard first
        # Exact maintained profile, priorities, discovery, workload, limits and command.
        # New filesystem safety tests run AFTER this, never to prewarm the case.
        run: bun scripts/ci/run-ci-checks.ts --observe-peers -- bun run --cwd scripts verify:packages --profile full --shard 2/2
      - name: Verify real filesystem safety after the cold qualification
        if: ${{ !cancelled() }}
        working-directory: packages/e2e
        env:
          # Script helpers are separate maintained P1 cases, not packaged-discovery members.
          TEST_PRIORITIES: P1
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/scripts/remove-test-directory.p1.test.ts --timeout 30000
      - name: Preserve actual case and native/fallback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-cleanup-candidate
          path: |
            packages/e2e/test-results
            test-results/ci/bun
          if-no-files-found: warn
      - name: Require unchanged generated source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
