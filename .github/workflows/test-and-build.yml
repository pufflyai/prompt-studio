name: PS-185 Windows composer phase observation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed immutable observation-only source based on PS-203
        required: true
        type: string
permissions:
  contents: read
jobs:
  observe:
    name: Complete composer once (Windows x64, original 45 seconds)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: "false"
      CI_PRIORITY: P1
      CI_PROFILE: production
      PSTDIO_COMPOSER_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Bind exact reviewed diagnostic source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "f87097eda9ec7e324119bbfb2acfc113eb332672"
          mkdir -p test-results/ps185-diagnostic
          git rev-parse HEAD HEAD^{tree} > test-results/ps185-diagnostic/source.txt
          git status --porcelain=v1 > test-results/ps185-diagnostic/source-status.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Build maintained packaged fixture dependencies
        run: bun run build -- --scope e2e --include-dependencies
      - name: Build the maintained native host binary
        run: bun run --cwd scripts build:host
      - name: Install the maintained full Chromium channel
        run: bunx playwright@1.60.0 install chromium --with-deps
      - name: Observe the original complete composer case once
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio.exe
        run: >-
          bun run --cwd packages/e2e test:packaged:cli
          src/packaged/packaged-project-setup-smoke.p1.test.ts
          --test-name-pattern '^serves the dashboard and API, hands off composer drafts, and starts idle sessions on their first message$'
      - name: Preserve immediate phases, runtime logs and maintained case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps185-windows-composer-observation-attempt-${{ github.run_attempt }}
          path: |
            test-results/ps185-diagnostic
            test-results/ci/bun/packages/e2e
            packages/e2e/test-results
          if-no-files-found: error
