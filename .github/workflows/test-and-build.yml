name: Qualify completed-source retirement on Windows
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact one-fixture PS158 correction
        required: true
        type: string
permissions:
  contents: read
jobs:
  cloud_control:
    name: Two-device retirement (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e packaged-cli source P2 1 windows-latest
            os: windows-latest
            platform: win32
            arch: x64
            owner: e2e
            runner: packaged-cli
            priority: P2
            files: '["packages/e2e/src/packaged/packaged-two-device-sync-smoke.p2.test.ts"]'
            stable: true
            quarantine: false
            suite: ""
            browser: true
            desktop: false
    env:
      GH_TOKEN: ${{ github.token }}
      EDITED_TEST_ROW: ${{ toJSON(matrix) }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require exact frozen source
        shell: bash
        env:
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$CONTROL_SOURCE_SHA" = "9f70e4215f694ed219ce6ec7504eca874c5a0d78"
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Install browser engines
        run: bunx playwright@1.60.0 install --with-deps
      - name: Qualify the complete changed fixture once with its maintained runner
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun scripts/ci/run-edited-tests.ts
          else
            bun scripts/ci/run-edited-tests.ts
          fi
      - name: Preserve original case outcomes and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-device-retirement-windows
          path: |
            test-results
            packages/e2e/test-results
          if-no-files-found: error
