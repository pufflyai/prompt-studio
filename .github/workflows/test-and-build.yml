name: Diagnose Cloud Retry request settlement
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen PS158 source
        required: true
        type: string
permissions:
  contents: read
jobs:
  cloud_control:
    name: Cloud main control (${{ matrix.runner }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e packaged-cli source P2 1 macos-15
            os: macos-15
            platform: darwin
            arch: arm64
            owner: e2e
            runner: packaged-cli
            priority: P2
            files: '["packages/e2e/src/packaged/packaged-cloud-project-recovery.p2.test.ts"]'
            stable: true
            quarantine: false
            suite: ""
            browser: true
            desktop: false
    env:
      GH_TOKEN: ${{ github.token }}
      EDITED_TEST_ROW: ${{ toJSON(matrix) }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require exact frozen source
        shell: bash
        env:
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$CONTROL_SOURCE_SHA" = "4bd741de85239fff34afa01d0dc37aa86e06d4ca"
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Install browser engines
        run: bunx playwright@1.60.0 install --with-deps
      - name: Capture browser events without changing cases or limits
        shell: bash
        run: |
          python3 - <<'PYTRACE'
          from pathlib import Path
          p = Path('packages/e2e/src/packaged/packaged-cloud-project.fixture.ts')
          s = p.read_text()
          begin = '    const page = await browser!.newPage();'
          assert s.count(begin) == 1
          s = s.replace(begin, begin + '\n    await mkdir(join(import.meta.dir, "../../test-results"), { recursive: true });\n    await page.context().tracing.start({ screenshots: true, snapshots: true, sources: true });')
          end = '    const cleanup = await Promise.allSettled(['
          assert s.count(end) == 1
          s = s.replace(end, '    await browser?.contexts()[0]?.tracing.stop({ path: join(import.meta.dir, "../../test-results/cloud-retry-settlement.zip") });\n' + end)
          p.write_text(s)
          PYTRACE
          git diff --check
          git diff --stat
      - name: Run the failed maintained case once with observational tracing
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun scripts/ci/run-edited-tests.ts
          else
            bun scripts/ci/run-edited-tests.ts
          fi
      - name: Preserve original case outcomes and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-retry-settlement-trace
          path: |
            test-results
            packages/e2e/test-results
          if-no-files-found: error
