name: Compare native cold core setup on Windows temp volumes
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_pkg: cli-win-x64
            volume: os
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            volume: os
          - os: windows-latest
            platform_pkg: cli-win-x64
            volume: runner
          - os: windows-11-arm
            platform_pkg: cli-win-arm64
            volume: runner
    env:
      CI_PRIORITY: P2
      E2E_DIAGNOSTIC_TEMP_VOLUME: ${{ matrix.volume }}
      PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the quiet combined product and volume experiment only
        run: git diff --exit-code c78f24f7b22e51bae809f51a577ef144fbc63809 -- . ':!.github/workflows/test-and-build.yml' ':!documentation/adrs/0113-temporary-native-directory-removal-experiment.md'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build identical public package inputs
        run: bun run build -- --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies --stream
      - name: Download the exact quiet compiled product from the metadata run
        uses: actions/download-artifact@v5
        with:
          run-id: 40280105888
          name: native-reparse-${{ matrix.platform_pkg }}
          github-token: ${{ github.token }}
          path: .
      - name: Provision the compiled smoke browser
        id: browser
        run: bun -e 'import {preparePackagedSmokeBrowser} from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(process.env.E2E_PACKAGED_BINARY_PATH!);'
      - name: Record volume placement and select the cold fixture directory
        shell: pwsh
        run: |
          Write-Host "Original TEMP=$env:TEMP TMP=$env:TMP RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Root, Free, Used | ConvertTo-Json -Compress
          if ($env:E2E_DIAGNOSTIC_TEMP_VOLUME -eq 'runner') {
            "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
            "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          }
      - name: Record actual test temp directory and binary hash
        run: |
          bun -e 'import {tmpdir} from "node:os";console.log(JSON.stringify({tmpdir:tmpdir(),arch:process.arch,bun:Bun.version,binary:process.env.E2E_PACKAGED_BINARY_PATH}));'
          Get-FileHash $env:E2E_PACKAGED_BINARY_PATH -Algorithm SHA256 | Format-List
      - name: Complete cold core features including standard removal
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-core-extension-features.p2.test.ts --timeout 30000 --silent
      - name: Complete cold defaults including standard removal
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        working-directory: packages/e2e
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-core-extensions-smoke.p1.test.ts --timeout 30000 --silent
      - name: Verify compiled integrity after cold cases
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: bun run --cwd scripts verify:packages --prebuilt --profile integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-volume-${{ matrix.platform_pkg }}-${{ matrix.volume }}
          path: |
            packages/e2e/test-results
            test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
