name: Observe complete cold ARM cases with two installer workers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      CI_PRIORITY: P2
      PSTDIO_VERIFY_PLATFORM_PKG: cli-win-arm64
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the normal compiled candidate and check integrity
        run: bun run --cwd scripts verify:packages --profile integrity
      - name: Verify the compiled worker diagnostic is present
        run: bun -e 'if (!(await Bun.file(process.env.E2E_PACKAGED_BINARY_PATH).text()).includes("PS932_INSTALL_THREADS")) throw new Error("Compiled installer worker diagnostic is missing")'
      - name: Observe both complete cold core cases once
        working-directory: packages/e2e
        env:
          BUN_CONFIG_MAX_HTTP_REQUESTS: "16"
          PS932_INSTALL_THREADS: "2"
        run: bun test --preload ./src/scripts/bun-process-cleanup.ts src/packaged/packaged-core-extension-features.p2.test.ts src/packaged/packaged-core-extensions-smoke.p1.test.ts
