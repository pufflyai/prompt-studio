name: Focused release regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      PLAYWRIGHT_TRACE: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - run: bun run --cwd clients/desktop package -- --arch=x64
      - name: Functional evidence regressions
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.packaged.config.ts packaged-benchmark-evidence.p2.spec.ts
      - name: Launch benchmarks
        if: '!cancelled()'
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.benchmark.config.ts packaged-launch.p3.bench.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-windows-evidence
          path: clients/desktop/test-results
