name: Compare pinned native Bun installer versions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        installer: ["1.4.3", "1.4.4"]
    env:
      CI_PRIORITY: P2
      PSTDIO_VERIFY_PLATFORM_PKG: cli-win-arm64
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the normal current candidate and check integrity
        run: bun run --cwd scripts verify:packages --profile integrity
      - name: Preserve the current Bun for source preparation
        run: bun -e 'import { mkdir } from "node:fs/promises"; const root = `${process.env.RUNNER_TEMP}/ps-932-current-bun`; await mkdir(root); await Bun.write(`${root}/bun.exe`, Bun.file(process.execPath))'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.installer }}
      - name: Identify the measured installer
        shell: pwsh
        run: |
          "PS932_INSTALL_BINARY=$((Get-Command bun).Source)" >> $env:GITHUB_ENV
          bun --version
          bun --revision
      - name: Prepare with current Bun and observe the selected installer
        working-directory: packages/e2e
        shell: pwsh
        env:
          BUN_CONFIG_MAX_HTTP_REQUESTS: "16"
        run: |
          $env:PATH = "$env:RUNNER_TEMP/ps-932-current-bun;$env:PATH"
          & "$env:RUNNER_TEMP/ps-932-current-bun/bun.exe" src/packaged/observe-planner-installer.ts
      - name: Keep complete installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-bun-installer-${{ matrix.installer }}
          path: |
            ${{ runner.temp }}/ps-932-planner-installer-*/summary.json
            ${{ runner.temp }}/ps-932-planner-installer-*/installer.*.log
          if-no-files-found: error
