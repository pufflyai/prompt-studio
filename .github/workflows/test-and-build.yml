name: Test and Build
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group: null
  push:
    branches:
      - main
      - test/ci-reliability/**
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options:
          - production
          - merge_queue
        default: production
        description: Validation profile
      source_sha:
        type: string
        default: ""
        description: Optional exact merged source for full diagnostics
      release_channel:
        type: choice
        options: [stable, nightly]
        default: stable
        description: Source diagnostic policy; nightly also measures coverage and publishes no release
  workflow_call:
    inputs:
      profile:
        type: string
        default: production
        description: Production functional validation or merge_queue diagnostics
      source_sha:
        type: string
        default: ""
        description: Exact candidate version commit
      original_source_sha:
        type: string
        default: ""
        description: Source revision before release version preparation
      artifact_run_id:
        type: string
        default: ""
        description: Run that produced immutable release artifacts
      artifact_attempt:
        type: string
        default: "1"
        description: Attempt that produced immutable release artifacts
      release_channel:
        type: string
        default: stable
        description: Candidate release channel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_DAEMON: "false"
jobs:
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.scope.outputs.stage }}
      docker_build: ${{ steps.scope.outputs.dockerBuild }}
      lerna_filter: ${{ steps.scope.outputs.lernaFilter }}
      database_tests: ${{ steps.scope.outputs.databaseTests }}
      license: ${{ steps.scope.outputs.license }}
      published_extensions: ${{ steps.scope.outputs.publishedExtensions }}
      harness_cli: ${{ steps.scope.outputs.harnessCli }}
      integration_matrix: ${{ steps.scope.outputs.integrationMatrix }}
      browser_smoke: ${{ steps.scope.outputs.browserSmoke }}
      package_checks: ${{ steps.scope.outputs.packageChecks }}
      package_matrix: ${{ steps.scope.outputs.packageMatrix }}
      required_jobs: ${{ steps.scope.outputs.requiredJobs }}
      production: ${{ steps.scope.outputs.production }}
      source_coverage: ${{ steps.scope.outputs.sourceCoverage }}
      coverage_artifacts: ${{ steps.scope.outputs.coverageArtifacts }}
      component_checks: ${{ steps.scope.outputs.componentChecks }}
      sdk_api_report: ${{ steps.scope.outputs.sdkApiReport }}
      gate_plan: ${{ steps.scope.outputs.gatePlan }}
      client_matrix: ${{ steps.scope.outputs.clientMatrix }}
      toolchain_matrix: ${{ steps.scope.outputs.toolchainMatrix }}
      component_matrix: ${{ steps.scope.outputs.componentMatrix }}
      bun_contract_matrix: ${{ steps.scope.outputs.bunContractMatrix }}
      app_matrix: ${{ steps.scope.outputs.appMatrix }}
      packaged_matrix: ${{ steps.scope.outputs.packagedMatrix }}
      database_matrix: ${{ steps.scope.outputs.databaseMatrix }}
      edited_matrix: ${{ steps.scope.outputs.editedMatrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Choose the stage, jobs, and packages to test
        id: scope
        env:
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          CI_PROFILE: ${{ inputs.profile || '' }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
        run: bun scripts/ci/pull-request-ci-scope.ts
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  edited_tests:
    name: edited_tests (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.edited_matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.edited_matrix) }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDITED_TEST_ROW: ${{ toJSON(matrix) }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Set up Windows desktop recovery tools
        if: runner.os == 'Windows' && (matrix.desktop || matrix.suite == 'desktop')
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: Install browser engines
        if: matrix.browser
        run: bunx playwright@1.60.0 install --with-deps
      - name: Check edited tests with their registered runners
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" && '${{ matrix.browser }}' == 'true' ]]; then
            xvfb-run -a bun scripts/ci/run-edited-tests.ts
          else
            bun scripts/ci/run-edited-tests.ts
          fi
      - name: Preserve selected files, execution reports, traces and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edited-tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: |
            test-results
            packages/e2e/test-results
            packages/ui/test-results
            packages/canvas-tests/test-results
            clients/desktop/test-results
          if-no-files-found: error
  static_checks:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      queue_run: ${{ steps.provenance.outputs.run_id }}
      queue_attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - &a1
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        if: needs.scope.outputs.stage != 'main'
      - name: Collect independent repository checks
        if: needs.scope.outputs.stage != 'main'
        run: bun scripts/ci/run-static-checks.ts
      - name: Verify tested merge content and inputs
        if: needs.scope.outputs.stage == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/verify-main-provenance.ts
        id: provenance
      - name: Preserve static outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-results-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: ignore
      - name: Copy certified host build archives
        if: needs.scope.outputs.stage == 'main'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-build-host-*-attempt-${{ steps.provenance.outputs.attempt }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .cache/certified-host-builds
      - name: Import complete certified host archives
        if: needs.scope.outputs.stage == 'main'
        run: bun scripts/ci/merge-build-cache.ts .cache/certified-host-builds .cache/ci-build
      - name: Publish certified host build cache on the default branch
        if: needs.scope.outputs.stage == 'main'
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-build
          key: nx-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-provenance
    needs: scope
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  package_checks:
    name: package_checks (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build the tested packages and their dependencies
        id: build_packages
        run: bun run build -- ${{ matrix.lernaFilter }} --include-dependencies --no-bail
      - name: Collect independent lint, unit, and synchronization results
        if: ${{ !cancelled() }}
        run: bun scripts/ci/run-package-group.ts
        env:
          LERNA_FILTER: ${{ matrix.lernaFilter }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package_checks-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Share tested host build cache with main
        if: ${{ !cancelled() && steps.build_packages.outcome == 'success' && needs.scope.outputs.stage == 'merge_queue' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-host-package-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: .cache/ci-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
  integration_contracts:
    name: integration_contracts_${{ matrix.priority }} (${{ matrix.package }})
    needs: scope
    if: needs.scope.outputs.integration_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.integration_matrix) }}
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Build selected contract owners
        env:
          LERNA_FILTER: --scope ${{ matrix.package }}
        shell: bash
        run: |
          read -r -a filters <<< "$LERNA_FILTER"
          bun run build -- "${filters[@]}" --include-dependencies
      - name: Test selected isolated integration contracts
        run: bun scripts/ci/run-ci-checks.ts --priority "$CI_PRIORITY" --observe-peers -- bun scripts/ci/run-priority-tests.ts "$CI_PRIORITY" --runner integration --scope "${{ matrix.package }}" --prebuilt
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-contract-results-${{ matrix.priority }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  bun_contracts:
    name: bun_contracts_${{ matrix.priority }} (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.bun_contract_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.bun_contract_matrix) }}
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Build selected contract owners
        env:
          LERNA_FILTER: ${{ matrix.lernaFilter }}
        shell: bash
        run: |
          read -r -a filters <<< "$LERNA_FILTER"
          bun run build -- "${filters[@]}" --include-dependencies
      - name: Test selected Bun contracts
        run: bun scripts/ci/run-ci-checks.ts --priority "$CI_PRIORITY" --observe-peers -- bun scripts/ci/run-priority-tests.ts "$CI_PRIORITY" --runner bun --scope '${{ join(matrix.packages, ',') }}' --prebuilt
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-contract-results-${{ matrix.priority }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  database_tests:
    name: database_tests_${{ matrix.priority }} (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.database_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.database_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build ${{ matrix.package }} and its dependencies
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run build -- --scope ${{ matrix.package }} --include-dependencies
        shell: bash
      - name: Test selected priority files
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c "$CI_CHECK_COMMAND"
        env:
          CI_TEST_PACKAGE: ${{ matrix.package }}
          CI_TEST_FILES_JSON: ${{ matrix.files }}
          CI_CHECK_COMMAND: bun scripts/ci/run-database-tests.ts
        shell: bash
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database_tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  published_extensions:
    needs: scope
    if: needs.scope.outputs.published_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      # Canvas is the only extension with build output: its preview catalog is built from
      # this repo's UI, so it must exist before the extension is copied out and checked.
      - name: Build the Canvas preview catalog
        run: bun run build -- --scope canvas --include-dependencies
      - name: Check extensions against published SDK and UI packages
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_COMMAND: bun run --cwd scripts verify:published-extensions
        shell: bash
    env:
      CI_PRIORITY: P0
      TEST_PRIORITIES: P0
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  harness_cli_support:
    needs: scope
    if: needs.scope.outputs.harness_cli == 'true'
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      versions: '["minimum","latest"]'
  windows_test_and_build:
    name: windows_test_and_build (${{ matrix.check }})
    needs: scope
    if: needs.scope.outputs.production == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            lane: lint
          - check: unit-1
            lane: unit
            shard: 1/4
          - check: unit-2
            lane: unit
            shard: 2/4
          - check: unit-3
            lane: unit
            shard: 3/4
          - check: unit-4
            lane: unit
            shard: 4/4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Warm up Windows PowerShell
        if: matrix.lane != 'lint'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static
          class PromptStudioWarmUp {}'"
      - name: Build monorepo
        run: bun run build
      - name: Lint monorepo
        if: matrix.lane == 'lint'
        run: bunx lerna run lint --no-bail --concurrency=2
      - name: Test monorepo shard ${{ matrix.shard }} (non-e2e)
        if: ${{ !cancelled() && (matrix.lane == 'unit') }}
        run: bun scripts/ci/run-windows-unit-tests.ts ${{ matrix.shard }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_test_and_build-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P2
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
  windows_database_tests:
    name: windows_database_tests (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.production == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pstdio-api
            shard: 1/8
          - package: pstdio-api
            shard: 2/8
          - package: pstdio-api
            shard: 3/8
          - package: pstdio-api
            shard: 4/8
          - package: pstdio-api
            shard: 5/8
          - package: pstdio-api
            shard: 6/8
          - package: pstdio-api
            shard: 7/8
          - package: pstdio-api
            shard: 8/8
          - package: pstdio-db
            shard: 1/4
          - package: pstdio-db
            shard: 2/4
          - package: pstdio-db
            shard: 3/4
          - package: pstdio-db
            shard: 4/4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build ${{ matrix.package }} and its dependencies
        run: bun run build -- --scope ${{ matrix.package }} --include-dependencies
      - name: Warm up Windows PowerShell
        if: matrix.package == 'pstdio-api'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static
          class PromptStudioWarmUp {}'"
      - name: Test ${{ matrix.package }} shard ${{ matrix.shard }}
        run: bun run --cwd packages/${{ matrix.package }} test --shard=${{ matrix.shard }} --timeout=15000
        if: ${{ !cancelled() }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_database_tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P2
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      GH_TOKEN: ${{ github.token }}
  components:
    name: components_${{ matrix.priority }} (${{ matrix.package }})
    needs: scope
    if: needs.scope.outputs.component_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.component_matrix) }}
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      CANVAS_TEST_PACKAGES: ${{ matrix.package }}
      COMPONENT_TEST_FILES: ${{ matrix.files }}
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
