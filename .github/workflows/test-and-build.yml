name: Test and Build

# Pull requests select fast package, browser and native checks from their affected inputs.
# Merge groups, main, manual runs and ci:full pull requests run the full stage, so main
# receives only commits that passed every check main runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches:
      - main
      - test/ci-reliability/**
  workflow_dispatch:

concurrency:
  # Only a newer event on the same pull request replaces a run. Every queue and main commit keeps
  # its own run until it finishes, so a red commit can always be traced.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: "false"

jobs:
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.scope.outputs.stage }}
      docker_build: ${{ steps.scope.outputs.dockerBuild }}
      lerna_filter: ${{ steps.scope.outputs.lernaFilter }}
      database_tests: ${{ steps.scope.outputs.databaseTests }}
      license: ${{ steps.scope.outputs.license }}
      published_extensions: ${{ steps.scope.outputs.publishedExtensions }}
      harness_cli: ${{ steps.scope.outputs.harnessCli }}
      relay_smoke: ${{ steps.scope.outputs.relaySmoke }}
      browser_smoke: ${{ steps.scope.outputs.browserSmoke }}
      browser_checks: ${{ steps.scope.outputs.browserChecks }}
      browser_matrix: ${{ steps.scope.outputs.browserMatrix }}
      native_checks: ${{ steps.scope.outputs.nativeChecks }}
      package_checks: ${{ steps.scope.outputs.packageChecks }}
      required_jobs: ${{ steps.scope.outputs.requiredJobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Choose the stage, jobs, and packages to test
        id: scope
        env:
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/pull-request-ci-scope.ts

  # Whole-repo checks that give the same result for the same commit. Every stage runs them.
  static_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The extension API report compares with the last release tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      - name: Check formatting
        run: bun run format:check

      # Offline and deterministic, so every stage runs them. A code rename can break a documentation link
      # without touching a Markdown file. External sites are checked by the Documentation links workflow.
      - name: Check documentation links, published routes, and exported skills
        run: bun run --cwd scripts verify:docs-links

      - name: Check that the SDK references name every public method
        run: bun run --cwd scripts verify:sdk-reference

      - name: Check that guide code blocks match their maintained examples
        run: bun run --cwd scripts verify:docs-snippets

      - name: Check package boundaries and browser test origins
        run: bun run verify:boundaries

      - name: Check for unused files, exports, and dependencies
        run: bun run knip

      - name: Check lockfile and extension API version
        run: bun run verify:lockfile && bun run verify:extension-api-version

      - name: Compare public SDK APIs with the last release
        id: sdk_api_report
        run: bun run verify:extension-api-report

      - name: Upload public SDK API comparison
        if: ${{ !cancelled() && steps.sdk_api_report.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-api-report
          path: .api-report/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      # Some build outputs, such as the webview runtime bundle, are committed. A stale copy ships old code.
      - name: Check committed build outputs are up to date
        run: git diff --exit-code

      - name: Check translations
        run: bun run verify:translations

  lint:
    needs: scope
    if: needs.scope.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # A scoped run lints and tests the packages changed since the target branch.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      - name: Build the tested packages and their dependencies
        run: bun run build -- ${{ needs.scope.outputs.lerna_filter }} --include-dependencies

      - name: Lint monorepo
        run: bunx lerna run lint ${{ needs.scope.outputs.lerna_filter }}

  unit_tests:
    needs: scope
    if: needs.scope.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache

      - name: Build tested packages and their dependencies
        run: bun run build -- ${{ needs.scope.outputs.lerna_filter }} --include-dependencies

      - name: Test monorepo (non-e2e)
        # Stream failures as they happen; buffered task output can be lost when the runner exits.
        # The API and database suites take minutes, so database_tests runs them in shards.
        run: bunx lerna run test --ignore e2e --ignore pstdio-api --ignore pstdio-db ${{ needs.scope.outputs.lerna_filter }} --stream

      - name: Test synchronization protocol with isolated storage
        run: bunx lerna run test:conformance ${{ needs.scope.outputs.lerna_filter }} --stream

  relay_smoke:
    needs: scope
    if: needs.scope.outputs.relay_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Test database ownership across container restarts
        run: bun packages/pstdio-db/src/db/pglite-container-lock.integration.ts

      - name: Test built relay with disposable PostgreSQL and object storage
        run: bun run --cwd services/relay test:isolated

      - name: Install dependencies for storage and private account authority checks
        run: bun install --frozen-lockfile

      - name: Test PostgreSQL publication and process recovery
        run: bun run --cwd services/relay test:storage

      - name: Test durable streaming assets and object storage contract
        run: bun run --cwd services/relay test:assets

      - name: Test authenticated relay HTTP and finite WebSocket subscriptions
        run: bun run --cwd services/relay test:transport

      - name: Test the blind sync store, its cleanup and its protocol
        run: bun run --cwd services/relay test:sync

      - name: Test production relay with real local stores
        env:
          SYNC_TEST_ENTRY: ../pstdio-db/src/services/extension-storage/grouped-production-relay.integration.ts
        run: bun run --cwd packages/pstdio-sync-contracts test:conformance

      - name: Test private account authority and its built image with disposable PostgreSQL
        run: bun run --cwd services/account-manager test:isolated

  # Together these suites took 6 to 8 minutes in one job, where they also slowed each other down.
  # Shards keep each job near the PR stage's 5-minute target.
  database_tests:
    name: database_tests (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.database_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: pstdio-api, shard: 1/4 }
          - { package: pstdio-api, shard: 2/4 }
          - { package: pstdio-api, shard: 3/4 }
          - { package: pstdio-api, shard: 4/4 }
          - { package: pstdio-db, shard: 1/3 }
          - { package: pstdio-db, shard: 2/3 }
          - { package: pstdio-db, shard: 3/3 }
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      - name: Build ${{ matrix.package }} and its dependencies
        run: bun run build -- --scope ${{ matrix.package }} --include-dependencies

      - name: Test ${{ matrix.package }} shard ${{ matrix.shard }}
        run: bun run --cwd packages/${{ matrix.package }} test --shard=${{ matrix.shard }}

  published_extensions:
    needs: scope
    if: needs.scope.outputs.published_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check extensions against published SDK and UI packages
        run: bun run --cwd scripts verify:published-extensions

  harness_cli_support:
    needs: scope
    if: needs.scope.outputs.harness_cli == 'true'
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ github.sha }}
      versions: '["minimum"]'

  windows_test_and_build:
    name: windows_test_and_build (${{ matrix.check }})
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: lint, lane: lint }
          - { check: unit-1, lane: unit, shard: 1/4 }
          - { check: unit-2, lane: unit, shard: 2/4 }
          - { check: unit-3, lane: unit, shard: 3/4 }
          - { check: unit-4, lane: unit, shard: 4/4 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      # A fresh runner's first Windows PowerShell start prepares its modules and C# compiler. That one-time cost
      # is usually about 4 s but has stalled past the 15 s test limit, so pay it before the tests that use PowerShell.
      - name: Warm up Windows PowerShell
        if: matrix.lane != 'lint'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"

      - name: Build monorepo
        run: bun run build

      - name: Lint monorepo
        if: matrix.lane == 'lint'
        run: bunx lerna run lint

      - name: Test monorepo shard ${{ matrix.shard }} (non-e2e)
        if: matrix.lane == 'unit'
        # ADR 0044: hosted Windows runner variance exceeds Bun's 5 s default.
        # Every package uses bun test; split its files without adding workers on the same runner.
        run: bunx lerna run test --ignore e2e --ignore pstdio-wt --ignore pstdio-db --ignore pstdio-api --stream --concurrency=1 -- --shard=${{ matrix.shard }} --timeout=15000

      - name: Test Git worktree shard ${{ matrix.shard }} with its existing 30-second limit
        if: matrix.lane == 'unit'
        run: bun run --cwd packages/pstdio-wt test --shard=${{ matrix.shard }}

  windows_database_tests:
    name: windows_database_tests (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: pstdio-api, shard: 1/8 }
          - { package: pstdio-api, shard: 2/8 }
          - { package: pstdio-api, shard: 3/8 }
          - { package: pstdio-api, shard: 4/8 }
          - { package: pstdio-api, shard: 5/8 }
          - { package: pstdio-api, shard: 6/8 }
          - { package: pstdio-api, shard: 7/8 }
          - { package: pstdio-api, shard: 8/8 }
          - { package: pstdio-db, shard: 1/4 }
          - { package: pstdio-db, shard: 2/4 }
          - { package: pstdio-db, shard: 3/4 }
          - { package: pstdio-db, shard: 4/4 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      - name: Build ${{ matrix.package }} and its dependencies
        run: bun run build -- --scope ${{ matrix.package }} --include-dependencies

      # Each API shard has a fresh runner. Keep PowerShell setup outside its test limits.
      - name: Warm up Windows PowerShell
        if: matrix.package == 'pstdio-api'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"

      # Split PGlite initialization across runners without adding workers within a shard.
      - name: Test ${{ matrix.package }} shard ${{ matrix.shard }}
        # ADR 0044: retain the existing Windows default and the API runner's own limit.
        run: bun run --cwd packages/${{ matrix.package }} test --shard=${{ matrix.shard }} --timeout=15000

  storybooks:
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache

      - name: Build Storybook dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Build shared Storybooks
        run: bun packages/e2e/src/scripts/build-storybooks.ts

      - name: Share prebuilt Storybooks with UI shards
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          overwrite: true
          path: |
            packages/ui/storybook-static
            packages/pstdio-dashboard/storybook-static
            packages/pstdio-workbench/storybook-static
          if-no-files-found: error

  browser_smoke:
    needs: scope
    if: needs.scope.outputs.browser_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright

      - name: Build dashboard browser test dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test basic dashboard flows
        run: bun run --cwd packages/e2e test:smoke

      - name: Preserve browser smoke reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn

  browser_regressions:
    name: browser_regressions (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.browser_checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.browser_matrix) }}
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build browser dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Test affected browser behavior
        env:
          PR_BROWSER_SPECS: ${{ matrix.specs }}
        run: |
          status=0
          for spec in $PR_BROWSER_SPECS; do
            bun run --cwd packages/e2e test:pr -- "$spec" || status=1
          done
          exit "$status"
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn

  native_contracts:
    needs: scope
    if: needs.scope.outputs.native_checks != '[]'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Build SDK contracts used by native fixtures
        run: bun run build -- --scope @pstdio/sdk --include-dependencies
      - name: Test Windows release paths and default extension reuse
        run: >-
          bun --conditions=source test
          scripts/release/align-release-baseline.test.ts
          packages/pstdio-api/src/features/extensions/default-extensions.test.ts
          packages/pstdio-api/src/features/extensions/default-extensions-reuse.test.ts
          packages/pstdio-api/src/features/extensions/repo-default-extensions.test.ts
      - name: Prepare Windows PowerShell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"
      - name: Test dependency installs, workspace links, watchers, and attachments
        if: contains(fromJSON(needs.scope.outputs.native_checks), 'filesystem')
        run: bun test --timeout 15000 scripts/ci/install-native-dependencies.test.ts packages/pstdio-extensions/src/runtime/loader-node-modules.test.ts packages/pstdio-extensions/src/authoring/extension-source-watcher-dependencies.test.ts packages/pstdio-api/src/features/sessions/session-attachments.test.ts
      - name: Test native process discovery and command shims
        if: contains(fromJSON(needs.scope.outputs.native_checks), 'process')
        run: bun --conditions=source test --timeout 15000 packages/pstdio-api/src/features/extensions/process-command.test.ts packages/pstdio-api/src/features/extensions/process-command.windows.test.ts packages/pstdio-api/src/features/extensions/process-discovery.test.ts packages/pstdio-extensions/src/runtime/process-environment.test.ts packages/pstdio-api-runtime-host/src/harness-registry.test.ts
      - name: Test Windows desktop platform integrations
        if: contains(fromJSON(needs.scope.outputs.native_checks), 'desktop')
        run: bun test --timeout 15000 clients/desktop/src/cli clients/desktop/src/performance

  e2e:
    needs: [scope, storybooks]
    if: needs.scope.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test desktop readiness helpers with the shared browser image
        if: matrix.shard == 1
        run: bun test clients/desktop/src/e2e/desktop-pages.test.ts

      - name: Download prebuilt shared Storybooks
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: packages

      - name: Test UI e2e
        run: bun run --cwd packages/e2e test:ui -- --shard=${{ matrix.shard }}/3

      - name: Preserve UI test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn

  e2e_cli:
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test e2e scripts
        run: bun run --cwd packages/e2e test:scripts

      - name: Test CLI e2e
        run: bun run --cwd packages/e2e test:cli

  packaged_and_vite_e2e:
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, browser]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright

      - name: Build packaged and Vite test dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test Vite terminal e2e
        if: matrix.suite == 'cli'
        run: bun run --cwd packages/e2e test:vite-terminal

      - name: Compile the packaged test CLI once
        id: packaged_cli
        run: bun run --cwd scripts build:host

      - name: Benchmark packaged collection readiness without traces
        if: matrix.suite == 'browser' && !cancelled() && steps.packaged_cli.outcome == 'success'
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:benchmark

      - name: Test packaged ${{ matrix.suite }} e2e
        if: ${{ !cancelled() && steps.packaged_cli.outcome == 'success' }}
        env:
          DEBUG: pw:browser
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:${{ matrix.suite }}

      - name: Preserve packaged and Vite test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-vite-e2e-${{ matrix.suite }}-results-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn

  quarantined_bun_tests:
    needs: scope
    if: needs.scope.outputs.stage == 'full' || needs.scope.outputs.package_checks == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      E2E_TEST_LANE: quarantine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Build database test dependencies
        run: bun run build -- --scope pstdio-db --include-dependencies
      - name: Build quarantined API dependencies
        if: runner.os == 'Windows'
        run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Run quarantined database cases with their existing limits
        continue-on-error: true
        run: bun run --cwd packages/pstdio-db test ${{ runner.os == 'Windows' && '--timeout=15000' || '' }}
      - name: Run quarantined release cases with their existing limits
        continue-on-error: true
        run: bun run --cwd scripts test
      - name: Run quarantined API cases with their existing limits
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          PSTDIO_DEFAULT_EXTENSIONS: "[]"
          PSTDIO_EXTENSION_WEBVIEW_BUILDS: "0"
        run: bun --cwd packages/pstdio-api ../../scripts/ci/run-bun-tests.ts --conditions=source --timeout 30000 --silent
      - name: Require every registered case to have executed
        run: bun scripts/ci/verify-quarantine-reports.ts bun
      - name: Preserve quarantine test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-bun-${{ runner.os }}-results-attempt-${{ github.run_attempt }}
          path: test-results/quarantine
          if-no-files-found: warn

  quarantined_browser_tests:
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_TEST_LANE: quarantine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build packaged test dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Compile the packaged test CLI
        run: bun run --cwd scripts build:host
      - name: Run quarantined browser cases without retries
        continue-on-error: true
        env:
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/dist/pstdio
        run: bun run --cwd packages/e2e test:packaged:browser
      - name: Require first-attempt browser execution
        run: bun scripts/ci/verify-quarantine-reports.ts playwright
      - name: Preserve quarantine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-browser-results-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn

  license_check:
    needs: scope
    if: needs.scope.outputs.license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate license report
        run: bunx license-checker --production --csv > npm-license-checker.csv

      - name: Check license report
        id: license_check_report
        uses: pilosus/action-pip-license-checker@v2
        with:
          external: npm-license-checker.csv
          external-format: csv
          external-options: "{:skip-header true}"
          fail: WeakCopyleft,StrongCopyleft,NetworkCopyleft
          fails-only: true
          totals: true
          verbose: 1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Echo error
        if: failure()
        run: echo "::error::${{ steps.license_check_report.outputs.report }}"

  # Builds every client without signing, because signing secrets are trusted only on main and
  # release tags. Hosted Intel runners are slow, so the full stage tests on the other three.
  build_clients:
    name: build_clients (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.stage != 'pull_request'
    runs-on: ${{ matrix.os }}
    # Measured full-stage rows (run 38230274646): win32 11.9 min, darwin-arm64 9.8, darwin-x64 5.8, linux 5.7.
    # Release runs took up to 11.8 min for the same steps on darwin-arm64. 20 min leaves about 70% headroom.
    timeout-minutes: 20
    env:
      # Packaged apps install this commit's core extensions, not those of the last release tag.
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, platform: linux, arch: x64, tests: true }
          - { target: darwin-arm64, os: macos-15, platform: darwin, arch: arm64, tests: true }
          - { target: darwin-x64, os: macos-15-intel, platform: darwin, arch: x64, tests: false }
          - { target: win32-x64, os: windows-2025, platform: win32, arch: x64, tests: true }
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Test native DMG attachment cleanup
        id: dmg_cleanup
        if: needs.scope.outputs.stage == 'full' && matrix.platform == 'darwin'
        run: |
          set -o pipefail
          bun test clients/desktop/src/packaging/dmg-device-cleanup.test.ts 2>&1 | tee native-dmg-cleanup.log

      - name: Preserve failed native DMG cleanup log
        if: failure() && steps.dmg_cleanup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-dmg-cleanup-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: native-dmg-cleanup.log
          if-no-files-found: error

      - name: Build monorepo
        if: matrix.platform == 'linux'
        run: bun run build

      - name: Compile CLI binaries for every platform
        if: matrix.platform == 'linux'
        run: bun run --cwd scripts build:all

      - name: Scaffold platform packages
        if: matrix.platform == 'linux'
        run: bun run --cwd scripts release:platforms:scaffold

      - name: Build unsigned desktop app
        id: desktop
        env:
          DEBUG: electron-installer-dmg
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Record disk images after a failed macOS desktop build
        if: failure() && matrix.platform == 'darwin' && steps.desktop.outcome == 'failure'
        run: hdiutil info -plist

      # Chromium refuses to start on Linux unless its sandbox helper is owned by root and setuid.
      - name: Configure the Linux Chromium sandboxes
        if: needs.scope.outputs.stage == 'full' && matrix.platform == 'linux'
        run: |
          set -euo pipefail
          (cd clients/desktop && bun -e 'require("electron")')
          for sandbox in clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox clients/desktop/node_modules/electron/dist/chrome-sandbox; do
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          done

      - name: Set up Windows desktop tests
        if: needs.scope.outputs.stage == 'full' && matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-desktop-tests

      # The source suite reuses the desktop build from packaging.
      - name: Test source Electron
        if: needs.scope.outputs.stage == 'full' && matrix.tests
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bunx playwright test --config playwright.config.ts

      - name: Benchmark packaged renderers
        if: needs.scope.outputs.stage == 'full' && matrix.tests && !cancelled() && steps.desktop.outcome == 'success'
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bunx playwright test --config playwright.benchmark.config.ts packaged-renderer.bench.ts

      # A source failure must not hide the packaged results for the same build. The job still fails.
      - name: Smoke packaged desktop app
        if: needs.scope.outputs.stage == 'full' && matrix.tests && !cancelled() && steps.desktop.outcome == 'success'
        env:
          DEBUG: pw:api,pw:browser
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bun run test:packaged

      - name: Run quarantined Apple Silicon packaged cases
        if: needs.scope.outputs.stage == 'full' && matrix.platform == 'darwin' && matrix.arch == 'arm64' && !cancelled() && steps.desktop.outcome == 'success'
        continue-on-error: true
        env:
          E2E_TEST_LANE: quarantine
        working-directory: clients/desktop
        run: bun run test:packaged

      - name: Require first-attempt Apple Silicon quarantine execution
        if: needs.scope.outputs.stage == 'full' && matrix.platform == 'darwin' && matrix.arch == 'arm64' && !cancelled() && steps.desktop.outcome == 'success'
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop

      - name: Preserve desktop test reports and traces
        if: always() && needs.scope.outputs.stage == 'full' && matrix.tests
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: clients/desktop/test-results
          if-no-files-found: warn

  build_docker:
    needs: scope
    if: needs.scope.outputs.docker_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # ADR 0043: Docker Hub resets anonymous pulls from shared runner IPs. The daemon tries
      # Google's public Docker Hub cache first and falls back to Docker Hub. Temporary workaround.
      - name: Pull Docker Hub images through a mirror
        run: |
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$config" | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'

  # The compiled CLI on Linux, Intel macOS and Windows, as the release checks it.
  packaged_toolchain:
    needs: scope
    if: needs.scope.outputs.stage == 'full'
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ github.sha }}

  # The one status check the main ruleset and merge queue require. Job and matrix names can
  # change without touching the ruleset. It must run whenever the run finishes, because GitHub
  # treats a skipped required check as passing and jobs are skipped when a job they need fails.
  # A run cancelled by a newer run on the same commit (for example after a label is added)
  # reports nothing, so its stale failure does not sit next to the newer run's result.
  # The scope lists required jobs explicitly. A selected check that skips cannot pass this gate.
  ci_passed:
    if: ${{ !cancelled() }}
    needs:
      - scope
      - static_checks
      - lint
      - unit_tests
      - relay_smoke
      - database_tests
      - published_extensions
      - harness_cli_support
      - windows_test_and_build
      - windows_database_tests
      - storybooks
      - browser_smoke
      - browser_regressions
      - native_contracts
      - e2e
      - e2e_cli
      - packaged_and_vite_e2e
      - license_check
      - build_clients
      - build_docker
      - packaged_toolchain
      - quarantined_bun_tests
      - quarantined_browser_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Require every selected job to succeed
        env:
          REQUIRED_JOBS: ${{ needs.scope.outputs.required_jobs }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-ci-jobs.ts
