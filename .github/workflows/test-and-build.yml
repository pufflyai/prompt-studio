name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check package boundaries and browser test origins
        run: bun run verify:boundaries

      - name: Check lockfile and extension API version
        run: bun run verify:lockfile && bun run verify:extension-api-version

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Check translations
        run: bun run verify:translations

      - name: Lint monorepo
        run: bun run lint

      - name: Test monorepo (non-e2e)
        run: bunx lerna run test --ignore e2e

  windows_test_and_build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency installs, workspace links, watchers, and attachments
        run: bun test scripts/ci/install-native-dependencies.test.ts packages/pstdio-extensions/src/runtime/loader-node-modules.test.ts packages/pstdio-api/src/features/extensions/extension-source-watcher-dependencies.test.ts packages/pstdio-api/src/features/sessions/session-attachments.test.ts

      - name: Check formatting
        run: bun run format:check

      - name: Build monorepo
        run: bun run build

      - name: Lint monorepo
        run: bun run lint

      - name: Test monorepo (non-e2e)
        run: bunx lerna run test --ignore e2e --stream --concurrency=1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test UI e2e
        run: bun run --cwd packages/e2e test:ui -- --shard=${{ matrix.shard }}/3

      - name: Preserve UI test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results-${{ matrix.shard }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  e2e_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test e2e scripts
        run: bun run --cwd packages/e2e test:scripts

      - name: Test CLI e2e
        run: bun run --cwd packages/e2e test:cli

  packaged_and_vite_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      - name: Test Vite terminal e2e
        run: bun run --cwd packages/e2e test:vite-terminal

      - name: Test packaged e2e
        env:
          DEBUG: pw:api,pw:browser
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
        run: bun run --cwd packages/e2e test:packaged

      - name: Preserve packaged and Vite test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-vite-e2e-results
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  desktop_e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Package Electron with its native sidecar
        run: bun run --cwd clients/desktop package

      - name: Configure the source Electron sandbox
        if: runner.os == 'Linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      - name: Test source Electron
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd clients/desktop test:electron

      - name: Test source Electron on macOS and Windows
        if: runner.os != 'Linux'
        run: bun run --cwd clients/desktop test:electron

      - name: Configure the packaged Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox

      - name: Verify packaged Electron fuses
        run: bun run --cwd clients/desktop verify:fuses

      - name: Install Windows process suspension test tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "pstools"
          $archive = Join-Path $env:RUNNER_TEMP "PSTools.zip"
          Invoke-WebRequest https://download.sysinternals.com/files/PSTools.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $tools
          $signature = Get-AuthenticodeSignature (Join-Path $tools "pssuspend64.exe")
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "CN=Microsoft Corporation,") {
            throw "PsSuspend must have a valid Microsoft signature"
          }
          $tools >> $env:GITHUB_PATH

      - name: Test packaged Electron
        if: runner.os == 'Linux'
        env:
          DEBUG: pw:api,pw:browser
        run: xvfb-run -a bun run --cwd clients/desktop test:packaged

      - name: Test packaged Electron on macOS and Windows
        if: runner.os != 'Linux'
        env:
          DEBUG: pw:api,pw:browser
        run: bun run --cwd clients/desktop test:packaged

      - name: Preserve Electron readiness results and redacted failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-readiness-${{ matrix.target }}
          path: clients/desktop/test-results
          if-no-files-found: error

  build_docker:
    needs: [test_and_build, windows_test_and_build, e2e, e2e_cli, packaged_and_vite_e2e, desktop_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'
