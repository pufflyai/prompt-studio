name: Diagnose concurrent native icon lookup
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact unmodified source for the paired cold-fixture experiment
        required: true
        type: string
permissions:
  contents: read
jobs:
  paired_main:
    runs-on: windows-latest
    # Same ceiling as the maintained native API job; no test allowance changes.
    timeout-minutes: 25
    env:
      NX_DAEMON: "false"
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
      API_TEST_REPORT_DIR: ${{ github.workspace }}/test-results/ci/paired-main
      API_FILES: '["src/features/harnesses/harness-registry-service.p1.test.ts","src/features/link-icons/routes.p1.test.ts"]'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build API dependencies
        run: bun run build -- --scope pstdio-api --include-dependencies
      - name: Preserve maintained Windows setup
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"
      - name: Record exact main identity and fixture hashes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --porcelain
          Get-FileHash packages/pstdio-api/src/features/harnesses/harness-registry-service.p1.test.ts
          Get-FileHash packages/pstdio-api/src/features/link-icons/routes.p1.test.ts
          Get-FileHash packages/pstdio-api/src/features/link-icons/link-icon-fetcher.ts
      - name: Run the original concurrent pair once
        if: ${{ !cancelled() }}
        shell: pwsh
        # Use the existing two-file scheduler, fresh processes and original per-case limits.
        # This is a causal experiment, not full-suite qualification or a reliability retry.
        run: bun run --cwd packages/pstdio-api test --files $env:API_FILES --timeout=15000
      - name: Preserve exact file and case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-icon-paired-main
          path: test-results/ci/paired-main
          if-no-files-found: warn
      - name: Confirm no source mutation
        if: always()
        run: git diff --exit-code
