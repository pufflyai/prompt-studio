name: Decode qualified native Edge engine
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  engine:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      E2E_QUALIFY_BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: architecture-msedge
          run-id: 40266908057
          github-token: ${{ github.token }}
      - name: Decode exact version from successful browser launches
        run: bun packages/e2e/src/packaged/decode-browser-architecture.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-native-edge-engine
          path: .pstdio/extension-storage/pstdio.pstdio-artifacts/browser-architecture
          include-hidden-files: true
