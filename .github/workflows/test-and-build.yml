      - name: Configure the Linux Chromium sandboxes
        if: (needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true') && matrix.platform == 'linux'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: >
            set -euo pipefail

            (cd clients/desktop && bun -e 'require("electron")')

            for sandbox in clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
            clients/desktop/node_modules/electron/dist/chrome-sandbox; do
              sudo chown root:root "$sandbox"
              sudo chmod 4755 "$sandbox"
            done
        shell: bash
      - name: Set up Windows desktop tests
        if: (needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true') && matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: Test source Electron
        if: (needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true') && matrix.tests
        working-directory: clients/desktop
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bunx playwright test --config playwright.config.ts
        shell: bash
      - name: Smoke packaged desktop app
        if: (needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true') && matrix.tests && !cancelled() &&
          steps.desktop.outcome == 'success'
        env:
          DEBUG: pw:api,pw:browser
          CI_CHECK_COMMAND: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bun run test:packaged --grep @essential
        working-directory: clients/desktop
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        shell: bash
      - name: Run quarantined packaged desktop cases
        if: needs.scope.outputs.production == 'true' && matrix.tests && !cancelled() && steps.desktop.outcome == 'success'
        continue-on-error: true
        env:
          CI_PRIORITY: P2
          E2E_TEST_LANE: quarantine
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bun run test:packaged --pass-with-no-tests
      - name: Require first-attempt packaged desktop quarantine execution
        if: needs.scope.outputs.production == 'true' && matrix.tests && !cancelled() && steps.desktop.outcome == 'success'
        env:
          CI_PRIORITY: P2
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop
      - name: Preserve desktop test reports and traces
        if: always() && (needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true') && matrix.tests
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            clients/desktop/test-results
            test-results/quarantine/clients/desktop
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Share native desktop build archives with certified main promotion
        if: ${{ !cancelled() && needs.scope.outputs.stage == 'merge_queue' && steps.desktop.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-host-native-desktop-${{ runner.os }}-${{ runner.arch }}-attempt-${{ github.run_attempt }}
          path: .cache/ci-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
  build_docker:
    needs: scope
    if: needs.scope.outputs.docker_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Pull Docker Hub images through a mirror
        run: >
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')

          echo "$config" | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' | sudo tee
          /etc/docker/daemon.json

          sudo systemctl restart docker

          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'
      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .
      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    name: build_docker (${{ matrix.image }})
    env:
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
  packaged_toolchain:
    needs: scope
    if: needs.scope.outputs.stage == 'merge_queue' || needs.scope.outputs.production == 'true'
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      platforms: ${{ needs.scope.outputs.production == 'true' &&
        '[{"os":"ubuntu-24.04","platform_pkg":"cli-linux-x64"},{"os":"macos-15-intel","platform_pkg":"cli-darwin-x64"},{"os":"ubuntu-24.04-arm","platform_pkg":"cli-linux-arm64"},{"os":"macos-15","platform_pkg":"cli-darwin-arm64"},{"os":"windows-latest","platform_pkg":"cli-win-x64"},{"os":"windows-11-arm","platform_pkg":"cli-win-arm64"}]'
        || '[{"os":"ubuntu-24.04","platform_pkg":"cli-linux-x64"},{"os":"macos-15-intel","platform_pkg":"cli-darwin-x64"}]' }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      artifact_attempt: ${{ inputs.artifact_attempt || '1' }}
      profile: ${{ needs.scope.outputs.production == 'true' && 'full' || 'integrity' }}
      priority: ${{ needs.scope.outputs.production == 'true' && 'P2' || 'P1' }}
      gate_plan: ${{ needs.scope.outputs.gate_plan }}
  ci_passed:
    if: ${{ !cancelled() }}
    needs:
      - scope
      - validation_results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - *a1
      - name: Require complete selected validation
        env:
          VALIDATION_RESULT: ${{ needs.validation_results.result }}
        run: bun -e 'if (process.env.VALIDATION_RESULT !== "success") throw new Error("Incomplete selected validation")'
      - name: Download production build identity
        if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ inputs.artifact_attempt }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Attest functional candidate consumption
        if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.original_source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
          CHANNEL: ${{ inputs.release_channel }}
          OUTCOME: ${{ needs.validation_results.result }}
        run: bun scripts/ci/production-evidence.ts --check functional --outcome "$OUTCOME"
      - if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-functional-attempt-${{ github.run_attempt }}
          path: production-evidence/functional.json
          if-no-files-found: error
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    name: ${{ needs.scope.outputs.production == 'true' && 'production_ci_passed' || 'ci_passed' }}
  sdk_api_report:
    needs: scope
    if: needs.scope.outputs.sdk_api_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - *a1
      - uses: ./.github/actions/setup-ci-cache
      - name: Compare public APIs with last release
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run verify:extension-api-report
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-api-report
          path: .api-report/
          include-hidden-files: true
          if-no-files-found: warn
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  storybook_tests:
    name: storybook_tests (${{ matrix.shard }})
    needs:
      - scope
      - storybooks
    if: needs.scope.outputs.component_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.component_shards == '1' && '[1]' || needs.scope.outputs.component_shards == '2' && '[1,2]' || '[1,2,3]') }}
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
      COMPONENT_TEST_FILES: ${{ needs.scope.outputs.component_files }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Restore component artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: storybook-static-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: .cache/storybook-artifacts
      - name: Require and extract every owner Storybook
        run: bun packages/storybook-tests/src/scripts/storybook-artifacts.ts restore
      - name: Test component interactions
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd packages/storybook-tests test:browser -- --shard=${{ matrix.shard }}/${{ needs.scope.outputs.component_shards }}
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |-
            packages/storybook-tests/test-results
            packages/storybook-tests/playwright-report
          if-no-files-found: warn
  validation_results:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - *a1
      - name: Observe selected jobs; report only P1 failure early
        run: bun scripts/ci/monitor-ci-gates.ts
      - name: Preserve plan, results, and source identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-attempt-${{ github.run_attempt }}
          path: test-results/ci/gate-results.json
          if-no-files-found: error
permissions:
  contents: read
  actions: read
