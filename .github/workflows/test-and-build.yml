name: Temporary PS236 isolated comparison
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  comparison:
    name: Isolated 5000-ticket and 5000-foobar comparison (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            source: f22e64bc0abd740b9944efd0c6cf51d16a81d8db
          - variant: candidate
            source: 1fee1c61ecb20243ddd199ef114f1f49bbf58327
    env:
      PSTDIO_ISOLATED_AGENT_CREDENTIALS: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          path: driver
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source }}
          path: app
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: Prepare browser and identical passive counters
        run: |
          mkdir -p browser-tools
          cd browser-tools
          bun init -y
          bun add --exact @playwright/test@1.60.0
          bunx playwright install --with-deps chromium
          cd ../app
          mkdir -p __test-tmp__
          cat > __test-tmp__/ps236-counters.compose.json <<'JSON'
          {"services":{"prompt-studio":{"environment":{"PSTDIO_BENCHMARK_COUNTERS":"1"}}}}
          JSON
      - name: Start the owned Docker runtime
        working-directory: app
        env:
          PSTDIO_ISOLATED_COMPOSE_FILE: __test-tmp__/ps236-counters.compose.json
        run: bun run dev:isolated -- --name ps236-${{ matrix.variant }}-${{ github.run_id }} --desktop
      - name: Run the complete comparison scenarios
        run: bun driver/scripts/diagnostics/ps236-isolated-comparison.ts app ps236-${{ matrix.variant }}-${{ github.run_id }} ${{ matrix.variant }} browser-tools
      - name: Capture owned stack logs
        if: always()
        run: |
          mkdir -p comparison-evidence/${{ matrix.variant }}
          docker logs ps236-${{ matrix.variant }}-${{ github.run_id }}-prompt-studio-1 > comparison-evidence/${{ matrix.variant }}/container.log 2>&1 || true
          docker ps -a --filter label=com.docker.compose.project=ps236-${{ matrix.variant }}-${{ github.run_id }} > comparison-evidence/${{ matrix.variant }}/owned-containers.txt
          df -h > comparison-evidence/${{ matrix.variant }}/disk.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps236-isolated-${{ matrix.variant }}-${{ github.run_id }}
          path: comparison-evidence
      - name: Remove only the owned stack
        if: always()
        working-directory: app
        env:
          PSTDIO_ISOLATED_COMPOSE_FILE: __test-tmp__/ps236-counters.compose.json
        run: bun run dev:isolated -- --name ps236-${{ matrix.variant }}-${{ github.run_id }} --down
