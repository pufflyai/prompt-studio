name: Focused launch quarantine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      PLAYWRIGHT_TRACE: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - run: bun run --cwd clients/desktop package -- --arch=x64
      - name: List stable launch selection without executing it again
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.benchmark.config.ts --list packaged-launch.p3.bench.ts
      - name: Run Windows launch quarantine once
        continue-on-error: true
        run: bun scripts/ci/run-quarantined-tests.ts packaged-desktop-benchmark --scope @pstdio/desktop --prebuilt
      - name: Require every quarantined case exactly once
        if: '!cancelled()'
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop-benchmark --scope @pstdio/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-quarantine-evidence
          path: |
            clients/desktop/test-results
            test-results/quarantine
