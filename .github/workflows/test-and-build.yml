name: Test and Build
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group: null
  push:
    branches:
      - main
      - test/ci-reliability/**
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options:
          - production
          - merge_queue
        default: production
        description: Validation profile
      source_sha:
        type: string
        default: ""
        description: Optional exact merged source for full diagnostics
  workflow_call:
    inputs:
      profile:
        type: string
        default: production
        description: Production functional validation or merge_queue diagnostics
      source_sha:
        type: string
        default: ""
        description: Exact candidate version commit
      original_source_sha:
        type: string
        default: ""
        description: Source revision before release version preparation
      artifact_run_id:
        type: string
        default: ""
        description: Run that produced immutable release artifacts
      artifact_attempt:
        type: string
        default: "1"
        description: Attempt that produced immutable release artifacts
      release_channel:
        type: string
        default: stable
        description: Candidate release channel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_DAEMON: "false"
jobs:
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.scope.outputs.stage }}
      docker_build: ${{ steps.scope.outputs.dockerBuild }}
      lerna_filter: ${{ steps.scope.outputs.lernaFilter }}
      database_tests: ${{ steps.scope.outputs.databaseTests }}
      license: ${{ steps.scope.outputs.license }}
      published_extensions: ${{ steps.scope.outputs.publishedExtensions }}
      harness_cli: ${{ steps.scope.outputs.harnessCli }}
      relay_smoke: ${{ steps.scope.outputs.relaySmoke }}
      browser_smoke: ${{ steps.scope.outputs.browserSmoke }}
      browser_checks: ${{ steps.scope.outputs.browserChecks }}
      browser_matrix: ${{ steps.scope.outputs.browserMatrix }}
      package_checks: ${{ steps.scope.outputs.packageChecks }}
      package_matrix: ${{ steps.scope.outputs.packageMatrix }}
      required_jobs: ${{ steps.scope.outputs.requiredJobs }}
      production: ${{ steps.scope.outputs.production }}
      component_checks: ${{ steps.scope.outputs.componentChecks }}
      component_files: ${{ steps.scope.outputs.componentFiles }}
      component_shards: ${{ steps.scope.outputs.componentShards }}
      sdk_api_report: ${{ steps.scope.outputs.sdkApiReport }}
      gate_plan: ${{ steps.scope.outputs.gatePlan }}
      client_matrix: ${{ steps.scope.outputs.clientMatrix }}
      database_matrix: ${{ steps.scope.outputs.databaseMatrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Choose the stage, jobs, and packages to test
        id: scope
        env:
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
          CI_PROFILE: ${{ inputs.profile || '' }}
        run: bun scripts/ci/pull-request-ci-scope.ts
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  static_checks:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - &a1
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        if: needs.scope.outputs.stage != 'main'
      - name: Collect independent repository checks
        if: needs.scope.outputs.stage != 'main'
        run: bun scripts/ci/run-static-checks.ts
      - name: Verify tested merge content and inputs
        if: needs.scope.outputs.stage == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/verify-main-provenance.ts
        id: provenance
      - name: Preserve static outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-results-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: ignore
      - name: Copy certified host build archives
        if: needs.scope.outputs.stage == 'main'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-build-host-*-attempt-${{ steps.provenance.outputs.attempt }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .cache/ci-build
          merge-multiple: true
      - name: Publish certified host build cache on the default branch
        if: needs.scope.outputs.stage == 'main'
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-build
          key: nx-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-provenance
      - name: Publish certified Intel Mac host build cache on the default branch
        if: needs.scope.outputs.stage == 'main'
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-build
          key: nx-macOS-X64-host-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-provenance
      - name: Publish certified Apple Silicon host build cache on the default branch
        if: needs.scope.outputs.stage == 'main'
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-build
          key: nx-macOS-ARM64-host-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-provenance
    needs: scope
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  package_checks:
    name: package_checks (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.package_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build the tested packages and their dependencies
        id: build_packages
        run: bun run build -- ${{ matrix.lernaFilter }} --include-dependencies --no-bail
      - name: Collect independent lint, unit, and synchronization results
        if: ${{ !cancelled() }}
        run: bun scripts/ci/run-package-group.ts
        env:
          LERNA_FILTER: ${{ matrix.lernaFilter }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package_checks-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Share tested host build cache with main
        if: ${{ !cancelled() && steps.build_packages.outcome == 'success' && needs.scope.outputs.stage == 'merge_queue' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-host-package-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: .cache/ci-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  relay_smoke:
    needs: scope
    if: needs.scope.outputs.relay_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Test database ownership across container restarts
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun packages/pstdio-db/src/db/pglite-container-lock.integration.ts
        shell: bash
      - name: Test built relay with disposable PostgreSQL and object storage
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/relay test:isolated
        shell: bash
      - name: Install dependencies for storage and private account authority checks
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun install --frozen-lockfile
        shell: bash
      - name: Test PostgreSQL publication and process recovery
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/relay test:storage
        shell: bash
      - name: Test durable streaming assets and object storage contract
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/relay test:assets
        shell: bash
      - name: Test authenticated relay HTTP and finite WebSocket subscriptions
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/relay test:transport
        shell: bash
      - name: Test the blind sync store, its cleanup and its protocol
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/relay test:sync
        shell: bash
      - name: Test private account authority and its built image with disposable PostgreSQL
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd services/account-manager test:isolated
        shell: bash
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  database_tests:
    name: database_tests (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.database_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.database_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build ${{ matrix.package }} and its dependencies
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run build -- --scope ${{ matrix.package }} --include-dependencies
        shell: bash
      - name: Test ${{ matrix.package }} shard ${{ matrix.shard }}
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        if: needs.scope.outputs.stage == 'pull_request'
        env:
          CI_TEST_PACKAGE: ${{ matrix.package }}
          CI_TEST_FILES_JSON: ${{ matrix.files }}
          CI_CHECK_COMMAND: bun scripts/ci/run-pr-database.ts
        shell: bash
      - name: Test complete merge-critical shard
        if: needs.scope.outputs.stage != 'pull_request'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd packages/${{ matrix.package }} test --shard=${{ matrix.shard }}
        shell: bash
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database_tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  published_extensions:
    needs: scope
    if: needs.scope.outputs.published_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check extensions against published SDK and UI packages
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd scripts verify:published-extensions
        shell: bash
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  harness_cli_support:
    needs: scope
    if: needs.scope.outputs.harness_cli == 'true'
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      versions: '["minimum","latest"]'
  windows_test_and_build:
    name: windows_test_and_build (${{ matrix.check }})
    needs: scope
    if: needs.scope.outputs.production == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            lane: lint
          - check: unit-1
            lane: unit
            shard: 1/4
          - check: unit-2
            lane: unit
            shard: 2/4
          - check: unit-3
            lane: unit
            shard: 3/4
          - check: unit-4
            lane: unit
            shard: 4/4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Warm up Windows PowerShell
        if: matrix.lane != 'lint'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static
          class PromptStudioWarmUp {}'"
      - name: Build monorepo
        run: bun run build
      - name: Lint monorepo
        if: matrix.lane == 'lint'
        run: bunx lerna run lint --no-bail --concurrency=2
      - name: Test monorepo shard ${{ matrix.shard }} (non-e2e)
        if: ${{ !cancelled() && (matrix.lane == 'unit') }}
        run: bunx lerna run test --ignore e2e --ignore storybook-tests --ignore pstdio-wt --ignore pstdio-db --ignore pstdio-api --stream
          --concurrency=1 --no-bail -- --shard=${{ matrix.shard }} --timeout=15000
      - name: Test Git worktree shard ${{ matrix.shard }} with its existing 30-second limit
        if: ${{ !cancelled() && (matrix.lane == 'unit') }}
        run: bun run --cwd packages/pstdio-wt test --shard=${{ matrix.shard }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_test_and_build-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
  windows_database_tests:
    name: windows_database_tests (${{ matrix.package }} ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.production == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pstdio-api
            shard: 1/8
          - package: pstdio-api
            shard: 2/8
          - package: pstdio-api
            shard: 3/8
          - package: pstdio-api
            shard: 4/8
          - package: pstdio-api
            shard: 5/8
          - package: pstdio-api
            shard: 6/8
          - package: pstdio-api
            shard: 7/8
          - package: pstdio-api
            shard: 8/8
          - package: pstdio-db
            shard: 1/4
          - package: pstdio-db
            shard: 2/4
          - package: pstdio-db
            shard: 3/4
          - package: pstdio-db
            shard: 4/4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build ${{ matrix.package }} and its dependencies
        run: bun run build -- --scope ${{ matrix.package }} --include-dependencies
      - name: Warm up Windows PowerShell
        if: matrix.package == 'pstdio-api'
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static
          class PromptStudioWarmUp {}'"
      - name: Test ${{ matrix.package }} shard ${{ matrix.shard }}
        run: bun run --cwd packages/${{ matrix.package }} test --shard=${{ matrix.shard }} --timeout=15000
        if: ${{ !cancelled() }}
      - name: Preserve file and case execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows_database_tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
  storybooks:
    name: storybooks (${{ matrix.package }})
    needs: scope
    if: needs.scope.outputs.component_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: ui
            project: "@pstdio/ui"
          - package: pstdio-dashboard
            project: pstdio-dashboard
          - package: pstdio-workbench
            project: "@pstdio/workbench"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
      - name: Build owner Storybook and dependencies
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun x --no-install lerna run build-storybook --scope '${{ matrix.project }}'
        shell: bash
      - name: Archive the owner output at its original path
        run: bun packages/storybook-tests/src/scripts/storybook-artifacts.ts pack '${{ matrix.package }}'
      - name: Share the owner Storybook with component shards
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: .cache/storybook-artifacts/storybook-${{ matrix.package }}.tar.gz
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Preserve owner build archives for certified main promotion
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-host-storybook-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: .cache/ci-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  browser_smoke:
    needs: scope
    if: needs.scope.outputs.browser_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - name: Install dependencies and restore build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Build dashboard browser test dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies
      - name: Test basic dashboard flows
        run: bun run --cwd packages/e2e test:smoke
        if: ${{ !cancelled() }}
      - name: Preserve browser smoke reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
