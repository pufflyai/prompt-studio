name: Test and Build
run-name: PS-1200 Home and Notes on PR head
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser_diagnostic:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: home
            label: Home source refresh on PR head
            source: a56948d199e9097c3dee881dc5df801d50af1a00
            test: packages/e2e/src/ui/home-project-source.p1.spec.ts
            priority: P1
          - id: notes
            label: Packaged Notes quarantine on PR head
            source: a56948d199e9097c3dee881dc5df801d50af1a00
            test: packages/e2e/src/packaged/packaged-notes-page.p2.spec.ts
            priority: P2
    env:
      NX_DAEMON: "false"
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      CI_PROFILE: production
      CI_PRIORITY: ${{ matrix.priority }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      EXPECTED_SHA: ${{ matrix.source }}
      DIAGNOSTIC_FILE: ${{ matrix.test }}
      DIAGNOSTIC_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Confirm exact test and workflow sources
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p test-results/ci
          node -e 'const fs=require("node:fs"); const git=(...args)=>require("node:child_process").execFileSync("git",args,{encoding:"utf8"}).trim(); const proof={source:git("rev-parse","HEAD"),tree:git("rev-parse","HEAD^{tree}"),workflow:process.env.GITHUB_WORKFLOW_SHA,file:process.env.DIAGNOSTIC_FILE,case:process.env.DIAGNOSTIC_ID}; fs.writeFileSync("test-results/ci/ps1200-browser-source.json",JSON.stringify(proof,null,2)+"\n"); console.log(proof);'
      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Run the complete selected file through its owning runner
        shell: bash
        run: |
          if [[ "$DIAGNOSTIC_ID" == notes ]]; then
            bun scripts/test.ts --file "$DIAGNOSTIC_FILE" --lane quarantine --list --out test-results/ci/ps1200-browser-plan.json
          else
            bun scripts/test.ts --file "$DIAGNOSTIC_FILE" --list --out test-results/ci/ps1200-browser-plan.json
          fi
          bun scripts/test.ts --plan test-results/ci/ps1200-browser-plan.json
      - name: Preserve exact source, logs, and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1200-browser-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: error
