name: Temporary database image diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_PRIORITY: P1
      TEST_PRIORITIES: P1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build database dependencies
        run: bun run build -- --scope pstdio-db --include-dependencies
      - name: Measure original image case with unchanged allowance
        working-directory: packages/pstdio-db
        run: bun ../../scripts/ci/run-bun-tests.ts scripts/build-empty-database.p1.test.ts
