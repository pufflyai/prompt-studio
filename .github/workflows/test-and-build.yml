name: Temporary Intel board diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PSTDIO_EXTENSION_RELEASE_REF: ${{ inputs.source_sha }}
      PSTDIO_BUILD_PLATFORM_PKG: cli-darwin-x64
      TEST_PRIORITIES: P0,P1,P2
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Diagnose full native packaged workload
        env:
          DEBUG: pw:api
          PSTDIO_VERIFY_PLATFORM_PKG: "1"
        run: bun run --cwd scripts verify:packages -- --profile full --shard 1/1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-board-full-diagnosis
          path: test-results
