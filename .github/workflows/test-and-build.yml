name: Observe Cloud Retry dispatch and attachment state
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact frozen PS158 source
        required: true
        type: string
permissions:
  contents: read
jobs:
  cloud_control:
    name: Observe Cloud Retry (${{ matrix.runner }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e packaged-cli source P2 1 macos-15
            os: macos-15
            platform: darwin
            arch: arm64
            owner: e2e
            runner: packaged-cli
            priority: P2
            files: '["packages/e2e/src/packaged/packaged-cloud-project-recovery.p2.test.ts"]'
            stable: true
            quarantine: false
            suite: ""
            browser: true
            desktop: false
    env:
      GH_TOKEN: ${{ github.token }}
      EDITED_TEST_ROW: ${{ toJSON(matrix) }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Require exact frozen source
        shell: bash
        env:
          CONTROL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$CONTROL_SOURCE_SHA" = "4bd741de85239fff34afa01d0dc37aa86e06d4ca"
          test "$(git rev-parse HEAD)" = "$CONTROL_SOURCE_SHA"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install native dependencies and restore host build cache
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: "true"
      - name: Install browser engines
        run: bunx playwright@1.60.0 install --with-deps
      - name: Add request and command-path telemetry without changing assertions or limits
        shell: bash
        run: |
          git fetch origin ${{ github.sha }} --no-tags
          git show ${{ github.sha }}:scripts/ci/observe-cloud-retry.py > "$RUNNER_TEMP/observe-cloud-retry.py"
          python3 "$RUNNER_TEMP/observe-cloud-retry.py"
          git diff --check
          git diff --stat
      - name: Run the maintained failed case once with request-path telemetry
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a bun scripts/ci/run-edited-tests.ts
          else
            bun scripts/ci/run-edited-tests.ts
          fi
      - name: Preserve original case outcomes and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-retry-path-observation
          path: |
            test-results
            packages/e2e/test-results
          if-no-files-found: error
