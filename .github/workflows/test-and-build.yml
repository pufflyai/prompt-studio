name: Test and Build
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group: null
  push:
    branches:
      - main
      - test/ci-reliability/**
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options:
          - production
          - windows
          - merge_queue
        default: production
        description: Production, Windows-only source diagnostics, or merge queue checks
      source_sha:
        type: string
        default: ""
        description: Optional exact merged source for diagnostics
      release_channel:
        type: choice
        options: [stable, nightly]
        default: stable
        description: Source diagnostic policy; nightly also measures coverage and publishes no release
  workflow_call:
    inputs:
      profile:
        type: string
        default: production
        description: Production functional validation, Windows-only source diagnostics, or merge_queue diagnostics
      source_sha:
        type: string
        default: ""
        description: Exact candidate version commit
      original_source_sha:
        type: string
        default: ""
        description: Source revision before release version preparation
      artifact_run_id:
        type: string
        default: ""
        description: Run that produced immutable release artifacts
      artifact_attempt:
        type: string
        default: "1"
        description: Attempt that produced immutable release artifacts
      candidate_artifact_id:
        type: string
        default: ""
        description: Immutable candidate identity from the production selector
      release_channel:
        type: string
        default: stable
        description: Candidate release channel
# A newer push to a PR, or a newer manual run for the same branch and source, replaces the older run.
# ci:full and ci:windows diagnostics dispatch on the base branch with the PR's source_sha, so each PR keeps its own group.
# Release Packages calls this workflow under its own name and keeps one group per commit.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'pull_request' && 'latest' ||
    github.event_name == 'workflow_dispatch' && github.workflow == 'Test and Build' && format('dispatch-{0}-{1}', inputs.profile, inputs.source_sha) ||
    github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.workflow == 'Test and Build') }}
env:
  NX_DAEMON: "false"
jobs:
  scope:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan_artifact_id: ${{ steps.test_plan.outputs.artifact-id }}
      stage: ${{ steps.scope.outputs.stage }}
      docker_build: ${{ steps.scope.outputs.dockerBuild }}
      lerna_filter: ${{ steps.scope.outputs.lernaFilter }}
      database_tests: ${{ steps.scope.outputs.databaseTests }}
      license: ${{ steps.scope.outputs.license }}
      published_extensions: ${{ steps.scope.outputs.publishedExtensions }}
      harness_cli: ${{ steps.scope.outputs.harnessCli }}
      integration_matrix: ${{ steps.scope.outputs.integrationMatrix }}
      browser_smoke: ${{ steps.scope.outputs.browserSmoke }}
      package_checks: ${{ steps.scope.outputs.packageChecks }}
      package_matrix: ${{ steps.scope.outputs.packageMatrix }}
      required_jobs: ${{ steps.scope.outputs.requiredJobs }}
      production: ${{ steps.scope.outputs.production }}
      source_coverage: ${{ steps.scope.outputs.sourceCoverage }}
      coverage_artifacts: ${{ steps.scope.outputs.coverageArtifacts }}
      component_checks: ${{ steps.scope.outputs.componentChecks }}
      sdk_api_report: ${{ steps.scope.outputs.sdkApiReport }}
      gate_plan: ${{ steps.scope.outputs.gatePlan }}
      client_matrix: ${{ steps.scope.outputs.clientMatrix }}
      toolchain_matrix: ${{ steps.scope.outputs.toolchainMatrix }}
      windows: ${{ steps.scope.outputs.windows }}
      windows_only: ${{ steps.scope.outputs.windowsOnly }}
      quarantine_bun_os: ${{ steps.scope.outputs.quarantineBunOs }}
      harness_matrix: ${{ steps.scope.outputs.harnessMatrix }}
      shared_build: ${{ steps.scope.outputs.sharedBuild }}
      component_matrix: ${{ steps.scope.outputs.componentMatrix }}
      bun_contract_matrix: ${{ steps.scope.outputs.bunContractMatrix }}
      app_matrix: ${{ steps.scope.outputs.appMatrix }}
      packaged_matrix: ${{ steps.scope.outputs.packagedMatrix }}
      database_matrix: ${{ steps.scope.outputs.databaseMatrix }}
      edited_matrix: ${{ steps.scope.outputs.editedMatrix }}
    steps:
      # Scope compares the candidate with its first parent only.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Choose the stage, jobs, and packages to test
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PROFILE: ${{ inputs.profile || '' }}
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'stable' }}
          SIGNED_CANDIDATE: ${{ inputs.artifact_run_id != '' }}
        run: bun scripts/ci/pull-request-ci-scope.ts
      - uses: actions/upload-artifact@v4
        id: test_plan
        with:
          name: test-plan-attempt-${{ github.run_attempt }}
          path: test-results/ci/plan.json
          if-no-files-found: error
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  # One Linux build per run. Host jobs import its archives, so each package builds once.
  # Build failures stay with the jobs that test those packages: they rebuild what is missing here.
  build_host:
    needs: scope
    if: needs.scope.outputs.shared_build != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - name: Record the restored build archives
        shell: bash
        run: find .cache/ci-build -maxdepth 1 -name '*.tar.gz' -printf '%f\n' | sort > "$RUNNER_TEMP/restored-archives.txt"
      - name: "[phase:build] Build every package this run's host jobs build"
        continue-on-error: true
        env:
          SHARED_BUILD: ${{ needs.scope.outputs.shared_build }}
        shell: bash
        run: |
          read -r -a filters <<< "$SHARED_BUILD"
          bun run build -- "${filters[@]}" --include-dependencies --no-bail
      - name: Keep only the archives this run built
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/shared-build"
          find .cache/ci-build -maxdepth 1 -name '*.tar.gz' -printf '%f\n' | sort |
            comm -13 "$RUNNER_TEMP/restored-archives.txt" - > "$RUNNER_TEMP/shared-build/archives.txt"
          while read -r archive; do cp ".cache/ci-build/$archive" "$RUNNER_TEMP/shared-build/"; done < "$RUNNER_TEMP/shared-build/archives.txt"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ci-build-shared-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-build
          compression-level: 0
          if-no-files-found: error
  edited_tests:
    name: edited_tests (${{ matrix.name }})
    needs: scope
    if: needs.scope.outputs.edited_matrix != '[]'
    runs-on: ${{ matrix.os }}
    # Linux browser rows use the image the other browser jobs use; it needs no Ubuntu packages (PS-1167).
    container: ${{ matrix.container && fromJSON('{"image":"mcr.microsoft.com/playwright:v1.60.0-noble","options":"--user 1001 --init --ipc=host"}') || '' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.edited_matrix) }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EDITED_TEST_ROW: ${{ toJSON(matrix) }}
      UI_PERF_ASSERT_BUDGETS: "1"
      PLAYWRIGHT_TRACE: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: ${{ !matrix.container }}
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Set up Bun in the Playwright image
        if: matrix.container
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - name: "[phase:install] Install dependencies and restore the Playwright image build cache"
        if: matrix.container
        uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: "[phase:install] Install native dependencies and restore host build cache"
        if: ${{ !matrix.container }}
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: ${{ matrix.runner == 'packaged-cli' || matrix.runner == 'packaged-browser' }}
      - name: Set up Windows desktop recovery tools
        if: runner.os == 'Windows' && (matrix.desktop || matrix.suite == 'desktop')
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: Install browser engines
        if: matrix.browser && !matrix.container
        # Approved 2026-11-11 (PS-1164): hosted installs take up to 91 s; an unreachable Ubuntu
        # archive otherwise stalls apt for the whole job.
        timeout-minutes: 3
        run: bunx playwright@1.60.0 install --with-deps
      - name: Check edited tests with their registered runners
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: edited-${{ strategy.job-index }}
          prebuilt: "false"
          display: "${{ matrix.browser || matrix.desktop }}"
      - name: "[phase:report-transfer] Preserve selected files, execution reports, traces and measurements"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edited-tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: |
            test-results
            packages/e2e/test-results
            packages/ui/test-results
            packages/canvas-tests/test-results
            clients/desktop/test-results
          if-no-files-found: error
  static_checks:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      queue_run: ${{ steps.provenance.outputs.run_id }}
      queue_attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - &a1
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        if: needs.scope.outputs.stage != 'main'
      - name: Collect independent repository checks
        if: needs.scope.outputs.stage != 'main'
        run: bun scripts/ci/run-static-checks.ts
      - name: Test repository contracts
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: repository
      - name: Verify tested merge content and inputs
        if: needs.scope.outputs.stage == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/verify-main-provenance.ts
        id: provenance
      - name: "[phase:report-transfer] Preserve static outcomes"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-results-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: ignore
      - name: Copy certified host build archives
        if: needs.scope.outputs.stage == 'main'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-build-host-*-attempt-${{ steps.provenance.outputs.attempt }}
          run-id: ${{ steps.provenance.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .cache/certified-host-builds
      - name: Import complete certified host archives
        if: needs.scope.outputs.stage == 'main'
        run: bun scripts/ci/merge-build-cache.ts .cache/certified-host-builds .cache/ci-build
      - name: Publish certified host build cache on the default branch
        if: needs.scope.outputs.stage == 'main'
        uses: actions/cache/save@v4
        with:
          path: .cache/ci-build
          key: nx-${{ runner.os }}-${{ runner.arch }}-host-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}-${{ github.sha }}-provenance
    needs: scope
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  package_checks:
    name: package_checks (${{ matrix.shard }})
    needs: [scope, build_host]
    # build_host only speeds builds up: this job still builds and reports if it failed.
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.package_checks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: "[phase:install] Install dependencies and restore build cache"
        uses: ./.github/actions/setup-ci-cache
      - uses: ./.github/actions/use-shared-build
      - name: "[phase:build] Build the tested packages and their dependencies"
        id: build_packages
        run: bun run build -- ${{ matrix.lernaFilter }} --include-dependencies --no-bail
      - name: Collect independent lint, unit, and synchronization results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: package-${{ matrix.shard }}
          package-filter: ${{ matrix.lernaFilter }}
          prebuilt: "true"
          display: "false"
      - name: "[phase:report-transfer] Preserve file and case execution evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package_checks-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Share tested host build cache with main
        if: ${{ !cancelled() && steps.build_packages.outcome == 'success' && needs.scope.outputs.stage == 'merge_queue' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-host-package-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: .cache/ci-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
  integration_contracts:
    name: integration_contracts_${{ matrix.priority }} (${{ matrix.shard }})
    needs: [scope, build_host]
    # build_host only speeds builds up: this job still builds and reports if it failed.
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.integration_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.integration_matrix) }}
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - uses: ./.github/actions/use-shared-build
      - name: "[phase:build] Build selected contract owners"
        env:
          LERNA_FILTER: ${{ matrix.lernaFilter }}
        shell: bash
        run: |
          read -r -a filters <<< "$LERNA_FILTER"
          bun run build -- "${filters[@]}" --include-dependencies
      - name: Test selected isolated integration contracts
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: integrations-${{ matrix.priority }}-${{ matrix.shard }}
          prebuilt: "true"
          display: "false"
      - name: "[phase:report-transfer] Preserve execution evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-contract-results-${{ matrix.priority }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  bun_contracts:
    name: bun_contracts_${{ matrix.priority }} (${{ matrix.shard }})
    needs: [scope, build_host]
    # build_host only speeds builds up: this job still builds and reports if it failed.
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.bun_contract_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.bun_contract_matrix) }}
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
      - uses: ./.github/actions/use-shared-build
      - name: "[phase:build] Build selected contract owners"
        env:
          LERNA_FILTER: ${{ matrix.lernaFilter }}
        shell: bash
        run: |
          read -r -a filters <<< "$LERNA_FILTER"
          bun run build -- "${filters[@]}" --include-dependencies
      - name: Test selected Bun contracts
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: contracts-${{ matrix.priority }}-${{ matrix.shard }}
          prebuilt: "true"
          display: "false"
      - name: "[phase:report-transfer] Preserve execution evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-contract-results-${{ matrix.priority }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  database_tests:
    name: database_tests_${{ matrix.priority }} (${{ matrix.package }} ${{ matrix.shard }})
    needs: [scope, build_host]
    # build_host only speeds builds up: this job still builds and reports if it failed.
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.database_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.database_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: "[phase:install] Install dependencies and restore build cache"
        uses: ./.github/actions/setup-ci-cache
      - uses: ./.github/actions/use-shared-build
      - name: "[phase:build] Build ${{ matrix.package }} and its dependencies"
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run build -- --scope ${{ matrix.package }} --include-dependencies
        shell: bash
      - name: Test selected priority files
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: database-${{ matrix.package }}-${{ matrix.priority }}-${{ matrix.shard }}
          prebuilt: "true"
          display: "false"
      - name: "[phase:report-transfer] Preserve file and case execution evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database_tests-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-results/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    env:
      CI_PRIORITY: ${{ matrix.priority }}
      CI_SOURCE_COVERAGE: ${{ needs.scope.outputs.source_coverage == 'true' && '1' || '0' }}
      TEST_PRIORITIES: ${{ matrix.priority }}
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  published_extensions:
    needs: scope
    if: needs.scope.outputs.published_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check extensions against published SDK and UI packages
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CHECK_COMMAND: bun run --cwd scripts verify:published-extensions
        shell: bash
    env:
      CI_PRIORITY: P0
      TEST_PRIORITIES: P0
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  harness_cli_support:
    needs: scope
    if: needs.scope.outputs.harness_cli == 'true'
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      versions: '["minimum","latest"]'
      harnesses: ${{ needs.scope.outputs.harness_matrix }}
  windows_test_and_build:
    name: windows_test_and_build (${{ matrix.check }})
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            lane: lint
          - check: unit-1
            lane: unit
            shard: 1/4
          - check: unit-2
            lane: unit
            shard: 2/4
          - check: unit-3
            lane: unit
            shard: 3/4
          - check: unit-4
            lane: unit
            shard: 4/4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
