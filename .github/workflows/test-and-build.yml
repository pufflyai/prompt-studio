name: Test and Build

# Every pull request update runs the jobs its changes need. Each push to main runs every job,
# so a failure in a job the pull request skipped still shows up on the commit that caused it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Only a newer push to the same pull request replaces a run. Every main commit keeps
  # its own run until it finishes, so a red commit can always be traced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lerna_filter: ${{ steps.scope.outputs.lernaFilter }}
      windows: ${{ steps.scope.outputs.windows }}
      e2e: ${{ steps.scope.outputs.e2e }}
      license: ${{ steps.scope.outputs.license }}
      published_extensions: ${{ steps.scope.outputs.publishedExtensions }}
      harness_cli: ${{ steps.scope.outputs.harnessCli }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Choose the jobs and packages to test
        id: scope
        run: bun scripts/ci/pull-request-ci-scope.ts

  test_and_build:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check package boundaries and browser test origins
        run: bun run verify:boundaries

      - name: Check for unused files, exports, and dependencies
        run: bun run knip

      - name: Check lockfile and extension API version
        run: bun run verify:lockfile && bun run verify:extension-api-version && bun run verify:extension-api-report

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      # Some build outputs, such as the webview runtime bundle, are committed. A stale copy ships old code.
      - name: Check committed build outputs are up to date
        run: git diff --exit-code

      - name: Check translations
        run: bun run verify:translations

      - name: Lint monorepo
        run: bunx lerna run lint ${{ needs.scope.outputs.lerna_filter }}

      - name: Test monorepo (non-e2e)
        # Stream failures as they happen; buffered task output can be lost when the runner exits.
        run: bunx lerna run test --ignore e2e ${{ needs.scope.outputs.lerna_filter }} --stream

  published_extensions:
    needs: scope
    if: needs.scope.outputs.published_extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check extensions against published SDK and UI packages
        run: bun run --cwd scripts verify:published-extensions

  harness_cli_support:
    needs: scope
    if: needs.scope.outputs.harness_cli == 'true'
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ github.sha }}
      versions: '["minimum"]'

  windows_test_and_build:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency installs, workspace links, watchers, and attachments
        run: bun test --timeout 15000 scripts/ci/install-native-dependencies.test.ts packages/pstdio-extensions/src/runtime/loader-node-modules.test.ts packages/pstdio-api/src/features/extensions/extension-source-watcher-dependencies.test.ts packages/pstdio-api/src/features/sessions/session-attachments.test.ts

      # A fresh runner's first Windows PowerShell start prepares its modules and C# compiler. That one-time cost
      # is usually about 4 s but has stalled past the 15 s test limit, so pay it before the tests that use PowerShell.
      - name: Warm up Windows PowerShell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"

      - name: Test Windows desktop platform integrations
        run: bun test --timeout 15000 clients/desktop/src/cli clients/desktop/src/performance/performance-endpoint.test.ts

      - name: Check formatting
        run: bun run format:check

      - name: Build monorepo
        run: bun run build

      - name: Test Windows npm command shims
        run: bun --conditions=source test --timeout 15000 packages/pstdio-api/src/features/extensions/process-command.test.ts packages/pstdio-api/src/features/extensions/process-command.windows.test.ts packages/pstdio-api/src/features/extensions/process-discovery.test.ts packages/pstdio-extensions/src/runtime/process-environment.test.ts packages/pstdio-api-runtime-host/src/harness-registry.test.ts

      - name: Compile Windows runtime for harness detection
        env:
          PSTDIO_BUILD_PLATFORM_PKG: cli-win-x64
        run: bun run --cwd scripts build:all

      - name: Test packaged Windows npm harness detection
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe
        run: bun test packages/e2e/src/packaged/harness-npm-detection.test.ts --timeout 30000

      - name: Lint monorepo
        run: bunx lerna run lint ${{ needs.scope.outputs.lerna_filter }}

      - name: Test monorepo (non-e2e)
        # ADR 0044: hosted Windows runner variance exceeds Bun's 5 s default.
        run: bunx lerna run test --ignore e2e --ignore pstdio-wt --ignore pstdio-db --ignore pstdio-api ${{ needs.scope.outputs.lerna_filter }} --stream --concurrency=1 -- --timeout=15000

      - name: Test Git worktrees with their existing 30-second limit
        run: bun run --cwd packages/pstdio-wt test

  windows_database_tests:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build database and API dependencies
        run: bun run build -- --scope pstdio-api --include-dependencies

      # This job has its own fresh runner, so it must prepare PowerShell before API tests too.
      - name: Warm up Windows PowerShell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "@{} | ConvertTo-Json | Out-Null; Add-Type -TypeDefinition 'public static class PromptStudioWarmUp {}'"

      # PGlite setup dominates these suites on Windows. Run them on their own runner
      # so the platform checks do not wait for hundreds of database initializations.
      - name: Test database and API packages
        # ADR 0044: retain the existing Windows default and the API runner's own limit.
        run: bunx lerna run test --scope pstdio-db --scope pstdio-api ${{ needs.scope.outputs.lerna_filter }} --stream --concurrency=1 -- --timeout=15000

  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test UI e2e
        run: bun run --cwd packages/e2e test:ui -- --shard=${{ matrix.shard }}/3

      - name: Preserve UI test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results-${{ matrix.shard }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  e2e_cli:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      - name: Test e2e scripts
        run: bun run --cwd packages/e2e test:scripts

      - name: Test CLI e2e
        run: bun run --cwd packages/e2e test:cli

  packaged_and_vite_e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        run: node scripts/ci/setup-container-bun.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      - name: Test Vite terminal e2e
        run: bun run --cwd packages/e2e test:vite-terminal

      - name: Test packaged e2e
        env:
          DEBUG: pw:api,pw:browser
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
        run: bun run --cwd packages/e2e test:packaged

      - name: Preserve packaged and Vite test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-vite-e2e-results
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  license_check:
    needs: scope
    if: needs.scope.outputs.license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate license report
        run: bunx license-checker --production --csv > npm-license-checker.csv

      - name: Check license report
        id: license_check_report
        uses: pilosus/action-pip-license-checker@v2
        with:
          external: npm-license-checker.csv
          external-format: csv
          external-options: "{:skip-header true}"
          fail: WeakCopyleft,StrongCopyleft,NetworkCopyleft
          fails-only: true
          totals: true
          verbose: 1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Echo error
        if: failure()
        run: echo "::error::${{ steps.license_check_report.outputs.report }}"

  build_docker:
    needs: test_and_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # ADR 0043: Docker Hub resets anonymous pulls from shared runner IPs. The daemon tries
      # Google's public Docker Hub cache first and falls back to Docker Hub. Temporary workaround.
      - name: Pull Docker Hub images through a mirror
        run: |
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          echo "$config" | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'

  # The one status check the main ruleset requires. Job and matrix names can change
  # without touching the ruleset. It must always run: GitHub treats a skipped required
  # check as passing, and jobs are skipped when a job they need fails.
  # Pull requests may skip jobs their changes do not need. On main every job must pass.
  ci_passed:
    if: always()
    needs: [scope, published_extensions, harness_cli_support, test_and_build, windows_test_and_build, windows_database_tests, e2e, e2e_cli, packaged_and_vite_e2e, license_check, build_docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to succeed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name != 'pull_request' && contains(needs.*.result, 'skipped'))
        run: exit 1
