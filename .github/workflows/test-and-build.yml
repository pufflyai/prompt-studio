          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  license_check:
    needs: scope
    if: needs.scope.outputs.license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: "[phase:install] Install dependencies"
        run: bun install --frozen-lockfile
      - name: Generate license report
        run: bunx license-checker --production --csv > npm-license-checker.csv
      - name: Check license report
        id: license_check_report
        uses: pilosus/action-pip-license-checker@v2
        with:
          external: npm-license-checker.csv
          external-format: csv
          external-options: "{:skip-header true}"
          fail: WeakCopyleft,StrongCopyleft,NetworkCopyleft
          fails-only: true
          totals: true
          verbose: 1
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Echo error
        if: failure()
        run: echo "::error::${{ steps.license_check_report.outputs.report }}"
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
  build_clients:
    name: build_clients (${{ matrix.target }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: scope
    if: needs.scope.outputs.production == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ inputs.source_sha || github.sha }}
      CI_PRIORITY: ${{ needs.scope.outputs.production == 'true' && 'P2' || 'P1' }}
      TEST_PRIORITIES: ${{ needs.scope.outputs.production == 'true' && 'P0,P1,P2' || 'P1' }}
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    strategy:
      fail-fast: ${{ needs.scope.outputs.production != 'true' }}
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.client_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: "[phase:install] Install native dependencies and restore host build cache"
        id: install_native_dependencies
        uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
          windows-dev-drive: ${{ matrix.platform == 'win32' }}
      - name: Test native DMG attachment cleanup
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'darwin' && matrix.shard == 1
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: dmg-${{ matrix.target }}
          prebuilt: "true"
          display: "false"
      - name: "[phase:build] Build monorepo"
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'linux'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run build
        shell: bash
      - name: "[phase:build] Compile CLI binaries for every platform"
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'linux'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd scripts build:all
        shell: bash
      - name: Scaffold platform packages
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'linux'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run --cwd scripts release:platforms:scaffold
        shell: bash
      - name: "[phase:build] Build unsigned desktop app"
        id: desktop
        env:
          DEBUG: electron-installer-dmg
          CI_CHECK_COMMAND: bun run --cwd clients/desktop package -- --arch=${{ matrix.arch }}
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        shell: bash
      - name: Record disk images after a failed macOS desktop build
        if: failure() && matrix.platform == 'darwin' && steps.desktop.outcome == 'failure'
        run: hdiutil info -plist
      - name: Configure the Linux Chromium sandboxes
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'linux'
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: >
            bun scripts/ci/configure-linux-desktop-sandboxes.ts
        shell: bash
      - name: Set up Windows desktop tests
        if: needs.scope.outputs.production == 'true' && matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: Test source Electron
        if: needs.scope.outputs.production == 'true' && matrix.tests && matrix.shard == 1
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: electron-${{ matrix.target }}
          prebuilt: "true"
          display: "true"
      - name: Record complete packaged desktop inventory
        if: matrix.packaged && matrix.shards > 1 && matrix.shard == 1 && !cancelled() && steps.desktop.outcome == 'success'
        working-directory: clients/desktop
        run: |
          mkdir -p test-results
          bun run test:packaged -- --list --reporter=json > test-results/packaged-release-inventory.json
        shell: bash
      # A signed release candidate runs these packaged cases in signed functional validation.
      - name: Smoke packaged desktop app
        if: needs.scope.outputs.production == 'true' && matrix.packaged && !cancelled() && steps.desktop.outcome == 'success'
        env:
          DEBUG: pw:api,pw:browser
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: desktop-${{ matrix.target }}-${{ matrix.shard }}/${{ matrix.shards }}
          prebuilt: "true"
          display: "true"
      - name: Run quarantined packaged desktop cases
        if: needs.scope.outputs.production == 'true' && matrix.packaged && matrix.shard == 1 && !cancelled() && steps.desktop.outcome == 'success'
        uses: ./.github/actions/run-test-plan
        with:
          plan-artifact-id: ${{ needs.scope.outputs.plan_artifact_id }}
          job: desktop-quarantine-${{ matrix.target }}
          prebuilt: "true"
          display: "true"
      - name: "[phase:report-transfer] Preserve desktop test reports and traces"
        if: always() && needs.scope.outputs.production == 'true' && matrix.tests
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.target }}-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-attempt-${{ github.run_attempt }}
          path: |
            clients/desktop/test-results
            test-results/quarantine
          if-no-files-found: warn
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
  build_docker:
    needs: scope
    if: needs.scope.outputs.docker_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Pull Docker Hub images through a mirror
        run: >
          config=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')

          echo "$config" | jq '.["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://mirror.gcr.io"] | unique)' | sudo tee
          /etc/docker/daemon.json

          sudo systemctl restart docker

          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'
      - name: "[phase:build] Build ${{ matrix.image }} image"
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .
      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'
      - name: Require committed generated outputs to match their source
        if: ${{ !cancelled() }}
        run: git diff --exit-code
    name: build_docker (${{ matrix.image }})
    env:
      CI_PRIORITY: P2
      GH_TOKEN: ${{ github.token }}
  packaged_toolchain:
    needs: scope
    if: needs.scope.outputs.production == 'true'
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ inputs.source_sha || github.sha }}
      artifact_run_id: ${{ inputs.artifact_run_id || '' }}
      artifact_attempt: ${{ inputs.artifact_attempt || '1' }}
      profile: full
      test_plan: true
      test_plan_artifact_id: ${{ needs.scope.outputs.plan_artifact_id }}
      platforms: ${{ needs.scope.outputs.toolchain_matrix }}
      priority: P2
      gate_plan: ${{ needs.scope.outputs.gate_plan }}
  source_coverage:
    needs: [scope, package_checks, bun_contracts, database_tests]
    if: >-
      !cancelled() && needs.scope.outputs.source_coverage == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Download measured source producers from this attempt
        uses: actions/download-artifact@v4
        with:
          pattern: '{package_checks,bun-contract-results,database_tests,windows_test_and_build,windows_database_tests}-*-attempt-${{ github.run_attempt }}'
          path: test-results/coverage-inputs
      - name: Require matching complete source evidence and merge line hits
        env:
          CI_COVERAGE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          CI_COVERAGE_ARTIFACTS: ${{ needs.scope.outputs.coverage_artifacts }}
        run: bun scripts/badges/nightly-source-coverage.ts test-results/coverage-inputs test-results/coverage/coverage.json
      - name: "[phase:report-transfer] Preserve the full nightly source measurement"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-source-coverage-attempt-${{ github.run_attempt }}
          path: test-results/coverage/*.json
          if-no-files-found: error
  ci_passed:
    if: ${{ !cancelled() }}
    needs:
      - scope
      - validation_results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - *a1
      - name: Require complete selected validation
        env:
          VALIDATION_RESULT: ${{ needs.validation_results.result }}
        run: bun -e 'if (process.env.VALIDATION_RESULT !== "success") throw new Error("Incomplete selected validation")'
      - name: Download production build identity
        if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ inputs.artifact_attempt }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download selected production candidate identity
        if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
      - name: Attest functional candidate consumption
        if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.original_source_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
          CHANNEL: ${{ inputs.release_channel }}
          OUTCOME: ${{ needs.validation_results.result }}
        run: bun scripts/ci/production-evidence.ts --check functional --outcome "$OUTCOME"
      - if: ${{ !cancelled() && needs.scope.outputs.production == 'true' && inputs.artifact_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-functional-attempt-${{ github.run_attempt }}
          path: production-evidence/functional.json
          if-no-files-found: error
    env:
      CI_PRIORITY: P1
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
    name: ${{ needs.scope.outputs.windows_only == 'true' && 'windows_ci_passed' || needs.scope.outputs.production == 'true' && 'production_ci_passed' || 'ci_passed' }}
  sdk_api_report:
    needs: scope
    if: needs.scope.outputs.sdk_api_report == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - *a1
      - uses: ./.github/actions/setup-ci-cache
      - name: Compare public APIs with last release
        run: bun "$GITHUB_WORKSPACE/scripts/ci/run-ci-checks.ts" --priority "$CI_PRIORITY" --observe-peers -- bash -eo pipefail -c
          "$CI_CHECK_COMMAND"
        env:
          CI_CHECK_COMMAND: bun run verify:extension-api-report
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-api-report
          path: .api-report/
          include-hidden-files: true
          if-no-files-found: warn
    env:
      CI_PRIORITY: P0
      GH_TOKEN: ${{ github.token }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
  validation_results:
    # GitHub owns waiting for runners; the result reader starts after execution finishes.
    needs:
      - scope
      - build_host
      - edited_tests
      - static_checks
      - package_checks
      - integration_contracts
      - bun_contracts
      - database_tests
      - published_extensions
      - harness_cli_support
      - windows_test_and_build
      - windows_database_tests
      - components
      - browser_smoke
      - e2e
      - e2e_cli
      - packaged_and_vite_e2e
      - quarantined_bun_tests
      - quarantined_native_ui_tests
      - quarantined_browser_tests
      - license_check
      - build_clients
      - build_docker
      - packaged_toolchain
      - source_coverage
      - sdk_api_report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CI_GATE_PLAN: ${{ needs.scope.outputs.gate_plan }}
      CI_PROFILE: ${{ needs.scope.outputs.production == 'true' && 'production' || needs.scope.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - *a1
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.scope.outputs.plan_artifact_id }}
          merge-multiple: true
          path: test-results/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: test-plan-results-*-attempt-*
          path: test-results/ci/bundles
      - name: Require complete planned test evidence
        run: bun scripts/ci/verify-test-results.ts test-results/ci/plan.json test-results/ci/bundles
      - name: Require complete selected job results
        run: bun scripts/ci/monitor-ci-gates.ts
      - name: "[phase:report-transfer] Preserve plan, results, and source identity"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci/plan.json
            test-results/ci/plan-verification.json
            test-results/ci/gate-results.json
          if-no-files-found: error
permissions:
  contents: read
  actions: read
