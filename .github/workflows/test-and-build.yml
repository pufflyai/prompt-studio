name: Baseline Windows desktop tab recovery reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI_PRIORITY: P2
      TEST_PRIORITIES: P0,P1,P2
      PSTDIO_EXTENSION_RELEASE_REF: 066cd94484d1adfa2de13a183d2ba5df82246f7d
      DEBUG: pw:api,pw:browser
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 066cd94484d1adfa2de13a183d2ba5df82246f7d
      - name: Require exact main baseline source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "066cd94484d1adfa2de13a183d2ba5df82246f7d") { throw "Wrong baseline source" }
          git diff --exit-code
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the unmodified baseline desktop app
        run: bun run --cwd clients/desktop package -- --arch=x64
      - uses: ./.github/actions/setup-windows-desktop-tests
      - name: Reproduce the original complete tab-write recovery case
        working-directory: clients/desktop
        run: bun run test:packaged -- packaged-project-tabs.p2.spec.ts --grep "reports a failed tab write and recovers when the next tab change can be saved"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-windows-desktop-tab-recovery
          path: clients/desktop/test-results
          include-hidden-files: true
          if-no-files-found: warn
