name: Observe main Windows PATH timing and temp policy
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        temp: [default, job-owned]
    env:
      CI_PRIORITY: P0
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Preserve only the diagnostic observer outside the checkout
        run: bun -e 'const fs=require("node:fs");const path=require("node:path");fs.copyFileSync("packages/e2e/src/packaged/observe-windows-user-path.ts",path.join(process.env.RUNNER_TEMP,"ps-932-observe-windows-user-path.ts"));'
      - name: Check out unchanged main source
        uses: actions/checkout@v5
        with:
          ref: 1942b69cbf20372825a0e2aef1144554e3c9eb56
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Select job-owned temp only in the comparison row
        if: matrix.temp == 'job-owned'
        run: bun -e 'const fs=require("node:fs");fs.appendFileSync(process.env.GITHUB_ENV,"TEMP="+process.env.RUNNER_TEMP+"\nTMP="+process.env.RUNNER_TEMP+"\n");'
      - name: Observe the unchanged full PATH test file under its 15-second allowance
        run: bun "$env:RUNNER_TEMP/ps-932-observe-windows-user-path.ts"
      - name: Require the source to be restored
        if: always()
        run: git diff --exit-code
      - name: Keep maintained test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-windows-path-${{ matrix.temp }}
          path: test-results/ci
          if-no-files-found: warn
