name: Temporary Intel board diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PSTDIO_EXTENSION_RELEASE_REF: ${{ inputs.source_sha }}
      PSTDIO_BUILD_PLATFORM_PKG: cli-darwin-x64
      TEST_PRIORITIES: P0,P1,P2
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build real native CLI
        run: bun run --cwd scripts build:all
      - name: Install provisioned Chromium
        run: bun -e 'import { preparePackagedSmokeBrowser } from "./scripts/verify/packaged-runtime-smoke"; preparePackagedSmokeBrowser(process.cwd() + "/packages/pstdio/dist/platforms/cli-darwin-x64/bin/pstdio");'
      - name: Diagnose all cold board cases with original allowances
        working-directory: packages/e2e
        env:
          DEBUG: pw:api
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-darwin-x64/bin/pstdio
        run: bun ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts ./src/packaged/packaged-board-panning-smoke.p2.test.ts --timeout 30000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-board-diagnosis
          path: test-results
