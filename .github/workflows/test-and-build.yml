name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check package boundaries and browser test origins
        run: bun run verify:boundaries

      - name: Check lockfile, extension API version, and translations
        run: bun run verify:lockfile && bun run verify:extension-api-version && bun run verify:translations

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Lint monorepo
        run: bun run lint

      - name: Test monorepo (non-e2e)
        run: bunx lerna run test --ignore e2e

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: bun run --cwd packages/e2e playwright install --with-deps chromium

      - name: Test UI e2e
        run: bun run --cwd packages/e2e test:ui -- --shard=${{ matrix.shard }}/3

      - name: Preserve UI test reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-results-${{ matrix.shard }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  e2e_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build end-to-end dependencies
        run: bun run build -- --scope e2e --scope pstdio-dashboard --include-dependencies

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Firefox for CLI shutdown tests
        run: bun run --cwd packages/e2e playwright install --with-deps firefox

      - name: Test e2e scripts
        run: bun run --cwd packages/e2e test:scripts

      - name: Test CLI e2e
        run: bun run --cwd packages/e2e test:cli

  packaged_and_vite_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/pstdio-ci-bun-cache
      E2E_BUN_CACHE_DIR: /tmp/pstdio-ci-bun-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Playwright browsers
        run: bun run --cwd packages/e2e playwright install --with-deps chromium firefox webkit

      - name: Test Vite terminal e2e
        run: bun run --cwd packages/e2e test:vite-terminal

      - name: Test packaged e2e
        env:
          DEBUG: pw:api,pw:browser
          E2E_REQUIRE_WEBVIEW_BROWSERS: "1"
        run: bun run --cwd packages/e2e test:packaged

      - name: Preserve packaged and Vite test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-vite-e2e-results
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: ignore

  desktop_e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Temporary workaround documented in ADR 0010.
      - name: Use canonical Ubuntu package mirror
        if: runner.os == 'Linux'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt

      - name: Install Electron system dependencies
        if: runner.os == 'Linux'
        run: bun run --cwd clients/desktop playwright install-deps chromium

      - name: Build desktop and dependencies
        run: bun run build -- --scope @pstdio/desktop --include-dependencies

      - name: Configure the source Electron sandbox
        if: runner.os == 'Linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      - name: Test source Electron
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd clients/desktop test:electron

      - name: Test source Electron on macOS
        if: runner.os == 'macOS'
        run: bun run --cwd clients/desktop test:electron

      - name: Package Electron with its native sidecar
        run: bun run --cwd clients/desktop package

      - name: Configure the packaged Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox

      - name: Verify packaged Electron fuses
        run: bun run --cwd clients/desktop verify:fuses

      - name: Test packaged Electron
        if: runner.os == 'Linux'
        env:
          DEBUG: pw:api,pw:browser
        run: xvfb-run -a bun run --cwd clients/desktop test:packaged

      - name: Test packaged Electron on macOS
        if: runner.os == 'macOS'
        env:
          DEBUG: pw:api,pw:browser
        run: bun run --cwd clients/desktop test:packaged

      - name: Preserve Electron readiness results and redacted failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-readiness-${{ matrix.target }}
          path: clients/desktop/test-results
          if-no-files-found: error

  build_docker:
    needs: [test_and_build, e2e, e2e_cli, packaged_and_vite_e2e, desktop_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: pstdio/landing-page
            dockerfile: clients/landing-page/Dockerfile
          - image: pstdio/api
            dockerfile: packages/pstdio-api/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} -f ${{ matrix.dockerfile }} .

      - name: Verify API runtime imports
        if: matrix.image == 'pstdio/api'
        run: docker run --rm --entrypoint bun pstdio/api:${{ github.sha }} -e 'await import("./src/app.ts");'
