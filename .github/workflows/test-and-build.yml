name: Diagnose native ARM extension-smoke in the full packaged workload
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ github.sha }}
      profile: full
      priority: P2
      platforms: '[{"os":"windows-11-arm","platform_pkg":"cli-win-arm64"}]'
