name: Detached readiness qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detached:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a11c4c9f8b8d09d9df913d5228471d4a3f3f68cd
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Prove detached lifetime after immediate and delayed readiness
        working-directory: packages/pstdio-api
        run: bun test ./src/features/extensions/extension-detached-process.p1.test.ts
