name: Temporary Intel startup diagnosis
on:
  workflow_dispatch:
    inputs:
      profile:
        type: string
        default: production
      source_sha:
        type: string
        required: true
      release_channel:
        type: string
        default: stable
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PSTDIO_EXTENSION_RELEASE_REF: ${{ inputs.source_sha }}
      TEST_PRIORITIES: P0,P1,P2
      CI_PRIORITY: P2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-ci-cache
        with:
          install-strategy: native
      - name: Build the real cold native app
        run: bun run --cwd clients/desktop package -- --arch=x64
      - name: Diagnose one cold capture
        run: bun run --cwd clients/desktop test:packaged -- --grep "exports complete evidence after the settling requirement is met"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-startup-probe
          path: clients/desktop/test-results
