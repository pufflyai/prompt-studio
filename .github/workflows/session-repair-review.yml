    steps:
      - uses: actions/checkout@v5
        with:
          ref: 695ef14b60004e9e0a02b033b3cd3af5406daf61
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Install browser prerequisites
        run: bunx playwright@1.60.0 install --with-deps chromium firefox
      - name: Prepare the canonical review plan
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          docker info --format '{{.ServerVersion}}'
          bun install --frozen-lockfile
          bun scripts/ci/run-local-review.ts --base "$REVIEW_BASE" \
            --test packages/canvas-tests/src/ui/pstdio-workbench/session-reopen.p1.spec.ts \
            --test packages/canvas-tests/src/ui/ui/chat-tail-resize.p1.spec.ts \
            --test packages/pstdio-api/src/features/sessions/session-queue-dispatch.p1.test.ts \
            --list > "$RUNNER_TEMP/review.json"
      - name: Complete the outstanding review checks
        run: |
          xvfb-run --auto-servernum bun -e '
            import { createHash } from "node:crypto";
            import { mkdtemp } from "node:fs/promises";
            import { join } from "node:path";
            import { tmpdir } from "node:os";
            import { executePlan } from "./scripts/ci/run-test-plan";
            import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
            import { localReviewEnvironment } from "./scripts/ci/local-review-source";
            const { testPlan: plan } = await Bun.file(join(process.env.RUNNER_TEMP, "review.json")).json();
            const localGreen = new Set(JSON.parse(process.env.PASSED_LOCAL_RUN_KEYS));
            const key = (run) => createHash("sha256").update(JSON.stringify([
              run.runner, run.priority, run.owner, run.artifact, run.smoke ?? null, [...run.files].sort(),
            ])).digest("hex");
            const lane = (runner) => {
              if (runner === "desktop") return "desktop";
              if (runner.startsWith("packaged-")) return "packaged";
              if (["app", "component"].includes(runner)) return "browser";
              return "source";
            };
            const runs = plan.runs.filter((run) => lane(run.runner) === process.env.REVIEW_LANE);
            const carried = runs.filter((run) => localGreen.has(key(run)));
            const runIds = runs.filter((run) => !localGreen.has(key(run))).map((run) => run.id);
            console.log(JSON.stringify({ head: plan.source, planDigest: plan.digest, carried: carried.map((run) => run.id), runIds }));
            if (!runIds.length) {
              if (runs.length === 0) throw new Error("The canonical plan did not contain this lane.");
              process.exit(0);
            }
            const directory = await mkdtemp(join(tmpdir(), "pstdio-session-review-"));
            try {
              const result = await executePlan(plan, {
                root: process.cwd(),
                runIds,
                env: { ...localReviewEnvironment(directory), CI_PROFILE: "production" },
              });
              process.exitCode = result.outcome === "success" ? 0 : 1;
            } finally {
              const cleanup = await cleanupReviewCompose(directory);
              if (cleanup.some((entry) => entry.outcome !== "success")) process.exitCode = 1;
            }
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-review-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/review.json
            test-results/ci/planned/**/execution.json
          if-no-files-found: warn
