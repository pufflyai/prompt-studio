name: Session repair review
on:
  push:
    branches: [validation/local-review/pr-2387-695ef14b60]
    paths: [.github/workflows/session-repair-review.yml]
permissions:
  contents: read
jobs:
  review:
    name: Review plan (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [source, browser, packaged, desktop]
    env:
      REVIEW_HEAD: 695ef14b60004e9e0a02b033b3cd3af5406daf61
      REVIEW_BASE: aaf35b1403edccc9a4909f3f87f08890d03a2c02
      REVIEW_LANE: ${{ matrix.lane }}
      PASSED_LOCAL_RUN_KEYS: '["643deb993729768efa133dde3ef99e4265e0c85969ed578b665f320e0ef77af7","a71d06aeb01b05cc0c6bd6cfff2d3acef0df72cfe5bdae159ce5e783f0ab58ac","04f51765c47399b324019dc5f5c49f81ea69ce3ec6597e3296371a64cc6f115e","d4a58860cd58c6b473dc1369cf59ed152ce91bcd6b64aa8274c454fc80f519ea","adacc1e23f5f6264f0d22b28217b59d1330e02b370fd022d30745a373fb11703","ba58d9e6009fa5f390b25d899735124c560471faea1c61aef31d55ed8f900cde","621a857e18c397cd73096fabf6c9b488fadbc6a927431787f017a08aecbb6071","4fa5448b6c3fd259b39d22f41bb11604840536ddbf179d51daf0dbc35c4619f9","02831f58cece3b8c93a0e9ca285f7a5299500b5272f7c16e6279da249a7f8f1b","ddac4ce2018eabe42dc3cc8299faaa57dc0497d26b788d6683fcc4e9f6d33c6a","236c609b153e171dcedc68b2cefd4b8b924f810c69aa8f0815e89529698535b3","036a6f364a2505752d2acb7f0302b52c6a34a382963e6b3d3baccbe7e7e536a2","7e5799826fc865e54bd0bcfce4e2c3972c7766b9084c76c4acbd441a0ca08449","38d6530365940f49f0e0fe533c7234acc0af3c452cfcb1e734eaa5cebc7bb342","1d5009495f4aac2dfabb1a298b6a7565d12e919e3feeb34e65152bc014a3f41d","30180750f472ab95933cc42fdffa1e54817b77204524c47ef5652a3bd5ac0b70","1344a81d2a4c930b5e8b77570414d865db8368380df972f3c4fe471873ef47a9","5e5331e40b63236f6ea41c9e47f2334bda2930f9fb1d6d5b0e27259787e34a44","bd5c2f1b2e6b798263de0abdaa130d6b495e580dddf83dd7f0fc0beefd990cfb","178eb09b2a7dfa50e1e6aa582b54b0c3f4c89e177b500a2b10b14e8a78ab8538","a6d6c7b98a775f11b263a1f80efa1b4f2a693790500189ea05fdce3f72b23c08","85bc74c13c0bb7128941fae52e7070d615d288fa7652d6e48484c73967f00dbb","233d8969f77dc716f279ba897d6aaba2c91b2486a9bf9fc655cb0a5ee52dd38f","c43e5f6bd53348d12cadcde16d889e08a1a326399fed987eb0f0f0e3322d6042","ef0b8675075b59549af9b0be3c0769f234d4ebdedf5bf8ca311dee3bb0ab5382","09f5ea4d555f25a16b9711f99d1c149a010cc6e9f5dcaca33368283de43346cf","13ace790847b86e6a83236409d92e4d2155679a26e70425cb360b6e28c5e1ec1","9f9949b2f70b3e4eecefa260dcaf321982ad6ff4f9728904c7963d7b0600749b","2c7df7054ab49cc4c92f8618df1360d76e30f35deaf2c8f59bd41c84bb779343","a42c13db5182cc8290ec17db0