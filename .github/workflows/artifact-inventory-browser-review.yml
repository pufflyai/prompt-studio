name: Artifact inventory browser review
on:
  push:
    branches: [diagnostics/release-artifact-browser]
permissions:
  actions: read
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      REVIEW_HEAD: 9c7214e72500f9a9287026bfd14f7fb6bec999bf
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REVIEW_HEAD }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Prepare exact review inputs
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          git fetch origin main
          docker info --format '{{.ServerVersion}}'
          bunx playwright@1.60.0 install --with-deps chromium firefox
          bun run test:review --base origin/main --test scripts/ci/production-artifacts.p0.test.ts --list |
            jq -e '.testPlan' > "$RUNNER_TEMP/review-plan.json"
      - name: Run the canonical plan's browser invocations with provisioned engines
        run: |
          bun install --frozen-lockfile
          xvfb-run --auto-servernum bun -e '
            import { mkdtemp } from "node:fs/promises";
            import { join } from "node:path";
            import { tmpdir } from "node:os";
            import { executePlan } from "./scripts/ci/run-test-plan";
            import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
            import { localReviewEnvironment } from "./scripts/ci/local-review-source";

            const directory = await mkdtemp(join(tmpdir(), "pstdio-review-replay-"));
            const plan = await Bun.file(join(process.env.RUNNER_TEMP, "review-plan.json")).json();
            if (plan.digest !== "981c22356e623375133c4e5bc2b0dc03954cc4d9f490e8c8a6cf7f84418152e8")
              throw new Error("Unexpected canonical plan digest " + plan.digest);
            const runIds = plan.runs.filter((run) => ["app", "packaged-browser"].includes(run.runner)).map((run) => run.id);
            if (runIds.length !== 5) throw new Error("The review plan did not include all five browser invocations");
            console.log({planDigest: plan.digest, runIds});
            try {
              const result = await executePlan(plan, {
                root: process.cwd(),
                runIds,
                env: { ...localReviewEnvironment(directory), CI_PROFILE: "production" },
              });
              process.exitCode = result.outcome === "success" ? 0 : 1;
            } finally {
              const cleanup = await cleanupReviewCompose(directory);
              if (cleanup.some((entry) => entry.outcome !== "success")) process.exitCode = 1;
            }
          '
      - name: Preserve the exact review plan and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-9c7214e725
          path: |
            ${{ runner.temp }}/review-plan.json
            test-results/ci/planned/**/execution.json
          if-no-files-found: error
