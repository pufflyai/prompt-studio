name: Diagnose retained Intel desktop

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: darwin-x64
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: Download signed diagnostic application
        uses: actions/download-artifact@v4
        with:
          name: signed-diagnostic-app-darwin-x64
          run-id: 34169358696
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-desktop
      - name: Extract signed application
        run: >-
          ditto -x -k "${{ runner.temp }}/signed-desktop/signed-diagnostic-app.zip"
          "clients/desktop/out/Prompt Studio-darwin-x64"
      - name: Verify retained signature and notarization
        run: |
          APP_PATH="clients/desktop/out/Prompt Studio-darwin-x64/Prompt Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
      - name: Build fixture SDK
        run: bun run --cwd packages/sdk build
      - name: Profile packaged startup
        run: bun run --cwd clients/desktop test:packaged --grep 'profiles packaged startup'
      - name: Retain startup profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-startup-cpu-darwin-x64
          path: clients/desktop/test-results
          retention-days: 7
      - name: Smoke packaged application without profilers
        if: always() && !cancelled()
        run: bun run --cwd clients/desktop test:packaged --grep-invert 'profiles packaged startup'
      - name: Retain unprofiled readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-readiness-darwin-x64
          path: clients/desktop/test-results
          retention-days: 7
