name: Build desktop release

# Builds, signs and verifies the desktop apps of a release candidate and uploads them as
# artifacts. Release Packages publishes them only after every release check passed.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        description: Release tag, which must point at ref
        required: true
        type: string
      ref:
        description: Commit to build
        required: true
        type: string
      original_source_sha:
        description: Source commit before generated version changes
        required: false
        type: string
      targets:
        description: JSON list of native targets to build. Nightlies skip Windows and Intel macOS.
        required: false
        type: string
        default: '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]'
      extension_ref:
        description: Git revision packaged apps install core extensions from (defaults to the tag)
        required: false
        type: string
    secrets:
      MACOS_CERTIFICATE:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.targets.outputs.include }}
    steps:
      - name: Select native targets
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
        # Hosted Intel runners are slow and costly. They run only the packaged tests
        # that prove the x64 build starts, serves, and runs terminals and pages.
        run: |
          set -euo pipefail
          ALL='[
            {"target":"darwin-arm64","platform":"darwin","arch":"arm64","os":"macos-15"},
            {"target":"darwin-x64","platform":"darwin","arch":"x64","os":"macos-15-intel","essential_only":true},
            {"target":"linux-x64","platform":"linux","arch":"x64","os":"ubuntu-latest"},
            {"target":"win32-x64","platform":"win32","arch":"x64","os":"windows-2025"}
          ]'
          INCLUDE=$(jq -cn --argjson all "$ALL" --argjson targets "$TARGETS" \
            '$all | map(select(.target as $target | $targets | index($target)))')
          if [ "$(jq length <<< "$INCLUDE")" != "$(jq length <<< "$TARGETS")" ]; then
            echo "Unknown desktop release target in $TARGETS" >&2
            exit 1
          fi
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  native:
    name: ${{ matrix.target }}
    needs: targets
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Packaged apps install default extensions from this ref. A nightly uses its main commit,
      # because older nightly tags are deleted.
      PSTDIO_EXTENSION_RELEASE_REF: ${{ inputs.extension_ref || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Isolate hosted Intel runner indexing
        if: matrix.target == 'darwin-x64'
        # Temporary hosted-runner workaround; see ADR 0032.
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Test device performance lifecycle and file authorization
        run: bun test clients/desktop/src/performance

      - name: Test native DMG attachment cleanup
        if: matrix.platform == 'darwin'
        run: bun scripts/ci/run-priority-tests.ts p1 --scope @pstdio/desktop --runner bun --prebuilt

      - name: Run registered native Bun quarantine once
        if: matrix.platform == 'darwin'
        continue-on-error: true
        run: bun scripts/ci/run-quarantined-tests.ts bun --scope @pstdio/desktop --prebuilt

      - name: Require native quarantine execution evidence
        if: matrix.platform == 'darwin' && !cancelled()
        run: bun scripts/ci/verify-quarantine-reports.ts bun --scope @pstdio/desktop

      - name: Verify release version
        env:
          DESKTOP_RELEASE_VERSION: ${{ inputs.version }}
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          bun -e 'const desktop = await Bun.file("clients/desktop/package.json").json();
          const runtime = await Bun.file("packages/pstdio/package.json").json();
          if (desktop.version !== process.env.DESKTOP_RELEASE_VERSION || runtime.version !== desktop.version ||
          process.env.DESKTOP_RELEASE_TAG !== "pstdio@" + desktop.version) throw new Error("Desktop release version drift");'

      - name: Import macOS signing credentials
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          CERTIFICATE_PATH: ${{ runner.temp }}/pstdio-desktop.p12
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_CONTENT"
          bun -e 'await Bun.write(process.env.CERTIFICATE_PATH, Buffer.from(process.env.MACOS_CERTIFICATE, "base64")); await Bun.write(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_CONTENT, "base64"));'
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Set up Azure Artifact Signing
        if: matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-signing
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_SIGNING_PROFILE }}

      - name: Build signed macOS distributions
        if: matrix.platform == 'darwin'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Build signed Windows distributions
        if: matrix.platform == 'win32'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Build Linux distributions
        if: matrix.platform == 'linux'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Configure Linux Chromium sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="clients/desktop/out/prompt-studio-linux-${{ matrix.arch }}/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G %a' "$sandbox_path")" = "root:root 4755"

      - name: Verify Electron fuse policy
        run: bun run --cwd clients/desktop verify:fuses

      - name: Set up Windows desktop tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-desktop-tests

      - name: Configure the source Electron sandbox
        if: matrix.platform == 'linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      # Deep functional checks and budgets run in production validation, independently
      # of nightly publication. Preserve the exact app before any packaged launch.
      - name: Archive the immutable app for production validation
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.original_source_sha || inputs.ref }}
          VERSION_SHA: ${{ inputs.ref }}
        run: |
          bun -e 'await Bun.write("production-build-identity.json", JSON.stringify({ sourceSha: process.env.SOURCE_SHA, versionSha: process.env.VERSION_SHA, toolchain: "bun-" + Bun.version }))'
          tar -czf "validation-app-${{ matrix.target }}.tar.gz" -C clients/desktop out
          bun scripts/ci/production-payload.ts record "validation-app-${{ matrix.target }}.tar.gz"

      - name: Share the immutable app with production validation
        uses: actions/upload-artifact@v4
        with:
          name: validation-app-${{ matrix.target }}
          path: |
            validation-app-${{ matrix.target }}.tar.gz
            production-build-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'darwin' && !cancelled() && success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="clients/desktop/out/Prompt Studio-darwin-${{ matrix.arch }}/Prompt Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Resources/bin/pstdio"
          bun clients/desktop/scripts/run-stapler.ts validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify Windows signatures and update payload
        if: matrix.platform == 'win32' && !cancelled() && success()
        run: bun clients/desktop/scripts/verify-windows-signatures.ts

      - name: Verify installed Windows command
        if: matrix.platform == 'win32' && !cancelled() && success()
        run: bun clients/desktop/scripts/verify-windows-cli-install.ts

      - name: Verify Linux package
        if: matrix.platform == 'linux' && !cancelled() && success()
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find clients/desktop/out/make -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "$PWD/$DEB"
          test "$(pst --version)" = '${{ inputs.version }}'
          sudo dpkg -i "$DEB"
          test "$(pst --version)" = '${{ inputs.version }}'
          sudo apt-get purge -y prompt-studio
          test ! -L /usr/bin/pst
          sudo ln -s /bin/true /usr/bin/pst
          sudo apt-get install -y "$PWD/$DEB"
          test "$(readlink /usr/bin/pst)" = /bin/true
          sudo apt-get purge -y prompt-studio
          test "$(readlink /usr/bin/pst)" = /bin/true
          sudo rm /usr/bin/pst

      - name: Extract desktop release notes
        shell: bash
        run: bun run --cwd scripts release:notes "${{ inputs.version }}" > "${{ runner.temp }}/desktop-release-notes.md"

      - name: Prepare release artifacts
        env:
          PSTDIO_DESKTOP_PUBLISHED_AT: ${{ github.event.repository.updated_at }}
        run: >-
          bun run --cwd clients/desktop release:prepare -- --target ${{ matrix.target }}
          --notes-file "${{ runner.temp }}/desktop-release-notes.md"

      - name: Upload verified native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: clients/desktop/out/release/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Windows candidate for installation and update checks
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-candidate
          path: clients/desktop/out/make
          if-no-files-found: error
          retention-days: 14

      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'darwin'
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: security delete-keychain "$KEYCHAIN_PATH" || true
