name: Release Desktop

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing pstdio package and desktop version
        required: true
        type: string
      tag:
        description: Existing draft GitHub release tag
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            os: macos-15
          # Hosted Intel runners are slow and costly. They run only the packaged tests
          # that prove the x64 build starts, serves, and runs terminals and pages.
          - target: darwin-x64
            platform: darwin
            arch: x64
            os: macos-15-intel
            essential_only: true
          - target: linux-x64
            platform: linux
            arch: x64
            os: ubuntu-latest
          - target: win32-x64
            platform: win32
            arch: x64
            os: windows-2025
    uses: ./.github/workflows/release-desktop-native.yml
    with:
      version: ${{ inputs.version }}
      tag: ${{ inputs.tag }}
      target: ${{ matrix.target }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      essential_only: ${{ matrix.essential_only || false }}
    secrets: inherit

  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-release

      - name: Verify and flatten release set
        shell: bash
        run: |
          set -euo pipefail
          bun clients/desktop/scripts/verify-release-set.ts desktop-release
          mkdir desktop-publish
          find desktop-release -type f -exec cp '{}' desktop-publish/ \;
          cd desktop-publish
          for checksums in checksums-*.sha256; do sha256sum -c "$checksums"; done
          cat checksums-*.sha256 | sort > "checksums-desktop-${{ inputs.version }}.sha256"

      - name: Publish desktop release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view '${{ inputs.tag }}' --json isDraft -q .isDraft)" = "true"
          gh release upload "${{ inputs.tag }}" desktop-publish/* --clobber
          gh release edit "${{ inputs.tag }}" --draft=false
