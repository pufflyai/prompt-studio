name: Release Desktop

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing pstdio package and desktop version
        required: true
        type: string
      tag:
        description: Existing draft GitHub release tag
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows desktop distribution remains deferred until its signing lane is ready.
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            os: macos-15
          # Hosted Intel runners are slow and costly. They run only the packaged tests
          # that prove the x64 build starts, serves, and runs terminals and pages.
          - target: darwin-x64
            platform: darwin
            arch: x64
            os: macos-15-intel
            essential_only: true
          - target: linux-x64
            platform: linux
            arch: x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Isolate hosted Intel runner indexing
        if: matrix.target == 'darwin-x64'
        # Temporary hosted-runner workaround; see ADR 0032.
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Verify release version
        env:
          DESKTOP_RELEASE_VERSION: ${{ inputs.version }}
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          bun -e 'const desktop = await Bun.file("clients/desktop/package.json").json();
          const runtime = await Bun.file("packages/pstdio/package.json").json();
          if (desktop.version !== process.env.DESKTOP_RELEASE_VERSION || runtime.version !== desktop.version ||
          process.env.DESKTOP_RELEASE_TAG !== `pstdio@${desktop.version}`) throw new Error("Desktop release version drift");'

      - name: Import macOS signing credentials
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          CERTIFICATE_PATH: ${{ runner.temp }}/pstdio-desktop.p12
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_CONTENT"
          bun -e 'await Bun.write(process.env.CERTIFICATE_PATH, Buffer.from(process.env.MACOS_CERTIFICATE, "base64")); await Bun.write(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_CONTENT, "base64"));'
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Set up Azure Artifact Signing
        if: matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-signing
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_SIGNING_PROFILE }}

      - name: Build signed macOS distributions
        if: matrix.platform == 'darwin'
        env:
          DEBUG: electron-notarize*
          PSTDIO_DESKTOP_RELEASE: "1"
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Build signed Windows distributions
        if: matrix.platform == 'win32'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Build Linux distributions
        if: matrix.platform == 'linux'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ matrix.arch }}

      - name: Configure Linux Chromium sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="clients/desktop/out/prompt-studio-linux-${{ matrix.arch }}/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G %a' "$sandbox_path")" = "root:root 4755"

      - name: Verify Electron fuse policy
        run: bun run --cwd clients/desktop verify:fuses

      - name: Set up Windows desktop tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-desktop-tests

      - name: Configure the source Electron sandbox
        if: matrix.platform == 'linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      # The source suite reuses the desktop build from packaging.
      - name: Test source Electron
        if: matrix.platform != 'linux' && !matrix.essential_only
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.config.ts

      - name: Test source Electron on Linux
        if: matrix.platform == 'linux'
        working-directory: clients/desktop
        run: xvfb-run -a bunx playwright test --config playwright.config.ts

      - name: Smoke packaged application
        if: matrix.platform != 'linux'
        env:
          DEBUG: pw:api,pw:browser
        run: bun run --cwd clients/desktop test:packaged ${{ matrix.essential_only && '--grep @essential' || '' }}

      - name: Smoke packaged Linux application
        if: matrix.platform == 'linux'
        env:
          DEBUG: pw:api,pw:browser
        run: xvfb-run -a bun run --cwd clients/desktop test:packaged

      - name: Upload packaged release-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ matrix.target }}
          path: clients/desktop/test-results
          if-no-files-found: error
          retention-days: 14

      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="clients/desktop/out/Prompt Studio-darwin-${{ matrix.arch }}/Prompt Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Resources/bin/pstdio"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify Windows signatures and update payload
        if: matrix.platform == 'win32'
        run: bun clients/desktop/scripts/verify-windows-signatures.ts

      - name: Verify Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find clients/desktop/out/make -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"

      - name: Extract desktop release notes
        shell: bash
        run: bun run --cwd scripts release:changelog -- pstdio "${{ inputs.version }}" > "${{ runner.temp }}/desktop-release-notes.md"

      - name: Prepare release artifacts
        env:
          PSTDIO_DESKTOP_PUBLISHED_AT: ${{ github.event.repository.updated_at }}
        run: >-
          bun run --cwd clients/desktop release:prepare -- --target ${{ matrix.target }}
          --notes-file "${{ runner.temp }}/desktop-release-notes.md"

      - name: Upload verified native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: clients/desktop/out/release/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'darwin'
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-release

      - name: Verify and flatten release set
        shell: bash
        run: |
          set -euo pipefail
          bun clients/desktop/scripts/verify-release-set.ts desktop-release
          mkdir desktop-publish
          find desktop-release -type f -exec cp '{}' desktop-publish/ \;
          cd desktop-publish
          for checksums in checksums-*.sha256; do sha256sum -c "$checksums"; done
          cat checksums-*.sha256 | sort > "checksums-desktop-${{ inputs.version }}.sha256"

      - name: Publish desktop release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view '${{ inputs.tag }}' --json isDraft -q .isDraft)" = "true"
          gh release upload "${{ inputs.tag }}" desktop-publish/* --clobber
          gh release edit "${{ inputs.tag }}" --draft=false
