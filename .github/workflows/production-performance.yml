name: Production performance
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      channel:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    uses: ./.github/workflows/production-desktop.yml
    with:
      ref: ${{ inputs.ref }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}
      artifact_attempt: ${{ inputs.artifact_attempt }}
      kind: performance
  workloads:
    name: P3 ${{ matrix.family }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { family: backend, os: ubuntu-24.04 }
          - { family: backend, os: macos-15 }
          - { family: backend, os: windows-2025 }
          - { family: browser, os: ubuntu-24.04 }
          - { family: relay, os: ubuntu-24.04 }
          - { family: navigation, os: ubuntu-24.04 }
          - { family: planner, os: ubuntu-24.04 }
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION_SHA: ${{ inputs.ref }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
      PLAYWRIGHT_TRACE: "off"
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install native dependencies
        run: node scripts/ci/install-native-dependencies.ts
      - name: Download the immutable compiled candidate
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ inputs.artifact_attempt }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Restore immutable compiled candidate
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Install browser engines
        if: matrix.family == 'browser' || matrix.family == 'navigation' || matrix.family == 'planner'
        run: bunx playwright@1.60.0 install --with-deps
      - name: Collect every fixed workload with existing budgets
        run: bun scripts/ci/production-performance.ts ${{ matrix.family }}
      - name: Attest actual consumer inputs and outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          CHECK: performance-${{ matrix.family }}-${{ matrix.os }}
        shell: bash
        run: bun scripts/ci/production-evidence.ts --check "$CHECK" --outcome "$OUTCOME"
      - name: Preserve consumer attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ matrix.family }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: production-evidence
          if-no-files-found: error
      - name: Preserve all measurements and machine metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-${{ matrix.family }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/production-performance
            packages/e2e/test-results
            packages/e2e/playwright-report
            packages/ui/test-results
            packages/ui/playwright-report
            __test-tmp__/subnav-benchmark/results
          if-no-files-found: warn
