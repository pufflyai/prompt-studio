name: Production performance
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      candidate_artifact_id:
        required: true
        type: string
      candidate_artifact_run_id:
        description: Run that produced the candidate manifest
        type: string
      channel:
        required: true
        type: string
      desktop_platforms:
        required: true
        type: string
      workloads:
        description: JSON family and runner rows for the release channel, from scripts/ci/production-platforms.ts
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact candidate version commit
        required: true
        type: string
      source_sha:
        description: Original source commit
        required: true
        type: string
      artifact_run_id:
        description: Release run that built the measured artifacts
        required: true
        type: string
      artifact_attempt:
        required: true
        default: "1"
        type: string
      candidate_artifact_id:
        description: Immutable production candidate identity artifact
        required: true
        type: string
      candidate_artifact_run_id:
        description: Run that produced the candidate manifest, distinct from the compiled payload producer
        required: true
        type: string
      channel:
        type: choice
        options: [stable, nightly]
        default: stable
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop_platforms: ${{ inputs.desktop_platforms || steps.platforms.outputs.benchmark_desktop_matrix }}
      workloads: ${{ inputs.workloads || steps.platforms.outputs.performance_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Select the maintained performance matrix
        id: platforms
        env:
          CHANNEL: ${{ inputs.channel }}
        run: bun scripts/ci/production-platforms.ts
  desktop:
    needs: plan
    uses: ./.github/workflows/production-desktop.yml
    with:
      ref: ${{ inputs.ref }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      channel: ${{ inputs.channel }}
      source_sha: ${{ inputs.source_sha }}
      artifact_attempt: ${{ inputs.artifact_attempt }}
      candidate_artifact_id: ${{ inputs.candidate_artifact_id }}
      candidate_artifact_run_id: ${{ inputs.candidate_artifact_run_id || github.run_id }}
      kind: performance
      platforms: ${{ needs.plan.outputs.desktop_platforms }}
  workloads:
    needs: plan
    name: P3 ${{ matrix.family }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.workloads) }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION_SHA: ${{ inputs.ref }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
      PLAYWRIGHT_TRACE: "off"
      E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/${{ matrix.platform_pkg }}/bin/${{ matrix.platform == 'win32' && 'pstdio.exe' || 'pstdio' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # Keep the installer matched to this workflow when validating an older candidate.
      - name: Check out the workflow's native installer
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: __test-tmp__/native-installer
          sparse-checkout: |
            /scripts/ci/install-native-dependencies.ts
            /scripts/ci/native-dependency-environment.ts
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      # The checkout above can be an older candidate, so use this workflow's own download action.
      - name: Check out the workflow's artifact download action
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: __test-tmp__/workflow-actions
          persist-credentials: false
          # Leave the action's test out of the workspace so test discovery never finds it.
          sparse-checkout: |
            /.github/actions/download-artifact-by-id/
            !/.github/actions/download-artifact-by-id/*.test.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: "[phase:install] Install native dependencies"
        run: bun __test-tmp__/native-installer/scripts/ci/install-native-dependencies.ts
      - name: "[phase:report-transfer] Download the immutable compiled candidate"
        uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ inputs.artifact_attempt }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Restore immutable compiled candidate
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf release-build.tar.gz
      - name: Install browser engines
        if: matrix.family == 'planner'
        # PS-1232: native Windows browser installation exceeded 3 min before measurements.
        # The user authorized setup allowances on 2026-11-17; keep product limits unchanged.
        timeout-minutes: ${{ matrix.os == 'windows-2025' && 8 || 3 }}
        run: bunx playwright@1.60.0 install --with-deps
      - name: "[phase:test] Collect every fixed workload with existing budgets"
        run: bun scripts/test.ts --performance-family ${{ matrix.family }} --prebuilt
      - name: Download the immutable candidate identity
        uses: ./__test-tmp__/workflow-actions/.github/actions/download-artifact-by-id
        if: always()
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          run-id: ${{ inputs.candidate_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Attest actual consumer inputs and outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          CHECK: performance-${{ matrix.family }}-${{ matrix.os }}
        shell: bash
        run: bun scripts/ci/production-evidence.ts --check "$CHECK" --outcome "$OUTCOME"
      - name: "[phase:report-transfer] Preserve consumer attestation"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ matrix.family }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: production-evidence
          if-no-files-found: error
      - name: "[phase:report-transfer] Preserve all measurements and machine metadata"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-${{ matrix.family }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci/planned
            !test-results/ci/planned/**/extension-fixtures-*/**
            test-results/production-performance
            test-results/quarantine/workbench-benchmark
            test-results/quarantine/subnav-benchmark
            packages/e2e/test-results
            packages/e2e/playwright-report
            packages/ui/test-results
            packages/ui/playwright-report
            __test-tmp__/subnav-benchmark/results
          if-no-files-found: warn
