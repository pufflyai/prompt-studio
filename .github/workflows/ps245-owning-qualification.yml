name: PS245 Linux HTTP1 current candidate and main
on:
  push:
    branches: [test/ps245-http1-current-head-20261118]
permissions:
  contents: read
env:
  NX_DAEMON: "false"
jobs:
  owning:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [candidate, main]
    env:
      GH_TOKEN: ${{ github.token }}
      UI_PERF_ASSERT_BUDGETS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.side == 'candidate' && 'aa61db9847a687214128271d87a69a79c5e1a08a' || 'd624df9a39277e48be8d881d69fad84434e0073c' }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up pinned Bun in the Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Bind exact clean candidate
        run: |
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree}
      - name: Run complete existing mixed-resource HTTP/1.1 owning file
        run: bun scripts/test.ts --file packages/e2e/src/ui/resource-stream-budget.p1.spec.ts --out test-results/ci/owning-plan.json
      - name: Retain exact owning outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps245-${{ matrix.side }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: error
