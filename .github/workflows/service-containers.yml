name: Service containers

on:
  pull_request:
    paths: ["services/**", "infra/**", "packages/pstdio-sync/**", "packages/pstdio-sync-contracts/**", "bun.lock", "package.json", ".dockerignore", ".github/workflows/service-containers.yml", ".github/workflows/release-packages.yml"]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [relay, account-manager]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.version || github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.service }}/Dockerfile
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: service-container-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: Plan an empty validation workspace without cloud access
        env:
          DIGITALOCEAN_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SPACES_ACCESS_KEY_ID: validation-only
          SPACES_SECRET_ACCESS_KEY: validation-only
        run: terraform -chdir=infra/terraform plan -refresh=false -input=false -var-file=validation.tfvars
  portable_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun test infra/container-entrypoint.test.ts
      - run: bun infra/relay/smoke-portable.ts
