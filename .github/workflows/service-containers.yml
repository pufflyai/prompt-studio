name: Service containers

on:
  pull_request:
    paths: ["services/**", "infra/**", "packages/pstdio-sync/**", "packages/pstdio-sync-contracts/**", "packages/e2e/src/packaged/registry-*.fixture.ts", "packages/e2e/src/packaged/packaged-independent-extensions*", "bun.lock", "package.json", ".dockerignore", ".github/workflows/service-containers.yml", ".github/workflows/release-packages.yml"]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psx_delivery:
    # Temporary: Playwright's Chromium does not install on Ubuntu 26.04 yet (ADR 0105).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd services/psx test:isolated
      - run: docker build -f infra/psx/Dockerfile -t pstdio-psx-smoke .
      - name: Build the packaged host for the delivery smoke
        env:
          PSTDIO_BUILD_PLATFORM_PKG: cli-linux-x64
        run: bun run --cwd scripts build:all
      - name: Check reproducible archives and upgrade an independently published extension
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio
          PSTDIO_PSX_REAL_SERVICE: "1"
          PSTDIO_PSX_TEST_IMAGE: pstdio-psx-smoke
        run: bun run --cwd packages/e2e test:packaged:cli -- --test-name-pattern "independently published|identical archives across time"
      - name: Provision Chromium for the UI delivery smoke
        run: packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio extensions install-browser
      - name: Upgrade through Settings
        env:
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio
          PSTDIO_PSX_REAL_SERVICE: "1"
          PSTDIO_PSX_TEST_IMAGE: pstdio-psx-smoke
        run: bun run --cwd packages/e2e test:packaged:browser -- packaged-independent-extensions.spec.ts
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [relay, account-manager, psx]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.version || github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.service }}/Dockerfile
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: service-container-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform/validation init -input=false
      - run: terraform -chdir=infra/terraform/validation validate
      - name: Plan the module with synthetic inputs and no cloud access
        env:
          DIGITALOCEAN_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SPACES_ACCESS_KEY_ID: validation-only
          SPACES_SECRET_ACCESS_KEY: validation-only
        run: terraform -chdir=infra/terraform/validation plan -refresh=false -input=false
  portable_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun test infra/container-entrypoint.test.ts
      - run: bun infra/relay/smoke-portable.ts
