name: PS-1270 exact source CLI review

on:
  push:
    branches:
      - chore/ps1270-2439-source-cli-3c5dcd16-receipt

permissions:
  actions: read
  contents: read

jobs:
  source_cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PS1270_HEAD: 3c5dcd1683162b3518898f04f43dc2f4dd0506c4
      PS1270_TREE: e38ffe04ca472b41504d5f68ee585f10172cf3de
      PS1270_BASE: e00cf5aa8e2a68aa7275fe3013a059c799d733f1
      PS1270_POLICY: 536f6bd3250ec53ca8db7d9c965133c0ad34c253ff46ca32ff1965c5a9ad7e44
      PS1270_EXPECTED_PLAN: 08c2d1eead74b3f1030888a334143cc63a7f668377cb4455de234d464b636e5f
      PS1270_CLI_GROUP: 72480638f874d13d0838a290
      PS1270_CLI_FILES_SHA256: 58d8a6b1f28c46136461a9d26acb7a8700f52cf27fdc5841e7117801d9420c7a
      PS1270_OUTPUT: test-results/ps1270-2439-source-cli
      PS1270_ORDINARY_RUN: "45528845229"
      PS1270_ORDINARY_SOURCE: 4e6da29acd3cca9a4426e467beda76bdbddd8890
      PS1270_ORDINARY_PLAN: f843fb146fa12ab025ca51b8a4b7e0b54bc36f63ce9fa5e0d0f97a3ab43ee4d0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PS1270_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify the source and sealed Linux plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/ps1270-2439-source-cli-3c5dcd16-receipt
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git show -s --format=%P "$GITHUB_WORKFLOW_SHA")" = "$PS1270_HEAD"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_WORKFLOW_SHA")" =             "$(printf 'A\t.github/workflows/ps1270-2439-source-cli-3c5dcd16-receipt.yml')"
          test "$(git rev-parse HEAD)" = "$PS1270_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PS1270_TREE"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main             refs/heads/bugfix/text-listener-replacement-snapshot:refs/remotes/origin/bugfix/text-listener-replacement-snapshot
          test "$(git rev-parse origin/bugfix/text-listener-replacement-snapshot)" = "$PS1270_HEAD"
          main="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$main")" = "$PS1270_BASE"
          incoming="$(git rev-list --count "HEAD..$main")"
          test "$incoming" -le 10
          prospective="$(git merge-tree --write-tree --no-messages HEAD "$main")"
          test "$(git cat-file -t "$prospective")" = tree
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = "1.4.4"
          test "$(node --version)" = "v26.7.0"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          mkdir -p "$PS1270_OUTPUT"
          bun run test:review --base "$PS1270_BASE" --list --test packages/e2e/src/ui/resource-stream-budget.p1.spec.ts > "$PS1270_OUTPUT/selected-plan.json"
          jq -e --arg sha "$PS1270_HEAD" --arg tree "$PS1270_TREE" --arg base "$PS1270_BASE"             --arg policy "$PS1270_POLICY" --arg digest "$PS1270_EXPECTED_PLAN" --arg group "$PS1270_CLI_GROUP" '
              .head == $sha and .mergeBase == $base and .testPlan.digest == $digest
              and .testPlan.source == {sha:$sha,tree:$tree,policy:$policy,dirty:false}
              and any(.selected[]; .file == "packages/pstdio-api/src/services/text-editing/member-lifecycle.p0.test.ts")
              and any(.selected[]; .file == "packages/e2e/src/ui/resource-stream-budget.p1.spec.ts")
              and (.testPlan.runs | length) == 77 and (.selected | length) == 2646
              and all(.testPlan.runs[]; .target == {platform:"linux",arch:"x64"})
              and ([.testPlan.runs[] | select(.job == "local-additions" and .runner == "cli") | .id] == [$group])
              and any(.testPlan.runs[]; .id == $group and .owner == "e2e" and .cwd == "packages/e2e"
                and .runner == "cli" and .priority == "P1" and .lane == "stable" and .artifact == "source"
                and .requires == ["build-e5b1f54fca1c52cd"] and (.files | length) == 10)
              and any(.testPlan.setup[]; .id == "build-e5b1f54fca1c52cd" and .owners == ["e2e"]
                and .kind == "build" and .requires == [])
            ' "$PS1270_OUTPUT/selected-plan.json"
          bun -e '
            import { validateTestPlan } from "./scripts/ci/test-plan";
            const { testPlan } = await Bun.file(process.env.PS1270_OUTPUT + "/selected-plan.json").json();
            validateTestPlan(testPlan);
          '
          sealed_digest="$(jq -er '.testPlan.digest' "$PS1270_OUTPUT/selected-plan.json")"
          echo "PS1270_PLAN=$sealed_digest" >> "$GITHUB_ENV"
          jq -c --arg group "$PS1270_CLI_GROUP" '.testPlan.runs[] | select(.id == $group) | .files'             "$PS1270_OUTPUT/selected-plan.json" > "$PS1270_OUTPUT/assigned-files.json"
          printf '%s  %s\n' "$PS1270_CLI_FILES_SHA256" "$PS1270_OUTPUT/assigned-files.json" | sha256sum -c -
          jq -n --arg sha "$PS1270_HEAD" --arg tree "$PS1270_TREE" --arg main "$main" --arg base "$PS1270_BASE"             --arg prospective "$prospective" --arg plan "$sealed_digest" --arg workflow "$GITHUB_WORKFLOW_SHA"             --argjson incoming "$incoming" --arg ordinary "$PS1270_ORDINARY_RUN"             --arg ordinarySource "$PS1270_ORDINARY_SOURCE"             '{sha:$sha,tree:$tree,main:$main,mergeBase:$base,mergeTree:$prospective,incoming:$incoming,
              planDigest:$plan,diagnosticCommit:$workflow,ordinaryCiRun:$ordinary,ordinaryCiSha:$ordinarySource}'             > "$PS1270_OUTPUT/identity.json"

      - name: Read the sealed required CI plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan-attempt-1
          path: ${{ env.PS1270_OUTPUT }}/ordinary-ci
          run-id: ${{ env.PS1270_ORDINARY_RUN }}
          github-token: ${{ github.token }}

      - name: Verify the CLI files are outside the required CI plan
        shell: bash
        run: |
          bun -e '
            import { validateTestPlan } from "./scripts/ci/test-plan";
            const { PS1270_OUTPUT: output, PS1270_ORDINARY_PLAN: digest, PS1270_ORDINARY_SOURCE: sha,
              PS1270_TREE: tree, PS1270_POLICY: policy } = process.env;
            const normal = await Bun.file(output + "/ordinary-ci/plan.json").json();
            const cli = await Bun.file(output + "/assigned-files.json").json();
            validateTestPlan(normal);
            if (normal.digest !== digest || normal.source.sha !== sha || normal.source.tree !== tree ||
                normal.source.policy !== policy || normal.source.dirty || normal.runs.length !== 75)
              throw new Error("The ordinary CI selection does not match the sealed candidate");
            const normalFiles = new Set(normal.runs.flatMap(run => run.files));
            if (cli.some(file => normalFiles.has(file)))
              throw new Error("The supplemental source CLI assignment overlaps required CI");
          '

      - name: Open an owned private temporary directory
        shell: bash
        run: |
          scratch="$(mktemp -d /tmp/ps1270.XXXXXX)"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$scratch/owner"
          {
            echo "PS1270_CLI_TMP=$scratch"
            echo "TMPDIR=$scratch"
            echo "TMP=$scratch"
            echo "TEMP=$scratch"
            echo "PS1270_NATIVE_BUN=$(command -v bun)"
          } >> "$GITHUB_ENV"
          { node --version; bun --version; docker version; df -h /tmp "$GITHUB_WORKSPACE"; }             > "$PS1270_OUTPUT/toolchain.log"

      - name: Install locked dependencies and prepare Firefox
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens
          (cd packages/e2e && bun x --no-install playwright install --with-deps firefox) 2>&1             | tee "$PS1270_OUTPUT/browser-setup.log"
          test -z "$(git status --porcelain)"

      - name: Execute only the ten-file source CLI group
        shell: bash
        run: |
          test "$(command -v bun)" = "$PS1270_NATIVE_BUN"
          bun --no-orphans - <<'BUN' 2>&1 | tee "$PS1270_OUTPUT/console.log"
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const { PS1270_CLI_TMP: scratch, PS1270_OUTPUT: relative, PS1270_CLI_GROUP: group } = process.env;
          if (!scratch || !/^\/tmp\/ps1270\.[A-Za-z0-9]{6}$/.test(scratch) || !relative || !group)
            throw new Error("Unexpected native review assignment");
          const executionId = process.env.GITHUB_RUN_ID + "/" + process.env.GITHUB_RUN_ATTEMPT;
          const output = resolve(root, relative);
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = relative + "/native";
          const { testPlan } = await Bun.file(resolve(output, "selected-plan.json")).json();
          let passed = false;
          try {
            const result = await executePlan(testPlan, {
              root, runIds: [group], prebuilt: false, executionId,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every(entry => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify exact native execution and file coverage
        shell: bash
        run: |
          jq -e --arg group "$PS1270_CLI_GROUP" --arg digest "$PS1270_PLAN"             --slurpfile expected "$PS1270_OUTPUT/assigned-files.json"             --slurpfile sealed "$PS1270_OUTPUT/selected-plan.json" '
              .source == $sealed[0].testPlan.source and .planDigest == $digest
              and .complete and .outcome == "success" and .errors == [] and .runIds == [$group]
              and (.results | length) == 1
              and all(.results[]; .runId == $group and .complete and .outcome == "success"
                and .exitCode == 0 and .nativeFailure != true and (.reportedFiles | sort) == ($expected[0] | sort))
              and [.phases[] | select(.kind == "build") | [.id,.outcome]] == [["build-e5b1f54fca1c52cd","success"]]
              and any(.phases[]; .kind == "cleanup" and .outcome == "success")
            ' "$PS1270_OUTPUT/native/execution.json"
          jq -e --arg execution "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --arg group "$PS1270_CLI_GROUP" \
            --arg digest "$PS1270_PLAN" --arg sha "$PS1270_HEAD" \
            --slurpfile expected "$PS1270_OUTPUT/assigned-files.json" '
              .executionId == $execution and .runId == $group and .planDigest == $digest
              and .sourceSha == $sha and .platform == "linux" and .arch == "x64"
              and .complete and .exitCode == 0 and .unreportedSelectedCases == 0 and .reportError == null
              and (.executedFiles | sort) == ($expected[0] | sort)
              and (.cases | length) == .executedCases and all(.cases[]; .outcome == "success")
            ' "$PS1270_OUTPUT/native/$PS1270_CLI_GROUP/cases.json"
          jq -e 'all(.[]; .outcome == "success")' "$PS1270_OUTPUT/compose-cleanup.json"
          git diff --exit-code

      - name: Retain and clean this invocation's temporary files
        if: always()
        shell: bash
        run: |
          mkdir -p "$PS1270_OUTPUT"
          if [[ -n "${PS1270_CLI_TMP:-}" ]]; then
            [[ "$PS1270_CLI_TMP" =~ ^/tmp/ps1270\.[A-Za-z0-9]{6}$ ]]
            test "$(cat "$PS1270_CLI_TMP/owner")" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if [[ -f "$PS1270_CLI_TMP/compose-projects.jsonl" ]]; then
              cp "$PS1270_CLI_TMP/compose-projects.jsonl" "$PS1270_OUTPUT/"
            fi
            rm -rf -- "$PS1270_CLI_TMP"
            test ! -e "$PS1270_CLI_TMP"
            printf '%s\n' 'Owned temporary directory removed' > "$PS1270_OUTPUT/scratch-cleanup.txt"
          fi

      - name: Upload the fixture and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1270-2439-source-cli-3c5dcd16-receipt-attempt-${{ github.run_attempt }}
          path: ${{ env.PS1270_OUTPUT }}
          if-no-files-found: error
