name: App Platform Preview
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy preview app
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
        with:
          deploy_pr_preview: "true"
          project_id: ee16f77b-a747-4eb7-af56-a21c8832f1ac
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Optional: drop the live URL into the PR conversation
      - uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview deployed: **${{ fromJson(steps.deploy.outputs.app).live_url }}**`
            })
