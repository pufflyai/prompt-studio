name: Desktop Native Baseline
on:
  push:
    branches: [feature/ps-3-native-desktop-support]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: node scripts/ci/install-native-dependencies.ts
      - run: bun test clients/desktop/src/testing/remove-packaged-directory.test.ts clients/desktop/src/testing/stop-packaged-runtime.test.ts clients/desktop/src/testing/stop-packaged-process.test.ts clients/desktop/src/runtime/runtime-process.test.ts
      - run: bun run --cwd clients/desktop package
      - run: bun run --cwd clients/desktop verify:fuses
      - name: Check compiled extension dependency loading
        shell: pwsh
        run: |
          $env:E2E_PACKAGED_BINARY_PATH = Join-Path $PWD "clients/desktop/.sidecar/bin/pstdio.exe"
          bun test packages/e2e/src/packaged/packaged-serve-smoke.test.ts --test-name-pattern "linked package directories|missing extension dependency|on-disk node_modules"
      - name: Install Windows process suspension test tool
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "pstools"
          $archive = Join-Path $env:RUNNER_TEMP "PSTools.zip"
          Invoke-WebRequest https://download.sysinternals.com/files/PSTools.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $tools
          $signature = Get-AuthenticodeSignature (Join-Path $tools "pssuspend64.exe")
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "CN=Microsoft Corporation,") { throw "PsSuspend must have a valid Microsoft signature" }
          $tools >> $env:GITHUB_PATH
      - run: bun run --cwd clients/desktop test:packaged
      - if: always()
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-readiness-win32-x64
          path: clients/desktop/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-development-win32-x64
          path: clients/desktop/out/Prompt Studio-win32-x64
          retention-days: 7
