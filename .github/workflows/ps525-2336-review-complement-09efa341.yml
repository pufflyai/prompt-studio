name: PS-525 exact selected review complement

on:
  push:
    branches:
      - chore/ps525-2336-review-09efa341-complement

permissions:
  actions: read
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 09efa341a81787b9086b5472c447a2ab4b78efe1
      CANDIDATE_TREE: 62e5d98311ce7a6b129dc84f3cc300b682aa2a08
      CANDIDATE_MERGE_BASE: 8ea58e189148883398004721402b181ab089a89a
      SOURCE_POLICY: 0919c441a350ecbfcce669094d433f8f02a2b3f45c4d0571f798af77d9b341da
      PLAN_DIGEST: 6e2fbd72d05091c0a47ecd007b84c7fa13b2268a184f5d11ec33a63139c65ca4
      CANDIDATE_REF: refs/remotes/origin/workspace/WS-446-bbc1220d-862b-4752-8112-a6f779889ca6
      ORDERED_RECORD_STREAM_TEST: packages/pstdio-db/src/services/extension-storage/ordered-record-stream.p1.test.ts
      CONCURRENT_EXTENSION_TEST: packages/e2e/src/packaged/packaged-concurrent-extension-smoke.p2.test.ts
      ORIGINAL_RUN: "45456415726"
      ORIGINAL_EXECUTION: local-5745-1795544039055
      PLAN_DISPLAY: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Download the original exact selected review
        uses: actions/download-artifact@v4
        with:
          name: ps525-2336-review-09efa341-attempt-1
          path: test-results/ps525-2336-original
          run-id: ${{ env.ORIGINAL_RUN }}
          github-token: ${{ github.token }}

      - name: Verify source, full plan, and failed group selection
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/ps525-2336-review-09efa341-complement
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git show --no-patch --format=%P "$GITHUB_WORKFLOW_SHA")" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_REF")" = "$CANDIDATE_SHA"
          test "$(bun --version)" = "1.4.4"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          main_head="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$main_head")" = "$CANDIDATE_MERGE_BASE"
          incoming="$(git rev-list --count "$CANDIDATE_SHA..$main_head")"
          test "$incoming" -le 10
          prospective_tree="$(git merge-tree --write-tree --no-messages "$main_head" "$CANDIDATE_SHA")"
          test "$(git cat-file -t "$prospective_tree")" = tree
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_WORKFLOW_SHA")" = \
            ".github/workflows/ps525-2336-review-complement-09efa341.yml"
          test -z "$(git status --porcelain)"

          prior=test-results/ps525-2336-original
          out=test-results/ps525-2336-complement
          mkdir -p "$out"
          (
            cd "$prior/ps525-2336-review"
            sha256sum -c - <<'MANIFEST'
          41b4914c2f9179a1b9ba6242f90aa600cc15d82eb13d4a581406456d2ba41e77  identity.json
          d313f39d70136bb354b46001ae8c3c064701eaf272b9b8887aa30f769694ed37  selected-plan.json
          8026fd50592bac2dce3a6f106c1a394ffef4c2b1338c0e3d500d698f5733911e  pstdio-local-review-3FTJbX/checks.json
          e038e6e66cbd5fbda867ee1faf03140a292f49ad9a7e7b74b0f8b50a45cf4f45  pstdio-local-review-3FTJbX/test-results/ci/planned/5745-1795544039055/execution.json
          MANIFEST
          )
          jq -e --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg base "$CANDIDATE_MERGE_BASE" \
            '.head == $head and .tree == $tree and .mergeBase == $base
            and .workflowSha == "7cb4bb2d1eafd53b79e03ea509e6b19fe28caf84"' \
            "$prior/ps525-2336-review/identity.json"
          jq -e --arg head "$CANDIDATE_SHA" \
            '.head == $head and (.results | length) == 70 and all(.results[]; .outcome == "success")' \
            "$prior/ps525-2336-review/pstdio-local-review-3FTJbX/checks.json"
          bun run test:review --base origin/main \
            --test "$ORDERED_RECORD_STREAM_TEST" --test "$CONCURRENT_EXTENSION_TEST" --list > "$out/selected-plan.json"
          jq -e --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg policy "$SOURCE_POLICY" \
            --arg digest "$PLAN_DIGEST" \
            '.testPlan.digest == $digest
            and .testPlan.source == {sha:$head,tree:$tree,policy:$policy,dirty:false}
            and (.testPlan.runs | length) == 83 and (.selected | length) == 2769 and (.queueFiles | length) == 2758' \
            "$out/selected-plan.json"
          jq -S '.testPlan' "$out/selected-plan.json" > "$out/plan.json"
          jq -S '.testPlan' "$prior/ps525-2336-review/selected-plan.json" | cmp - "$out/plan.json"

          receipt="$prior/ps525-2336-review/pstdio-local-review-3FTJbX/test-results/ci/planned/5745-1795544039055/execution.json"
          jq -e --slurpfile plan "$out/plan.json" --arg digest "$PLAN_DIGEST" --arg execution "$ORIGINAL_EXECUTION" \
            '.source == $plan[0].source and .planDigest == $digest and .executionId == $execution
            and .complete and .outcome == "failure" and (.errors | length) == 0
            and ([.results[].runId] | sort) == ([$plan[0].runs[].id] | sort)
            and (.runIds | sort) == ([$plan[0].runs[].id] | sort)
            and all(.results[]; .complete)
            and all(.results[] | select(.outcome == "success"); .exitCode == 0 and .nativeFailure != true)
            and all(.results[] | select(.outcome == "failure"); .exitCode != 0 and .nativeFailure)
            and ([.results[] | select(.outcome == "success")] | length) == 71
            and ([.results[] | select(.outcome == "failure")] | length) == 12' "$receipt"
          jq -e --slurpfile plan "$out/plan.json" \
            --arg db "$ORDERED_RECORD_STREAM_TEST" --arg packaged "$CONCURRENT_EXTENSION_TEST" '
              . as $receipt |
              all([$db, $packaged][]; . as $file |
                [$plan[0].runs[] | select(.files | index($file)) | .id] as $ids |
                ($ids | length) > 0 and all($ids[]; . as $id |
                  any($receipt.results[]; .runId == $id and .complete and .outcome == "success")
                )
              )
            ' "$receipt"
          jq '[.results[] | select(.outcome == "failure") | .runId]' "$receipt" > "$out/assigned-groups.json"
          jq -e '. == [
            "4a605c0961571e0b93722a79", "17a6f4a45b802635172e439e", "2a8ea6db520685a9df29aadf",
            "61f5db38bbaf57f4bf80a1f8", "ceb00cf6cf0238b259ab751f", "663b8552c50f3cd04718d371",
            "4d971518f0bd64ec5e9f5de7", "4dccdfb6923873f7c4fb463c", "336206f55e684f82a16be354",
            "d4e326c64d469b0126d68ff2", "efab1885100feb29dbd697ae", "72480638f874d13d0838a290"
          ]' "$out/assigned-groups.json"
          jq -n --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg digest "$PLAN_DIGEST" \
            --arg base "$main_head" --arg mergeBase "$CANDIDATE_MERGE_BASE" \
            --argjson incoming "$incoming" --arg prospectiveTree "$prospective_tree" \
            --arg workflow "$GITHUB_WORKFLOW_REF" --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --arg originalRun "$ORIGINAL_RUN" --arg originalExecution "$ORIGINAL_EXECUTION" \
            '{head:$head,tree:$tree,digest:$digest,base:$base,mergeBase:$mergeBase,workflow:$workflow,
              incoming:$incoming,prospectiveTree:$prospectiveTree,workflowSha:$workflowSha,
              originalRun:$originalRun,originalExecution:$originalExecution}' > "$out/identity.json"

      - name: Prepare browsers and a short private temporary directory
        shell: bash
        run: |
          docker version
          docker compose version
          sudo -n true
          bunx playwright@1.60.0 install --with-deps 2>&1 | tee test-results/ps525-2336-complement/browser-setup.log
          command -v xvfb-run
          private_tmp="$(mktemp -d /tmp/ps525.XXXXXX)"
          {
            echo "PS525_2336_REVIEW_TMP=$private_tmp"
            echo "TMPDIR=$private_tmp"
            echo "TMP=$private_tmp"
            echo "TEMP=$private_tmp"
          } >> "$GITHUB_ENV"

      - name: Install unchanged locked workspace dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens

      - name: Run the twelve complete owning groups
        shell: bash
        run: |
          bun --no-orphans - <<'BUN' 2>&1 | tee test-results/ps525-2336-complement/console.log
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const output = resolve(root, "test-results/ps525-2336-complement");
          const scratch = process.env.PS525_2336_REVIEW_TMP;
          if (!scratch || !/^\/tmp\/ps525\.[A-Za-z0-9]{6}$/.test(scratch))
            throw new Error("Unexpected review temporary directory");
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = "test-results/ps525-2336-complement/native";
          const plan = await Bun.file(resolve(output, "plan.json")).json();
          const runIds = await Bun.file(resolve(output, "assigned-groups.json")).json();
          let passed = false;
          try {
            const result = await executePlan(plan, {
              root,
              runIds,
              prebuilt: false,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every((entry) => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify native receipts for every assigned group
        shell: bash
        run: |
          out=test-results/ps525-2336-complement
          jq -e --arg digest "$PLAN_DIGEST" --slurpfile plan "$out/plan.json" \
            --slurpfile assigned "$out/assigned-groups.json" \
            '.complete and .outcome == "success" and .planDigest == $digest and .source == $plan[0].source
            and (.runIds | sort) == ($assigned[0] | sort)
            and ([.results[].runId] | sort) == ($assigned[0] | sort)
            and .errors == []
            and all(.results[]; .complete and .outcome == "success" and .exitCode == 0 and .nativeFailure != true)
            and any(.phases[]; .kind == "desktop" and .outcome == "success")
            and any(.phases[]; .kind == "cleanup" and .outcome == "success")' "$out/native/execution.json"
          jq -e 'all(.[]; .outcome == "success")' "$out/compose-cleanup.json"

      - name: Collect failed-group and cleanup evidence
        if: always()
        shell: bash
        run: |
          out=test-results/ps525-2336-complement
          mkdir -p "$out"
          docker ps -a --format '{{.Names}} {{.Status}} {{.Label "com.docker.compose.project"}}' > "$out/docker-after.txt"
          docker network ls --format '{{.Name}} {{.Label "com.docker.compose.project"}}' > "$out/docker-networks-after.txt"
          docker volume ls --format '{{.Name}} {{.Label "com.docker.compose.project"}}' > "$out/docker-volumes-after.txt"
          if [[ -n "${PS525_2336_REVIEW_TMP:-}" ]]; then
            [[ "$PS525_2336_REVIEW_TMP" =~ ^/tmp/ps525\.[A-Za-z0-9]{6}$ ]]
            if [[ -f "$PS525_2336_REVIEW_TMP/compose-projects.jsonl" ]]; then
              cp "$PS525_2336_REVIEW_TMP/compose-projects.jsonl" "$out/"
            fi
            rm -rf -- "$PS525_2336_REVIEW_TMP"
            test ! -e "$PS525_2336_REVIEW_TMP"
            printf '%s\n' "$PS525_2336_REVIEW_TMP removed" > "$out/scratch-cleanup.txt"
          fi
          test ! -s "$out/docker-after.txt"
          test ! -s "$out/docker-volumes-after.txt"
          test -z "$(awk '$1 !~ /^(bridge|host|none)$/ { print }' "$out/docker-networks-after.txt")"

      - name: Upload exact twelve-group execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps525-2336-complement-09efa341-attempt-${{ github.run_attempt }}
          path: |
            test-results/ps525-2336-complement
            packages/e2e/test-results
            clients/desktop/test-results
          if-no-files-found: error
