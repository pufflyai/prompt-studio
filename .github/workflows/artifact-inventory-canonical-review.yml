name: Artifact inventory canonical review
on:
  push:
    branches: [diagnostics/release-artifact-review]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9c7214e72500f9a9287026bfd14f7fb6bec999bf
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify the exact source and review prerequisites
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "9c7214e72500f9a9287026bfd14f7fb6bec999bf"
          git fetch origin main
          git rev-parse origin/main
          docker version
          docker compose version
          df -h .
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
          bun run test:review --base origin/main --test scripts/ci/production-artifacts.p0.test.ts --list > "$RUNNER_TEMP/review-plan.json"
      - name: Run the canonical repository review
        run: |
          xvfb-run -a bun run test:review --base origin/main --test scripts/ci/production-artifacts.p0.test.ts \
            2>&1 | tee "$RUNNER_TEMP/review-command.log"
      - name: Preserve review report and phase failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-9c7214e725
          path: |
            ${{ runner.temp }}/review-command.log
            ${{ runner.temp }}/review-plan.json
            test-results/local-review/*.json
            /tmp/pstdio-local-review-*/checks.json
            /tmp/pstdio-local-review-*/logs/**/*.log
          if-no-files-found: error
