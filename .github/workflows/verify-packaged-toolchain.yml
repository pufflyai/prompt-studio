name: Verify packaged toolchain

# Runs on native runners after every merge to main and before every release.
on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          # Temporary: Playwright's Chromium does not install on Ubuntu 26.04 yet (ADR 0105).
          - os: ubuntu-24.04
            platform_pkg: cli-linux-x64
          - os: macos-15-intel
            platform_pkg: cli-darwin-x64
          - os: windows-latest
            platform_pkg: cli-win-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Packaged checks read older release tags, such as the Planner upgrade check.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Install Chromium for packaged extension smoke tests
        if: runner.os != 'Windows'
        run: bunx playwright@1.60.0 install chromium --with-deps

      - name: Verify packaged Bun toolchain
        id: toolchain
        shell: bash
        env:
          PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
        run: |
          set -o pipefail
          mkdir -p packages/e2e/test-results/packaged-toolchain
          bun run --cwd scripts verify:packages 2>&1 | tee packages/e2e/test-results/packaged-toolchain/verification.log

      - name: Run quarantined Windows compiled CLI cases
        if: runner.os == 'Windows' && !cancelled() && steps.toolchain.outcome == 'success'
        continue-on-error: true
        env:
          E2E_TEST_LANE: quarantine
          E2E_PACKAGED_BINARY_PATH: ${{ github.workspace }}/packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe
        run: bun --cwd packages/e2e ../../scripts/ci/run-bun-tests.ts --preload ./src/scripts/bun-process-cleanup.ts --timeout 30000 --silent

      - name: Require every compiled CLI quarantine case to have executed
        if: runner.os == 'Windows' && !cancelled() && steps.toolchain.outcome == 'success'
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-bun

      - name: Preserve packaged toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-toolchain-${{ matrix.platform_pkg }}-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
            test-results/quarantine/packages/e2e
          if-no-files-found: warn
