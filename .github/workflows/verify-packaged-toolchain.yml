name: Verify packaged toolchain

# Runs on native runners after every merge to main and before every release.
on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_pkg: cli-linux-x64
          - os: macos-15-intel
            platform_pkg: cli-darwin-x64
          - os: windows-latest
            platform_pkg: cli-win-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Packaged checks read older release tags, such as the Planner upgrade check.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Install Chromium for packaged extension smoke tests
        if: runner.os != 'Windows'
        run: bunx playwright@1.60.0 install chromium --with-deps

      - name: Verify packaged Bun toolchain
        shell: bash
        env:
          PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
        run: |
          set -o pipefail
          mkdir -p packages/e2e/test-results/packaged-toolchain
          bun run --cwd scripts verify:packages 2>&1 | tee packages/e2e/test-results/packaged-toolchain/verification.log

      - name: Preserve failed packaged toolchain evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-toolchain-${{ matrix.platform_pkg }}-attempt-${{ github.run_attempt }}
          path: |
            packages/e2e/test-results
            packages/e2e/playwright-report
          if-no-files-found: warn
