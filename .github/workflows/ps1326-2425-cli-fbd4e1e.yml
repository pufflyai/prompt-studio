name: PS-1326 exact core source CLI review

on:
  push:
    branches:
      - chore/ps1326-2425-cli-fbd4e1e

permissions:
  contents: read
  actions: read

jobs:
  source_cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PS1326_HEAD: fbd4e1e73e6d94c545e661e0849660815f043191
      PS1326_TREE: 86bff68cca4f8c3ceca53896ae20269d2fb59815
      PS1326_BASE: e0d6ab22d22032febd995ae206b5432dbbe658b2
      PS1326_POLICY: eeda44a3cdb1ac1ca43bda7a351ba8ed43d09409cd8b1cc4c373fa2bfd6a2348
      PS1326_MERGE: a27814c099d35dac9dcfd04171284c9c6344ca29
      PS1326_MERGE_TREE: 86bff68cca4f8c3ceca53896ae20269d2fb59815
      PS1326_MAIN: e0d6ab22d22032febd995ae206b5432dbbe658b2
      PS1326_CLI_GROUP: 72480638f874d13d0838a290
      PS1326_CLI_FILES_SHA256: 58d8a6b1f28c46136461a9d26acb7a8700f52cf27fdc5841e7117801d9420c7a
      PS1326_ORDINARY_RUN: 45576282840
      PS1326_ORDINARY_PLAN: 935815b28ece265b3906e9f00fcbe11c2ab9661c8c50ae8f940d860aa3d3f2f6
      PS1326_SELECTED_PLAN: 7b0acc1b4b85a7a2bb0cd5584aee792a84081e411ff2186907900018bde5f92a
      PS1326_OUTPUT: test-results/ps1326-2425-cli
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PS1326_MERGE }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify the source and sealed Linux plan
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/ps1326-2425-cli-fbd4e1e
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git show -s --format=%P "$GITHUB_WORKFLOW_SHA")" = "$PS1326_HEAD"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_WORKFLOW_SHA")" =             "$(printf 'A\t.github/workflows/ps1326-2425-cli-fbd4e1e.yml')"
          test "$(git rev-parse HEAD)" = "$PS1326_MERGE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PS1326_MERGE_TREE"
          test "$(git rev-parse 'HEAD^1')" = "$PS1326_MAIN"
          test "$(git rev-parse 'HEAD^2')" = "$PS1326_HEAD"
          test "$(git rev-parse "$PS1326_HEAD^{tree}")" = "$PS1326_TREE"
          git fetch --no-tags origin refs/heads/feature/ps-1326-microsoft-cloud-identity:refs/remotes/origin/feature/ps-1326-microsoft-cloud-identity
          test "$(git rev-parse origin/feature/ps-1326-microsoft-cloud-identity)" = "$PS1326_HEAD"
          test "$(git merge-base "$PS1326_HEAD" "$PS1326_MAIN")" = "$PS1326_BASE"
          incoming="$(git rev-list --count "$PS1326_HEAD..$PS1326_MAIN")"
          test "$incoming" -le 10
          prospective="$(git merge-tree --write-tree --no-messages "$PS1326_HEAD" "$PS1326_MAIN")"
          test "$prospective" = "$PS1326_MERGE_TREE"
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = "1.4.4"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          mkdir -p "$PS1326_OUTPUT"
          bun run test:review --base "$PS1326_MAIN" --list > "$PS1326_OUTPUT/selected-plan.json"
          plan="$(jq -er '.testPlan.digest | select(test("^[0-9a-f]{64}$"))' "$PS1326_OUTPUT/selected-plan.json")"
          test "$plan" = "$PS1326_SELECTED_PLAN"
          printf 'PS1326_PLAN=%s\n' "$plan" >> "$GITHUB_ENV"
          jq -e --arg sha "$PS1326_MERGE" --arg tree "$PS1326_MERGE_TREE" --arg base "$PS1326_MAIN" \
            --arg policy "$PS1326_POLICY" --arg digest "$plan" --arg group "$PS1326_CLI_GROUP" '
              .head == $sha and .mergeBase == $base and .testPlan.digest == $digest
              and .testPlan.source == {sha:$sha,tree:$tree,policy:$policy,dirty:false}
              and (.testPlan.runs | length) == 98 and (.selected | length) == 2891
              and all(.testPlan.runs[]; .target == {platform:"linux",arch:"x64"})
              and ([.testPlan.runs[] | select(.job == "local-additions") | .id] == [$group])
              and any(.testPlan.runs[]; .id == $group and .owner == "e2e" and .cwd == "packages/e2e"
                and .runner == "cli" and .priority == "P1" and .lane == "stable" and .artifact == "source"
                and .requires == ["build-e5b1f54fca1c52cd"] and (.files | length) == 10)
              and any(.testPlan.setup[]; .id == "build-e5b1f54fca1c52cd" and .owners == ["e2e"]
                and .kind == "build" and .requires == [])
            ' "$PS1326_OUTPUT/selected-plan.json"
          jq -c --arg group "$PS1326_CLI_GROUP" '.testPlan.runs[] | select(.id == $group) | .files' \
            "$PS1326_OUTPUT/selected-plan.json" > "$PS1326_OUTPUT/assigned-files.json"
          printf '%s  %s\n' "$PS1326_CLI_FILES_SHA256" "$PS1326_OUTPUT/assigned-files.json" | sha256sum -c -
          jq -n --arg head "$PS1326_HEAD" --arg headTree "$PS1326_TREE" --arg merge "$PS1326_MERGE" \
            --arg mergeTree "$PS1326_MERGE_TREE" --arg main "$PS1326_MAIN" --arg base "$PS1326_BASE" \
            --arg plan "$plan" --arg workflow "$GITHUB_WORKFLOW_SHA" --argjson incoming "$incoming" \
            '{sha:$merge,tree:$mergeTree,prHead:$head,prHeadTree:$headTree,main:$main,branchBase:$base,
              mergeBase:$main,mergeTree:$mergeTree,incoming:$incoming,planDigest:$plan,diagnosticCommit:$workflow}' \
            > "$PS1326_OUTPUT/identity.json"

      - name: Retain the ordinary Linux scope
        uses: actions/download-artifact@v4
        with:
          name: test-plan-attempt-1
          path: ${{ env.PS1326_OUTPUT }}/ordinary
          github-token: ${{ github.token }}
          run-id: ${{ env.PS1326_ORDINARY_RUN }}

      - name: Verify the ordinary scope and prerequisite jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ordinary="$PS1326_OUTPUT/ordinary"
          jq -e --arg sha "$PS1326_MERGE" --arg tree "$PS1326_MERGE_TREE" \
            --arg policy "$PS1326_POLICY" --arg plan "$PS1326_ORDINARY_PLAN" --arg group "$PS1326_CLI_GROUP" '
              .source == {sha:$sha,tree:$tree,policy:$policy,dirty:false} and .digest == $plan
              and (.runs | length) == 97 and all(.runs[]; .id != $group)
            ' "$ordinary/plan.json"
          for assignment in scope:139074912276 static_checks:139075199098 build_host:139075199256; do
            name="${assignment%:*}"
            job="${assignment#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" \
              --jq '{id,name,run_id,run_attempt,head_sha,status,conclusion,steps:[.steps[]|{name,status,conclusion}]}' > "$ordinary/$name.json"
            jq -e --arg name "$name" --arg id "$job" --arg run "$PS1326_ORDINARY_RUN" --arg sha "$PS1326_HEAD" '
              .name == $name and (.id|tostring) == $id and (.run_id|tostring) == $run
              and .run_attempt == 1 and .head_sha == $sha and .status == "completed" and .conclusion == "success"
            ' "$ordinary/$name.json"
          done

      - name: Create private test runtime
        shell: bash
        run: |
          scratch="$(mktemp -d /tmp/ps1326.XXXXXX)"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$scratch/owner"
          {
            echo "PS1326_CLI_TMP=$scratch"
            echo "TMPDIR=$scratch"
            echo "TMP=$scratch"
            echo "TEMP=$scratch"
            echo "PS1326_NATIVE_BUN=$(command -v bun)"
          } >> "$GITHUB_ENV"
          { node --version; bun --version; docker version; df -h /tmp "$GITHUB_WORKSPACE"; }             > "$PS1326_OUTPUT/toolchain.log"

      - name: Install locked dependencies and prepare Firefox
        shell: bash
        run: |
          bun install --frozen-lockfile --concurrent-scripts 1
          bun run --cwd packages/ui typegen:tokens
          (cd packages/e2e && bun x --no-install playwright install --with-deps firefox) 2>&1             | tee "$PS1326_OUTPUT/browser-setup.log"
          test -z "$(git status --porcelain)"

      - name: Execute only the ten-file source CLI group
        shell: bash
        run: |
          test "$(command -v bun)" = "$PS1326_NATIVE_BUN"
          bun --no-orphans - <<'BUN' 2>&1 | tee "$PS1326_OUTPUT/console.log"
          import { resolve } from "node:path";
          import { cleanupReviewCompose } from "./scripts/ci/local-review-compose";
          import { localReviewEnvironment } from "./scripts/ci/local-review-source";
          import { executePlan } from "./scripts/ci/run-test-plan";

          const root = process.cwd();
          const { PS1326_CLI_TMP: scratch, PS1326_OUTPUT: relative, PS1326_CLI_GROUP: group } = process.env;
          if (!scratch || !/^\/tmp\/ps1326\.[A-Za-z0-9]{6}$/.test(scratch) || !relative || !group)
            throw new Error("Unexpected native review assignment");
          const executionId = process.env.GITHUB_RUN_ID + "/" + process.env.GITHUB_RUN_ATTEMPT;
          const output = resolve(root, relative);
          for (const [key, value] of Object.entries(localReviewEnvironment(scratch))) {
            if (value === undefined) delete process.env[key];
            else process.env[key] = value;
          }
          process.env.CI_PLAN_OUTPUT_DIR = relative + "/native";
          const { testPlan } = await Bun.file(resolve(output, "selected-plan.json")).json();
          let passed = false;
          try {
            const result = await executePlan(testPlan, {
              root, runIds: [group], prebuilt: false, executionId,
              env: { CI_PROFILE: "production", BUN_FEATURE_FLAG_NO_ORPHANS: undefined },
            });
            passed = result.complete && result.outcome === "success";
          } finally {
            const cleanup = await cleanupReviewCompose(scratch);
            await Bun.write(resolve(output, "compose-cleanup.json"), JSON.stringify(cleanup, null, 2));
            passed &&= cleanup.every(entry => entry.outcome === "success");
            process.exitCode = passed ? 0 : 1;
          }
          BUN

      - name: Verify exact native execution and file coverage
        shell: bash
        run: |
          jq -e --arg group "$PS1326_CLI_GROUP" --arg digest "$PS1326_PLAN"             --slurpfile expected "$PS1326_OUTPUT/assigned-files.json"             --slurpfile sealed "$PS1326_OUTPUT/selected-plan.json" '
              .source == $sealed[0].testPlan.source and .planDigest == $digest
              and .complete and .outcome == "success" and .errors == [] and .runIds == [$group]
              and (.results | length) == 1
              and all(.results[]; .runId == $group and .complete and .outcome == "success"
                and .exitCode == 0 and .nativeFailure != true and (.reportedFiles | sort) == ($expected[0] | sort))
              and [.phases[] | select(.kind == "build") | [.id,.outcome]] == [["build-e5b1f54fca1c52cd","success"]]
              and any(.phases[]; .kind == "cleanup" and .outcome == "success")
            ' "$PS1326_OUTPUT/native/execution.json"
          jq -e --arg sha "$PS1326_MERGE" --arg plan "$PS1326_PLAN" --arg group "$PS1326_CLI_GROUP" \
            --arg execution "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --slurpfile expected "$PS1326_OUTPUT/assigned-files.json" '
              .sourceSha == $sha and .planDigest == $plan and .runId == $group and .executionId == $execution
              and .complete and .exitCode == 0 and .reportError == null and .signal == null
              and .executedCases == 20 and .unreportedSelectedCases == 0 and (.cases | length) == 20
              and (.executedFiles | sort) == ($expected[0] | sort) and all(.cases[]; .outcome == "success")
            ' "$PS1326_OUTPUT/native/$PS1326_CLI_GROUP/cases.json"
          jq -e 'all(.[]; .outcome == "success")' "$PS1326_OUTPUT/compose-cleanup.json"
          git diff --exit-code

      - name: Retain and clean this invocation's temporary files
        if: always()
        shell: bash
        run: |
          mkdir -p "$PS1326_OUTPUT"
          if [[ -n "${PS1326_CLI_TMP:-}" ]]; then
            [[ "$PS1326_CLI_TMP" =~ ^/tmp/ps1326\.[A-Za-z0-9]{6}$ ]]
            test "$(cat "$PS1326_CLI_TMP/owner")" = "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if [[ -f "$PS1326_CLI_TMP/compose-projects.jsonl" ]]; then
              cp "$PS1326_CLI_TMP/compose-projects.jsonl" "$PS1326_OUTPUT/"
            fi
            rm -rf -- "$PS1326_CLI_TMP"
            test ! -e "$PS1326_CLI_TMP"
            printf '%s\n' 'Owned temporary directory removed' > "$PS1326_OUTPUT/scratch-cleanup.txt"
          fi

      - name: Upload the fixture and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps1326-2425-source-cli-fbd4e1e-attempt-${{ github.run_attempt }}
          path: ${{ env.PS1326_OUTPUT }}
          if-no-files-found: error
