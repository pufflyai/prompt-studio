name: Build and Validate Desktop

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      target:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      essential_only:
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      MACOS_SIGN_IDENTITY:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
      id-token: write
    # Split the former 30-minute job budget equally between build and validation.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Isolate hosted Intel runner indexing
        if: inputs.target == 'darwin-x64'
        # Temporary hosted-runner workaround; see ADR 0032.
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Verify release version
        env:
          DESKTOP_RELEASE_VERSION: ${{ inputs.version }}
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # The template literal is evaluated by Bun, not the shell.
          # shellcheck disable=SC2016
          bun -e 'const desktop = await Bun.file("clients/desktop/package.json").json();
          const runtime = await Bun.file("packages/pstdio/package.json").json();
          if (desktop.version !== process.env.DESKTOP_RELEASE_VERSION || runtime.version !== desktop.version ||
          process.env.DESKTOP_RELEASE_TAG !== `pstdio@${desktop.version}`) throw new Error("Desktop release version drift");'

      - name: Import macOS signing credentials
        if: inputs.platform == 'darwin'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          CERTIFICATE_PATH: ${{ runner.temp }}/pstdio-desktop.p12
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_CONTENT"
          bun -e 'await Bun.write(process.env.CERTIFICATE_PATH, Buffer.from(process.env.MACOS_CERTIFICATE, "base64")); await Bun.write(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_CONTENT, "base64"));'
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Set up Azure Artifact Signing
        if: inputs.platform == 'win32'
        uses: ./.github/actions/setup-windows-signing
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_SIGNING_PROFILE }}

      - name: Build signed macOS distributions
        if: inputs.platform == 'darwin'
        env:
          DEBUG: electron-notarize*
          PSTDIO_DESKTOP_RELEASE: "1"
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run --cwd clients/desktop make -- --arch=${{ inputs.arch }}

      - name: Build signed Windows distributions
        if: inputs.platform == 'win32'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ inputs.arch }}

      - name: Build Linux distributions
        if: inputs.platform == 'linux'
        env:
          PSTDIO_DESKTOP_RELEASE: "1"
        run: bun run --cwd clients/desktop make -- --arch=${{ inputs.arch }}

      # Tar preserves executable modes and the symlinks in signed macOS bundles.
      - name: Archive native build
        shell: bash
        run: tar -cf native-build.tar -C clients/desktop out dist

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ inputs.target }}
          path: native-build.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Remove macOS signing keychain
        if: always() && inputs.platform == 'darwin'
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/pstdio-desktop.keychain-db
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  validate:
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Isolate hosted Intel runner indexing
        if: inputs.target == 'darwin-x64'
        # Temporary hosted-runner workaround; see ADR 0032.
        run: |
          sudo mdutil -a -i off
          mdutil -a -s

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Download native build
        uses: actions/download-artifact@v4
        with:
          name: native-build-${{ inputs.target }}
          path: .native-build

      - name: Restore native build
        shell: bash
        run: tar -xf .native-build/native-build.tar -C clients/desktop

      - name: Configure Linux Chromium sandbox
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox_path="clients/desktop/out/prompt-studio-linux-${{ inputs.arch }}/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G %a' "$sandbox_path")" = "root:root 4755"

      - name: Verify Electron fuse policy
        run: bun run --cwd clients/desktop verify:fuses

      - name: Set up Windows desktop tests
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-desktop-tests

      - name: Configure the source Electron sandbox
        if: inputs.platform == 'linux'
        run: |
          (cd clients/desktop && bun -e 'require("electron")')
          sudo chown root:root clients/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 clients/desktop/node_modules/electron/dist/chrome-sandbox

      # The source suite reuses the desktop build from packaging.
      - name: Test source Electron
        if: inputs.platform != 'linux' && !inputs.essential_only
        working-directory: clients/desktop
        run: bunx playwright test --config playwright.config.ts

      - name: Test source Electron on Linux
        if: inputs.platform == 'linux'
        working-directory: clients/desktop
        run: xvfb-run -a bunx playwright test --config playwright.config.ts

      - name: Smoke packaged application
        if: inputs.platform != 'linux'
        env:
          DEBUG: pw:api,pw:browser
        run: bun run --cwd clients/desktop test:packaged ${{ inputs.essential_only && '--grep @essential' || '' }}

      - name: Smoke packaged Linux application
        if: inputs.platform == 'linux'
        env:
          DEBUG: pw:api,pw:browser
        run: xvfb-run -a bun run --cwd clients/desktop test:packaged

      - name: Upload packaged release-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ inputs.target }}
          path: clients/desktop/test-results
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Verify macOS signatures and notarization
        if: inputs.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="clients/desktop/out/Prompt Studio-darwin-${{ inputs.arch }}/Prompt Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Resources/bin/pstdio"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify Windows signatures and update payload
        if: inputs.platform == 'win32'
        run: bun clients/desktop/scripts/verify-windows-signatures.ts

      - name: Verify installed Windows command
        if: inputs.platform == 'win32'
        run: bun clients/desktop/scripts/verify-windows-cli-install.ts

      - name: Verify Linux package
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find clients/desktop/out/make -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "$PWD/$DEB"
          test "$(pst --version)" = '${{ inputs.version }}'
          sudo dpkg -i "$DEB"
          test "$(pst --version)" = '${{ inputs.version }}'
          sudo apt-get purge -y prompt-studio
          test ! -L /usr/bin/pst
          sudo ln -s /bin/true /usr/bin/pst
          sudo apt-get install -y "$PWD/$DEB"
          test "$(readlink /usr/bin/pst)" = /bin/true
          sudo apt-get purge -y prompt-studio
          test "$(readlink /usr/bin/pst)" = /bin/true
          sudo rm /usr/bin/pst

      - name: Extract desktop release notes
        shell: bash
        run: bun run --cwd scripts release:notes "${{ inputs.version }}" > "${{ runner.temp }}/desktop-release-notes.md"

      - name: Prepare release artifacts
        env:
          PSTDIO_DESKTOP_PUBLISHED_AT: ${{ github.event.repository.updated_at }}
        run: >-
          bun run --cwd clients/desktop release:prepare -- --target ${{ inputs.target }}
          --notes-file "${{ runner.temp }}/desktop-release-notes.md"

      - name: Upload verified native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.target }}
          path: clients/desktop/out/release/${{ inputs.target }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
