name: PS-202 native failed scopes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failed_scopes:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6d9cf4901ce08b81dd30e4210363ba149c310104
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install exact repaired-source dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Build desktop test dependencies
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Check the original full legacy backlog workload
        id: storage
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p clients/desktop/test-results
          bun packages/pstdio-db/src/services/extension-storage/ordered-legacy-backlog.p3.bench.ts 2>&1 | tee clients/desktop/test-results/ps202-legacy-backlog.log
      - name: Package the repaired source with normal native hooks
        id: package
        working-directory: clients/desktop
        run: bun run package
      - name: Check original startup workload and launch order without instrumentation
        id: startup
        working-directory: clients/desktop
        run: bunx --no-install playwright test --config playwright.benchmark.config.ts src/e2e/packaged-launch.p3.bench.ts
      - name: Require both repaired scopes to pass
        if: always()
        env:
          STORAGE: ${{ steps.storage.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          STARTUP: ${{ steps.startup.outcome }}
        run: |
          bun -e 'for (const scope of ["STORAGE", "PACKAGE", "STARTUP"]) if (process.env[scope] !== "success") throw Error(scope + " did not pass: " + process.env[scope]);'
      - name: Preserve all failed-scope outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps202-native-failed-scopes
          path: clients/desktop/test-results
          if-no-files-found: error
