name: Production desktop validation
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      channel:
        required: true
        type: string
      kind:
        description: functional or performance; performance always uses a fresh runner
        required: true
        type: string
      platforms:
        description: JSON desktop rows selected for this release channel
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    name: ${{ inputs.kind }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Preserve the existing desktop release allowance; operation budgets remain in benchmarks.
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # Keep the installer matched to this workflow when validating an older candidate.
      - name: Check out the workflow's native installer
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: __test-tmp__/native-installer
          sparse-checkout: |
            /scripts/ci/install-native-dependencies.ts
            /scripts/ci/native-dependency-environment.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install native dependencies
        run: bun __test-tmp__/native-installer/scripts/ci/install-native-dependencies.ts
      - name: Build desktop test dependencies
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Download the exact signed release app
        if: inputs.channel == 'stable' || matrix.platform != 'win32'
        uses: actions/download-artifact@v4
        with:
          name: validation-app-${{ matrix.target }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Restore the exact release app
        if: inputs.channel == 'stable' || matrix.platform != 'win32'
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-${{ matrix.target }}.tar.gz -C clients/desktop
      # Nightlies publish no Windows app. Still exercise Windows each day. Stable
      # certification above always measures its signed publication artifact.
      # The identity names the checkout under test, so it exists before the build:
      # a failed build must still be attested as this candidate's failure.
      - name: Record the daily Windows candidate identity
        if: inputs.channel == 'nightly' && matrix.platform == 'win32'
        shell: bash
        run: |
          bun -e 'await Bun.write("production-build-identity.json", JSON.stringify({ sourceSha: process.env.SOURCE_SHA, versionSha: process.env.VERSION_SHA, toolchain: "bun-" + Bun.version }))'
        env:
          VERSION_SHA: ${{ inputs.ref }}
      - name: Build the daily Windows candidate
        if: inputs.channel == 'nightly' && matrix.platform == 'win32'
        shell: bash
        run: bun run --cwd clients/desktop make -- --arch=x64
      - name: Configure Linux sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Set up Windows desktop tests
        if: matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: Measure fixed workloads without traces or retries
        if: inputs.kind == 'performance'
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bunx playwright test --config playwright.benchmark.config.ts
      - name: Test every packaged functional case
        if: inputs.kind == 'functional'
        working-directory: clients/desktop
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bun run test:packaged
      - name: Run quarantined launch benchmarks once
        if: ${{ !cancelled() && inputs.kind == 'performance' && matrix.platform == 'win32' }}
        continue-on-error: true
        run: bun scripts/ci/run-quarantined-tests.ts packaged-desktop-benchmark --scope @pstdio/desktop --prebuilt
      - name: Require first-attempt launch quarantine execution
        if: ${{ !cancelled() && inputs.kind == 'performance' && matrix.platform == 'win32' }}
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop-benchmark --scope @pstdio/desktop
      - name: Run quarantined packaged functional cases once
        if: ${{ !cancelled() && inputs.kind == 'functional' }}
        continue-on-error: true
        run: ${{ matrix.platform == 'linux' && 'xvfb-run -a ' || '' }}bun scripts/ci/run-quarantined-tests.ts packaged-desktop --scope @pstdio/desktop --prebuilt
      - name: Require first-attempt functional quarantine execution
        if: ${{ !cancelled() && inputs.kind == 'functional' }}
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop --scope @pstdio/desktop
      - name: Attest actual consumer inputs and outcome
        if: always()
        env:
          CHECK: ${{ inputs.kind == 'functional' && 'signed-functional' || 'performance-desktop' }}-${{ matrix.target }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: bun scripts/ci/production-evidence.ts --check "$CHECK" --outcome "$OUTCOME"
      - name: Preserve consumer attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ inputs.kind }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: production-evidence
          if-no-files-found: error
      - name: Preserve all production desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-desktop-${{ inputs.kind }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: clients/desktop/test-results
          if-no-files-found: warn
