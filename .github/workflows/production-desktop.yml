name: PS-202 native startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 8ac8b63703c82871391655049331cb5f304ac072
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: Install candidate dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Build desktop test dependencies
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: validation-app-darwin-arm64
          run-id: 42962479744
          github-token: ${{ github.token }}
      - name: Restore the exact signed candidate
        env:
          SOURCE_SHA: 7ddf324d55bec0d61d2bf43ca763acdacd94ef01
          ARTIFACT_RUN_ID: 42962479744
          ARTIFACT_ATTEMPT: "1"
          CHANNEL: stable
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-darwin-arm64.tar.gz -C clients/desktop
      - name: Trace only the cold launch and preserve its exported trace
        run: |
          bun - <<'BUN'
          const path = "clients/desktop/src/e2e/packaged-app-helpers.ts";
          let text = await Bun.file(path).text();
          const needle = '["--remote-debugging-port=0", \u0060--user-data-dir=\u0024{join(home, "electron-user-data")}\u0060]';
          const replacement = '["--remote-debugging-port=0", ...(test.info().title.includes("cold start") ? ["--trace-startup=-*,startup,toplevel,blink,cc,gpu,loading,v8,disabled-by-default-v8.cpu_profiler", "--trace-startup-duration=5", "--trace-startup-format=json", \u0060--trace-startup-file=\u0024{join(desktopRoot, "test-results", "ps202-cold-start.json")}\u0060] : []), \u0060--user-data-dir=\u0024{join(home, "electron-user-data")}\u0060]';
          if (!text.includes(needle)) throw Error("Diagnostic driver target changed");
          text = text.replace(needle, replacement);
          const kill = '    await stopPackagedProcess(app.child);';
          if (!text.includes(kill)) throw Error("Diagnostic teardown target changed");
          text = text.replace(kill, `    // Diagnostic only: preserve Chromium's trace service until it exports on exit.
              if (test.info().title.includes("cold start") && app.child.exitCode === null && app.child.signalCode === null) {
                const closed = new Promise<void>((resolve) => app.child.once("close", () => resolve()));
                app.child.kill("SIGTERM");
                await closed;
                if (!existsSync(join(desktopRoot, "test-results", "ps202-cold-start.json"))) throw Error("Cold startup trace was not exported");
              }
          ${kill}`);
          await Bun.write(path, text);
          BUN
      - name: Diagnose original launch order and workload with tracing overhead
        working-directory: clients/desktop
        run: bunx --no-install playwright test --config playwright.benchmark.config.ts src/e2e/packaged-launch.p3.bench.ts
      - name: Preserve diagnostic traces and original benchmark outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps202-native-startup-diagnostic
          path: clients/desktop/test-results
          if-no-files-found: error
