name: Production desktop validation
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      artifact_attempt:
        required: true
        type: string
      candidate_artifact_id:
        required: true
        type: string
      channel:
        required: true
        type: string
      kind:
        description: functional or performance; performance always uses a fresh runner
        required: true
        type: string
      platforms:
        description: JSON desktop rows selected for this release channel
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    name: ${{ inputs.kind }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Preserve the existing desktop release allowance; operation budgets remain in benchmarks.
    timeout-minutes: 30
    env:
      CI_PROFILE: production
      PLAN_DISPLAY: ${{ matrix.platform == 'linux' && 'true' || 'false' }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_ATTEMPT: ${{ inputs.artifact_attempt }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # Keep the installer matched to this workflow when validating an older candidate.
      - name: Check out the workflow's native installer
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: __test-tmp__/native-installer
          sparse-checkout: |
            /scripts/ci/install-native-dependencies.ts
            /scripts/ci/native-dependency-environment.ts
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
      - name: "[phase:install] Install native dependencies"
        run: bun __test-tmp__/native-installer/scripts/ci/install-native-dependencies.ts
      - name: "[phase:build] Build desktop test dependencies"
        run: bun run build -- --scope @pstdio/desktop --include-dependencies
      - name: Download the exact signed release app
        uses: actions/download-artifact@v4
        with:
          name: validation-app-${{ matrix.target }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Restore the exact release app
        shell: bash
        run: |
          bun scripts/ci/production-payload.ts check
          tar -xzf validation-app-${{ matrix.target }}.tar.gz -C clients/desktop
      - name: Configure Linux sandbox
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo chown root:root clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
          sudo chmod 4755 clients/desktop/out/prompt-studio-linux-x64/chrome-sandbox
      - name: Set up Windows desktop tests
        if: matrix.platform == 'win32'
        uses: ./.github/actions/setup-windows-desktop-tests
      - name: "[phase:test] Measure fixed workloads without traces or retries"
        if: inputs.kind == 'performance'
        run: bun scripts/test.ts --performance-family desktop --prebuilt
      - name: "[phase:test] Test the declared shared or native packaged contract"
        if: inputs.kind == 'functional'
        run: bun scripts/test.ts --artifact packaged-desktop --prebuilt --out test-results/ci/desktop-contract-plan.json
      - name: Require first-attempt launch quarantine execution
        if: ${{ !cancelled() && inputs.kind == 'performance' && matrix.platform == 'win32' }}
        run: bun scripts/ci/verify-quarantine-reports.ts packaged-desktop-benchmark --scope @pstdio/desktop
      - name: Download the immutable candidate identity
        uses: actions/download-artifact@v4
        if: always()
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
      - name: Attest actual consumer inputs and outcome
        if: always()
        env:
          CHECK: ${{ inputs.kind == 'functional' && (matrix.platform == 'linux' && 'desktop-shared' || 'desktop-native') || 'performance-desktop' }}-${{ matrix.target }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: bun scripts/ci/production-evidence.ts --check "$CHECK" --outcome "$OUTCOME"
      - name: "[phase:report-transfer] Preserve consumer attestation"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ inputs.kind }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: production-evidence
          if-no-files-found: error
      - name: "[phase:report-transfer] Preserve all production desktop evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-desktop-${{ inputs.kind }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci/desktop-contract-plan.json
            clients/desktop/test-results
            test-results/ci/planned
            !test-results/ci/planned/**/extension-fixtures-*/**
          if-no-files-found: warn
