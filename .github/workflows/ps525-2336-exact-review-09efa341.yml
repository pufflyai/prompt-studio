name: PS-525 exact admission candidate review

on:
  push:
    branches:
      - chore/ps525-2336-review-09efa341-noble

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_SHA: 09efa341a81787b9086b5472c447a2ab4b78efe1
      CANDIDATE_TREE: 62e5d98311ce7a6b129dc84f3cc300b682aa2a08
      CANDIDATE_MERGE_BASE: 8ea58e189148883398004721402b181ab089a89a
      EXPECTED_LINUX_PLAN: 6e2fbd72d05091c0a47ecd007b84c7fa13b2268a184f5d11ec33a63139c65ca4
      CANDIDATE_REF: refs/remotes/origin/workspace/WS-446-bbc1220d-862b-4752-8112-a6f779889ca6
      DIAGNOSTIC_REF: refs/heads/chore/ps525-2336-review-09efa341-noble
      DIAGNOSTIC_FILE: .github/workflows/ps525-2336-exact-review-09efa341.yml
      ORDERED_RECORD_STREAM_TEST: packages/pstdio-db/src/services/extension-storage/ordered-record-stream.p1.test.ts
      CONCURRENT_EXTENSION_TEST: packages/e2e/src/packaged/packaged-concurrent-extension-smoke.p2.test.ts
      REVIEW_EVIDENCE: test-results/ps525-2336-review
      PLAN_DISPLAY: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Verify source and enumerate the Linux queue plan
        shell: bash
        run: |
          test "$GITHUB_REF" = "$DIAGNOSTIC_REF"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git show -s --format=%P "$GITHUB_WORKFLOW_SHA")" = "$CANDIDATE_SHA"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_WORKFLOW_SHA")" = "$(printf 'A\t%s' "$DIAGNOSTIC_FILE")"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE_REF")" = "$CANDIDATE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$CANDIDATE_MERGE_BASE"
          incoming="$(git rev-list --count HEAD..origin/main)"
          test "$incoming" -le 10
          prospective_tree="$(git merge-tree --write-tree HEAD origin/main)"
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = "1.4.4"
          test "$(jq -r .packageManager package.json)" = "bun@1.4.4"
          mkdir -p "$REVIEW_EVIDENCE"
          jq -n \
            --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" \
            --arg main "$(git rev-parse origin/main)" --arg mergeBase "$CANDIDATE_MERGE_BASE" \
            --argjson incoming "$incoming" --arg prospectiveMergeTree "$prospective_tree" \
            --arg ref "$GITHUB_WORKFLOW_REF" --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            '{head:$head,tree:$tree,main:$main,mergeBase:$mergeBase,incoming:$incoming,
              prospectiveMergeTree:$prospectiveMergeTree,workflow:$ref,workflowSha:$workflowSha}' \
            > "$REVIEW_EVIDENCE/identity.json"
          bun run test:review --base origin/main \
            --test "$ORDERED_RECORD_STREAM_TEST" --test "$CONCURRENT_EXTENSION_TEST" --list \
            > "$REVIEW_EVIDENCE/selected-plan.json"
          jq -e --arg head "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" --arg base "$CANDIDATE_MERGE_BASE" \
            --arg expectedPlan "$EXPECTED_LINUX_PLAN" \
            --arg database "$ORDERED_RECORD_STREAM_TEST" --arg packaged "$CONCURRENT_EXTENSION_TEST" '
              ([.selected[].file] | unique) as $selected |
              ([.testPlan.runs[].files[]] | unique) as $assigned |
              .head == $head and .mergeBase == $base and .testPlan.digest == $expectedPlan and
              .testPlan.source.sha == $head and .testPlan.source.tree == $tree and .testPlan.source.dirty == false and
              (.queueFiles | length) > 0 and (.queueFiles - $selected | length) == 0 and
              ($selected - $assigned | length) == 0 and ($assigned - $selected | length) == 0 and
              ($assigned | index($database) != null and index($packaged) != null) and
              all(.testPlan.runs[]; .target.platform == "linux" and .target.arch == "x64")
            ' "$REVIEW_EVIDENCE/selected-plan.json"
          jq '{head,mergeBase,groups:(.testPlan.runs|length),selected:(.selected|length),
               queueFiles:(.queueFiles|length),digest:.testPlan.digest}' "$REVIEW_EVIDENCE/selected-plan.json"

      - name: Prepare isolated Linux review prerequisites
        shell: bash
        run: |
          sudo -n true
          {
            cat /etc/os-release
            node --version
            bun --version
            docker version
            docker compose version
            command -v xvfb-run
            dpkg-query -W xvfb
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } | tee "$REVIEW_EVIDENCE/toolchain.log"
          bunx playwright@1.60.0 install --with-deps 2>&1 | tee "$REVIEW_EVIDENCE/browser-setup.log"
          mkdir -p "$RUNNER_TEMP/ps525-2336-review-scratch" "$RUNNER_TEMP/ps525-2336-review-bin"
          echo "TMPDIR=$RUNNER_TEMP/ps525-2336-review-scratch" >> "$GITHUB_ENV"
          echo "PS525_2336_REAL_BUN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ps525-2336-review-bin" >> "$GITHUB_PATH"
          cat > "$RUNNER_TEMP/ps525-2336-review-bin/bun" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ $# -eq 4 && $1 == run && $2 == --cwd && $3 == clients/desktop && $4 == package ]]; then
            case "$(pwd -P)" in
              "$TMPDIR"/pstdio-local-review-*/source) ;;
              *) echo "Desktop package command is outside the review scratch checkout" >&2; exit 1 ;;
            esac
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
            "$PS525_2336_REAL_BUN" "$@"
            printf '%s\n' 'Configure Chromium sandbox in the disposable Linux checkout'
            exec "$PS525_2336_REAL_BUN" scripts/ci/configure-linux-desktop-sandboxes.ts
          fi
          exec "$PS525_2336_REAL_BUN" "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/ps525-2336-review-bin/bun"

      - name: Run all selected checks and both admission regressions
        shell: bash
        run: |
          test "$(command -v bun)" = "$RUNNER_TEMP/ps525-2336-review-bin/bun"
          test -z "$(git status --porcelain)"
          bun run test:review --base origin/main \
            --test "$ORDERED_RECORD_STREAM_TEST" --test "$CONCURRENT_EXTENSION_TEST" 2>&1 \
            | tee "$REVIEW_EVIDENCE/console.log"
          shopt -s nullglob
          reports=(test-results/local-review/*.json)
          test "${#reports[@]}" -eq 1
          jq -e --arg head "$CANDIDATE_SHA" --arg base "$CANDIDATE_MERGE_BASE" \
            --arg digest "$(jq -r .testPlan.digest "$REVIEW_EVIDENCE/selected-plan.json")" '
              .head == $head and .mergeBase == $base and .plan.testPlan.digest == $digest and
              .outcome == "local_passed" and all(.composeCleanup[]; .outcome == "success")
            ' "${reports[0]}"

      - name: Collect selected test and cleanup evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$REVIEW_EVIDENCE"
          shopt -s nullglob
          for report in test-results/local-review/*.json; do
            scratch="$(jq -r .directory "$report")"
            case "$scratch" in
              "$RUNNER_TEMP"/ps525-2336-review-scratch/pstdio-local-review-*) ;;
              *) echo "Unexpected review scratch directory: $scratch" >&2; exit 1 ;;
            esac
            target="$GITHUB_WORKSPACE/$REVIEW_EVIDENCE/$(basename "$scratch")"
            mkdir -p "$target"
            for relative in checks.json logs compose-projects.jsonl; do
              if [[ -e "$scratch/$relative" ]]; then cp -R "$scratch/$relative" "$target/"; fi
            done
            for relative in test-results packages/e2e/test-results packages/ui/test-results \
              packages/canvas-tests/test-results clients/desktop/test-results; do
              if [[ -d "$scratch/source/$relative" ]]; then
                mkdir -p "$target/$(dirname "$relative")"
                cp -R "$scratch/source/$relative" "$target/$relative"
              fi
            done
          done
          {
            docker ps -a --format '{{.Names}} {{.Status}} {{.Label "com.docker.compose.project"}}'
            docker network ls --format '{{.Name}} {{.Label "com.docker.compose.project"}}'
            docker volume ls --format '{{.Name}} {{.Label "com.docker.compose.project"}}'
          } > "$REVIEW_EVIDENCE/docker-after.txt"

      - name: Upload exact candidate and selected-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps525-2336-review-09efa341-attempt-${{ github.run_attempt }}
          path: |
            test-results/ps525-2336-review
            test-results/local-review
          if-no-files-found: error
