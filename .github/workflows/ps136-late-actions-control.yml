name: PS136 Node lifecycle capture correction
on:
  push:
    branches: [test/ps136-late-actions-control-20261117]
permissions:
  contents: read
env:
  NX_DAEMON: "false"
jobs:
  owning:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        owner: [original-packaged]
    env:
      GH_TOKEN: ${{ github.token }}
      UI_PERF_ASSERT_BUDGETS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Set up pinned Bun in Playwright image
        run: |
          echo "BUN_INSTALL_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          echo "E2E_BUN_CACHE_DIR=/tmp/pstdio-ci-bun-cache" >> "$GITHUB_ENV"
          node scripts/ci/setup-container-bun.ts
      - uses: ./.github/actions/setup-ci-cache
        with:
          profile: playwright
      - name: Run real controlled component policy arrival
        if: matrix.owner == 'controlled-canvas'
        run: bun scripts/test.ts --file packages/canvas-tests/src/ui/pstdio-workbench/late-panel-actions.p1.spec.ts --out test-results/ci/panel-control-plan.json
      - name: Execute unchanged complete original empty-panel actions/assertions with lifecycle capture
        if: matrix.owner == 'original-packaged'
        run: bun scripts/test.ts --file packages/e2e/src/packaged/packaged-empty-panels.p2.spec.ts --out test-results/ci/panel-menu-plan.json
      - name: Preserve original failure and before-cleanup DOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps136-${{ matrix.owner }}-lifecycle-attempt-${{ github.run_attempt }}
          path: |
            test-results/ci
            packages/e2e/test-results
            packages/canvas-tests/test-results
            packages/canvas-tests/playwright-report
          if-no-files-found: error
