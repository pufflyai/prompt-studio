name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@latest

      - name: Verify runtime
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build monorepo
        run: bun run build

      - name: Compile platform binaries
        run: bun run scripts/build-all.ts

      - name: Scaffold platform packages
        run: bun run scripts/scaffold-platform-packages.ts

      - name: Verify binaries
        run: bun run scripts/verify-packages.ts

      - name: Generate checksums
        run: bun run scripts/generate-checksums.ts

      - name: Publish platform packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bun run scripts/publish-platform-packages.ts

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
          version: bash scripts/version.sh
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: steps.changesets.outputs.published == 'true'
        run: git push --tags

      - name: Upload binaries to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "pstdio") | .version')
          if [ -z "$VERSION" ]; then
            echo "pstdio was not published in this run. Skipping binary upload."
            exit 0
          fi

          TAG="pstdio@${VERSION}"
          ASSETS=(
            "packages/pstdio/dist/platforms/cli-darwin-arm64/bin/pstdio#pstdio-darwin-arm64"
            "packages/pstdio/dist/platforms/cli-darwin-x64/bin/pstdio#pstdio-darwin-x64"
            "packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio#pstdio-linux-x64"
            "packages/pstdio/dist/platforms/cli-linux-arm64/bin/pstdio#pstdio-linux-arm64"
            "packages/pstdio/dist/platforms/cli-linux-x64-musl/bin/pstdio#pstdio-linux-x64-musl"
            "packages/pstdio/dist/platforms/cli-linux-arm64-musl/bin/pstdio#pstdio-linux-arm64-musl"
            "packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe#pstdio-win-x64.exe"
            "packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe#pstdio-win-arm64.exe"
            "packages/pstdio/dist/platforms/checksums.sha256#checksums.sha256"
            "scripts/install.sh#install.sh"
          )

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG with binary assets."
            gh release create "$TAG" --title "$TAG" --generate-notes "${ASSETS[@]}"
            exit 0
          fi

          IS_IMMUTABLE=$(gh release view "$TAG" --json isImmutable -q '.isImmutable')
          if [ "$IS_IMMUTABLE" = "true" ]; then
            echo "Release $TAG is immutable. Verifying required assets."
            EXISTING_ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name')
            MISSING_ASSETS=()

            for asset in "${ASSETS[@]}"; do
              asset_name="${asset#*#}"
              if ! echo "$EXISTING_ASSETS" | grep -Fxq "$asset_name"; then
                MISSING_ASSETS+=("$asset_name")
              fi
            done

            if [ ${#MISSING_ASSETS[@]} -gt 0 ]; then
              echo "::error::Release $TAG is immutable and missing assets: ${MISSING_ASSETS[*]}"
              echo "::error::Delete and recreate the release/tag, then rerun this workflow."
              exit 1
            fi

            echo "All required assets already exist on immutable release $TAG. Skipping upload."
            exit 0
          fi

          gh release upload "$TAG" --clobber "${ASSETS[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Releases for other packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in $(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name != "pstdio") | "\(.name)@\(.version)"'); do
            tag="${pkg}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
