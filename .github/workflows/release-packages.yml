name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@latest

      - name: Verify runtime
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Compile platform binaries
        run: bun run scripts/build-all.ts

      - name: Scaffold platform packages
        run: bun run scripts/scaffold-platform-packages.ts

      - name: Verify binaries
        run: bun run scripts/verify-packages.ts

      - name: Generate checksums
        run: bun run scripts/generate-checksums.ts

      - name: Publish platform packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bun run scripts/publish-platform-packages.ts

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
          version: bash scripts/version.sh
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: steps.changesets.outputs.published == 'true'
        run: git push --tags

      - name: Create pstdio GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "pstdio") | .version')
          if [ -n "$VERSION" ]; then
            TAG="pstdio@${VERSION}"
            RELEASE_ASSETS_DIR="packages/pstdio/dist/release-assets"

            rm -rf "$RELEASE_ASSETS_DIR"
            mkdir -p "$RELEASE_ASSETS_DIR"

            install -m 755 packages/pstdio/dist/platforms/cli-darwin-arm64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-darwin-arm64"
            install -m 755 packages/pstdio/dist/platforms/cli-darwin-x64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-darwin-x64"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-x64"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-arm64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-arm64"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-x64-musl/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-x64-musl"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-arm64-musl/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-arm64-musl"
            install -m 755 packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe "$RELEASE_ASSETS_DIR/pstdio-win-x64.exe"
            install -m 755 packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe "$RELEASE_ASSETS_DIR/pstdio-win-arm64.exe"
            install -m 644 packages/pstdio/dist/platforms/checksums.sha256 "$RELEASE_ASSETS_DIR/checksums.sha256"
            install -m 755 scripts/install.sh "$RELEASE_ASSETS_DIR/install.sh"

            RELEASE_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || true)

            if [ "$RELEASE_DRAFT" = "true" ]; then
              echo "Release $TAG exists as a draft, uploading assets and publishing."
              gh release upload "$TAG" "$RELEASE_ASSETS_DIR"/* --clobber
              gh release edit "$TAG" --draft=false
            elif [ "$RELEASE_DRAFT" = "false" ]; then
              echo "Release $TAG already exists, skipping."
            else
              gh release create "$TAG" --title "$TAG" --generate-notes --draft --verify-tag
              gh release upload "$TAG" "$RELEASE_ASSETS_DIR"/*
              gh release edit "$TAG" --draft=false
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Releases for other packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          for pkg in $(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name != "pstdio") | "\(.name)@\(.version)"'); do
            tag="${pkg}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
