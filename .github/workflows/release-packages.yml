name: Release Packages

# Host releases build and verify every artifact before publishing. The manual packages
# channel publishes only SDK/UI previews. See ADRs 0072 and 0107.
on:
  push:
    branches:
      - main
  # Nightlies and SDK/UI previews reuse this workflow's existing npm publisher trust.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release stable, nightly, a stable patch, or SDK/UI previews only (packages)
        type: choice
        options:
          - stable
          - nightly
          - patch
          - packages
        default: stable
      base_tag:
        description: "Patch only: current stable tag, such as pstdio@0.43.1"
        type: string
      source_sha:
        description: "Patch only: full commit SHA of the reviewed fixes, based on base_tag"
        type: string
      summary:
        description: "Patch only: one-line release note"
        type: string
      publish_patch:
        description: "Patch only: publish after verification (false builds and verifies without publishing)"
        type: boolean
        default: false

# Runs of one channel never overlap, so two attempts never publish at once. A newer run
# replaces a run of the same channel that is still waiting. A queued nightly never replaces
# a queued stable run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel == 'packages' && 'packages' || (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package_previews:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.channel == 'packages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts
      - name: Give SDK/UI previews a source-based version
        run: bun run --cwd scripts release:packages:version
      - name: Build SDK and UI with their dependencies
        run: bunx lerna run build --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Check preview release contracts
        run: >-
          bun test scripts/release/package-preview-version.test.ts
          scripts/release/package-preview-publish.test.ts
          scripts/verify/extension-api-registry.test.ts scripts/verify/extension-api-baselines.test.ts
      - name: Check packed public API exports
        run: bun scripts/verify/published-type-exports.ts sdk ui
      - name: Install, typecheck, and bundle packed SDK/UI consumers
        run: bun scripts/verify/public-package-consumer.ts sdk ui
      - name: Pack both previews before publication
        run: bun run --cwd scripts release:packages:publish --dry-run
      - name: Publish only SDK and UI with the preview tag
        env:
          NPM_CONFIG_PROVENANCE: true
        run: bun run --cwd scripts release:packages:publish

  # The workflow stays on main for signing trust. Only the build checkout changes.
  prepare_patch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.channel == 'patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release: ${{ steps.patch.outputs.release }}
      version: ${{ steps.patch.outputs.version }}
      tag: ${{ steps.patch.outputs.tag }}
      commit: ${{ steps.patch.outputs.commit }}
      previous_tag: ${{ steps.patch.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts
      - name: Prepare the patch candidate
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATCH_BASE_TAG: ${{ inputs.base_tag }}
          PATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PATCH_SUMMARY: ${{ inputs.summary }}
        run: bun scripts/release/prepare-patch.ts

  # Decides whether this run releases, and places the tag that packaged apps install
  # core extensions from. Verification needs that tag, so it exists before any check runs.
  plan:
    needs: prepare_patch
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.channel != 'packages' &&
      (needs.prepare_patch.result == 'success' || needs.prepare_patch.result == 'skipped') }}
    runs-on: ubuntu-latest
    # These are the limits of the plan and nightly jobs this job replaces. The nightly path
    # installs dependencies and versions the packages.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 30 || 5 }}
    permissions:
      contents: write
      actions: read
    outputs:
      release: ${{ needs.prepare_patch.outputs.release || steps.stable.outputs.release || steps.nightly.outputs.release }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ needs.prepare_patch.outputs.version || steps.stable.outputs.version || steps.nightly.outputs.version || steps.existing.outputs.version }}
      tag: ${{ needs.prepare_patch.outputs.tag || steps.stable.outputs.tag || steps.nightly.outputs.tag || steps.existing.outputs.tag }}
      commit: ${{ needs.prepare_patch.outputs.commit || steps.stable.outputs.commit || steps.nightly.outputs.commit || steps.existing.outputs.commit }}
      previous_tag: ${{ needs.prepare_patch.outputs.previous_tag || steps.stable.outputs.previous_tag }}
      candidate_run_id: ${{ steps.existing.outputs.artifact_run_id }}
      candidate_attempt: ${{ steps.existing.outputs.artifact_attempt }}
      source_sha: ${{ inputs.channel == 'patch' && inputs.source_sha || (steps.channel.outputs.channel == 'nightly' && github.sha || steps.stable.outputs.commit) }}
      # Nightly tags are pruned, so nightly builds install core extensions from the main commit.
      extension_ref: ${{ steps.channel.outputs.channel == 'nightly' && github.sha || needs.prepare_patch.outputs.tag || steps.stable.outputs.tag }}
      targets: ${{ steps.channel.outputs.channel == 'nightly' && '["darwin-arm64","darwin-x64","linux-x64"]' || '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose the channel
        id: channel
        run: echo "channel=${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Plan the stable release
        id: stable
        if: steps.channel.outputs.channel == 'stable' && inputs.channel != 'patch'
        run: bun scripts/release/plan-release.ts

      # Only an unpublished release reaches this step, so moving its tag affects nothing users see.
      - name: Place the release tag
        if: steps.stable.outputs.place_tag == 'true'
        env:
          COMMIT: ${{ steps.stable.outputs.commit }}
          TAG: ${{ steps.stable.outputs.tag }}
        run: git push --force origin "$COMMIT:refs/tags/$TAG"

      # Main changes many times a day, and signing and notarizing costs runner minutes,
      # so a nightly runs only when main moved since the newest published nightly.
      - name: Compare main with the newest nightly
        id: changed
        if: steps.channel.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          LAST_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease and (.tagName | test("^pstdio@.+-nightly\\.")))) | .[0].tagName // ""')
          # A nightly tag points at its version commit, whose parent is the main commit it built.
          if [ -n "$LAST_TAG" ] && [ "$(gh api "repos/$GH_REPO/commits/$LAST_TAG" --jq '.parents[0].sha')" = "$GITHUB_SHA" ]; then
            echo "Main has not changed since $LAST_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "previous_candidate_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover exact artifacts for daily unchanged-candidate validation
        id: existing
        continue-on-error: true
        if: steps.changed.outputs.changed == 'false'
        env:
          LAST_TAG: ${{ steps.changed.outputs.previous_candidate_tag }}
        run: bun scripts/ci/production-existing-candidate.ts "$LAST_TAG" "$GITHUB_SHA"

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true' || (steps.changed.outputs.changed == 'false' && steps.existing.outcome == 'failure')
        run: node scripts/ci/install-native-dependencies.ts

      # The version change is never pushed to main. The tag keeps it so every job builds the same versions.
      - name: Version and tag the nightly
        id: nightly
        if: steps.changed.outputs.changed == 'true' || (steps.changed.outputs.changed == 'false' && steps.existing.outcome == 'failure')
        run: |
          set -euo pipefail
          PSTDIO_STABLE_TAG=$(gh release view --json tagName --jq .tagName)
          export PSTDIO_STABLE_TAG
          bun run --cwd scripts release:version --nightly
          VERSION=$(jq -r .version packages/pstdio/package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version nightly pstdio@$VERSION"
          git tag "pstdio@$VERSION"
          git push origin "refs/tags/pstdio@$VERSION"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  release_build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Build and verify immutable publication artifacts
        uses: ./.github/actions/build-release
      - name: Record source and build identity
        id: identity
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION_SHA: ${{ needs.plan.outputs.commit }}
        run: |
          bun -e 'await Bun.write("production-build-identity.json", JSON.stringify({sourceSha: process.env.SOURCE_SHA, versionSha: process.env.VERSION_SHA, toolchain: "bun-" + Bun.version}))'
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Archive outputs once for validation and publication
        run: bun scripts/ci/production-archive.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-attempt-${{ github.run_attempt }}
          path: |
            release-build.tar.gz
            production-build-identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-identity-attempt-${{ github.run_attempt }}
          path: production-build-identity.json
          if-no-files-found: error


  containers:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/service-containers.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}
      original_source_sha: ${{ needs.plan.outputs.source_sha }}

  desktop:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      original_source_sha: ${{ needs.plan.outputs.source_sha }}
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.commit }}
      targets: ${{ needs.plan.outputs.targets }}
      extension_ref: ${{ needs.plan.outputs.extension_ref }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Nightlies build no Windows assets, so only stable releases check the Windows update.
  windows_update:
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'stable' && needs.desktop.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-windows-update.yml
    with:
      previous-tag: ${{ needs.plan.outputs.previous_tag }}
      candidate-ref: ${{ needs.plan.outputs.commit }}

  # A daily nightly and every stable candidate get the same deep diagnostics.
  # Publication below waits for this job only for stable releases.
  production:
    needs: [plan, release_build, containers, desktop]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/production-validation.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      artifact_run_id: ${{ github.run_id }}
      artifact_attempt: ${{ needs.release_build.outputs.artifact_attempt }}
      channel: ${{ needs.plan.outputs.channel }}

  production_unchanged:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release != 'true' && needs.plan.outputs.channel == 'nightly' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/production-validation.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      artifact_run_id: ${{ needs.plan.outputs.candidate_run_id }}
      artifact_attempt: ${{ needs.plan.outputs.candidate_attempt }}
      channel: nightly

  # Publishes only when every check passed. Each step skips work an earlier attempt finished,
  # so re-running this job completes a release that stopped halfway. The GitHub release is
  # published last: a published release means npm and every desktop asset shipped.
  publish:
    needs: [plan, release_build, containers, desktop, windows_update, production]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'stable' &&
      (inputs.channel != 'patch' || inputs.publish_patch) &&
      needs.release_build.result == 'success' &&
      (needs.plan.outputs.channel == 'nightly' || needs.production.result == 'success') &&
      needs.containers.result == 'success' &&
      needs.desktop.result == 'success' &&
      (needs.windows_update.result == 'success' || (needs.plan.outputs.channel == 'nightly' && needs.windows_update.result == 'skipped')) }}
    # Temporary: Playwright's Chromium does not install on Ubuntu 26.04 yet (ADR 0105).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      DIST_TAG: ${{ needs.plan.outputs.channel == 'nightly' && 'nightly' || 'latest' }}
      PRERELEASE: ${{ needs.plan.outputs.channel == 'nightly' }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ needs.release_build.outputs.artifact_attempt }}
      - uses: ./.github/actions/publish-release
        with:
          certificate-name: ${{ needs.production.outputs.certificate_name }}
          artifact-attempt: ${{ needs.release_build.outputs.artifact_attempt }}
          commit: ${{ needs.plan.outputs.commit }}
          version: ${{ needs.plan.outputs.version }}
          targets: ${{ needs.plan.outputs.targets }}
          channel: ${{ needs.plan.outputs.channel }}
          previous-tag: ${{ needs.plan.outputs.previous_tag }}
          patch: ${{ inputs.channel == 'patch' }}

  publish_nightly:
    needs: [plan, release_build, containers, desktop]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'nightly' &&
      (inputs.channel != 'patch' || inputs.publish_patch) &&
      needs.release_build.result == 'success' &&
      needs.containers.result == 'success' &&
      needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      DIST_TAG: ${{ needs.plan.outputs.channel == 'nightly' && 'nightly' || 'latest' }}
      PRERELEASE: ${{ needs.plan.outputs.channel == 'nightly' }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ needs.release_build.outputs.artifact_attempt }}
      - uses: ./.github/actions/publish-release
        with:
          artifact-attempt: ${{ needs.release_build.outputs.artifact_attempt }}
          commit: ${{ needs.plan.outputs.commit }}
          version: ${{ needs.plan.outputs.version }}
          targets: ${{ needs.plan.outputs.targets }}
          channel: ${{ needs.plan.outputs.channel }}
          previous-tag: ${{ needs.plan.outputs.previous_tag }}
          patch: ${{ inputs.channel == 'patch' }}

  # Runs only after a nightly published with every asset.
  nightly_prune:
    needs: [plan, publish_nightly]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'nightly' && needs.publish_nightly.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Delete older nightlies and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd scripts release:nightlies:prune "${{ needs.plan.outputs.tag }}"

  # Refresh after publication or patch verification so main skips reserved patch versions.
  # This job only prepares a version PR; it never publishes.
  version_pr:
    needs: [prepare_patch, publish]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' && inputs.channel != 'nightly' && inputs.channel != 'packages' &&
      needs.prepare_patch.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Read the current stable version baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          version: bun run --cwd scripts release:version
        env:
          PSTDIO_STABLE_TAG: ${{ steps.baseline.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
