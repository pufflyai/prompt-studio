name: Release Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/release-packages.yml"
      - "bun.lock"
      - "clients/desktop/**"
      - "package.json"
      - "extensions/**"
      - "packages/e2e/package.json"
      - "packages/e2e/src/packaged/**"
      - "packages/pstdio/**"
      - "packages/pstdio-*/**"
      - "packages/sdk/**"
      - "scripts/build/**"
      - "scripts/embed.json"
      - "scripts/release/**"
      - "scripts/verify/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify_packaged_bun_toolchain:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_pkg: cli-linux-x64
          - os: macos-15-intel
            platform_pkg: cli-darwin-x64
          - os: windows-latest
            platform_pkg: cli-win-x64
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify packaged Bun toolchain
        env:
          PSTDIO_VERIFY_PLATFORM_PKG: ${{ matrix.platform_pkg }}
        run: bun run --cwd scripts verify:packages

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify_packaged_bun_toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pstdio_published: ${{ steps.desktop_release.outputs.published }}
      pstdio_version: ${{ steps.desktop_release.outputs.version }}
      pstdio_tag: ${{ steps.desktop_release.outputs.tag }}
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin npm for trusted publishing
        run: npm i -g npm@11.16.0

      - name: Verify runtime
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate changesets
        run: bun run validate:changesets

      - name: Build monorepo
        run: bun run build

      - name: Compile platform binaries
        run: bun run --cwd scripts build:all

      - name: Scaffold platform packages
        run: bun run --cwd scripts release:platforms:scaffold

      - name: Verify binaries
        run: bun run --cwd scripts verify:packages

      - name: Generate checksums
        run: bun run --cwd scripts release:checksums

      - name: Publish platform packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bun run --cwd scripts release:platforms:publish

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
          version: bun run --cwd scripts release:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release tags
        id: release-packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PSTDIO_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: bun run --cwd scripts release:tags:push

      - name: Resolve desktop release
        id: desktop_release
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[] | select(.name == "pstdio") | .version')
          if [ -z "$VERSION" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pstdio@$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pstdio GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.release-packages.outputs.packages }}' | jq -r '.[] | select(.name == "pstdio") | .version')
          if [ -n "$VERSION" ]; then
            TAG="pstdio@${VERSION}"
            RELEASE_ASSETS_DIR="packages/pstdio/dist/release-assets"
            NOTES_FILE="$(mktemp)"
            bun run --cwd scripts release:changelog -- pstdio "$VERSION" > "$NOTES_FILE"

            rm -rf "$RELEASE_ASSETS_DIR"
            mkdir -p "$RELEASE_ASSETS_DIR"

            install -m 755 packages/pstdio/dist/platforms/cli-darwin-arm64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-darwin-arm64"
            install -m 755 packages/pstdio/dist/platforms/cli-darwin-x64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-darwin-x64"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-x64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-x64"
            install -m 755 packages/pstdio/dist/platforms/cli-linux-arm64/bin/pstdio "$RELEASE_ASSETS_DIR/pstdio-linux-arm64"
            install -m 755 packages/pstdio/dist/platforms/cli-win-x64/bin/pstdio.exe "$RELEASE_ASSETS_DIR/pstdio-win-x64.exe"
            install -m 755 packages/pstdio/dist/platforms/cli-win-arm64/bin/pstdio.exe "$RELEASE_ASSETS_DIR/pstdio-win-arm64.exe"
            install -m 644 packages/pstdio/dist/platforms/checksums.sha256 "$RELEASE_ASSETS_DIR/checksums.sha256"
            install -m 755 packages/pstdio/install.sh "$RELEASE_ASSETS_DIR/install.sh"

            RELEASE_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || true)

            if [ "$RELEASE_DRAFT" = "true" ]; then
              echo "Release $TAG exists as a draft, refreshing CLI assets."
              gh release upload "$TAG" "$RELEASE_ASSETS_DIR"/* --clobber
            elif [ "$RELEASE_DRAFT" = "false" ]; then
              echo "Release $TAG already exists, skipping."
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" --draft --verify-tag
              gh release upload "$TAG" "$RELEASE_ASSETS_DIR"/*
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Releases for other packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          echo '${{ steps.release-packages.outputs.packages }}' \
            | jq -c '.[] | select(.name != "pstdio")' \
            | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            version=$(echo "$entry" | jq -r '.version')
            tag="${name}@${version}"

            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag already exists, skipping."
              continue
            fi

            notes_file="${tmp_root}/${tag//\//_}.notes.md"
            bun run --cwd scripts release:changelog -- "$name" "$version" > "$notes_file"

            if [ -d "extensions/${name}" ]; then
              archive="${tmp_root}/${name}-${version}.tar.gz"
              git archive --format=tar.gz --prefix="${name}/" -o "$archive" "HEAD:extensions/${name}"
              gh release create "$tag" --title "$tag" --notes-file "$notes_file" "$archive"
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes_file"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop_release:
    if: needs.release.outputs.pstdio_published == 'true'
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.release.outputs.pstdio_version }}
      tag: ${{ needs.release.outputs.pstdio_tag }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
