name: Release Packages

on:
  push:
    branches:
      - main
  # Nightly builds live here, not in their own workflow, because npm trusted
  # publishing allows one publisher per package and names this workflow file.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: stable runs the release pipeline; nightly publishes a nightly build of main
        type: choice
        options:
          - stable
          - nightly
        default: stable

# A queued nightly must never replace a queued stable run, so each channel has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Native runners are slow and costly, so native checks run only when this commit
  # publishes a new pstdio version. The publish scripts use the same npm check.
  plan:
    if: github.event_name != 'schedule' && inputs.channel != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pstdio_release: ${{ steps.pstdio.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for an unpublished pstdio version
        id: pstdio
        run: |
          VERSION=$(jq -r .version packages/pstdio/package.json)
          if npm view "pstdio@$VERSION" version > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify_packaged_bun_toolchain:
    needs: plan
    if: needs.plan.outputs.pstdio_release == 'true'
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ github.sha }}

  release:
    # Every main commit keeps the version PR current. A skipped native check means
    # there is no pstdio version to publish.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.verify_packaged_bun_toolchain.result) }}
    needs: [plan, verify_packaged_bun_toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      pstdio_published: ${{ steps.release.outputs.published }}
      pstdio_version: ${{ steps.release.outputs.version }}
      pstdio_tag: ${{ steps.release.outputs.tag }}
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v5
        with:
          # Packaged checks in build-release read older release tags, such as the Planner upgrade check.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin npm for trusted publishing
        run: npm i -g npm@11.16.0

      - name: Verify runtime
        run: |
          node -v
          npm -v

      - name: Build release artifacts
        uses: ./.github/actions/build-release

      - name: Publish platform packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bun run --cwd scripts release:platforms:publish

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
          version: bun run --cwd scripts release:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: release
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(printf '%s' "$PUBLISHED_PACKAGES" | jq -r '.[] | select(.name == "pstdio") | .version')
          if [ -z "$VERSION" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "published=true"
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.release.outputs.published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: git push origin "refs/tags/pstdio@${VERSION}"

      - name: Create pstdio GitHub Release
        if: steps.release.outputs.published == 'true'
        uses: ./.github/actions/create-pstdio-release
        with:
          version: ${{ steps.release.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  desktop_release:
    if: needs.release.outputs.pstdio_published == 'true'
    needs: release
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.release.outputs.pstdio_version }}
      tag: ${{ needs.release.outputs.pstdio_tag }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Main changes many times a day, and signing and notarizing costs runner minutes,
  # so a nightly runs only when main moved since the newest published nightly.
  nightly_plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.channel == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Compare main with the newest nightly
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease and (.tagName | test("^pstdio@.+-nightly\\.")))) | .[0].tagName // ""')
          # A nightly tag points at its version commit, whose parent is the main commit it built.
          if [ -n "$LAST_TAG" ] && [ "$(gh api "repos/$GH_REPO/commits/$LAST_TAG" --jq '.parents[0].sha')" = "$GITHUB_SHA" ]; then
            echo "Main has not changed since $LAST_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs the same version script and build action as a stable release, so every
  # nightly also tests the release steps.
  nightly:
    needs: nightly_plan
    if: needs.nightly_plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      NPM_CONFIG_PROVENANCE: true
      # The compiled CLI installs core extensions from this main commit, not from the
      # nightly tag, which is deleted once a newer nightly is published.
      PSTDIO_EXTENSION_RELEASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Packaged checks in build-release read older release tags, such as the Planner upgrade check.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin npm for trusted publishing
        run: npm i -g npm@11.16.0

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Version nightly
        id: version
        run: |
          set -euo pipefail
          bun run --cwd scripts release:version --nightly
          VERSION=$(jq -r .version packages/pstdio/package.json)
          {
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
          } >> "$GITHUB_OUTPUT"

      # The version change is never pushed to main. The tag keeps it so the desktop
      # workflow builds the same versions.
      - name: Commit nightly version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version nightly $TAG"
          git tag "$TAG"

      - name: Build release artifacts
        uses: ./.github/actions/build-release

      - name: Publish platform packages
        run: bun run --cwd scripts release:platforms:publish nightly

      - name: Publish npm packages
        run: bunx changeset publish --tag nightly --no-git-tag

      - name: Push nightly tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$TAG"

      - name: Create pstdio GitHub prerelease
        uses: ./.github/actions/create-pstdio-release
        with:
          version: ${{ steps.version.outputs.version }}
          prerelease: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  nightly_desktop:
    needs: nightly
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.nightly.outputs.version }}
      tag: ${{ needs.nightly.outputs.tag }}
      targets: '["darwin-arm64","darwin-x64","linux-x64"]'
      prerelease: true
      # Main is never force-pushed, so this commit stays fetchable after the tag is pruned.
      extension_ref: ${{ github.sha }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Runs only after the desktop workflow published the new nightly with every asset.
  nightly_prune:
    needs: [nightly, nightly_desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Delete older nightlies and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd scripts release:nightlies:prune "${{ needs.nightly.outputs.tag }}"
