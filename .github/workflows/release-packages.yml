name: Release Packages
# Verify runs name their candidate so the scheduled dry run and the repair loop can find them.
# Other runs keep GitHub's default title, because a blank run-name falls back to it.
run-name: ${{ inputs.channel == 'verify' && format('Release Packages · verify {0}', inputs.source_sha) || '' }}

# Host releases build and verify every artifact before publishing. The manual packages
# channel publishes only SDK/UI previews. See ADRs 0072 and 0107.
on:
  push:
    branches:
      - main
  # Nightlies and SDK/UI previews reuse this workflow's existing npm publisher trust.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release stable, nightly, a patch, SDK/UI previews (packages), or verify without publishing
        type: choice
        options:
          - stable
          - nightly
          - patch
          - packages
          - verify
        default: stable
      base_tag:
        description: "Patch only: current stable tag, such as pstdio@0.43.1"
        type: string
      source_sha:
        description: "Patch: reviewed fix SHA. Verify: full SHA of the Changesets version candidate."
        type: string
      summary:
        description: "Patch only: one-line release note"
        type: string
      publish_patch:
        description: "Patch only: publish after verification (false builds and verifies without publishing)"
        type: boolean
        default: false

# Runs of one channel never overlap, so two attempts never publish at once. A newer run
# replaces a run of the same channel that is still waiting. A queued nightly never replaces
# a queued stable run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel == 'verify' && 'verify' || inputs.channel == 'packages' && 'packages' || (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package_previews:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.channel == 'packages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Install dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Give SDK/UI previews a source-based version
        run: bun run --cwd scripts release:packages:version
      - name: Build SDK and UI with their dependencies
        run: bunx lerna run build --scope @pstdio/sdk --scope @pstdio/ui --include-dependencies
      - name: Check packed public API exports
        run: bun scripts/verify/published-type-exports.ts sdk ui
      - name: Install, typecheck, and bundle packed SDK/UI consumers
        run: bun scripts/verify/public-package-consumer.ts sdk ui
      - name: Pack both previews before publication
        run: bun run --cwd scripts release:packages:publish --dry-run
      - name: Publish only SDK and UI with the preview tag
        env:
          NPM_CONFIG_PROVENANCE: true
        run: bun run --cwd scripts release:packages:publish

  # The workflow stays on main for signing trust. Only the build checkout changes.
  prepare_patch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.channel == 'patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release: ${{ steps.patch.outputs.release }}
      version: ${{ steps.patch.outputs.version }}
      tag: ${{ steps.patch.outputs.tag }}
      commit: ${{ steps.patch.outputs.commit }}
      previous_tag: ${{ steps.patch.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Install dependencies
        run: bun scripts/ci/install-native-dependencies.ts
      - name: Prepare the patch candidate
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATCH_BASE_TAG: ${{ inputs.base_tag }}
          PATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PATCH_SUMMARY: ${{ inputs.summary }}
        run: bun scripts/release/prepare-patch.ts

  # Decides whether this run releases, and places the tag that packaged apps install
  # core extensions from. Verification needs that tag, so it exists before any check runs.
  plan:
    needs: prepare_patch
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.channel != 'packages' &&
      (needs.prepare_patch.result == 'success' || needs.prepare_patch.result == 'skipped') }}
    runs-on: ubuntu-latest
    # These are the limits of the plan and nightly jobs this job replaces. The nightly path
    # installs dependencies and versions the packages.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 30 || 5 }}
    permissions:
      contents: write
      actions: read
    outputs:
      release: ${{ steps.verify.outputs.release || needs.prepare_patch.outputs.release || steps.stable.outputs.release || steps.nightly.outputs.release }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.verify.outputs.version || needs.prepare_patch.outputs.version || steps.stable.outputs.version || steps.nightly.outputs.version }}
      tag: ${{ steps.verify.outputs.tag || needs.prepare_patch.outputs.tag || steps.stable.outputs.tag || steps.nightly.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit || needs.prepare_patch.outputs.commit || steps.stable.outputs.commit || steps.nightly.outputs.commit }}
      previous_tag: ${{ steps.verify.outputs.previous_tag || needs.prepare_patch.outputs.previous_tag || steps.stable.outputs.previous_tag }}
      harness_smoke: ${{ steps.harness_smoke.outputs.required }}
      harness_smoke_baseline: ${{ steps.harness_smoke.outputs.baseline }}
      source_sha: ${{ steps.verify.outputs.source_sha || (inputs.channel == 'patch' && inputs.source_sha || (steps.channel.outputs.channel == 'nightly' && github.sha || steps.stable.outputs.commit)) }}
      # Nightly tags are pruned, so nightly builds install core extensions from the main commit.
      extension_ref: ${{ steps.verify.outputs.commit || (steps.channel.outputs.channel == 'nightly' && github.sha || needs.prepare_patch.outputs.tag || steps.stable.outputs.tag) }}
      targets: ${{ steps.channel.outputs.channel == 'nightly' && '["darwin-arm64","linux-x64"]' || '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose the channel
        id: channel
        run: echo "channel=${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.channel == 'verify' && inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - name: Plan the stable release
        id: stable
        if: steps.channel.outputs.channel == 'stable' && inputs.channel != 'patch' && inputs.channel != 'verify'
        run: bun scripts/release/plan-release.ts

      - name: Select the exact version candidate for verification without placing a release tag
        id: verify
        if: inputs.channel == 'verify'
        env:
          CANDIDATE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bun -e 'if (!/^[a-f0-9]{40}$/.test(process.env.CANDIDATE_SHA ?? "")) throw new Error("Verify requires the full Changesets version candidate SHA");'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git show -s --format=%s HEAD)" = "Version Packages"
          VERSION=$(bun -e 'console.log((await Bun.file("packages/pstdio/package.json").json()).version)')
          PREVIOUS_TAG=$(gh release view --json tagName --jq .tagName)
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
            echo "commit=$CANDIDATE_SHA"
            echo "source_sha=$(git rev-parse HEAD^)"
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      # Only an unpublished release reaches this step, so moving its tag affects nothing users see.
      - name: Place the release tag
        if: steps.stable.outputs.place_tag == 'true'
        env:
          COMMIT: ${{ steps.stable.outputs.commit }}
          TAG: ${{ steps.stable.outputs.tag }}
        run: git push --force origin "$COMMIT:refs/tags/$TAG"

      # Main changes many times a day, and signing and notarizing costs runner minutes,
      # so a nightly runs only when main moved since the newest published nightly.
      - name: Compare main with the newest nightly
        id: changed
        if: steps.channel.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          LAST_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease and (.tagName | test("^pstdio@.+-nightly\\.")))) | .[0].tagName // ""')
          echo "previous_nightly_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          # A nightly tag points at its version commit, whose parent is the main commit it built.
          if [ -n "$LAST_TAG" ] && [ "$(gh api "repos/$GH_REPO/commits/$LAST_TAG" --jq '.parents[0].sha')" = "$GITHUB_SHA" ]; then
            echo "Main has not changed since $LAST_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: bun scripts/ci/install-native-dependencies.ts

      # The version change is never pushed to main. The tag keeps it so every job builds the same versions.
      - name: Version and tag the nightly
        id: nightly
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PSTDIO_STABLE_TAG=$(gh release view --json tagName --jq .tagName)
          export PSTDIO_STABLE_TAG
          bun run --cwd scripts release:version --nightly
          VERSION=$(jq -r .version packages/pstdio/package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version nightly pstdio@$VERSION"
          git tag "pstdio@$VERSION"
          git push origin "refs/tags/pstdio@$VERSION"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Select the packaged harness smoke
        id: harness_smoke
        if: needs.prepare_patch.outputs.release == 'true' || steps.stable.outputs.release == 'true' || steps.nightly.outputs.release == 'true' || steps.verify.outputs.release == 'true'
        env:
          BASELINE: ${{ steps.channel.outputs.channel == 'nightly' && steps.changed.outputs.previous_nightly_tag || needs.prepare_patch.outputs.previous_tag || steps.stable.outputs.previous_tag || steps.verify.outputs.previous_tag }}
          CANDIDATE: ${{ steps.verify.outputs.commit || needs.prepare_patch.outputs.commit || steps.stable.outputs.commit || steps.nightly.outputs.commit }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          required=true
          if [[ -n "$BASELINE" ]]; then
            previous=$(git rev-parse --verify "refs/tags/$BASELINE^{commit}")
            candidate="$CANDIDATE"
            if [[ "$CHANNEL" == nightly ]]; then
              # Compare source commits so nightly version bumps do not look like harness changes.
              previous=$(git rev-parse --verify "$previous^")
              candidate="$GITHUB_SHA"
            fi
            changed=$(git diff --name-only "$previous" "$candidate" -- \
              ':(glob)extensions/harness-*/**' \
              packages/pstdio-api/src/features/extensions \
              packages/pstdio-api/files/extension-catalog.json \
              packages/pstdio-extensions/src/runtime \
              scripts/build \
              packages/e2e/src/packaged/packaged-harness-smoke.ts \
              .github/workflows/release-desktop.yml .github/workflows/release-packages.yml)
            if [[ -z "$changed" ]]; then required=false; fi
          fi
          {
            echo "required=$required"
            echo "baseline=$BASELINE"
          } >> "$GITHUB_OUTPUT"
          echo "Packaged harness smoke required: $required" >> "$GITHUB_STEP_SUMMARY"

  # Prepared extension runtimes include the native Bun/OS/architecture identity.
  # Cross-compiling the CLI on Linux alone leaves Apple Silicon doing cold builds.
  release_mac_cli:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      PSTDIO_PREBUILD_UPGRADE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - run: bun scripts/ci/install-native-dependencies.ts
      - run: bun run build -- --scope pstdio --include-dependencies
      - uses: actions/upload-artifact@v4
        id: archive
        with:
          name: native-mac-cli-attempt-${{ github.run_attempt }}
          path: dist/pstdio
          if-no-files-found: error

  release_build:
    needs: [plan, release_mac_cli]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.release_mac_cli.result == 'success' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
      build_artifact_id: ${{ steps.archive.outputs.artifact-id }}
    env:
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      PSTDIO_PREBUILD_UPGRADE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"
      - name: Download the native Apple Silicon CLI from this candidate
        uses: ./.github/actions/download-artifact-by-id
        with:
          artifact-ids: ${{ needs.release_mac_cli.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-mac-cli
      - name: Build and verify immutable publication artifacts
        uses: ./.github/actions/build-release
        env:
          PSTDIO_NATIVE_MAC_CLI: ${{ runner.temp }}/native-mac-cli/pstdio
      - name: Record source and build identity
        id: identity
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION_SHA: ${{ needs.plan.outputs.commit }}
        run: |
          bun -e 'await Bun.write("production-build-identity.json", JSON.stringify({sourceSha: process.env.SOURCE_SHA, versionSha: process.env.VERSION_SHA, toolchain: "bun-" + Bun.version}))'
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Archive outputs once for validation and publication
        run: bun scripts/ci/production-archive.ts
      - uses: actions/upload-artifact@v4
        id: archive
        with:
          name: release-build-attempt-${{ github.run_attempt }}
          path: |
            release-build.tar.gz
            production-build-identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-identity-attempt-${{ github.run_attempt }}
          path: production-build-identity.json
          if-no-files-found: error


  containers:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/service-containers.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}
      original_source_sha: ${{ needs.plan.outputs.source_sha }}

  desktop:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      original_source_sha: ${{ needs.plan.outputs.source_sha }}
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.commit }}
      targets: ${{ needs.plan.outputs.targets }}
      extension_ref: ${{ needs.plan.outputs.extension_ref }}
      harness_smoke: ${{ needs.plan.outputs.harness_smoke == 'true' }}
      harness_smoke_baseline: ${{ needs.plan.outputs.harness_smoke_baseline }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Nightlies build no Windows assets, so only stable releases check the Windows update.
  windows_update:
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'stable' && needs.desktop.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-windows-update.yml
    with:
      previous-tag: ${{ needs.plan.outputs.previous_tag }}
      candidate-ref: ${{ needs.plan.outputs.commit }}

  # Full production validation gates stable, patch and verify candidates. Nightlies publish after
  # the build, desktop release flows and upgrade paths pass; the twice-daily Release Dry Run
  # (release-dry-run.yml) runs this validation on the next stable candidate instead.
  production:
    needs: [plan, release_build, containers, desktop]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel != 'nightly' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/production-validation.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      artifact_run_id: ${{ github.run_id }}
      artifact_attempt: ${{ needs.release_build.outputs.artifact_attempt }}
      channel: ${{ needs.plan.outputs.channel }}
      stable_tag: ${{ needs.plan.outputs.previous_tag }}

  # Publishes only when every check passed. Each step skips work an earlier attempt finished,
  # so re-running this job completes a release that stopped halfway. The GitHub release is
  # published last: a published release means npm and every desktop asset shipped.
  publish:
    needs: [plan, release_build, containers, desktop, windows_update, production]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'stable' &&
      inputs.channel != 'verify' &&
      (inputs.channel != 'patch' || inputs.publish_patch) &&
      needs.release_build.result == 'success' &&
      (needs.plan.outputs.channel == 'nightly' || needs.production.result == 'success') &&
      needs.containers.result == 'success' &&
      needs.desktop.result == 'success' &&
      (needs.windows_update.result == 'success' || (needs.plan.outputs.channel == 'nightly' && needs.windows_update.result == 'skipped')) }}
    # Temporary: Playwright's Chromium does not install on Ubuntu 26.04 yet (ADR 0105).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      DIST_TAG: ${{ needs.plan.outputs.channel == 'nightly' && 'nightly' || 'latest' }}
      PRERELEASE: ${{ needs.plan.outputs.channel == 'nightly' }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-build-attempt-${{ needs.release_build.outputs.artifact_attempt }}
      - uses: ./.github/actions/publish-release
        with:
          certificate-name: ${{ needs.production.outputs.certificate_name }}
          artifact-attempt: ${{ needs.release_build.outputs.artifact_attempt }}
          commit: ${{ needs.plan.outputs.commit }}
          version: ${{ needs.plan.outputs.version }}
          targets: ${{ needs.plan.outputs.targets }}
          channel: ${{ needs.plan.outputs.channel }}
          previous-tag: ${{ needs.plan.outputs.previous_tag }}
          patch: ${{ inputs.channel == 'patch' }}

  nightly_upgrade:
    needs: [plan, release_build]
    # Normal nightlies skip prepare_patch. Check the required jobs explicitly so that
    # the skipped ancestor doesn't suppress verification of a successful nightly build.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.release_build.result == 'success' &&
      needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'nightly' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-project-upgrade.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      source_sha: ${{ needs.plan.outputs.source_sha }}
      artifact_run_id: ${{ github.run_id }}
      artifact_attempt: ${{ needs.release_build.outputs.artifact_attempt }}
      build_artifact_id: ${{ needs.release_build.outputs.build_artifact_id }}
      include_previous_nightly: true

  publish_nightly:
    needs: [plan, release_build, containers, desktop, nightly_upgrade]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'nightly' &&
      inputs.channel != 'verify' &&
      (inputs.channel != 'patch' || inputs.publish_patch) &&
      needs.release_build.result == 'success' && needs.nightly_upgrade.result == 'success' &&
      needs.containers.result == 'success' &&
      needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      DIST_TAG: ${{ needs.plan.outputs.channel == 'nightly' && 'nightly' || 'latest' }}
      PRERELEASE: ${{ needs.plan.outputs.channel == 'nightly' }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/download-artifact-by-id
        with:
          artifact-ids: ${{ needs.release_build.outputs.build_artifact_id }}
          merge-multiple: true
      - uses: ./.github/actions/publish-release
        with:
          artifact-attempt: ${{ needs.release_build.outputs.artifact_attempt }}
          commit: ${{ needs.plan.outputs.commit }}
          version: ${{ needs.plan.outputs.version }}
          targets: ${{ needs.plan.outputs.targets }}
          channel: ${{ needs.plan.outputs.channel }}
          previous-tag: ${{ needs.plan.outputs.previous_tag }}
          patch: ${{ inputs.channel == 'patch' }}

      - name: Report dispatch-to-publication time
        continue-on-error: true
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .published_at)
          seconds=$(( $(date -d "$published" +%s) - $(date -d "$started" +%s) ))
          echo "Nightly published in ${seconds}s (target <1800s)." >> "$GITHUB_STEP_SUMMARY"
          if (( seconds >= 1800 )); then echo "::warning::Nightly exceeded its 30-minute delivery target (${seconds}s)"; fi

  # Performance measurements start independently when a candidate exists or after publication.
  # A dispatch failure remains advisory and cannot fail an otherwise delivered release.
  benchmarks:
    needs: [plan, release_build, production, publish]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.production.outputs.candidate_artifact_id != '') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      ARTIFACT_ATTEMPT: ${{ needs.release_build.outputs.artifact_attempt }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.production.outputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_RUN_ID: ${{ github.run_id }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      WORKFLOW_REF: ${{ github.event.repository.default_branch }}
    steps:
      - name: Start the release benchmarks
        if: ${{ !cancelled() && needs.plan.outputs.channel != 'nightly' && inputs.channel != 'verify' && needs.publish.result == 'success' }}
        run: |
          set -euo pipefail
          # Releases publish more targets than there are benchmark hosts. Keep this list in step with RUNNERS in
          # benchmarks.yml, which stops the whole run on any other platform.
          platforms=$(jq -r 'map(select(IN("linux-x64", "darwin-arm64", "win32-x64"))) | join(",")' <<< "$TARGETS")
          gh workflow run benchmarks.yml --ref "$TAG" \
            -f commits="$COMMIT" -f platforms="$platforms" -f release_tag="$TAG"

      - name: Start artifact performance observations
        if: ${{ !cancelled() && env.CANDIDATE_ARTIFACT_ID != '' }}
        run: |
          set -euo pipefail
          gh workflow run production-performance.yml --ref "$WORKFLOW_REF" \
            -f ref="$COMMIT" -f source_sha="$SOURCE_SHA" \
            -f artifact_run_id="$ARTIFACT_RUN_ID" -f artifact_attempt="$ARTIFACT_ATTEMPT" \
            -f candidate_artifact_id="$CANDIDATE_ARTIFACT_ID" \
            -f candidate_artifact_run_id="$CANDIDATE_ARTIFACT_RUN_ID" -f channel="$CHANNEL"
      - name: Report unavailable performance inputs
        if: ${{ !cancelled() && env.CANDIDATE_ARTIFACT_ID == '' }}
        run: echo "Performance observations were not dispatched because the candidate identity is unavailable." >> "$GITHUB_STEP_SUMMARY"

  # Runs only after a nightly published with every asset.
  nightly_prune:
    needs: [plan, publish_nightly]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'nightly' && needs.publish_nightly.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Delete older nightlies and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd scripts release:nightlies:prune "${{ needs.plan.outputs.tag }}"

  # Refresh after publication or patch verification so main skips reserved patch versions.
  # This job only prepares a version PR; it never publishes.
  version_pr:
    needs: [prepare_patch, publish]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' && inputs.channel != 'nightly' && inputs.channel != 'packages' && inputs.channel != 'verify' &&
      needs.prepare_patch.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - name: Install dependencies
        run: bun scripts/ci/install-native-dependencies.ts

      - name: Read the current stable version baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          version: bun run --cwd scripts release:version
        env:
          PSTDIO_STABLE_TAG: ${{ steps.baseline.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
