name: Release Packages

# One pipeline publishes stable releases and nightlies. It builds and verifies every
# artifact from one commit first, and publishes npm packages and desktop apps together
# only when everything passed. A failed release resumes with "Re-run failed jobs" or
# with the next push to main. See ADR 0072.
on:
  push:
    branches:
      - main
  # Nightly builds live here, not in their own workflow, because npm trusted
  # publishing allows one publisher per package and names this workflow file.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release a version on main, build a nightly, or patch the current stable release
        type: choice
        options:
          - stable
          - nightly
          - patch
        default: stable
      base_tag:
        description: "Patch only: current stable tag, such as pstdio@0.43.1"
        type: string
      source_sha:
        description: "Patch only: full commit SHA of the reviewed fixes, based on base_tag"
        type: string
      summary:
        description: "Patch only: one-line release note"
        type: string
      publish_patch:
        description: "Patch only: publish after verification (false builds and verifies without publishing)"
        type: boolean
        default: false

# Runs of one channel never overlap, so two attempts never publish at once. A newer run
# replaces a run of the same channel that is still waiting. A queued nightly never replaces
# a queued stable run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The workflow stays on main for signing trust. Only the build checkout changes.
  prepare_patch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.channel == 'patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release: ${{ steps.patch.outputs.release }}
      version: ${{ steps.patch.outputs.version }}
      tag: ${{ steps.patch.outputs.tag }}
      commit: ${{ steps.patch.outputs.commit }}
      previous_tag: ${{ steps.patch.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts
      - name: Prepare the patch candidate
        id: patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PATCH_BASE_TAG: ${{ inputs.base_tag }}
          PATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          PATCH_SUMMARY: ${{ inputs.summary }}
        run: bun scripts/release/prepare-patch.ts

  # Decides whether this run releases, and places the tag that packaged apps install
  # core extensions from. Verification needs that tag, so it exists before any check runs.
  plan:
    needs: prepare_patch
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare_patch.result == 'success' || needs.prepare_patch.result == 'skipped') }}
    runs-on: ubuntu-latest
    # These are the limits of the plan and nightly jobs this job replaces. The nightly path
    # installs dependencies and versions the packages.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 30 || 5 }}
    permissions:
      contents: write
    outputs:
      release: ${{ needs.prepare_patch.outputs.release || steps.stable.outputs.release || steps.nightly.outputs.release }}
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ needs.prepare_patch.outputs.version || steps.stable.outputs.version || steps.nightly.outputs.version }}
      tag: ${{ needs.prepare_patch.outputs.tag || steps.stable.outputs.tag || steps.nightly.outputs.tag }}
      commit: ${{ needs.prepare_patch.outputs.commit || steps.stable.outputs.commit || steps.nightly.outputs.commit }}
      previous_tag: ${{ needs.prepare_patch.outputs.previous_tag || steps.stable.outputs.previous_tag }}
      # Nightly tags are pruned, so nightly builds install core extensions from the main commit.
      extension_ref: ${{ steps.channel.outputs.channel == 'nightly' && github.sha || needs.prepare_patch.outputs.tag || steps.stable.outputs.tag }}
      targets: ${{ steps.channel.outputs.channel == 'nightly' && '["darwin-arm64","darwin-x64","linux-x64"]' || '["darwin-arm64","darwin-x64","linux-x64","win32-x64"]' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose the channel
        id: channel
        run: echo "channel=${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Plan the stable release
        id: stable
        if: steps.channel.outputs.channel == 'stable' && inputs.channel != 'patch'
        run: bun scripts/release/plan-release.ts

      # Only an unpublished release reaches this step, so moving its tag affects nothing users see.
      - name: Place the release tag
        if: steps.stable.outputs.place_tag == 'true'
        env:
          COMMIT: ${{ steps.stable.outputs.commit }}
          TAG: ${{ steps.stable.outputs.tag }}
        run: git push --force origin "$COMMIT:refs/tags/$TAG"

      # Main changes many times a day, and signing and notarizing costs runner minutes,
      # so a nightly runs only when main moved since the newest published nightly.
      - name: Compare main with the newest nightly
        id: changed
        if: steps.channel.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          LAST_TAG=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
            --jq 'map(select(.isPrerelease and (.tagName | test("^pstdio@.+-nightly\\.")))) | .[0].tagName // ""')
          # A nightly tag points at its version commit, whose parent is the main commit it built.
          if [ -n "$LAST_TAG" ] && [ "$(gh api "repos/$GH_REPO/commits/$LAST_TAG" --jq '.parents[0].sha')" = "$GITHUB_SHA" ]; then
            echo "Main has not changed since $LAST_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        run: node scripts/ci/install-native-dependencies.ts

      # The version change is never pushed to main. The tag keeps it so every job builds the same versions.
      - name: Version and tag the nightly
        id: nightly
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PSTDIO_STABLE_TAG=$(gh release view --json tagName --jq .tagName)
          export PSTDIO_STABLE_TAG
          bun run --cwd scripts release:version --nightly
          VERSION=$(jq -r .version packages/pstdio/package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version nightly pstdio@$VERSION"
          git tag "pstdio@$VERSION"
          git push origin "refs/tags/pstdio@$VERSION"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "tag=pstdio@$VERSION"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  packaged_toolchain:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/verify-packaged-toolchain.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  harness_cli_support:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/harness-cli-support.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      versions: '["minimum", "latest"]'

  containers:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/service-containers.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}

  desktop:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.commit }}
      targets: ${{ needs.plan.outputs.targets }}
      extension_ref: ${{ needs.plan.outputs.extension_ref }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Nightlies build no Windows assets, so only stable releases check the Windows update.
  windows_update:
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' && needs.plan.outputs.channel == 'stable' && needs.desktop.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-windows-update.yml
    with:
      previous-tag: ${{ needs.plan.outputs.previous_tag }}
      candidate-ref: ${{ needs.plan.outputs.commit }}

  # Publishes only when every check passed. Each step skips work an earlier attempt finished,
  # so re-running this job completes a release that stopped halfway. The GitHub release is
  # published last: a published release means npm and every desktop asset shipped.
  publish:
    needs: [plan, packaged_toolchain, harness_cli_support, containers, desktop, windows_update]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.release == 'true' &&
      (inputs.channel != 'patch' || inputs.publish_patch) &&
      needs.packaged_toolchain.result == 'success' && needs.harness_cli_support.result == 'success' &&
      needs.containers.result == 'success' &&
      needs.desktop.result == 'success' &&
      (needs.windows_update.result == 'success' || (needs.plan.outputs.channel == 'nightly' && needs.windows_update.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      NPM_CONFIG_PROVENANCE: true
      PSTDIO_EXTENSION_RELEASE_REF: ${{ needs.plan.outputs.extension_ref }}
      DIST_TAG: ${{ needs.plan.outputs.channel == 'nightly' && 'nightly' || 'latest' }}
      PRERELEASE: ${{ needs.plan.outputs.channel == 'nightly' }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          # Packaged checks in build-release read older release tags, such as the Planner upgrade check.
          fetch-depth: 0

      - name: Confirm the patch still targets the current stable release
        if: inputs.channel == 'patch'
        env:
          BASE_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          CURRENT=$(gh release view --json tagName --jq .tagName)
          if [ "$CURRENT" != "$BASE_TAG" ]; then
            echo "::error::Only the current stable release can be patched. Stable is now $CURRENT."
            exit 1
          fi

      # A newer attempt of the same unpublished version moves the tag and owns the release.
      - name: Check that this run still owns the release tag
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TAGGED=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$TAGGED" != "$COMMIT" ]; then
            echo "::error::$TAG now points at $TAGGED, not $COMMIT. A newer run releases this version."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin npm for trusted publishing
        run: npm i -g npm@11.16.0

      - name: Build release artifacts
        uses: ./.github/actions/build-release

      - name: Download verified desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-release

      - name: Verify the desktop release set
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          bun clients/desktop/scripts/verify-release-set.ts desktop-release --targets "$(jq -r 'join(",")' <<< "$TARGETS")"
          mkdir desktop-publish
          find desktop-release -type f -exec cp '{}' desktop-publish/ \;
          cd desktop-publish
          for checksums in checksums-*.sha256; do sha256sum -c "$checksums"; done
          cat checksums-*.sha256 | sort > "checksums-desktop-${{ needs.plan.outputs.version }}.sha256"

      # Packing errors must stop the release before the first package reaches npm.
      - name: Dry-run the npm packages that are not published yet
        env:
          NPM_CONFIG_PROVENANCE: false
        run: |
          set -euo pipefail
          for manifest in $(jq -r '.workspaces[] | sub("/$"; "") + "/package.json"' package.json); do
            [ -f "$manifest" ] || continue
            [ "$(jq -r '.private // false' "$manifest")" = "true" ] && continue
            NAME=$(jq -r .name "$manifest")
            VERSION=$(jq -r .version "$manifest")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then continue; fi
            (cd "$(dirname "$manifest")" && npm publish --dry-run --tag "$DIST_TAG")
          done

      - name: Publish platform packages
        run: bun run --cwd scripts release:platforms:publish "$DIST_TAG"

      # Publishes only versions npm does not have yet. Only the pstdio tag is pushed, by plan.
      - name: Publish npm packages
        run: bunx changeset publish --tag "$DIST_TAG" --no-git-tag

      - name: Download verified service images
        uses: actions/download-artifact@v4
        with:
          pattern: service-container-*
          path: service-images
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified service images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for service in relay account-manager; do
            docker load --input "service-images/$service.tar"
            docker push "ghcr.io/$GITHUB_REPOSITORY/$service:$VERSION"
          done

      # Self-hosters pull these images without logging in. GitHub creates a new package as
      # private and has no API to change that, so an organization owner makes it public once.
      - name: Check that anyone can pull the service images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          for service in relay account-manager; do
            if ! docker manifest inspect "ghcr.io/$GITHUB_REPOSITORY/$service:$VERSION" > /dev/null; then
              echo "::error::ghcr.io/$GITHUB_REPOSITORY/$service is private. In its package settings, choose Danger Zone > Change visibility > Public, then re-run this job."
              exit 1
            fi
          done

      - name: Create the draft GitHub release with CLI assets
        uses: ./.github/actions/create-pstdio-release
        with:
          version: ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.channel == 'nightly' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach desktop assets and publish the release
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true"
          gh release upload "$TAG" desktop-publish/* --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi

  # Runs only after a nightly published with every asset.
  nightly_prune:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.outputs.channel == 'nightly' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Delete older nightlies and their tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd scripts release:nightlies:prune "${{ needs.plan.outputs.tag }}"

  # Refresh after publication or patch verification so main skips reserved patch versions.
  # This job only prepares a version PR; it never publishes.
  version_pr:
    needs: [prepare_patch, publish]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' && inputs.channel != 'nightly' &&
      needs.prepare_patch.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: node scripts/ci/install-native-dependencies.ts

      - name: Read the current stable version baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          version: bun run --cwd scripts release:version
        env:
          PSTDIO_STABLE_TAG: ${{ steps.baseline.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
