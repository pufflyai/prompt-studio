name: Desktop Intel CPU Profile
on:
  push:
    branches: [test/ps-3-intel-profile]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: node scripts/ci/install-native-dependencies.ts
      - run: bunx lerna run build --scope workbench-fixture --include-dependencies
      - uses: actions/download-artifact@v4
        with:
          name: desktop-diagnostic-darwin-x64
          run-id: 36181278842
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/pstdio-intel-package
      - name: Restore the exact signed application
        run: |
          mkdir -p clients/desktop/out
          tar -xzf /tmp/pstdio-intel-package/pstdio-intel-diagnostic.tar.gz -C clients/desktop/out
          codesign --verify --deep --strict 'clients/desktop/out/Prompt Studio-darwin-x64/Prompt Studio.app'
      - name: Collect diagnostic CPU profiles with unchanged tests
        run: bun scripts/ci/run-intel-profile.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-intel-cpu-profile
          path: clients/desktop/test-results
          if-no-files-found: error
