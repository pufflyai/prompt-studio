<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prompt Studio is a workbench where you and your agents can build and run tailored tools for your work."
    />
    <meta name="application-name" content="Prompt Studio" />
    <meta name="apple-mobile-web-app-title" content="Prompt Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1015" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prompt Studio" />
    <meta property="og:title" content="Prompt Studio" />
    <meta
      property="og:description"
      content="Prompt Studio is a workbench where you and your agents can build and run tailored tools for your work."
    />
    <meta name="twitter:card" content="summary" />

    <title>Prompt Studio</title>
    <style>
      /* Remains available if either the app bundle or its theme fails to load. */
      #dashboard-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      #root:not(:empty) + #dashboard-status {
        display: none;
      }
      #dashboard-status a {
        color: LinkText;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <main id="dashboard-status">
      <p id="dashboard-status-message" role="status">Opening Prompt Studio…</p>
      <a href="">Reload Prompt Studio</a>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
